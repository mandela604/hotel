<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Orders | Aurum Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; }
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:13px; background:#f4f6fb; color:#1c2440; min-height:100vh;
  }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }
  .content{ flex:1; padding:20px 24px 28px; background:#f4f6fb; }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .rst-banner{
    display:flex; align-items:flex-start; gap:10px; background:#feecec; border:1px solid rgba(240,68,56,.3);
    color:#f04438; border-radius:10px; padding:11px 14px; margin-bottom:14px; font-size:12.5px; font-weight:600;
    line-height:1.5;
  }
  .rst-banner i{ margin-top:1px; }
  .rst-banner[hidden]{ display:none; }

  .toast{
    position:fixed; bottom:20px; right:20px; background:#ffffff; border:1px solid #eef0f6; border-radius:10px;
    padding:11px 16px; font-size:13px; color:#1c2440; box-shadow:0 8px 28px rgba(15,20,40,0.18); z-index:999;
    display:flex; align-items:center; gap:8px; max-width:calc(100vw - 40px); font-weight:600;
  }
  .toast.success{ border-left:3px solid #12b76a; }
  .toast.error{ border-left:3px solid #f04438; }
  .toast.info{ border-left:3px solid #2f6fed; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <div class="rst-banner" id="guestLoadError" hidden>
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="guestLoadErrorText">Couldn't load in-house guests for Room Charge.</span>
      </div>
      <div id="ordersSlot"></div>
    </div>
  </div>
</div>

<script src="data/restaurant-seed.js"></script>
<script src="services/restaurant-service.js"></script>
<script src="../component/restaurant-shell.js"></script>
<script src="../component/orders-workspace.js"></script>
<script>
/**
 * Restaurant Orders
 * Room Charge: type room / name / phone in the search box (empty = no results).
 *
 * This page does NOT talk to BookingData directly, and doesn't even load
 * its scripts — RestaurantService.getInHouseGuests() lazily loads
 * booking-demo-seed.js + booking-service.js itself the first time it's
 * needed. The service owns where that data comes from; the page only
 * renders it or shows an error. There is no hardcoded/fake guest fallback
 * anywhere in this flow.
 */

function showToast(msg, type) {
  type = type || 'success';
  var icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 4200);
}

function showGuestLoadError(msg) {
  var banner = document.getElementById('guestLoadError');
  var text = document.getElementById('guestLoadErrorText');
  if (text) text.textContent = msg;
  if (banner) banner.hidden = false;
  showToast(msg, 'error');
}

(async function boot() {
  if (window.RestaurantShell) {
    RestaurantShell.attach({
      sidebarTarget: '#sidebarSlot',
      topbarTarget: '#topbarSlot',
      activeFile: 'restaurant-orders.html',
      pageTitle: 'Orders',
      pageSubtitle: 'Quick sales and open tabs — Restaurant',
    });
  }

  if (!window.RestaurantService) {
    console.error('[restaurant-orders] RestaurantService missing');
    showGuestLoadError('Restaurant service failed to load. Please refresh the page.');
    return;
  }

  await RestaurantService.loadAll();

  var guests = [];
  try {
    guests = await RestaurantService.getInHouseGuests();
  } catch (err) {
    console.error('[restaurant-orders] failed to load in-house guests', err);
    showGuestLoadError('Could not load in-house guests for Room Charge — ' + ((err && err.message) || 'unknown error') + '. Room Charge search will show no results until this is fixed.');
  }
  console.log('[restaurant-orders] guests for Room Charge:', guests.length, guests);

  OrdersWorkspace.attach('#ordersSlot', {
    module: 'restaurant',
    service: RestaurantService,
    guests: guests,
    allowRoomCharge: true,
    paymentMethods: ['Cash', 'POS', 'Transfer', 'Room Charge', 'Complimentary'],
    idPrefixes: { sale: 'RST-', order: 'RSO-' },
    keys: {
      stock: RestaurantService.KEYS.STOCK,
      sales: RestaurantService.KEYS.SALES,
      orders: RestaurantService.KEYS.ORDERS,
      movements: RestaurantService.KEYS.MOVEMENTS,
    },
    CFG: { API_BASE: '', API_KEY: '', USE_DEMO: true },
  });
})();
</script>
</body>
</html>
