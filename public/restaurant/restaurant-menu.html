<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Menu | Aurum Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
    --red:#f87171; --red-bg:rgba(248,113,113,0.12);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
  }
  html{ height:auto; }
  body{ font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }
  .content{ padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s; min-height:112px; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-accent{ position:absolute; bottom:-10px; right:-10px; font-size:46px; opacity:.16; line-height:1; pointer-events:none; }
  .kpi-label{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; font-weight:500; }
  .kpi-value{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1; margin-bottom:6px; }
  .kpi-trend{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:600; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-family:'Outfit',sans-serif; font-size:12.5px; cursor:pointer; outline:none; }
  .filter-select:focus{ border-color:var(--gold-border); }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-family:'Outfit',sans-serif; font-size:11.5px; cursor:pointer; padding:8px 6px; }
  .btn-ghost:hover{ color:var(--gold); }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:600; color:var(--text); }

  .menu-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; padding:16px; }
  .menu-card{ background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px; position:relative; overflow:hidden; transition:all .2s; }
  .menu-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .menu-card.food::before{ background:linear-gradient(90deg,var(--gold),transparent); }
  .menu-card.drink::before{ background:linear-gradient(90deg,#a78bfa,transparent); }
  .menu-card:hover{ border-color:var(--gold-border); transform:translateY(-2px); }
  .menu-card.unavail{ opacity:.6; }
  .mc-cat{ font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); margin-bottom:4px; }
  .mc-name{ font-size:13.5px; font-weight:600; color:var(--text); margin-bottom:2px; }
  .mc-price{ font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:700; color:var(--gold); margin-bottom:4px; }
  .mc-desc{ font-size:11px; color:var(--text3); line-height:1.4; margin-bottom:10px; min-height:28px; }
  .mc-actions{ display:flex; gap:5px; flex-wrap:wrap; }
  .act-btn{ background:none; border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:11px; font-weight:500; color:var(--text2); cursor:pointer; transition:all .15s; font-family:'Outfit',sans-serif; white-space:nowrap; }
  .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .act-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; }
  .chip-ok{ background:var(--green-bg); color:var(--green); } .chip-ok::before{ background:var(--green); }
  .chip-out{ background:var(--red-bg); color:var(--red); } .chip-out::before{ background:var(--red); }
  .empty-note{ grid-column:1/-1; text-align:center; padding:32px; color:var(--text3); font-size:12.5px; }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:600; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; transition:all .2s; border:1px solid transparent; }
  .btn-primary{ background:var(--gold); color:#000; font-weight:600; }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--modal-bg,var(--surface)); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(520px,96vw); box-shadow:0 32px 80px rgba(0,0,0,0.6); margin:auto; position:relative; overflow:hidden; }
  .modal::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
  .modal-sm{ width:min(400px,96vw); }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:700; color:var(--text); }
  .modal-close{ background:none; border:none; color:var(--text3); font-size:18px; cursor:pointer; padding:4px; }
  .modal-close:hover{ color:var(--text); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  @media (max-width:480px){ .form-row{ grid-template-columns:1fr; } }
  .form-group{ display:flex; flex-direction:column; gap:5px; }
  .form-group.span2{ grid-column:span 2; }
  @media (max-width:480px){ .form-group.span2{ grid-column:span 1; } }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:500; }
  .form-input, .form-select{ background:var(--input-bg,var(--surface2)); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; outline:none; width:100%; }
  .form-input:focus, .form-select:focus{ border-color:var(--gold-border); }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text); box-shadow:0 8px 28px rgba(0,0,0,0.3); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); }
  .toast.success{ border-left:3px solid var(--green); }
  .toast.error{ border-left:3px solid var(--red); }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <div class="toolbar no-print">
        <div class="toolbar-row">
          <div class="toolbar-left">
            <div class="flt-group" style="flex:1;min-width:180px;max-width:260px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <span style="color:var(--text3);font-size:12px;">🔍</span>
                <input type="text" id="fSearch" placeholder="Item name…" oninput="page=1;render()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Category</span>
              <select class="filter-select" id="fCat" onchange="page=1;render()"><option value="">All Categories</option></select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Type</span>
              <select class="filter-select" id="fType" onchange="page=1;render()">
                <option value="">All Types</option><option value="food">Food</option><option value="drink">Drink</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Availability</span>
              <select class="filter-select" id="fAvail" onchange="page=1;render()">
                <option value="">All</option><option value="1">Available</option><option value="0">Sold Out</option>
              </select>
            </div>
            <button class="btn-ghost" onclick="clearFilters()">✕ Clear Filters</button>
          </div>
          <button class="btn btn-primary btn-sm" onclick="openItemModal()">＋ Add Item</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Menu Items</div>
          <span style="font-size:11px;color:var(--text3);" id="tblCount">—</span>
        </div>
        <div class="menu-grid" id="menuGrid"></div>
        <div class="pagination">
          <span id="paginLabel">—</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="itemModalTitle">Add Menu Item</div>
      <button class="modal-close" onclick="closeModal('itemModal')">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group span2">
        <label class="form-label">Item Name</label>
        <input class="form-input" type="text" id="miName" placeholder="e.g. Grilled Chicken">
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <input class="form-input" type="text" id="miCategory" placeholder="e.g. Main Course" list="catList">
        <datalist id="catList"></datalist>
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select class="form-select" id="miType"><option value="food">Food</option><option value="drink">Drink</option></select>
      </div>
      <div class="form-group">
        <label class="form-label">Price (₦)</label>
        <input class="form-input" type="number" id="miPrice" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Availability</label>
        <select class="form-select" id="miAvail"><option value="1">Available</option><option value="0">Sold Out</option></select>
      </div>
      <div class="form-group span2">
        <label class="form-label">Description</label>
        <input class="form-input" type="text" id="miDesc" placeholder="Brief description…">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('itemModal')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveItem()">✓ Save Item</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--red);">Delete Item</div>
      <button class="modal-close" onclick="closeModal('deleteModal')">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.6;" id="deleteMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('deleteModal')">Cancel</button>
      <button class="btn btn-sm" style="background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.3);color:var(--red);font-weight:700;" onclick="confirmDelete()">🗑 Delete</button>
    </div>
  </div>
</div>

<script src="../component/restaurant-shell.js"></script>
<script>
const shell = RestaurantShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'restaurant-menu.html',
  pageTitle:     'Menu',
  pageSubtitle:  'Everything sellable — food and bar, independent of Kitchen stock',
  apiMode:       'Demo',
  user:          { name: 'Restaurant Manager', initials: 'RM' },
});

const CFG = { API_BASE:'', API_KEY:'', USE_DEMO:true, PAGE_SIZE:12 };

async function apiFetch(method, path, body=null){
  if (!CFG.API_BASE) throw new Error('No API_BASE configured');
  const opts = { method, headers:{ 'Content-Type':'application/json' } };
  if (CFG.API_KEY) opts.headers['Authorization'] = `Bearer ${CFG.API_KEY}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(CFG.API_BASE + path, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
function apiSave(method, path, body){ if (!CFG.USE_DEMO) apiFetch(method, path, body).catch(e => console.warn('[API write]', e.message)); }

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared}; }
};

const KEY_MENU = 'restaurant-menu';

async function loadShared(key, fallback){
  try {
    const r = await storage.get(key, true);
    if (r && r.value) { const parsed = JSON.parse(r.value); if (Array.isArray(parsed)) return parsed; }
  } catch(e){}
  return fallback;
}
async function saveShared(key, value){
  try { await storage.set(key, JSON.stringify(value), true); } catch(e){ console.warn('[sync]', key, e); }
}

/* Demo seed — same catalog the old monolith shipped with */

  {id:'m20',name:'Chef Special (Daily)',  category:'Specials',    type:'food',  price:9500,  avail:true,  desc:"Ask waiter for today's special"},
];

let menu = [];
let page = 1;

function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }

function renderKPIs(){
  const total = menu.length;
  const food = menu.filter(m=>m.type==='food').length;
  const drink = menu.filter(m=>m.type==='drink').length;
  const soldOut = menu.filter(m=>!m.avail).length;
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card" onclick="clearFilters()">
      <div class="kpi-accent">🍴</div><div class="kpi-label">Total Menu Items</div>
      <div class="kpi-value">${total}</div><div class="kpi-trend neutral">Food + Bar</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">🍽</div><div class="kpi-label">Food Items</div>
      <div class="kpi-value" style="color:var(--gold);">${food}</div><div class="kpi-trend neutral">Kitchen-sourced</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">🍸</div><div class="kpi-label">Drink Items</div>
      <div class="kpi-value" style="color:#a78bfa;">${drink}</div><div class="kpi-trend neutral">Bar catalog</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">✕</div><div class="kpi-label">Sold Out</div>
      <div class="kpi-value" style="color:var(--red);">${soldOut}</div>
      <div class="kpi-trend ${soldOut>0?'warn':'up'}">${soldOut>0?'Hidden from Orders':'✓ Everything available'}</div>
    </div>`;
}

function populateFilterOptions(){
  const sel = document.getElementById('fCat');
  const cur = sel.value;
  const cats = [...new Set(menu.map(m=>m.category))].sort();
  sel.innerHTML = '<option value="">All Categories</option>' + cats.map(c=>`<option${c===cur?' selected':''}>${c}</option>`).join('');
  document.getElementById('catList').innerHTML = cats.map(c=>`<option value="${c}">`).join('');
}

function getFiltered(){
  const q = document.getElementById('fSearch').value.toLowerCase();
  const cat = document.getElementById('fCat').value;
  const typ = document.getElementById('fType').value;
  const av = document.getElementById('fAvail').value;
  return menu.filter(m => {
    const mq = !q || m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q);
    const mc = !cat || m.category === cat;
    const mt = !typ || m.type === typ;
    const ma = av === '' || (av === '1' ? m.avail : !m.avail);
    return mq && mc && mt && ma;
  });
}

function clearFilters(){
  document.getElementById('fSearch').value = '';
  document.getElementById('fCat').value = '';
  document.getElementById('fType').value = '';
  document.getElementById('fAvail').value = '';
  page = 1; render();
}

function renderPagination(total){
  const totalPages = Math.max(1, Math.ceil(total / CFG.PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  const from = total === 0 ? 0 : (page-1)*CFG.PAGE_SIZE + 1;
  const to = Math.min(page*CFG.PAGE_SIZE, total);
  document.getElementById('paginLabel').textContent = total === 0 ? 'No records' : `${from}–${to} of ${total}`;
  const wrap = document.getElementById('pageBtns');
  wrap.innerHTML = '';
  const mk = (label, p, disabled, active) => {
    const b = document.createElement('button'); b.className='page-btn'+(active?' active':''); b.textContent=label; b.disabled=!!disabled;
    b.onclick = () => { page = p; render(); }; return b;
  };
  const totalPg = Math.max(1, Math.ceil(total / CFG.PAGE_SIZE));
  wrap.appendChild(mk('‹', page-1, page===1, false));
  let start = Math.max(1, page-2), end = Math.min(totalPg, start+4); start = Math.max(1, end-4);
  for (let i=start;i<=end;i++) wrap.appendChild(mk(String(i), i, false, i===page));
  wrap.appendChild(mk('›', page+1, page>=totalPg, false));
}

function render(){
  renderKPIs();
  populateFilterOptions();
  const rows = getFiltered();
  document.getElementById('tblCount').textContent = rows.length + ' item' + (rows.length!==1?'s':'');
  const start = (page-1)*CFG.PAGE_SIZE;
  const pageRows = rows.slice(start, start+CFG.PAGE_SIZE);

  document.getElementById('menuGrid').innerHTML = pageRows.length === 0
    ? `<div class="empty-note">No menu items match your filters.</div>`
    : pageRows.map(item => {
        const gi = menu.indexOf(item);
        return `<div class="menu-card ${item.type}${!item.avail?' unavail':''}">
          <div class="mc-cat">${item.type==='drink'?'🍸':'🍴'} ${item.category} &nbsp; <span class="chip ${item.avail?'chip-ok':'chip-out'}">${item.avail?'Available':'Sold Out'}</span></div>
          <div class="mc-name">${item.name}</div>
          <div class="mc-price">${fmtN(item.price)}</div>
          <div class="mc-desc">${item.desc||''}</div>
          <div class="mc-actions">
            <button class="act-btn" onclick="openItemModal(${gi})">✏ Edit</button>
            <button class="act-btn" onclick="toggleAvail(${gi})">${item.avail?'Mark Sold Out':'Mark Available'}</button>
            <button class="act-btn danger" onclick="openDeleteModal(${gi})">🗑</button>
          </div>
        </div>`;
      }).join('');

  renderPagination(rows.length);
}

let editIdx = null;
function openItemModal(idx=null){
  editIdx = idx;
  document.getElementById('itemModalTitle').textContent = idx!==null ? 'Edit Menu Item' : 'Add Menu Item';
  if (idx!==null) {
    const i = menu[idx];
    document.getElementById('miName').value = i.name;
    document.getElementById('miCategory').value = i.category;
    document.getElementById('miType').value = i.type;
    document.getElementById('miPrice').value = i.price;
    document.getElementById('miAvail').value = i.avail ? '1' : '0';
    document.getElementById('miDesc').value = i.desc || '';
  } else {
    document.getElementById('miName').value = '';
    document.getElementById('miCategory').value = '';
    document.getElementById('miType').value = 'food';
    document.getElementById('miPrice').value = '';
    document.getElementById('miAvail').value = '1';
    document.getElementById('miDesc').value = '';
  }
  document.getElementById('itemModal').classList.add('show');
}
async function saveItem(){
  const name = document.getElementById('miName').value.trim();
  const category = document.getElementById('miCategory').value.trim();
  const price = parseFloat(document.getElementById('miPrice').value) || 0;
  if (!name || !category || !price) { showToast('Name, category and price are required.', 'error'); return; }
  const entry = {
    id: editIdx!==null ? menu[editIdx].id : 'm'+Date.now(),
    name, category, price,
    type: document.getElementById('miType').value,
    avail: document.getElementById('miAvail').value === '1',
    desc: document.getElementById('miDesc').value.trim(),
  };
  if (editIdx!==null) { menu[editIdx] = entry; showToast('Menu item updated.', 'success'); }
  else { menu.push(entry); showToast('Menu item added.', 'success'); }
  apiSave(editIdx!==null?'PUT':'POST', editIdx!==null?`/api/restaurant/menu/${entry.id}`:'/api/restaurant/menu', entry);
  closeModal('itemModal');
  render();
  await saveShared(KEY_MENU, menu);
}
async function toggleAvail(idx){
  menu[idx].avail = !menu[idx].avail;
  apiSave('PATCH', `/api/restaurant/menu/${menu[idx].id}`, { avail: menu[idx].avail });
  showToast(`${menu[idx].name} marked as ${menu[idx].avail?'Available':'Sold Out'}.`, menu[idx].avail?'success':'error');
  render();
  await saveShared(KEY_MENU, menu);
}
let deleteIdx = null;
function openDeleteModal(idx){
  deleteIdx = idx;
  document.getElementById('deleteMsg').textContent = `Remove "${menu[idx].name}" from the menu? This cannot be undone.`;
  document.getElementById('deleteModal').classList.add('show');
}
async function confirmDelete(){
  const item = menu[deleteIdx];
  menu.splice(deleteIdx, 1);
  apiSave('DELETE', `/api/restaurant/menu/${item.id}`);
  closeModal('deleteModal');
  showToast(`"${item.name}" removed from menu.`, 'error');
  render();
  await saveShared(KEY_MENU, menu);
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }
['itemModal','deleteModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e){ if (e.target === this) closeModal(id); });
});

function showToast(msg, type='success'){
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = (type==='success'?'✓ ':'✕ ') + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

async function init(){
  if (!CFG.USE_DEMO) {
    try {
      const data = await apiFetch('GET', '/api/restaurant/menu');
      menu = data.menu || data || [];
      shell.setApiMode('Live');
      render();
      return;
    } catch(e) { console.warn('[API] Falling back to shared/demo data:', e.message); }
  }
  menu = await loadShared(KEY_MENU, DEMO_MENU);
  await saveShared(KEY_MENU, menu);
  render();
}
init();
</script>
