<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Reports | Aurum Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; }
  body{ font-family:'Outfit',sans-serif; font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; flex-shrink:0; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; transition:transform .2s,box-shadow .2s,border-color .2s; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-amber::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-red{ background:var(--red-bg); color:var(--red); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  #filterSlot{ flex-shrink:0; }
  #tableSlot{ flex-shrink:0; min-width:0; }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @media print{
    #rst-sidebar, #rst-topbar, .no-print, .sfb-root, .st-pagin{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .print-header{ display:block !important; margin-bottom:14px; }
  }
  .print-header{ display:none; }
  .print-header h2{ font-family:'Cormorant Garamond',serif; font-size:18px; }
  .print-header p{ font-size:11px; color:#555; margin-top:3px; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <div id="filterSlot" class="no-print"></div>

      <div class="print-header">
        <h2>Aurum Hotel — Restaurant Sales Report</h2>
        <p id="printSub"></p>
      </div>

      <!-- SalesTable mounts here -->
      <div id="tableSlot"></div>

    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="../services/permissions.js"></script>
<script src="services/restaurant-service.js"></script>
<script src="../component/restaurant-shell.js"></script>
<script src="../component/sales-filter-bar.js"></script>
<script src="../component/sales-detail.js"></script>
<script src="../component/sales-table.js"></script>
<script>
'use strict';

const shell = RestaurantShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'restaurant-reports.html',
  pageTitle:     'Reports',
  pageSubtitle:  'Filterable view over completed and voided sales',
});

const svc = window.RestaurantService;
let filterBar = null;
let salesTable = null;
let salesDetail = null;
let filterState = null;

function fmtN(n) {
  if (svc && svc.fmtN) return svc.fmtN(n);
  return '₦' + Math.round(n || 0).toLocaleString('en-NG');
}

function currentShellTheme() {
  return document.documentElement.getAttribute('data-theme') || 'dark';
}

function buildDetailSale(s) {
  return {
    id: s.id,
    dept: 'Restaurant',
    table: s.table,
    staff: s.staff,
    date: s.date,
    method: s.method,
    items: (s.items || []).map(function (i) {
      return { name: i.name || i.meal || '—', qty: i.qty, price: i.price };
    }),
    discount: (s.subtotal || 0) * (s.discount || 0) / 100,
    total: s.total,
    status: s.status,
    voidReason: s.voidReason,
    notes: s.notes,
  };
}

/* ── Pure render KPIs ── */
function renderKPIs(kpis, label) {
  const isAll = label === 'All time';
  const salesTitle = isAll ? 'Total Sales' : (label === 'Today' ? "Today's Sales" : 'Sales');
  const revTitle   = isAll ? 'Total Revenue' : (label === 'Today' ? "Today's Revenue" : 'Revenue');
  const salesSub   = isAll ? 'All completed + voided' : (kpis.count + ' completed');
  const revSub     = isAll ? 'All-time net revenue' : ('In ' + label.toLowerCase());

  document.getElementById('kpiRow').innerHTML =
    '<div class="kpi-card acc-blue">' +
      '<div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-receipt"></i></div>' +
      '<div class="kpi-label">' + salesTitle + '</div></div>' +
      '<div class="kpi-value" style="color:var(--blue);">' + kpis.total + '</div>' +
      '<div class="kpi-trend neutral">' + salesSub + '</div>' +
    '</div>' +
    '<div class="kpi-card acc-green">' +
      '<div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div>' +
      '<div class="kpi-label">' + revTitle + '</div></div>' +
      '<div class="kpi-value" style="color:var(--green);">' + fmtN(kpis.revenue) + '</div>' +
      '<div class="kpi-trend up">' + revSub + '</div>' +
    '</div>' +
    '<div class="kpi-card acc-amber">' +
      '<div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-bolt"></i></div>' +
      '<div class="kpi-label">Quick Sales</div></div>' +
      '<div class="kpi-value" style="color:var(--amber);">' + kpis.quickCount + '</div>' +
      '<div class="kpi-trend info">In current filter</div>' +
    '</div>' +
    '<div class="kpi-card acc-red">' +
      '<div class="kpi-top"><div class="kpi-ic ic-red"><i class="fa-solid fa-ban"></i></div>' +
      '<div class="kpi-label">Voided Sales</div></div>' +
      '<div class="kpi-value" style="color:var(--red);">' + kpis.voided + '</div>' +
      '<div class="kpi-trend ' + (kpis.voided > 0 ? 'warn' : 'up') + '">' +
        (kpis.voided > 0 ? 'Stock restored' : 'None in filter') +
      '</div>' +
    '</div>';
}

/* ── Pure call to service ── */
function applyFilters(state) {
  if (!salesTable || !svc) return;
  filterState = state || filterState || {};

  const filters = {
    status: filterState.status || '',
    source: filterState.source || '',
    payment: filterState.payment || '',
    search: filterState.search || '',
    bounds: filterState.bounds || { start: null, end: null, label: 'All time' }
  };

  const filtered = svc.getFilteredSales(filters);
  const kpis = svc.salesKPIs(filtered);

  const label = filters.bounds.label || 'All time';
  const title = label && label !== 'All time' ? 'Report: ' + label : 'Full Report';

  document.getElementById('printSub').textContent =
    'Generated: ' + new Date().toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    }) +
    ' · Net: ' + fmtN(kpis.revenue) +
    (label !== 'All time' ? ' · ' + label : '');

  renderKPIs(kpis, label);
  salesTable.setTitle(title);
  salesTable.setSort('date', 'desc');
  salesTable.setRows(filtered);
}

async function init() {
  if (!window.RestaurantService) {
    document.getElementById('kpiRow').innerHTML =
      '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text3);">RestaurantService not loaded.</div>';
    return;
  }
  if (!window.SalesFilterBar || !window.SalesTable) {
    document.getElementById('filterSlot').innerHTML =
      '<div style="padding:16px;color:var(--text3);">SalesFilterBar / SalesTable not loaded.</div>';
    return;
  }

  try {
    await RestaurantService.loadAll();

    if (window.SalesDetail) {
      salesDetail = SalesDetail.create({ theme: currentShellTheme() });
    }

    salesTable = SalesTable.create({
      target: '#tableSlot',
      pageSize: 8,
      showSummary: true,
      showActions: false,
      showSource: true,
      canVoid: false,
      title: 'Full Report',
      formatMoney: fmtN,
      onRowClick: function (s) {
        if (salesDetail) {
          salesDetail.open(buildDetailSale(s));
        }
      },
    });

    filterBar = SalesFilterBar.create({
      target: '#filterSlot',
      show: {
        period: true,
        status: true,
        source: true,
        payment: true,
        dateRange: true,
        search: true,
        clear: true,
        chips: true,
      },
      periodOptions: [
        { value: 'all',  label: 'All Time' },
        { value: 'today', label: 'Today' },
        { value: '7d',   label: 'Last 7 Days' },
        { value: '30d',  label: 'Last 30 Days' },
      ],
      statusOptions: [
        { value: '',          label: 'All',       tone: 'all' },
        { value: 'completed', label: 'Completed', tone: 'completed', color: '#12b76a' },
        { value: 'voided',    label: 'Voided',    tone: 'voided',    color: '#f04438' },
      ],
      sourceOptions: [
        { value: '',      label: 'All Sources' },
        { value: 'quick', label: 'Quick Sale' },
        { value: 'tab',   label: 'Open Tab' },
      ],
      paymentOptions: ['Cash', 'POS', 'Transfer', 'Room Charge', 'Complimentary'],
      searchPlaceholder: 'Sale #, item, staff, table…',
      defaultPeriod: 'all',
      actions: [
        { id: 'print', label: 'Print Report', icon: 'fa-print', variant: 'outline' },
      ],
      onChange: function (state) {
        applyFilters(state);
      },
      onAction: function (actionId) {
        if (actionId === 'print') window.print();
      },
    });

    applyFilters(filterBar.getState());

    if (RestaurantService.onChange) {
      RestaurantService.onChange(function () {
        applyFilters(filterBar.getState());
      });
    }
  } catch (err) {
    console.error(err);
    document.getElementById('kpiRow').innerHTML =
      '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text3);">Could not load report data.</div>';
  }
}
init();
</script>
</body>
</html>
