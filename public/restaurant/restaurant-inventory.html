<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory | Aurum Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; }
  body{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:13px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content, .modal-overlay{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
  }
  .content{ padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; background:var(--bg); color:var(--text); }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-amber::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .ic-red{ background:var(--red-bg); color:var(--red); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .toolbar-row.top{ justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .toolbar-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:700; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; transition:border-color .2s; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; font-family:inherit; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-size:12.5px; cursor:pointer; outline:none; transition:border-color .2s; font-family:inherit; }
  .filter-select:focus{ border-color:var(--gold-border); }
  .status-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-pill{ display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text2); transition:all .15s; white-space:nowrap; }
  .status-pill:hover{ border-color:var(--gold-border); }
  .status-pill i{ font-size:6px; }
  .status-pill.on.all{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .status-pill.on.ok{ background:var(--green-bg); border-color:rgba(18,183,106,.35); color:var(--green); }
  .status-pill.on.low{ background:var(--amber-bg); border-color:rgba(247,144,9,.35); color:var(--amber); }
  .status-pill.on.out{ background:var(--red-bg); border-color:rgba(240,68,56,.35); color:var(--red); }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-size:11.5px; font-weight:700; cursor:pointer; padding:8px 6px; display:inline-flex; align-items:center; gap:5px; font-family:inherit; }
  .btn-ghost:hover{ color:var(--gold); }

  @media (max-width:700px){
    .toolbar-row.top{ flex-direction:column; align-items:stretch; }
    .toolbar-left{ flex-direction:column; align-items:stretch; }
    .toolbar-actions{ flex-direction:column; align-items:stretch; }
    .flt-group{ width:100%; }
    .search-box{ max-width:100%; }
    .filter-select{ width:100%; }
    .toolbar-row.top > .btn, .toolbar-actions .btn{ width:100%; justify-content:center; }
  }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; font-family:inherit; }
  .btn-primary{ background:var(--gold); color:#fff; font-weight:700; }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(15,26,42,0.55); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--modal-bg,var(--surface)); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(520px,96vw); box-shadow:0 32px 80px rgba(15,34,55,0.25); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; position:relative; overflow:hidden; }
  .modal::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
  .modal.mode-delete::before{ background:var(--red); }
  .modal-sm{ width:min(400px,96vw); }
  @keyframes modalIn{ from{opacity:0;transform:translateY(16px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-size:19px; font-weight:800; color:var(--text); }
  .modal-close{ background:none; border:none; color:var(--text3); font-size:16px; cursor:pointer; padding:4px; line-height:1; transition:color .2s; }
  .modal-close:hover{ color:var(--text); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  @media (max-width:480px){ .form-row{ grid-template-columns:1fr; } }
  .form-group{ display:flex; flex-direction:column; gap:5px; }
  .form-group.span2{ grid-column:span 2; }
  @media (max-width:480px){ .form-group.span2{ grid-column:span 1; } }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:600; }
  .form-input, .form-select, .form-textarea{ background:var(--input-bg,var(--surface2)); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-size:13px; outline:none; transition:border-color .2s; width:100%; font-family:inherit; }
  .form-input:focus, .form-select:focus, .form-textarea:focus{ border-color:var(--gold-border); }
  .form-textarea{ resize:vertical; min-height:60px; }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .form-hint{ font-size:11px; color:var(--text3); margin-top:2px; }

  .category-list{ margin-top:6px; max-height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .cat-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; font-size:13px; }
  .cat-actions{ display:flex; gap:6px; }
  .cat-actions .act-btn{ background:none; border:1px solid var(--border); border-radius:7px; padding:5px 9px; font-size:12px; cursor:pointer; color:var(--text2); }
  .cat-actions .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text); box-shadow:0 8px 28px rgba(15,34,55,0.18); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); }
  .toast.success{ border-left:3px solid var(--green); }
  .toast.error{ border-left:3px solid var(--red); }
  .toast.info{ border-left:3px solid var(--blue); }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  @media print{
    #rst-sidebar, #rst-topbar, .toolbar, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <div class="toolbar no-print">
        <div class="toolbar-row top">
          <div class="toolbar-left">
            <div class="flt-group">
              <span class="flt-label">Status</span>
              <div class="status-pills" id="statusPills">
                <div class="status-pill on all" data-level="">All</div>
                <div class="status-pill ok" data-level="ok"><i class="fa-solid fa-circle" style="color:var(--green)"></i>In Stock</div>
                <div class="status-pill low" data-level="low"><i class="fa-solid fa-circle" style="color:var(--amber)"></i>Low Stock</div>
                <div class="status-pill out" data-level="out"><i class="fa-solid fa-circle" style="color:var(--red)"></i>Out of Stock</div>
              </div>
            </div>
            <div class="flt-group" style="flex:1;min-width:180px;max-width:260px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px;"></i>
                <input type="text" id="fSearch" placeholder="Item name, batch, category…" oninput="render()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Category</span>
              <select class="filter-select" id="fCategory" onchange="render()">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Sort By</span>
              <select class="filter-select" id="fSort" onchange="render()">
                <option value="name_asc">Item (A → Z)</option>
                <option value="qty_asc">Lowest Stock First</option>
                <option value="qty_desc">Highest Stock First</option>
                <option value="received_desc">Recently Received</option>
              </select>
            </div>
            <button class="btn-ghost" type="button" onclick="clearFilters()"><i class="fa-solid fa-xmark"></i> Clear Filters</button>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-outline btn-sm" type="button" onclick="openManageCategories()"><i class="fa-solid fa-tags"></i> Manage Categories</button>
            <button class="btn btn-outline btn-sm" type="button" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
            <button class="btn btn-primary btn-sm" type="button" id="btnAddItem" onclick="openItemModal()" style="display:none"><i class="fa-solid fa-plus"></i> Add Item</button>
          </div>
        </div>
      </div>

      <!-- InventoryTable mounts here -->
      <div id="tableSlot"></div>

    </div>
  </div>
</div>

<!-- ADD / EDIT ITEM -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="itemModalTitle">Add Item to Inventory</div>
      <button class="modal-close" type="button" onclick="closeModal('itemModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-row">
      <div class="form-group span2">
        <label class="form-label">Item Name</label>
        <input class="form-input" type="text" id="fName" placeholder="e.g. Jollof Rice">
      </div>
      <div class="form-group">
       <label class="form-label">Category</label>
       <select class="form-select" id="fCat" onchange="onCatChange()"></select>
       <input class="form-input" type="text" id="fCatCustom" placeholder="New category name…" style="display:none;margin-top:6px;">
      </div>
      <div class="form-group">
        <label class="form-label">Unit</label>
        <select class="form-select" id="fUnit">
          <option>portion</option>
          <option>bowl</option>
          <option>glass</option>
          <option>bottle</option>
          <option>pack</option>
          <option>piece</option>
          <option>plate</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Reorder Level</label>
        <input class="form-input" type="number" id="fMin" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Sale Price (₦)</label>
        <input class="form-input" type="number" id="fPrice" placeholder="0" min="0">
      </div>
      <div class="form-group span2">
        <label class="form-label">Description <span style="text-transform:none;">(optional)</span></label>
        <input class="form-input" type="text" id="fDesc" placeholder="Brief description…">
        <div class="form-hint" id="qtyHint">Qty on hand is set by transfers &amp; sales — not edited here.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" type="button" onclick="closeModal('itemModal')">Cancel</button>
      <button class="btn btn-primary btn-sm" type="button" onclick="saveItem()"><i class="fa-solid fa-check"></i> Save Item</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--red);">Delete Item</div>
      <button class="modal-close" type="button" onclick="closeModal('deleteModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.6;" id="deleteMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" type="button" onclick="closeModal('deleteModal')">Cancel</button>
      <button class="btn btn-sm" type="button" style="background:var(--red-bg);border:1px solid rgba(240,68,56,0.3);color:var(--red);font-weight:700;" onclick="confirmDelete()"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
  </div>
</div>

<!-- MANAGE CATEGORIES -->
<div class="modal-overlay" id="categoryModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Manage Categories</div>
      <button class="modal-close" type="button" onclick="closeModal('categoryModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-section-title">Add New Category</div>
    <div class="form-row">
      <div class="form-group" style="flex:1;">
        <input class="form-input" type="text" id="newCatName" placeholder="Category name…">
      </div>
      <div class="form-group" style="width:auto;">
        <button class="btn btn-primary btn-sm" type="button" onclick="addCategory()"><i class="fa-solid fa-plus"></i> Add</button>
      </div>
    </div>
    <div class="category-list" id="categoryList"></div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" type="button" onclick="closeModal('categoryModal')">Close</button>
    </div>
  </div>
</div>

<!-- EDIT CATEGORY -->
<div class="modal-overlay" id="editCatModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">Rename Category</div>
      <button class="modal-close" type="button" onclick="closeModal('editCatModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <label class="form-label">New name</label>
    <input class="form-input" type="text" id="editCatInput" placeholder="New category name…">
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" type="button" onclick="closeModal('editCatModal')">Cancel</button>
      <button class="btn btn-primary btn-sm" type="button" onclick="saveRenameCategory()"><i class="fa-solid fa-check"></i> Save</button>
    </div>
  </div>
</div>

<script src="../services/permissions.js"></script>
<script src="services/restaurant-service.js"></script>
<script src="../component/restaurant-shell.js"></script>
<script src="../component/inventory-table.js"></script>
<script>
'use strict';

const shell = RestaurantShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'restaurant-inventory.html',
  pageTitle:     'Restaurant Inventory',
  pageSubtitle:  'Every sellable item — food & drinks, one source of truth for Orders',
});

let levelFilter = '';
let editName = null;
let deleteName = null;
let invTable = null;
let canMutate = false; // edit / delete / add

function getSession() {
  if (shell && typeof shell.getUser === 'function') return shell.getUser();
  return null;
}

/** Admin, manager, or staff with canEdit on restaurant module. */
function canEditInventory() {
  const session = getSession();
  if (!session || !session.role) return false;
  const role = String(session.role).toLowerCase();
  if (role === 'admin' || role === 'manager') return true;
  if (window.Permissions) {
    return !!Permissions.hasPermission(session, 'canEdit', 'restaurant');
  }
  return false;
}

function fmtN(n) {
  if (window.RestaurantService && RestaurantService.fmtN) return RestaurantService.fmtN(n);
  return '₦' + Math.round(n || 0).toLocaleString('en-NG');
}
function invLevel(i) {
  if (window.RestaurantService && RestaurantService.stockLevel) return RestaurantService.stockLevel(i);
  return i.qty <= 0 ? 'out' : (i.qty <= (i.min || 0) ? 'low' : 'ok');
}
function itemName(i) { return i.name || i.meal || '—'; }

function parseDDMMYY(s) {
  if (!s || s === '—') return 0;
  var parts = String(s).split('/');
  if (parts.length < 3) return 0;
  var d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
  return new Date(2000 + y, m - 1, d).getTime();
}

function getStock() {
  return (RestaurantService.state && RestaurantService.state.stock) || [];
}

function getCategoriesList() {
  if (window.RestaurantService && RestaurantService.getCategories) {
    return RestaurantService.getCategories();
  }
  var cats = [];
  getStock().forEach(function (i) {
    var c = i.category || 'Uncategorized';
    if (cats.indexOf(c) === -1) cats.push(c);
  });
  return cats.sort();
}

function fillCategorySelect() {
  var sel = document.getElementById('fCategory');
  var current = sel.value;
  var cats = getCategoriesList();
  sel.innerHTML = '<option value="">All Categories</option>' +
    cats.map(function (c) {
      return '<option value="' + c.replace(/"/g, '&quot;') + '"' +
        (c === current ? ' selected' : '') + '>' + c + '</option>';
    }).join('');
}

function renderKPIs() {
  var stock = getStock();
  var total = stock.length;
  var low = stock.filter(function (i) { return invLevel(i) === 'low'; }).length;
  var out = stock.filter(function (i) { return invLevel(i) === 'out'; }).length;
  var units = stock.reduce(function (s, i) { return s + (i.qty || 0); }, 0);
  var lowOk = low === 0;
  var outOk = out === 0;

  document.getElementById('kpiRow').innerHTML =
    '<div class="kpi-card acc-blue" onclick="setLevel(\'\')">' +
      '<div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-boxes-stacked"></i></div><div class="kpi-label">Items Tracked</div></div>' +
      '<div class="kpi-value" style="color:var(--blue);">' + total + '</div>' +
      '<div class="kpi-trend neutral">Across all categories</div>' +
    '</div>' +
    '<div class="kpi-card ' + (lowOk ? 'acc-green' : 'acc-amber') + '" onclick="setLevel(\'low\')">' +
      '<div class="kpi-top"><div class="kpi-ic ' + (lowOk ? 'ic-green' : 'ic-amber') + '"><i class="fa-solid fa-triangle-exclamation"></i></div>' +
      '<div class="kpi-label">Low Stock</div></div>' +
      '<div class="kpi-value" style="color:' + (lowOk ? 'var(--green)' : 'var(--amber)') + ';">' + low + '</div>' +
      '<div class="kpi-trend ' + (lowOk ? 'up' : 'warn') + '">' + (lowOk ? 'All above threshold' : 'Needs restock') + '</div>' +
    '</div>' +
    '<div class="kpi-card ' + (outOk ? 'acc-green' : 'acc-red') + '" onclick="setLevel(\'out\')">' +
      '<div class="kpi-top"><div class="kpi-ic ' + (outOk ? 'ic-green' : 'ic-red') + '"><i class="fa-solid fa-ban"></i></div>' +
      '<div class="kpi-label">Out of Stock</div></div>' +
      '<div class="kpi-value" style="color:' + (outOk ? 'var(--green)' : 'var(--red)') + ';">' + out + '</div>' +
      '<div class="kpi-trend ' + (outOk ? 'up' : 'warn') + '">' + (outOk ? 'None' : 'Unavailable to sell') + '</div>' +
    '</div>' +
    '<div class="kpi-card acc-purple" onclick="setLevel(\'\')">' +
      '<div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-cubes"></i></div><div class="kpi-label">Total Units On Hand</div></div>' +
      '<div class="kpi-value" style="color:var(--purple);">' + units + '</div>' +
      '<div class="kpi-trend info">Across ' + total + ' item' + (total !== 1 ? 's' : '') + '</div>' +
    '</div>';
}

function bindStatusPills() {
  document.querySelectorAll('.status-pill').forEach(function (p) {
    p.addEventListener('click', function () {
      levelFilter = p.dataset.level || '';
      document.querySelectorAll('.status-pill').forEach(function (x) { x.classList.remove('on'); });
      p.classList.add('on');
      render();
    });
  });
}

function setLevel(k) {
  levelFilter = k || '';
  document.querySelectorAll('.status-pill').forEach(function (x) { x.classList.remove('on'); });
  var target = document.querySelector('.status-pill[data-level="' + levelFilter + '"]');
  if (target) target.classList.add('on');
  render();
}

function clearFilters() {
  document.getElementById('fSearch').value = '';
  document.getElementById('fCategory').value = '';
  document.getElementById('fSort').value = 'name_asc';
  levelFilter = '';
  document.querySelectorAll('.status-pill').forEach(function (x) { x.classList.remove('on'); });
  var all = document.querySelector('.status-pill.all');
  if (all) all.classList.add('on');
  render();
}

function applyMutateUI() {
  canMutate = canEditInventory();
  var addBtn = document.getElementById('btnAddItem');
  if (addBtn) addBtn.style.display = canMutate ? '' : 'none';
}

/** (Re)create InventoryTable with current permission flags. */
function mountInventoryTable() {
  canMutate = canEditInventory();
  if (invTable && typeof invTable.destroy === 'function') invTable.destroy();

  invTable = InventoryTable.create({
    target: '#tableSlot',
    pageSize: 8,
    title: 'Restaurant Inventory',
    emptyText: 'No inventory items match your filters.',
    showActions: canMutate,
    showDeduct: false,
    showEdit: canMutate,
    showDelete: canMutate,
    rowClickable: false,
    formatMoney: fmtN,
    stockLevel: invLevel,
    onEdit: function (item) {
      if (!canEditInventory()) return;
      openItemModal(item.name || item.meal);
    },
    onDelete: function (item) {
      if (!canEditInventory()) return;
      openDeleteModal(item.name || item.meal);
    },
  });
  applyMutateUI();
  if (invTable) invTable.setRows(getFiltered());
}

function getFiltered() {
  var q = (document.getElementById('fSearch').value || '').toLowerCase();
  var cat = document.getElementById('fCategory').value;
  var sort = document.getElementById('fSort').value;

  var rows = getStock().filter(function (i) {
    var name = itemName(i).toLowerCase();
    var batch = String(i.batch || '').toLowerCase();
    var category = String(i.category || '').toLowerCase();
    var mq = !q || name.indexOf(q) !== -1 || batch.indexOf(q) !== -1 || category.indexOf(q) !== -1;
    var ml = !levelFilter || invLevel(i) === levelFilter;
    var mc = !cat || (i.category || 'Uncategorized') === cat;
    return mq && ml && mc;
  });

  if (sort === 'name_asc') rows.sort(function (a, b) { return itemName(a).localeCompare(itemName(b)); });
  else if (sort === 'qty_asc') rows.sort(function (a, b) { return (a.qty || 0) - (b.qty || 0); });
  else if (sort === 'qty_desc') rows.sort(function (a, b) { return (b.qty || 0) - (a.qty || 0); });
  else if (sort === 'received_desc') rows.sort(function (a, b) { return parseDDMMYY(b.received) - parseDDMMYY(a.received); });

  return rows;
}

function render() {
  fillCategorySelect();
  renderKPIs();
  if (invTable) invTable.setRows(getFiltered());
}

/* ═══ Add / Edit ═══ */
function fillCatModalSelect(selected) {
  var sel = document.getElementById('fCat');
  var cats = getCategoriesList();
  sel.innerHTML = cats.map(function (c) {
    return '<option value="' + c.replace(/"/g, '&quot;') + '"' +
      (c === selected ? ' selected' : '') + '>' + c + '</option>';
  }).join('') +
    '<option value="__new__">＋ New category…</option>';
  document.getElementById('fCatCustom').style.display = 'none';
  document.getElementById('fCatCustom').value = '';
}

function onCatChange() {
  var v = document.getElementById('fCat').value;
  var custom = document.getElementById('fCatCustom');
  if (v === '__new__') {
    custom.style.display = '';
    custom.focus();
  } else {
    custom.style.display = 'none';
    custom.value = '';
  }
}

function resolveCategoryFromForm() {
  var sel = document.getElementById('fCat').value;
  if (sel === '__new__') {
    var n = document.getElementById('fCatCustom').value.trim();
    if (!n) throw new Error('Enter a name for the new category.');
    return n;
  }
  return sel || 'Uncategorized';
}

function openItemModal(name) {
  if (!canEditInventory()) {
    showToast('You do not have permission to edit inventory.', 'error');
    return;
  }
  editName = name || null;
  var isEdit = !!editName;
  document.getElementById('itemModalTitle').textContent = isEdit ? 'Edit Item' : 'Add Item to Inventory';
  document.getElementById('qtyHint').style.display = isEdit ? '' : 'none';

  if (isEdit) {
    var i = RestaurantService.findStock(editName);
    if (!i) { showToast('Item not found.', 'error'); return; }
    document.getElementById('fName').value = i.name;
    document.getElementById('fName').disabled = true;
    fillCatModalSelect(i.category || 'Uncategorized');
    document.getElementById('fUnit').value = i.unit || 'portion';
    document.getElementById('fMin').value = i.min != null ? i.min : '';
    document.getElementById('fPrice').value = i.price != null ? i.price : '';
    document.getElementById('fDesc').value = i.desc || '';
  } else {
    document.getElementById('fName').value = '';
    document.getElementById('fName').disabled = false;
    fillCatModalSelect('Mains');
    document.getElementById('fUnit').value = 'portion';
    document.getElementById('fMin').value = '';
    document.getElementById('fPrice').value = '';
    document.getElementById('fDesc').value = '';
  }
  document.getElementById('itemModal').classList.add('show');
}

async function saveItem() {
  var name = document.getElementById('fName').value.trim();
  if (!name) { showToast('Please enter an item name.', 'error'); return; }

  var category;
  try {
    category = resolveCategoryFromForm();
  } catch (e) {
    showToast(e.message, 'error');
    return;
  }

  var payload = {
    category: category,
    unit: document.getElementById('fUnit').value,
    min: parseFloat(document.getElementById('fMin').value) || 0,
    price: parseFloat(document.getElementById('fPrice').value) || 0,
    desc: document.getElementById('fDesc').value.trim(),
  };

  try {
    if (editName) {
      await RestaurantService.editStockItem(editName, payload);
      showToast('Item updated.', 'success');
    } else {
      await RestaurantService.addStockItem({
        name: name,
        category: payload.category,
        unit: payload.unit,
        min: payload.min,
        price: payload.price,
        desc: payload.desc,
      });
      showToast('Item added to inventory.', 'success');
    }
    closeModal('itemModal');
    render();
  } catch (err) {
    showToast(err.message || 'Could not save item.', 'error');
  }
}

function openDeleteModal(name) {
  if (!canEditInventory()) {
    showToast('You do not have permission to delete inventory items.', 'error');
    return;
  }
  deleteIsCategory = false;
  deleteName = name;
  deleteCatName = '';
  document.querySelector('#deleteModal .modal').classList.add('mode-delete');
  document.getElementById('deleteMsg').textContent =
    'Remove "' + name + '" from Restaurant Inventory? This cannot be undone.';
  document.getElementById('deleteModal').classList.add('show');
}

async function confirmDelete() {
  if (deleteIsCategory) return confirmDeleteCategory();
  if (!deleteName) return;
  try {
    await RestaurantService.deleteStockItem(deleteName);
    showToast('"' + deleteName + '" removed from inventory.', 'error');
    closeModal('deleteModal');
    render();
  } catch (err) {
    showToast(err.message || 'Could not delete item.', 'error');
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
['itemModal', 'deleteModal'].forEach(function (id) {
  document.getElementById(id).addEventListener('click', function (e) {
    if (e.target === this) closeModal(id);
  });
});

/* ═══ Manage Categories ═══ */
let editCatOldName = '';
let deleteCatName = '';
let deleteIsCategory = false;

function renderCategoryList() {
  var cats = RestaurantService.getCategories();
  var el = document.getElementById('categoryList');
  el.innerHTML = cats.map(function (c) {
    var n = escapeHtml(c);
    return '<div class="cat-item">' +
      '<span>' + n + '</span>' +
      '<span class="cat-actions">' +
      '<button class="act-btn" onclick="openEditCategory(\'' + c.replace(/'/g, "\\'") + '\')" title="Rename"><i class="fa-solid fa-pen"></i></button> ' +
      '<button class="act-btn" style="color:var(--red);" onclick="openDeleteCategory(\'' + c.replace(/'/g, "\\'") + '\')" title="Delete"><i class="fa-solid fa-trash"></i></button>' +
      '</span></div>';
  }).join('') || '<div style="font-size:12px;color:var(--text3);padding:8px 0;">No categories yet.</div>';
}

function openManageCategories() {
  if (!canEditInventory()) { showToast('You do not have permission to manage categories.', 'error'); return; }
  renderCategoryList();
  document.getElementById('categoryModal').classList.add('show');
}

async function addCategory() {
  var input = document.getElementById('newCatName');
  var name = (input.value || '').trim();
  if (!name) { showToast('Enter a category name.', 'error'); return; }
  try {
    await RestaurantService.addCategory(name);
    input.value = '';
    renderCategoryList();
    showToast('Category added.', 'success');
  } catch (err) {
    showToast(err.message || 'Could not add category.', 'error');
  }
}

function openEditCategory(name) {
  editCatOldName = name;
  document.getElementById('editCatInput').value = name;
  document.getElementById('editCatModal').classList.add('show');
}

async function saveRenameCategory() {
  var newName = (document.getElementById('editCatInput').value || '').trim();
  if (!newName) { showToast('Enter a new category name.', 'error'); return; }
  try {
    await RestaurantService.renameCategory(editCatOldName, newName);
    closeModal('editCatModal');
    renderCategoryList();
    showToast('Category renamed.', 'success');
  } catch (err) {
    showToast(err.message || 'Could not rename category.', 'error');
  }
}

function openDeleteCategory(name) {
  deleteIsCategory = true;
  deleteCatName = name;
  deleteName = '';
  var msg = document.getElementById('deleteMsg');
  msg.textContent = 'Delete category "' + name + '"? Items in this category will revert to "Uncategorized".';
  document.getElementById('deleteModal').classList.add('show');
  document.getElementById('deleteModal').classList.add('mode-delete');
}

async function confirmDeleteCategory() {
  if (!deleteCatName) return;
  try {
    await RestaurantService.deleteCategory(deleteCatName, { reassignTo: 'Uncategorized' });
    closeModal('deleteModal');
    renderCategoryList();
    showToast('Category deleted.', 'success');
  } catch (err) {
    showToast(err.message || 'Could not delete category.', 'error');
  }
}

['categoryModal', 'editCatModal'].forEach(function (id) {
  document.getElementById(id).addEventListener('click', function (e) {
    if (e.target === this) closeModal(id);
  });
});
document.getElementById('deleteModal').addEventListener('click', function (e) {
  if (e.target === this) closeModal('deleteModal');
});

function escapeHtml(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function showToast(msg, type) {
  type = type || 'success';
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  var icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + escapeHtml(msg);
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3400);
}

async function init() {
  if (!window.RestaurantService) {
    document.getElementById('kpiRow').innerHTML =
      '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text3);">RestaurantService not loaded. Check script order.</div>';
    return;
  }
  if (!window.InventoryTable) {
    document.getElementById('tableSlot').innerHTML =
      '<div style="padding:24px;text-align:center;color:var(--text3);">InventoryTable component not loaded.</div>';
    return;
  }

  try {
    await RestaurantService.loadAll();

    mountInventoryTable();
    bindStatusPills();
    render();

    // Live session may resolve after first paint — refresh action visibility
    setTimeout(function () {
      var next = canEditInventory();
      if (next !== canMutate) mountInventoryTable();
      else applyMutateUI();
    }, 400);

    if (RestaurantService.onChange) {
      RestaurantService.onChange(function () { render(); });
    }
  } catch (err) {
    console.error(err);
    document.getElementById('kpiRow').innerHTML =
      '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text3);">Could not load inventory.</div>';
  }
}

init();
</script>
