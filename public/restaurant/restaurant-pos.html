<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Point of Sale | Aurum Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  /* restaurant-shell.js defines --gold/--text/--border/--surface etc,
     but never defines status colors — every green/red/amber/blue
     reference on this page depends on THESE being defined right here,
     exactly as on every other Restaurant page. */
  :root{
    --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
    --red:#f87171; --red-bg:rgba(248,113,113,0.12);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
  }
  /* This page only owns layout + its own content. Sidebar + topbar
     look/markup live entirely in restaurant-shell.js. Layout matches
     pool-bar.html / restaurant-inventory.html: normal document flow,
     body scrolls naturally — nothing traps overflow. */
  html{ height:auto; }
  body{ font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{ padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  /* ═══ KPI ═══ */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; transition:transform .2s,box-shadow .2s,border-color .2s; min-height:112px; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.revenue{ background:linear-gradient(160deg, rgba(74,222,128,.08), var(--surface) 60%); border-color:rgba(74,222,128,.24); }
  .kpi-card.revenue::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.revenue .kpi-label{ color:var(--green); }
  .kpi-card.units{ background:linear-gradient(160deg, rgba(96,165,250,.08), var(--surface) 60%); border-color:rgba(96,165,250,.24); }
  .kpi-card.units::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.units .kpi-label{ color:var(--blue); }
  .kpi-card.attn{ background:linear-gradient(160deg, rgba(251,191,36,.08), var(--surface) 60%); border-color:rgba(251,191,36,.24); }
  .kpi-card.attn::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-card.attn .kpi-label{ color:var(--amber); }
  .kpi-accent{ position:absolute; bottom:-10px; right:-10px; font-size:46px; opacity:.16; line-height:1; pointer-events:none; }
  .kpi-label{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; font-weight:500; }
  .kpi-value{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1; margin-bottom:6px; }
  @media (max-width:420px){ .kpi-value{ font-size:21px; } }
  .kpi-trend{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  /* ═══ POS builder ═══ */
  .pos-builder{ display:grid; grid-template-columns:1fr 340px; gap:14px; align-items:start; }
  @media (max-width:900px){ .pos-builder{ grid-template-columns:1fr; } }

  .menu-picker{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .mp-header{ padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .mp-title{ font-size:13px; font-weight:600; color:var(--text); flex:1; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; transition:border-color .2s; min-width:160px; max-width:220px; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }

  .mi-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding:14px; }
  .mi-tile{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; transition:all .15s; text-align:left; width:100%; font-family:'Outfit',sans-serif; position:relative; overflow:hidden; }
  .mi-tile:hover{ border-color:var(--gold-border); background:var(--gold-dim); }
  .mi-tile:disabled, .mi-tile.out{ opacity:.5; cursor:not-allowed; }
  .mi-tile:disabled:hover, .mi-tile.out:hover{ border-color:var(--border); background:var(--surface2); }
  .mi-name{ font-size:13px; font-weight:600; color:var(--text); margin-bottom:5px; }
  .mi-price{ font-size:12.5px; color:var(--gold); font-weight:600; margin-bottom:5px; }
  .mi-stock{ font-size:10.5px; color:var(--text3); }
  .mi-stock.low{ color:var(--amber); } .mi-stock.out{ color:var(--red); font-weight:600; }
  .mi-badge{ position:absolute; top:8px; right:8px; font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:2px 6px; border-radius:20px; background:var(--red-bg); color:var(--red); }

  .empty-note{ font-size:12.5px; color:var(--text3); padding:24px; text-align:center; grid-column:1/-1; }

  /* ═══ Cart ═══ */
  .cart-panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; position:sticky; top:16px; }
  .cart-head{ padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .cart-title{ font-size:13px; font-weight:600; color:var(--text); }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-family:'Outfit',sans-serif; font-size:11.5px; cursor:pointer; padding:4px 8px; }
  .btn-ghost:hover{ color:var(--gold); }
  .cart-body{ flex:1; overflow-y:auto; padding:8px 14px; min-height:80px; max-height:280px; }
  .cart-empty{ text-align:center; padding:24px 12px; color:var(--text3); font-size:12.5px; }
  .ci{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .ci:last-child{ border-bottom:none; }
  .ci-name{ flex:1; font-size:12.5px; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ci-qty{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .ci-qty button{ background:var(--surface2); border:1px solid var(--border); color:var(--text); width:22px; height:22px; border-radius:6px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .ci-qty button:hover{ background:var(--gold-dim); color:var(--gold); border-color:var(--gold-border); }
  .ci-qty span{ font-size:12.5px; font-weight:600; min-width:18px; text-align:center; }
  .ci-price{ font-size:12px; color:var(--gold); min-width:60px; text-align:right; flex-shrink:0; }
  .ci-del{ background:none; border:none; color:var(--text3); cursor:pointer; font-size:14px; padding:2px 4px; transition:color .15s; flex-shrink:0; }
  .ci-del:hover{ color:var(--red); }

  .cart-footer{ border-top:1px solid var(--border); padding:14px 16px; }
  .ct-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text2); margin-bottom:6px; align-items:center; }
  .ct-row.total{ font-size:15px; font-weight:600; color:var(--text); margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
  .ct-row.total .ct-val{ color:var(--gold); font-family:'Cormorant Garamond',serif; font-size:19px; }
  .disc-input{ width:50px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:3px 6px; color:var(--text); font-size:12px; text-align:center; outline:none; }
  .disc-input:focus{ border-color:var(--gold-border); }

  .form-group{ display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:500; }
  .form-input, .form-select{ background:var(--input-bg,var(--surface2)); border:1px solid var(--border); border-radius:9px; padding:8px 11px; color:var(--text); font-family:'Outfit',sans-serif; font-size:12.5px; outline:none; transition:border-color .2s; width:100%; }
  .form-input:focus, .form-select:focus{ border-color:var(--gold-border); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-primary{ background:var(--gold); color:#000; font-weight:700; }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }

  /* Toast */
  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text); box-shadow:0 8px 28px rgba(0,0,0,0.3); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); }
  .toast.success{ border-left:3px solid var(--green); }
  .toast.error{ border-left:3px solid var(--red); }
  .toast.info{ border-left:3px solid var(--blue); }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar is rendered here by restaurant-shell.js — Restaurant nav only -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar is rendered here by restaurant-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <div class="pos-builder">
        <!-- Meal picker — pulled straight from Restaurant Inventory, so
             you can only sell what Kitchen has actually transferred over. -->
        <div class="menu-picker">
          <div class="mp-header">
            <div class="mp-title">Sell From Restaurant Inventory</div>
            <div class="search-box">
              <span style="color:var(--text3);font-size:12px;">🔍</span>
              <input type="text" id="mealSearch" placeholder="Search meal…" oninput="renderPicker()">
            </div>
          </div>
          <div class="mi-grid" id="mealGrid"></div>
        </div>

        <!-- Cart -->
        <div class="cart-panel">
          <div class="cart-head">
            <div class="cart-title">Current Sale</div>
            <button class="btn-ghost" onclick="clearCart()">Clear</button>
          </div>
          <div class="cart-body" id="cartBody"><div class="cart-empty">Tap a meal to add it to the sale</div></div>
          <div class="cart-footer">
            <div class="ct-row"><span>Subtotal</span><span id="cartSub">₦0</span></div>
            <div class="ct-row">
              <span>Discount</span>
              <span style="display:flex;align-items:center;gap:4px;">
                <input type="number" class="disc-input" id="cartDisc" value="0" min="0" max="100" oninput="updateTotals()">%
              </span>
            </div>
            <div class="ct-row total"><span>Total</span><span class="ct-val" id="cartTotal">₦0</span></div>

            <div style="height:10px;"></div>
            <div class="form-group">
              <label class="form-label">Table / Seat</label>
              <input class="form-input" type="text" id="fTable" placeholder="e.g. Table 4, Takeaway">
            </div>
            <div class="form-group">
              <label class="form-label">Payment Method</label>
              <select class="form-select" id="fMethod">
                <option>Cash</option><option>POS</option><option>Transfer</option><option>Room Charge</option><option>Complimentary</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Staff</label>
              <input class="form-input" type="text" id="fStaff" placeholder="Staff name">
            </div>
            <div class="form-group">
              <label class="form-label">Notes (optional)</label>
              <input class="form-input" type="text" id="fNotes" placeholder="Allergies, special requests…">
            </div>
            <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;" id="submitBtn" onclick="submitSale()">✓ Complete Sale</button>
            <div style="text-align:center;margin-top:10px;">
              <a href="restaurant-sales.html" style="font-size:11px;color:var(--text3);text-decoration:none;">View Sales Ledger →</a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../component/restaurant-shell.js"></script>
<script>
/* ═══════════════════════════════════════════
   Shell — sidebar + topbar, restaurant nav only.
═══════════════════════════════════════════ */
const shell = RestaurantShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'restaurant-pos.html',
  pageTitle:     'Point of Sale',
  pageSubtitle:  'Sell meals from Restaurant Inventory — stock deducts automatically',
  apiMode:       'Demo',
  user:          { name: 'Restaurant Manager', initials: 'RM' },
});

/* ═══════════════════════════════════════════
   CONFIG, API LAYER & STORAGE
   This IS the page that creates sales. It reads/writes the same
   shared keys as restaurant-sales.html (the ledger) and
   restaurant-inventory.html (stock), so a sale rung up here shows
   up instantly on both — same pattern as Transfers' Accept/Reject.
═══════════════════════════════════════════ */
const CFG = { API_BASE:'', API_KEY:'', USE_DEMO:true };

async function apiFetch(method, path, body=null){
  if (!CFG.API_BASE) throw new Error('No API_BASE configured');
  const opts = { method, headers:{ 'Content-Type':'application/json' } };
  if (CFG.API_KEY) opts.headers['Authorization'] = `Bearer ${CFG.API_KEY}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(CFG.API_BASE + path, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
function apiSave(method, path, body){ if (!CFG.USE_DEMO) apiFetch(method, path, body).catch(e => console.warn('[API write]', e.message)); }

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared}; }
};

const KEY_SALES     = 'restaurant-sales';
const KEY_INVENTORY = 'restaurant-inventory';
const KEY_MOVEMENTS = 'restaurant-movements';

async function loadShared(key, fallback){
  try {
    const r = await storage.get(key, true);
    if (r && r.value) { const parsed = JSON.parse(r.value); if (Array.isArray(parsed)) return parsed; }
  } catch(e){}
  return fallback;
}
async function saveShared(key, value){
  try { await storage.set(key, JSON.stringify(value), true); } catch(e){ console.warn('[sync]', key, e); }
}

/* Demo seed — only used the very first time, before anything syncs.
   Same shape/rows as restaurant-inventory.html and restaurant-sales.html
   so all three pages agree on what "Restaurant Inventory" looks like. */
const DEMO_INVENTORY = [
  { meal:'Egusi Soup',  qty:15, unit:'Portions', batch:'PROD-00094', received:'17/07/26', min:8 },
  { meal:'Moi Moi',     qty:4,  unit:'Pieces',   batch:'PROD-00090', received:'16/07/26', min:8 },
  { meal:'Jollof Rice', qty:0,  unit:'Plates',   batch:'PROD-00088', received:'16/07/26', min:6 },
  { meal:'Fried Rice',  qty:18, unit:'Plates',   batch:'PROD-00085', received:'16/07/26', min:6 },
];
const DEMO_SALES = [
  { id:'SALE-1043', items:[{meal:'Egusi Soup',qty:2,price:6000}], subtotal:12000, discount:0, total:12000, method:'Cash', staff:'Amaka O.', table:'Table 4', notes:'', date:'17/07/26 11:05 AM', status:'completed' },
  { id:'SALE-1042', items:[{meal:'Fried Rice',qty:3,price:6000}], subtotal:18000, discount:0, total:18000, method:'POS', staff:'Tunde A.', table:'Table 2', notes:'', date:'17/07/26 10:40 AM', status:'completed' },
  { id:'SALE-1041', items:[{meal:'Moi Moi',qty:1,price:2500}], subtotal:2500, discount:0, total:2500, method:'Transfer', staff:'Amaka O.', table:'Takeaway', notes:'', date:'17/07/26 09:52 AM', status:'completed' },
];

/* Restaurant Inventory items don't carry a sale price (they only track
   quantity/unit/reorder — see restaurant-inventory.html), so POS keeps
   its own price list, same numbers already used in restaurant-sales.html's
   demo data. New meals default to ₦3,500 until a manager sets a real price. */
const MENU_PRICES = {
  'Egusi Soup': 6000, 'Fried Rice': 6000, 'Moi Moi': 2500, 'Jollof Rice': 5500,
  'Pounded Yam': 4500,
};
function priceFor(meal){ return MENU_PRICES[meal] || 3500; }

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let inventory = [];
let sales     = [];
let movements = [];
let cart      = [];

function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function invLevel(i){ return i.qty<=0 ? 'out' : (i.qty<=i.min ? 'low' : 'ok'); }
function nowStamp(){
  const d = new Date();
  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  const year = String(d.getFullYear()).slice(-2);
  let hh = d.getHours();
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ampm = hh >= 12 ? 'PM' : 'AM';
  hh = hh % 12; if (hh === 0) hh = 12;
  return `${day}/${month}/${year} ${String(hh).padStart(2,'0')}:${mm} ${ampm}`;
}
function todayDDMMYY(){
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`;
}

/* ═══════════════════════════════════════════
   KPIs
═══════════════════════════════════════════ */
function renderKPIs(){
  const today = todayDDMMYY();
  const todaySales = sales.filter(s => s.status === 'completed' && s.date.startsWith(today));
  const revenue = todaySales.reduce((s,x)=>s+x.total,0);
  const units = todaySales.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0);
  const available = inventory.filter(i => i.qty > 0).length;
  const needsAttn = inventory.filter(i => invLevel(i) !== 'ok').length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card revenue">
      <div class="kpi-accent" style="color:var(--green)">💰</div>
      <div class="kpi-label">Today's Sales</div>
      <div class="kpi-value" style="color:var(--green);">${fmtN(revenue)}</div>
      <div class="kpi-trend up">${todaySales.length} sale${todaySales.length!==1?'s':''} rung up</div>
    </div>
    <div class="kpi-card units">
      <div class="kpi-accent" style="color:var(--blue)">📦</div>
      <div class="kpi-label">Units Sold Today</div>
      <div class="kpi-value" style="color:var(--blue);">${units}</div>
      <div class="kpi-trend info">Across all meals</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">🍽</div>
      <div class="kpi-label">Meals Available</div>
      <div class="kpi-value">${available}</div>
      <div class="kpi-trend neutral">Of ${inventory.length} tracked</div>
    </div>
    <div class="kpi-card attn">
      <div class="kpi-accent" style="color:var(--amber)">⚠️</div>
      <div class="kpi-label">Needs Restock</div>
      <div class="kpi-value" style="color:var(--amber);">${needsAttn}</div>
      <div class="kpi-trend ${needsAttn>0?'warn':'up'}">${needsAttn>0?'Low or out of stock':'✓ All above threshold'}</div>
    </div>`;
}

/* ═══════════════════════════════════════════
   MEAL PICKER — sourced straight from Restaurant Inventory
═══════════════════════════════════════════ */
function renderPicker(){
  const q = (document.getElementById('mealSearch').value || '').toLowerCase();
  const items = inventory.filter(i => !q || i.meal.toLowerCase().includes(q));

  document.getElementById('mealGrid').innerHTML = items.length === 0
    ? `<div class="empty-note">No meals in Restaurant Inventory yet — accept a Kitchen transfer first.</div>`
    : items.map(i => {
        const lvl = invLevel(i);
        const inCart = cart.find(c => c.meal === i.meal);
        const remaining = i.qty - (inCart ? inCart.qty : 0);
        const disabled = i.qty <= 0 || remaining <= 0;
        return `<button class="mi-tile${i.qty<=0?' out':''}" ${disabled?'disabled':''} onclick="addToCart('${i.meal.replace(/'/g,"\\'")}')">
          ${i.qty<=0?'<span class="mi-badge">Out</span>':''}
          <div class="mi-name">${i.meal}</div>
          <div class="mi-price">${fmtN(priceFor(i.meal))}</div>
          <div class="mi-stock ${lvl}">${i.qty} ${i.unit} on hand</div>
        </button>`;
      }).join('');
}

/* ═══════════════════════════════════════════
   CART
═══════════════════════════════════════════ */
function addToCart(meal){
  const inv = inventory.find(i => i.meal === meal);
  if (!inv || inv.qty <= 0) { showToast(`${meal} is out of stock.`, 'error'); return; }
  const existing = cart.find(c => c.meal === meal);
  const alreadyInCart = existing ? existing.qty : 0;
  if (alreadyInCart >= inv.qty) { showToast(`Only ${inv.qty} ${inv.unit} of ${meal} available.`, 'error'); return; }
  if (existing) existing.qty++;
  else cart.push({ meal, price: priceFor(meal), qty: 1, unit: inv.unit });
  renderCart();
  renderPicker();
}
function adjustQty(meal, delta){
  const c = cart.find(x => x.meal === meal);
  if (!c) return;
  const inv = inventory.find(i => i.meal === meal);
  const max = inv ? inv.qty : c.qty;
  const next = c.qty + delta;
  if (next < 1) { removeFromCart(meal); return; }
  if (next > max) { showToast(`Only ${max} ${c.unit} of ${meal} available.`, 'error'); return; }
  c.qty = next;
  renderCart();
  renderPicker();
}
function removeFromCart(meal){
  cart = cart.filter(c => c.meal !== meal);
  renderCart();
  renderPicker();
}
function clearCart(){
  cart = [];
  renderCart();
  renderPicker();
}
function renderCart(){
  const body = document.getElementById('cartBody');
  if (cart.length === 0) { body.innerHTML = `<div class="cart-empty">Tap a meal to add it to the sale</div>`; updateTotals(); return; }
  body.innerHTML = cart.map(c => `
    <div class="ci">
      <div class="ci-name">${c.meal}</div>
      <div class="ci-qty">
        <button onclick="adjustQty('${c.meal.replace(/'/g,"\\'")}',-1)">−</button>
        <span>${c.qty}</span>
        <button onclick="adjustQty('${c.meal.replace(/'/g,"\\'")}',1)">+</button>
      </div>
      <div class="ci-price">${fmtN(c.price * c.qty)}</div>
      <button class="ci-del" onclick="removeFromCart('${c.meal.replace(/'/g,"\\'")}')">✕</button>
    </div>`).join('');
  updateTotals();
}
function updateTotals(){
  const sub = cart.reduce((s,c) => s + c.price * c.qty, 0);
  const disc = parseFloat(document.getElementById('cartDisc').value) || 0;
  document.getElementById('cartSub').textContent = fmtN(sub);
  document.getElementById('cartTotal').textContent = fmtN(sub * (1 - disc/100));
  document.getElementById('submitBtn').disabled = cart.length === 0;
}

/* ═══════════════════════════════════════════
   SUBMIT SALE — deducts Restaurant Inventory, logs a movement,
   and appends to the shared Sales ledger.
═══════════════════════════════════════════ */
function nextSaleId(){
  let max = 1040;
  sales.forEach(s => { const n = parseInt((s.id||'').replace('SALE-',''), 10); if (!isNaN(n) && n > max) max = n; });
  return 'SALE-' + (max + 1);
}

async function submitSale(){
  if (cart.length === 0) { showToast('Add at least one meal to the sale.', 'error'); return; }
  const table = document.getElementById('fTable').value.trim();
  const staff = document.getElementById('fStaff').value.trim();
  if (!table) { showToast('Please enter a table or seat.', 'error'); return; }
  if (!staff) { showToast('Please enter the staff name.', 'error'); return; }

  const discount = parseFloat(document.getElementById('cartDisc').value) || 0;
  const subtotal = cart.reduce((s,c) => s + c.price * c.qty, 0);
  const total = subtotal * (1 - discount/100);
  const stamp = nowStamp();

  const sale = {
    id: nextSaleId(),
    items: cart.map(c => ({ meal: c.meal, qty: c.qty, price: c.price })),
    subtotal, discount, total,
    method: document.getElementById('fMethod').value,
    staff, table,
    notes: document.getElementById('fNotes').value.trim(),
    date: stamp,
    status: 'completed',
  };

  // Deduct stock + log a movement for every item sold
  cart.forEach(c => {
    const inv = inventory.find(i => i.meal === c.meal);
    if (inv) {
      inv.qty = Math.max(0, inv.qty - c.qty);
      movements.unshift({ date: stamp, meal: c.meal, qtyIn: 0, qtyOut: c.qty, balance: inv.qty, reason: `Sale (${sale.id})` });
    }
  });

  sales.unshift(sale);

  await Promise.all([ saveShared(KEY_SALES, sales), saveShared(KEY_INVENTORY, inventory), saveShared(KEY_MOVEMENTS, movements) ]);
  apiSave('POST', '/api/restaurant/sales', sale);

  clearCart();
  document.getElementById('fTable').value = '';
  document.getElementById('fStaff').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('cartDisc').value = '0';

  renderKPIs();
  showToast(`${sale.id} recorded — ${fmtN(total)}.`, 'success');
}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
function showToast(msg, type='success'){
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = (type==='success'?'✓ ':type==='error'?'✕ ':'ℹ ') + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

/* ═══════════════════════════════════════════
   INIT — tries a real API first (when CFG.USE_DEMO=false), falls
   back to shared storage, and finally to the hardcoded demo seed.
   Shared storage keeps this page in sync with Sales and Inventory.
═══════════════════════════════════════════ */
async function init(){
  if (!CFG.USE_DEMO) {
    try {
      const data = await apiFetch('GET', '/api/restaurant/pos');
      inventory = data.inventory || [];
      sales     = data.sales || [];
      movements = data.movements || [];
      shell.setApiMode('Live');
      renderKPIs(); renderPicker(); renderCart();
      return;
    } catch(e) { console.warn('[API] Falling back to shared/demo data:', e.message); }
  }

  inventory = await loadShared(KEY_INVENTORY, DEMO_INVENTORY);
  sales     = await loadShared(KEY_SALES, DEMO_SALES);
  movements = await loadShared(KEY_MOVEMENTS, []);

  // Seed shared storage the very first time so Inventory / Sales / Dashboard
  // all read the same live data going forward.
  await Promise.all([
    saveShared(KEY_INVENTORY, inventory),
    saveShared(KEY_SALES, sales),
    saveShared(KEY_MOVEMENTS, movements),
  ]);

  renderKPIs();
  renderPicker();
  renderCart();
}
init();
</script>
