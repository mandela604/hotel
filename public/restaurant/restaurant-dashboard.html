<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Dashboard | Aurum Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{ --radius:14px; --radius-sm:10px; --transition:.3s cubic-bezier(.4,0,.2,1); }
  html, body{ height:100%; overflow:hidden; }
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:13px; transition:background .3s,color .3s;
  }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; gap:16px; min-height:0;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:768px){ .content{ padding:16px 16px 24px; } }
  @media (max-width:480px){ .content{ padding:14px 12px 20px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:700; margin-bottom:8px; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 14px 12px; position:relative; overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s;
    text-decoration:none; display:flex; flex-direction:column; animation:fadeUp .4s ease both; color:inherit;
  }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-card.acc-amber::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.neutral{ color:var(--text3); }

  .row{
    display:grid;
    grid-template-columns:1.3fr .7fr;
    gap:14px;
    align-items:stretch;
  }
  @media (max-width:900px){ .row{ grid-template-columns:1fr; } }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    box-shadow:var(--shadow);
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  @media (max-width:420px){ .panel{ padding:14px; } }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .panel-title{ font-size:12px; font-weight:800; color:var(--text); letter-spacing:.8px; text-transform:uppercase; }
  .panel-action{
    font-size:11.5px; color:var(--gold); text-decoration:none; font-weight:600; white-space:nowrap;
    background:none; border:none; font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  }
  .panel-action:hover{ color:var(--gold-light); }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:10px 0; text-align:center; }

  .rev-total{ font-size:24px; font-weight:800; color:var(--gold); line-height:1; }
  .rev-sub-label{ font-size:11px; color:var(--text3); margin:4px 0 12px; }
  .bar-row{ margin-bottom:10px; } .bar-row:last-child{ margin-bottom:0; }
  .bar-meta{ display:flex; justify-content:space-between; margin-bottom:5px; }
  .bar-name{ font-size:12.5px; color:var(--text2); }
  .bar-count{ font-size:11.5px; color:var(--text3); font-weight:600; }
  .bar-track{ height:6px; background:var(--surface3); border-radius:20px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:20px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width 1.2s cubic-bezier(.4,0,.2,1); }
  .bar-fill.blue{ background:linear-gradient(90deg,#60a5fa,#93c5fd); }
  .bar-fill.purple{ background:linear-gradient(90deg,var(--purple),#c4b5fd); }
  .bar-fill.amber{ background:linear-gradient(90deg,var(--amber),#fbbf24); }
  .bar-fill.green{ background:linear-gradient(90deg,var(--green),#6ee7b7); }

  .list-row{
    display:flex; align-items:center; gap:10px; padding:8px 0;
    border-bottom:1px solid var(--border); text-decoration:none; color:inherit; cursor:pointer;
  }
  .list-row:last-child{ border-bottom:none; padding-bottom:0; }
  .list-row:hover .list-name{ color:var(--gold); }
  .list-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .list-body{ flex:1; min-width:0; }
  .list-name{
    font-size:12.5px; color:var(--text); font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .15s;
  }
  .list-meta{
    font-size:11px; color:var(--text3); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .chip{
    display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px;
    font-size:9.5px; font-weight:700; white-space:nowrap; flex-shrink:0;
  }
  .chip i{ font-size:6px; }
  .chip-sent{ background:var(--blue-bg); color:var(--blue); }
  .chip-low{ background:var(--amber-bg); color:var(--amber); }
  .chip-out{ background:var(--red-bg); color:var(--red); }
  .chip-ok{ background:var(--green-bg); color:var(--green); }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div>
        <div class="section-title">Restaurant Overview</div>
        <div class="kpi-row" id="kpiRow"></div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Revenue Breakdown — Today</div>
            <button type="button" class="panel-action" onclick="location.href='restaurant-reports.html'"><i class="fa-solid fa-arrow-right"></i> Full Report</button>
          </div>
          <div class="rev-total" id="revTotal">₦0</div>
          <div class="rev-sub-label">Restaurant sales, from meals served today</div>
          <div id="revBars"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Restaurant Inventory Status</div>
            <button type="button" class="panel-action" onclick="location.href='restaurant-inventory.html'"><i class="fa-solid fa-arrow-right"></i> View All</button>
          </div>
          <div id="invSnap"></div>
        </div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Pending Transfers from Kitchen</div>
            <button type="button" class="panel-action" onclick="location.href='restaurant-transfer-history.html'"><i class="fa-solid fa-arrow-right"></i> Review All</button>
          </div>
          <div id="pendingXfer"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Low Stock Alerts</div>
            <button type="button" class="panel-action" onclick="location.href='restaurant-inventory.html'"><i class="fa-solid fa-arrow-right"></i> Open Inventory</button>
          </div>
          <div id="lowStock"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../services/permissions.js"></script>
<script src="services/restaurant-service.js"></script>
<script src="../component/restaurant-shell.js"></script>
<script>
'use strict';

var shell = RestaurantShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'restaurant-dashboard.html',
  pageTitle:     'Dashboard',
  pageSubtitle:  'Restaurant operations overview',
});

/**
 * Call-and-render only. Every value/label/threshold below comes straight
 * from RestaurantService — no "if service is missing, compute it here
 * instead" fallback branches, no locally redefined LEVEL_CHIP/LEVEL_LABEL,
 * no hardcoded payment-method list/colors, no hardcoded 'voided' string,
 * no hand-typed OUT/LOW short labels. If RestaurantService fails to load,
 * init() below shows a clear error instead of silently degrading.
 */
var svc = RestaurantService;

function invName(i) { return i.name || '—'; }

function renderKPIs(kpis, stockLen) {
  var pending  = kpis.pendingN || 0;
  var lowStock = kpis.lowStock || 0;
  var today    = kpis.todayRevenue || 0;
  var plates   = kpis.units || 0;
  var salesN   = kpis.todaySalesCount || 0;

  document.getElementById('kpiRow').innerHTML =
    '<a class="kpi-card acc-blue" href="restaurant-transfer-history.html">' +
      '<div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-truck"></i></div><div class="kpi-label">Pending Transfers</div></div>' +
      '<div class="kpi-value" style="color:var(--blue);">' + pending + '</div>' +
      '<div class="kpi-trend ' + (pending > 0 ? 'warn' : 'up') + '">' + (pending > 0 ? 'Awaiting review' : 'All clear') + '</div>' +
    '</a>' +
    '<a class="kpi-card acc-amber" href="restaurant-inventory.html">' +
      '<div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="kpi-label">Low Stock Alerts</div></div>' +
      '<div class="kpi-value" style="color:var(--amber);">' + lowStock + '</div>' +
      '<div class="kpi-trend ' + (lowStock > 0 ? 'warn' : 'up') + '">' + (lowStock > 0 ? 'Needs kitchen transfer' : 'All above threshold') + '</div>' +
    '</a>' +
    '<a class="kpi-card acc-green" href="restaurant-sales.html">' +
      '<div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Today\'s Sales</div></div>' +
      '<div class="kpi-value" style="color:var(--green);">' + svc.fmtN(today) + '</div>' +
      '<div class="kpi-trend up">' + salesN + ' sale' + (salesN !== 1 ? 's' : '') + ' recorded</div>' +
    '</a>' +
    '<a class="kpi-card acc-purple" href="restaurant-inventory.html">' +
      '<div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-box"></i></div><div class="kpi-label">Items On Hand</div></div>' +
      '<div class="kpi-value" style="color:var(--purple);">' + plates + '</div>' +
      '<div class="kpi-trend neutral">' + (stockLen || 0) + ' item' + (stockLen !== 1 ? 's' : '') + ' tracked</div>' +
    '</a>';

  if (shell.setPendingBadge) shell.setPendingBadge(pending);
}

/**
 * All payment-method bars — order, which methods appear, and their color
 * class all come from svc.getRevenueBreakdown(sales), which itself reads
 * RestaurantSeed.REVENUE_METHOD_ORDER / REVENUE_METHOD_COLORS. This page
 * no longer decides "Cash first, then Room Charge…" or which methods are
 * blue vs purple — that's config, not page logic.
 */
function renderRevenue(sales) {
  var total = sales.reduce(function (s, x) { return s + (x.total || 0); }, 0);
  var entries = svc.getRevenueBreakdown(sales); // [{ method, amount, colorClass }]
  var max = entries.length ? Math.max.apply(null, entries.map(function (e) { return e.amount; })) : 1;

  document.getElementById('revTotal').textContent = svc.fmtN(total);
  document.getElementById('revBars').innerHTML = entries.length === 0
    ? '<div class="empty-note">No sales recorded today.</div>'
    : entries.map(function (e) {
        return '<div class="bar-row">' +
          '<div class="bar-meta"><span class="bar-name">' + e.method + '</span><span class="bar-count">' + svc.fmtN(e.amount) + '</span></div>' +
          '<div class="bar-track"><div class="bar-fill ' + (e.colorClass || '') + '" style="width:' + Math.round(e.amount / max * 100) + '%"></div></div>' +
        '</div>';
      }).join('');
}

/** Max 5 inventory rows */
function renderInventorySnapshot(inventory) {
  var el = document.getElementById('invSnap');
  var rows = (inventory || []).slice(0, 5);
  el.innerHTML = rows.length === 0
    ? '<div class="empty-note">No finished meals in Restaurant Inventory yet.</div>'
    : rows.map(function (i) {
        var lvl = svc.stockLevel(i);
        return '<a class="list-row" href="restaurant-inventory.html">' +
          '<span class="list-dot" style="background:' + (lvl === 'ok' ? 'var(--green)' : lvl === 'low' ? 'var(--amber)' : 'var(--red)') + '"></span>' +
          '<div class="list-body"><div class="list-name">' + invName(i) + '</div>' +
          '<div class="list-meta">' + i.qty + ' ' + (i.unit || '') + ' on hand · reorder at ' + (i.min || 0) + '</div></div>' +
          '<span class="chip ' + svc.LEVEL_CHIP[lvl] + '"><i class="fa-solid fa-circle"></i>' + svc.LEVEL_LABEL[lvl] + '</span></a>';
      }).join('');
}

/** Max 2 pending transfers */
function renderPendingTransfers(pending) {
  var el = document.getElementById('pendingXfer');
  var rows = (pending || []).slice(0, 2);
  el.innerHTML = rows.length === 0
    ? '<div class="empty-note">No transfers awaiting review.</div>'
    : rows.map(function (t) {
        var label = t.meal
          ? (t.no + ' — ' + t.meal)
          : (t.no + ' — ' + ((t.items && t.items[0] && t.items[0].name) || 'Batch'));
        var meta = t.meal
          ? ((t.quantity || t.qty || 0) + ' ' + (t.unit || '') + ' · from ' + (t.from || 'Kitchen') + ' · ' + (t.date || ''))
          : (((t.items && t.items.length) || 0) + ' lines · from ' + (t.from || 'Store') + ' · ' + (t.date || ''));
        return '<a class="list-row" href="restaurant-transfer-history.html">' +
          '<span class="list-dot" style="background:var(--blue)"></span>' +
          '<div class="list-body"><div class="list-name">' + label + '</div><div class="list-meta">' + meta + '</div></div>' +
          '<span class="chip chip-sent"><i class="fa-solid fa-circle"></i>Sent</span></a>';
      }).join('');
}

/**
 * Max 2 low-stock alerts. Short OUT/LOW labels come from
 * svc.getLevelLabelsShort() — no hand-typed second label set here.
 */
function renderLowStock(inventory) {
  var el = document.getElementById('lowStock');
  var shortLabels = svc.getLevelLabelsShort();
  var alerts = (inventory || []).filter(function (i) { return svc.stockLevel(i) !== 'ok'; }).slice(0, 2);
  el.innerHTML = alerts.length === 0
    ? '<div class="empty-note">All meals above their reorder threshold.</div>'
    : alerts.map(function (i) {
        var lvl = svc.stockLevel(i);
        return '<a class="list-row" href="restaurant-inventory.html">' +
          '<span class="list-dot" style="background:' + (lvl === 'out' ? 'var(--red)' : 'var(--amber)') + '"></span>' +
          '<div class="list-body"><div class="list-name">' + invName(i) + '</div>' +
          '<div class="list-meta">' + i.qty + ' ' + (i.unit || '') + ' on hand · reorder at ' + (i.min || 0) + '</div></div>' +
          '<span class="chip ' + svc.LEVEL_CHIP[lvl] + '"><i class="fa-solid fa-circle"></i>' + shortLabels[lvl] + '</span></a>';
      }).join('');
}

function paint() {
  var st = svc.state;
  var kpis = svc.dashboardKPIs();
  // Today's non-voided completed sales — svc.getTodaysCompletedSales()
  // already applies the "today" + SALE_COMPLETED rule; no re-typed
  // 'voided' string or manual date-prefix check on this page.
  var todaySales = svc.getTodaysCompletedSales();

  renderKPIs(kpis, (st.stock || []).length);
  renderRevenue(todaySales);
  renderInventorySnapshot(st.stock || []);
  renderPendingTransfers(st.pending || []);
  renderLowStock(st.stock || []);
}

async function init() {
  if (!window.RestaurantService) {
    document.getElementById('kpiRow').innerHTML =
      '<div class="empty-note">RestaurantService not loaded. Script order: seed → restaurant-service → shell.</div>';
    return;
  }
  try {
    await svc.loadAll();
    paint();
    if (svc.onChange) svc.onChange(paint);
  } catch (err) {
    console.error(err);
    document.getElementById('kpiRow').innerHTML =
      '<div class="empty-note">Could not load dashboard data.</div>';
  }
}
init();
</script>
</body>
</html>
