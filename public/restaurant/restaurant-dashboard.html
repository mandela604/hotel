<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Dashboard | Aurum Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  /* This page only owns layout + its own KPI/panel content.
     Sidebar + topbar look/markup live entirely in restaurant-shell.js and
     stay on the shared dark/blue theme. The .content scope below re-declares
     the SAME variable names with light values, so only the main content
     area turns white — the sidebar never sees these overrides. */
  :root{ --radius:14px; --radius-sm:10px; --transition:.3s cubic-bezier(.4,0,.2,1); }
  html, body{ height:100%; overflow:hidden; }
  body{ font-family:'Outfit',sans-serif; font-size:14px; transition:background .3s,color .3s; }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  /* ── Light-theme variables, scoped to content only ── */
  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:500; margin-bottom:2px; }

  /* KPI */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; position:relative; overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s; text-decoration:none; display:block; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-label{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; font-weight:500; }
  .kpi-value{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1; margin-bottom:6px; }
  @media (max-width:420px){ .kpi-value{ font-size:21px; } }
  .kpi-trend{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); }

  /* Row / Panel */
  .row{ display:grid; grid-template-columns:1.3fr .7fr; gap:14px; }
  @media (max-width:900px){ .row{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow); min-width:0; }
  @media (max-width:420px){ .panel{ padding:14px; } }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  .panel-title{ font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.8px; text-transform:uppercase; }
  .panel-action{ font-size:11.5px; color:var(--gold); text-decoration:none; font-weight:500; white-space:nowrap; background:none; border:none; font-family:'Outfit',sans-serif; cursor:pointer; }
  .panel-action:hover{ color:var(--gold-light); }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:14px 0; text-align:center; }

  /* Revenue bars */
  .rev-total{ font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:700; color:var(--gold); line-height:1; }
  .rev-sub-label{ font-size:11px; color:var(--text3); margin:4px 0 16px; }
  .bar-row{ margin-bottom:12px; } .bar-row:last-child{ margin-bottom:0; }
  .bar-meta{ display:flex; justify-content:space-between; margin-bottom:5px; }
  .bar-name{ font-size:12.5px; color:var(--text2); } .bar-count{ font-size:11.5px; color:var(--text3); }
  .bar-track{ height:6px; background:var(--surface3); border-radius:20px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:20px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width 1.2s cubic-bezier(.4,0,.2,1); }
  .bar-fill.blue{ background:linear-gradient(90deg,#60a5fa,#93c5fd); }
  .bar-fill.purple{ background:linear-gradient(90deg,#a78bfa,#c4b5fd); }

  /* List rows */
  .list-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); text-decoration:none; color:inherit; cursor:pointer; }
  .list-row:last-child{ border-bottom:none; padding-bottom:0; }
  .list-row:hover .list-name{ color:var(--gold-light); }
  .list-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .list-body{ flex:1; min-width:0; }
  .list-name{ font-size:12.5px; color:var(--text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .15s; }
  .list-meta{ font-size:11px; color:var(--text3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; flex-shrink:0; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .chip-sent{ background:var(--blue-bg); color:var(--blue); } .chip-sent::before{ background:var(--blue); }
  .chip-low{ background:var(--amber-bg); color:var(--amber); } .chip-low::before{ background:var(--amber); }
  .chip-out{ background:var(--red-bg); color:var(--red); } .chip-out::before{ background:var(--red); }
  .chip-ok{ background:var(--green-bg); color:var(--green); } .chip-ok::before{ background:var(--green); }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @media print{
    #rst-sidebar, #rst-topbar, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
  }



  
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar is rendered here by restaurant-shell.js — Restaurant nav only -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar is rendered here by restaurant-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">

      <div>
        <div class="section-title">Restaurant Overview</div>
        <div class="kpi-row" id="kpiRow"></div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Revenue Breakdown — Today</div>
            <button class="panel-action" onclick="location.href='restaurant-reports.html'">Full Report →</button>
          </div>
          <div class="rev-total" id="revTotal">₦0</div>
          <div class="rev-sub-label">Restaurant sales, from meals served today</div>
          <div id="revBars"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Restaurant Inventory Status</div>
            <button class="panel-action" onclick="location.href='restaurant-inventory.html'">View All →</button>
          </div>
          <div id="invSnap"></div>
        </div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Pending Transfers from Kitchen</div>
            <button class="panel-action" onclick="location.href='restaurant-transfers.html'">Review All →</button>
          </div>
          <div id="pendingXfer"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Low Stock Alerts</div>
            <button class="panel-action" onclick="location.href='restaurant-inventory.html'">Open Inventory →</button>
          </div>
          <div id="lowStock"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../component/restaurant-shell.js"></script>
<script>
/* ═══════════════════════════════════════════
   Shell — sidebar + topbar for this page, restaurant nav only.
═══════════════════════════════════════════ */
const shell = RestaurantShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'restaurant-dashboard.html',
  pageTitle:     'Dashboard',
  pageSubtitle:  'Restaurant operations overview',
  apiMode:       'Demo',
  user:          { name: 'Restaurant Manager', initials: 'RM' },
});

/* ═══════════════════════════════════════════
   CONFIG & DATA LAYER
   Restaurant Inventory / transfers are meant to be shared with the
   Kitchen module the same way Stock is shared across the Store
   module — via window.storage (shared:true), with a localStorage
   fallback so this page always renders something on its own.
═══════════════════════════════════════════ */
const CFG = { API_BASE:'', API_KEY:'', USE_DEMO:true };

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared}; }
};

async function apiFetch(method, path){
  if (!CFG.API_BASE) throw new Error('No API_BASE configured');
  const opts = { method, headers:{ 'Content-Type':'application/json' } };
  if (CFG.API_KEY) opts.headers['Authorization'] = `Bearer ${CFG.API_KEY}`;
  const res = await fetch(CFG.API_BASE + path, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* Demo fallbacks — used only until real transfers/inventory/sales are synced */
const DEMO_INVENTORY = [
  { meal:'Egusi Soup',  qty:15, unit:'Portions', batch:'PROD-00094', received:'17/07/26', min:8 },
  { meal:'Moi Moi',     qty:4,  unit:'Pieces',   batch:'PROD-00090', received:'16/07/26', min:8 },
  { meal:'Jollof Rice', qty:0,  unit:'Plates',   batch:'PROD-00088', received:'16/07/26', min:6 },
  { meal:'Fried Rice',  qty:18, unit:'Plates',   batch:'PROD-00085', received:'16/07/26', min:6 },
];
const DEMO_TRANSFERS = [
  { no:'KTN-00045', meal:'Fried Rice',  qty:30, unit:'Plates', from:'Kitchen', date:'17/07/26 10:30 AM', prodNo:'PROD-00096' },
  { no:'KTN-00044', meal:'Jollof Rice', qty:20, unit:'Plates', from:'Kitchen', date:'17/07/26 09:15 AM', prodNo:'PROD-00095' },
];
const DEMO_SALES = [
  { id:'SALE-1043', meal:'Egusi Soup',  qty:2, total:12000, method:'Cash',     time:'11:05 AM' },
  { id:'SALE-1042', meal:'Fried Rice',  qty:3, total:18000, method:'POS',      time:'10:40 AM' },
  { id:'SALE-1041', meal:'Moi Moi',     qty:1, total:2500,  method:'Transfer', time:'09:52 AM' },
];

function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function invLevel(i){ return i.qty<=0 ? 'out' : (i.qty<=i.min ? 'low' : 'ok'); }
const LEVEL_CHIP  = { ok:'chip-ok', low:'chip-low', out:'chip-out' };
const LEVEL_LABEL = { ok:'In Stock', low:'Low', out:'Out of Stock' };

async function loadShared(key, fallback){
  try {
    const r = await storage.get(key, true);
    if (r && r.value) { const parsed = JSON.parse(r.value); if (Array.isArray(parsed) && parsed.length) return parsed; }
  } catch(e){}
  return fallback;
}

function renderKPIs(inventory, transfers, sales){
  const pending  = transfers.length;
  const lowStock = inventory.filter(i => invLevel(i) !== 'ok').length;
  const today    = sales.reduce((s,x)=>s+x.total,0);
  const plates   = inventory.reduce((s,i)=>s+i.qty,0);

  document.getElementById('kpiRow').innerHTML = `
    <a class="kpi-card" href="restaurant-transfers.html">
      <div class="kpi-label">Pending Transfers</div>
      <div class="kpi-value" style="color:var(--blue);">${pending}</div>
      <div class="kpi-trend ${pending>0?'warn':'up'}">${pending>0?'⚠ Awaiting review':'✓ All clear'}</div>
    </a>
    <a class="kpi-card" href="restaurant-inventory.html">
      <div class="kpi-label">Low Stock Alerts</div>
      <div class="kpi-value" style="color:var(--amber);">${lowStock}</div>
      <div class="kpi-trend ${lowStock>0?'warn':'up'}">${lowStock>0?'Needs kitchen transfer':'✓ All above threshold'}</div>
    </a>
    <a class="kpi-card" href="restaurant-sales.html">
      <div class="kpi-label">Today's Sales</div>
      <div class="kpi-value" style="font-size:22px;">${fmtN(today)}</div>
      <div class="kpi-trend up">${sales.length} sale${sales.length!==1?'s':''} recorded</div>
    </a>
    <a class="kpi-card" href="restaurant-inventory.html">
      <div class="kpi-label">Plates On Hand</div>
      <div class="kpi-value">${plates}</div>
      <div class="kpi-trend neutral">Across ${inventory.length} meals</div>
    </a>`;

  shell.setPendingBadge(pending);
}

function renderRevenue(sales){
  const total = sales.reduce((s,x)=>s+x.total,0);
  const byMethod = {};
  sales.forEach(s => { byMethod[s.method] = (byMethod[s.method]||0) + s.total; });
  const max = Math.max(...Object.values(byMethod), 1);
  const colorCls = { Cash:'', POS:'blue', Transfer:'purple' };

  document.getElementById('revTotal').textContent = fmtN(total);
  document.getElementById('revBars').innerHTML = Object.entries(byMethod).length === 0
    ? `<div class="empty-note">No sales recorded today.</div>`
    : Object.entries(byMethod).map(([m,v]) => `
      <div class="bar-row">
        <div class="bar-meta"><span class="bar-name">${m}</span><span class="bar-count">${fmtN(v)}</span></div>
        <div class="bar-track"><div class="bar-fill ${colorCls[m]||''}" style="width:${Math.round(v/max*100)}%"></div></div>
      </div>`).join('');
}

function renderInventorySnapshot(inventory){
  const el = document.getElementById('invSnap');
  el.innerHTML = inventory.length === 0
    ? `<div class="empty-note">No finished meals in Restaurant Inventory yet.</div>`
    : inventory.map(i => { const lvl = invLevel(i); return `
      <a class="list-row" href="restaurant-inventory.html">
        <span class="list-dot" style="background:${lvl==='ok'?'var(--green)':lvl==='low'?'var(--amber)':'var(--red)'}"></span>
        <div class="list-body"><div class="list-name">${i.meal}</div><div class="list-meta">${i.qty} ${i.unit} on hand · batch ${i.batch}</div></div>
        <span class="chip ${LEVEL_CHIP[lvl]}">${LEVEL_LABEL[lvl]}</span>
      </a>`; }).join('');
}

function renderPendingTransfers(transfers){
  const el = document.getElementById('pendingXfer');
  el.innerHTML = transfers.length === 0
    ? `<div class="empty-note">No transfers awaiting review.</div>`
    : transfers.map(t => `
      <a class="list-row" href="restaurant-transfers.html">
        <span class="list-dot" style="background:var(--blue)"></span>
        <div class="list-body"><div class="list-name">${t.no} — ${t.meal}</div><div class="list-meta">${t.qty} ${t.unit} · from ${t.from} · ${t.date}</div></div>
        <span class="chip chip-sent">Sent</span>
      </a>`).join('');
}

function renderLowStock(inventory){
  const el = document.getElementById('lowStock');
  const alerts = inventory.filter(i => invLevel(i) !== 'ok');
  el.innerHTML = alerts.length === 0
    ? `<div class="empty-note">All meals above their reorder threshold.</div>`
    : alerts.map(i => { const lvl = invLevel(i); return `
      <a class="list-row" href="restaurant-inventory.html">
        <span class="list-dot" style="background:${lvl==='out'?'var(--red)':'var(--amber)'}"></span>
        <div class="list-body"><div class="list-name">${i.meal}</div><div class="list-meta">${i.qty} ${i.unit} on hand · reorder at ${i.min}</div></div>
        <span class="chip ${lvl==='out'?'chip-out':'chip-low'}">${lvl==='out'?'OUT':'LOW'}</span>
      </a>`; }).join('');
}

async function init(){
  let inventory, transfers, sales;
  if (!CFG.USE_DEMO) {
    try {
      const data = await apiFetch('GET', '/api/restaurant/dashboard-summary');
      inventory = data.inventory; transfers = data.transfers; sales = data.sales;
      shell.setApiMode('Live');
    } catch(e) { console.warn('[API] Falling back to local demo data:', e.message); }
  }
  if (!inventory) inventory = await loadShared('restaurant-inventory', DEMO_INVENTORY);
  if (!transfers) transfers = await loadShared('restaurant-pending-transfers', DEMO_TRANSFERS);
  if (!sales)     sales     = await loadShared('restaurant-sales', DEMO_SALES);

  renderKPIs(inventory, transfers, sales);
  renderRevenue(sales);
  renderInventorySnapshot(inventory);
  renderPendingTransfers(transfers);
  renderLowStock(inventory);
}
init();
</script>
</body>
</html>
