<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>Suppliers | Aurum Procurement</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; }
  body{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:13px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:700; margin-bottom:8px; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; cursor:default; transition:transform .2s,box-shadow .2s,border-color .2s; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .ic-red{ background:var(--red-bg); color:var(--red); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .toolbar-row.top{ justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .toolbar-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:700; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; transition:border-color .2s; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-size:12.5px; cursor:pointer; outline:none; transition:border-color .2s; }
  .filter-select:focus{ border-color:var(--gold-border); }

  @media (max-width:700px){
    .toolbar-row.top{ flex-direction:column; align-items:stretch; }
    .toolbar-left{ flex-direction:column; align-items:stretch; }
    .toolbar-actions{ flex-direction:column; align-items:stretch; }
    .flt-group{ width:100%; }
    .search-box{ max-width:100%; }
    .filter-select{ width:100%; }
  }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; text-decoration:none; }
  .btn-primary{ background:var(--gold); color:#fff; font-weight:700; }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }

  /* Panel / Table */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:800; color:var(--text); }
  .tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .tbl-wrap::-webkit-scrollbar{ height:8px; }
  .tbl-wrap::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:940px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:700; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.center{ text-align:center; }
  tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  tbody td.center{ text-align:center; }
  .empty-row td{ text-align:center; padding:32px; color:var(--text3); white-space:normal; cursor:default; }

  .chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip i{ font-size:6px; }
  .chip-active{ background:var(--green-bg); color:var(--green); }
  .chip-inactive{ background:var(--red-bg); color:var(--red); }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:700; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  /* ═══ MODALS — sit outside .content in the DOM, so --surface/--border/
     --text (scoped to .content) aren't available here — every color
     below is hardcoded to match them instead of using var(). ═══ */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(15,20,45,0.55); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:#ffffff; border:1px solid #eef0f6; border-radius:18px; padding:24px; width:min(560px,96vw); box-shadow:0 32px 80px rgba(15,34,55,0.25); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; position:relative; overflow:hidden; }
  .modal::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:#2f6fed; }
  .modal-sm{ width:min(420px,96vw); }
  @keyframes modalIn{ from{opacity:0;transform:translateY(16px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-size:17px; font-weight:800; color:#1c2440; }
  .modal-close{ background:none; border:none; color:#9aa1b3; font-size:16px; cursor:pointer; padding:4px; line-height:1; transition:color .2s; }
  .modal-close:hover{ color:#1c2440; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  @media (max-width:480px){ .form-row{ grid-template-columns:1fr; } }
  .form-group{ display:flex; flex-direction:column; gap:5px; }
  .form-group.span2{ grid-column:span 2; }
  @media (max-width:480px){ .form-group.span2{ grid-column:span 1; } }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:#9aa1b3; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .form-input, .form-select, .form-textarea{ background:#f4f6fb; border:1px solid #eef0f6; border-radius:10px; padding:9px 12px; color:#1c2440; font-family:inherit; font-size:13px; outline:none; transition:border-color .2s; width:100%; }
  .form-input:focus, .form-select:focus, .form-textarea:focus{ border-color:rgba(47,111,237,0.25); }
  .form-textarea{ resize:vertical; min-height:60px; }
  .cat-select-row{ display:flex; gap:6px; align-items:stretch; }
  .cat-select-row .form-select{ flex:1; }
  .icon-btn-sm{ flex-shrink:0; width:36px; background:#f4f6fb; border:1px solid #eef0f6; border-radius:10px; color:#6b7280; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .icon-btn-sm:hover{ border-color:rgba(47,111,237,0.3); color:#2f6fed; background:rgba(47,111,237,0.08); }
  .manage-cat-link{ font-size:10px; color:#2f6fed; cursor:pointer; font-weight:700; text-transform:none; letter-spacing:0; }
  .manage-cat-link:hover{ text-decoration:underline; }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid #eef0f6; flex-wrap:wrap; }
  .modal-footer-split{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:14px; border-top:1px solid #eef0f6; flex-wrap:wrap; gap:8px; }
  .field-error{ font-size:10.5px; color:#f04438; display:none; }
  .field-error.show{ display:block; }

  /* Manage Categories modal */
  .cat-list{ display:flex; flex-direction:column; gap:6px; max-height:280px; overflow-y:auto; margin-bottom:14px; }
  .cat-row{ display:flex; align-items:center; gap:8px; background:#f4f6fb; border:1px solid #eef0f6; border-radius:10px; padding:8px 10px; }
  .cat-row-name{ flex:1; font-size:13px; color:#1c2440; font-weight:600; cursor:pointer; padding:2px 4px; border-radius:6px; }
  .cat-row-name:hover{ background:rgba(47,111,237,0.08); color:#2f6fed; }
  .cat-row-input{ flex:1; background:#ffffff; border:1px solid rgba(47,111,237,0.35); border-radius:6px; padding:5px 8px; font-family:inherit; font-size:13px; color:#1c2440; outline:none; }
  .cat-row-actions{ display:flex; gap:4px; flex-shrink:0; }
  .cat-icon-btn{ width:26px; height:26px; border-radius:6px; border:1px solid #eef0f6; background:#ffffff; color:#9aa1b3; cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .cat-icon-btn:hover{ border-color:rgba(47,111,237,0.3); color:#2f6fed; }
  .cat-icon-btn.danger:hover{ border-color:rgba(240,68,56,0.35); color:#f04438; background:#feecec; }
  .cat-icon-btn.confirm:hover{ border-color:rgba(18,183,106,0.35); color:#12b76a; background:#e9f9f0; }
  .cat-add-row{ display:flex; gap:8px; }
  .cat-add-row .form-input{ flex:1; }
  .cat-empty{ text-align:center; padding:20px; color:#9aa1b3; font-size:12.5px; }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; font-weight:600; color:var(--text); box-shadow:var(--shadow-lg); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); }
  .toast.success{ border-left:3px solid var(--green); } .toast.success i{ color:var(--green); }
  .toast.error{ border-left:3px solid var(--red); } .toast.error i{ color:var(--red); }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  @media print{
    #prc-sidebar, #prc-topbar, .toolbar, .pagination, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar rendered here by procurement-shell.js -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar rendered here by procurement-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">

      <div>
        <div class="section-title">Supplier Directory</div>
        <div class="kpi-row" id="kpiRow"></div>
      </div>

      <div class="toolbar no-print">
        <div class="toolbar-row top">
          <div class="toolbar-left">
            <div class="flt-group" style="flex:1;min-width:180px;max-width:260px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px;"></i>
                <input type="text" id="spSearch" placeholder="Supplier, contact person…" oninput="spPage=1;renderSuppliers()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Category</span>
              <select class="filter-select" id="spCat" onchange="spPage=1;renderSuppliers()">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Status</span>
              <select class="filter-select" id="spStatus" onchange="spPage=1;renderSuppliers()">
                <option value="">All</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-primary btn-sm" onclick="openSupplierModal()"><i class="fa-solid fa-plus"></i> Add Supplier</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">All Suppliers</div>
          <span style="font-size:11px;color:var(--text3);" id="tblCount">—</span>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Supplier</th><th>Category</th><th>Contact Person</th><th>Phone</th><th>Email</th>
                <th class="center">Status</th><th class="center">Orders</th><th class="center">Total Spend</th>
              </tr>
            </thead>
            <tbody id="spBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="spPaginLabel">—</span>
          <div class="page-btns" id="spPageBtns"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD / EDIT SUPPLIER MODAL -->
<div class="modal-overlay" id="supplierModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="supplierModalTitle">Add Supplier</div>
      <button class="modal-close" onclick="closeSupplierModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-row">
      <div class="form-group span2">
        <label class="form-label">Supplier Name</label>
        <input class="form-input" type="text" id="fsName" placeholder="e.g. Coastal Foods Ltd">
        <span class="field-error" id="fsNameErr">Supplier name is required.</span>
      </div>
      <div class="form-group">
        <label class="form-label">Category <span class="manage-cat-link" onclick="openCategoryModal()">Manage categories</span></label>
        <div class="cat-select-row">
          <select class="form-select" id="fsCat"></select>
          <button type="button" class="icon-btn-sm" onclick="openCategoryModal()" title="Add / manage categories"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="fsStatus">
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Contact Person</label>
        <input class="form-input" type="text" id="fsContact" placeholder="Full name">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input class="form-input" type="tel" id="fsPhone" placeholder="e.g. 0803 000 0000">
      </div>
      <div class="form-group span2">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="fsEmail" placeholder="name@company.com">
      </div>
      <div class="form-group span2">
        <label class="form-label">Address</label>
        <input class="form-input" type="text" id="fsAddress" placeholder="Street, city, state">
      </div>
      <div class="form-group span2">
        <label class="form-label">Notes <span style="text-transform:none;">(optional)</span></label>
        <textarea class="form-textarea" id="fsNotes" placeholder="Payment terms, delivery notes, anything relevant…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeSupplierModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" id="fsSaveBtn" onclick="saveSupplier()"><i class="fa-solid fa-check"></i> Save Supplier</button>
    </div>
  </div>
</div>

<!-- MANAGE CATEGORIES MODAL -->
<div class="modal-overlay" id="categoryModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">Manage Categories</div>
      <button class="modal-close" onclick="closeCategoryModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="cat-list" id="catList"></div>
    <div class="cat-add-row">
      <input class="form-input" type="text" id="catNewInput" placeholder="New category name…">
      <button class="btn btn-primary btn-sm" onclick="addCategoryFromModal()"><i class="fa-solid fa-plus"></i> Add</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeCategoryModal()">Done</button>
    </div>
  </div>
</div>

<script src="../services/permissions.js"></script>
  <script src="services/procurement-service.js"></script>
<script src="procurement-shell.js"></script>
<script src="procurement-modals.js"></script>
<script>
/**
 * suppliers.html — call-and-render only.
 *
 * Every mutation (add supplier, edit supplier, add/rename/delete
 * category) goes through ProcurementService.* — this page never touches
 * the category list or localStorage directly.
 * It only collects form input, calls the service, and re-renders from
 * whatever the service returns / already knows.
 */
const shell = ProcurementShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'suppliers.html',
  pageTitle:     'Suppliers',
  pageSubtitle:  'Supplier directory and performance',
  apiMode:       'Live',
  user:          { name: 'Procurement Officer', initials: 'PO' },
});

// Local caches — populated once by init() via ProcurementService.getSuppliers()
// / getPRs() / getCategories(). Nothing on this page touches localStorage directly.
let allSuppliers = [];
let allPRsForSpend = [];
let allCategories = [];

let spPage = 1;
const SP_PAGE_SIZE = 10;
let filteredSP = [];

// Edit state for the Add/Edit Supplier modal — null means "creating new".
let editingSupplierId = null;
// Which category row (by name) is currently showing its inline rename input.
let editingCategoryName = null;

function fmtN(n){ return ProcurementService.fmtN(n); }

/* Suppliers without status set default to Active. */
function supplierStatus(sp){ return sp.status || 'Active'; }

function renderPagination(btnId,labelId,page,total,size,cb){
  const totalPages=Math.max(1,Math.ceil(total/size));
  const from=total===0?0:(page-1)*size+1, to=Math.min(page*size,total);
  document.getElementById(labelId).textContent = total===0?'No records':`${from}–${to} of ${total}`;
  const wrap=document.getElementById(btnId); wrap.innerHTML='';
  const mk=(txt,pg,dis,active)=>{const b=document.createElement('button');b.className='page-btn'+(active?' active':'');b.innerHTML=txt;b.disabled=dis;b.onclick=()=>cb(pg);return b;};
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-left"></i>',page-1,page===1));
  let s=Math.max(1,page-2), e=Math.min(totalPages,s+4); s=Math.max(1,e-4);
  for(let i=s;i<=e;i++) wrap.appendChild(mk(i,i,false,i===page));
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-right"></i>',page+1,page>=totalPages));
}

/* ═══ KPI CARDS ═══ */
function renderKpis(){
  const suppliers = allSuppliers;
  const prs = allPRsForSpend;
  const total = suppliers.length;
  const active = suppliers.filter(sp => supplierStatus(sp) === 'Active').length;
  const totalSpend = suppliers.reduce((s,sp) => {
    const spend = prs.filter(p => p.supplier === sp.name).reduce((ss,p) => ss + p.totalAmount, 0);
    return s + spend;
  }, 0);
  // Total categories DEFINED in the system (via ProcurementService.getCategories()),
  // not just the ones currently in use by a supplier — now that categories
  // are independently manageable, this is the more meaningful count.
  const categoryCount = allCategories.length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card acc-blue">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-truck-field"></i></div><div class="kpi-label">Total Suppliers</div></div>
      <div class="kpi-value" style="color:var(--blue);">${total}</div>
      <div class="kpi-trend neutral">In directory</div>
    </div>
    <div class="kpi-card acc-green">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-circle-check"></i></div><div class="kpi-label">Active Suppliers</div></div>
      <div class="kpi-value" style="color:var(--green);">${active}</div>
      <div class="kpi-trend up">${total?Math.round(active/total*100):0}% of directory</div>
    </div>
    <div class="kpi-card acc-purple">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Total Spend</div></div>
      <div class="kpi-value" style="color:var(--purple);font-size:19px;">${fmtN(totalSpend)}</div>
      <div class="kpi-trend info">All time</div>
    </div>
    <div class="kpi-card acc-amber">
      <div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-layer-group"></i></div><div class="kpi-label">Categories Tracked</div></div>
      <div class="kpi-value" style="color:var(--amber);">${categoryCount}</div>
      <div class="kpi-trend neutral">Manage from any supplier</div>
    </div>`;
}

/* Category <select> options — shared by the toolbar filter and the
   Add/Edit Supplier modal. Always rebuilt from
   ProcurementService.getCategories(), never hardcoded. */
async function populateCategorySelects(){
  allCategories = await ProcurementService.getCategories() || [];

  const filterSel = document.getElementById('spCat');
  const curFilter = filterSel.value;
  filterSel.innerHTML = `<option value="">All Categories</option>` +
    allCategories.map(c => `<option${c===curFilter?' selected':''}>${c}</option>`).join('');

  const formSel = document.getElementById('fsCat');
  const curForm = formSel.value;
  formSel.innerHTML = allCategories.map(c => `<option${c===curForm?' selected':''}>${c}</option>`).join('');
}

function renderSuppliers(){
  const q = (document.getElementById('spSearch').value||'').toLowerCase();
  const cat = document.getElementById('spCat').value;
  const status = document.getElementById('spStatus').value;

  filteredSP = allSuppliers.filter(sp => {
    const mq = !q || sp.name.toLowerCase().includes(q) || sp.contact.toLowerCase().includes(q);
    const mc = !cat || sp.cat === cat;
    const ms = !status || supplierStatus(sp) === status;
    return mq && mc && ms;
  });

  document.getElementById('tblCount').textContent = filteredSP.length + ' supplier' + (filteredSP.length!==1?'s':'');
  renderSupplierPage();
  renderKpis();
}

function renderSupplierPage(){
  const total = filteredSP.length;
  const start = (spPage-1)*SP_PAGE_SIZE;
  const rows = filteredSP.slice(start, start+SP_PAGE_SIZE);
  document.getElementById('spBody').innerHTML = rows.length===0
    ? `<tr class="empty-row"><td colspan="8">No suppliers found.</td></tr>`
    : rows.map(sp => {
        const orders = allPRsForSpend.filter(p => p.supplier === sp.name).length;
        const spend = allPRsForSpend.filter(p => p.supplier === sp.name).reduce((s,p) => s + p.totalAmount, 0);
        const status = supplierStatus(sp);
        return `
      <tr onclick="openSupplierModal('${sp.id}')">
        <td style="font-weight:700;">${sp.name}</td>
        <td>${sp.cat}</td>
        <td>${sp.contact}</td>
        <td>${sp.phone}</td>
        <td>${sp.email}</td>
        <td class="center"><span class="chip ${status==='Active'?'chip-active':'chip-inactive'}"><i class="fa-solid fa-circle"></i>${status}</span></td>
        <td class="center">${orders}</td>
        <td class="center" style="font-weight:700;color:var(--gold);">${fmtN(spend)}</td>
      </tr>`;
      }).join('');
  renderPagination('spPageBtns','spPaginLabel',spPage,total,SP_PAGE_SIZE,p=>{spPage=p;renderSupplierPage();});
}

/* ═══ ADD / EDIT SUPPLIER MODAL ═══
   Same modal for both — openSupplierModal() with no id clears the form
   and creates on save; openSupplierModal(id) populates from the existing
   supplier (via ProcurementService.getSupplierById) and saves through
   updateSupplier() instead. */
function openSupplierModal(id){
  editingSupplierId = id || null;
  populateCategorySelects();

  const titleEl = document.getElementById('supplierModalTitle');
  const saveBtn = document.getElementById('fsSaveBtn');

  if (editingSupplierId) {
    const sp = allSuppliers.find(s => (s.id || s._id) === editingSupplierId) || allSuppliers.find(s => (s.id || s._id) === String(editingSupplierId));
    if (!sp) { showToast('Supplier not found.', 'error'); return; }
    titleEl.textContent = 'Edit Supplier';
    saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Save Changes';
    document.getElementById('fsName').value = sp.name || '';
    document.getElementById('fsCat').value = sp.cat || allCategories[0] || '';
    document.getElementById('fsStatus').value = supplierStatus(sp);
    document.getElementById('fsContact').value = sp.contact && sp.contact !== '—' ? sp.contact : '';
    document.getElementById('fsPhone').value = sp.phone && sp.phone !== '—' ? sp.phone : '';
    document.getElementById('fsEmail').value = sp.email && sp.email !== '—' ? sp.email : '';
    document.getElementById('fsAddress').value = sp.address || '';
    document.getElementById('fsNotes').value = sp.notes || '';
  } else {
    titleEl.textContent = 'Add Supplier';
    saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Save Supplier';
    document.getElementById('fsName').value = '';
    document.getElementById('fsCat').value = allCategories[0] || '';
    document.getElementById('fsStatus').value = 'Active';
    document.getElementById('fsContact').value = '';
    document.getElementById('fsPhone').value = '';
    document.getElementById('fsEmail').value = '';
    document.getElementById('fsAddress').value = '';
    document.getElementById('fsNotes').value = '';
  }
  document.getElementById('fsNameErr').classList.remove('show');
  document.getElementById('supplierModal').classList.add('show');
}
function closeSupplierModal(){
  document.getElementById('supplierModal').classList.remove('show');
  editingSupplierId = null;
}
document.getElementById('supplierModal').addEventListener('click', function(e){ if (e.target === this) closeSupplierModal(); });

async function saveSupplier(){
  const name = document.getElementById('fsName').value.trim();
  const nameErr = document.getElementById('fsNameErr');
  if (!name) { nameErr.classList.add('show'); return; }
  nameErr.classList.remove('show');

  const entry = {
    name,
    cat: document.getElementById('fsCat').value,
    status: document.getElementById('fsStatus').value,
    contact: document.getElementById('fsContact').value.trim() || '—',
    phone: document.getElementById('fsPhone').value.trim() || '—',
    email: document.getElementById('fsEmail').value.trim() || '—',
    address: document.getElementById('fsAddress').value.trim() || '',
    notes: document.getElementById('fsNotes').value.trim() || '',
  };

  try {
    if (editingSupplierId) {
      // updateSupplier() does the duplicate-name check (against every
      // OTHER supplier) and persistence — this page never writes to the
      // array or to localStorage itself.
      await ProcurementService.updateSupplier(editingSupplierId, entry, ProcurementService.resolveSession());
      showToast(`${name} updated.`, 'success');
    } else {
      // createSupplier() does the duplicate-name check, validation, id
      // assignment, and persistence.
      await ProcurementService.createSupplier(entry, ProcurementService.resolveSession());
      showToast(`${name} added to supplier directory.`, 'success');
    }
    allSuppliers = await ProcurementService.getSuppliers();
    closeSupplierModal();
    spPage = 1;
    renderSuppliers();
  } catch (err) {
    showToast(err.message || 'Failed to save supplier.', 'error');
  }
}

/* ═══ MANAGE CATEGORIES MODAL ═══
   Add / rename / delete all go through ProcurementService — renaming or
   deleting a category also re-points every supplier that used it
   (handled inside the service, not here). */
function openCategoryModal(){
  editingCategoryName = null;
  document.getElementById('catNewInput').value = '';
  renderCategoryList();
  document.getElementById('categoryModal').classList.add('show');
}
function closeCategoryModal(){
  document.getElementById('categoryModal').classList.remove('show');
  editingCategoryName = null;
  // Categories may have changed while this modal was open — refresh the
  // selects/filter and the table (category names can appear in rows).
  populateCategorySelects();
  renderSuppliers();
}
document.getElementById('categoryModal').addEventListener('click', function(e){ if (e.target === this) closeCategoryModal(); });

async function renderCategoryList(){
  const cats = await ProcurementService.getCategories() || [];
  const list = document.getElementById('catList');
  if (!cats.length) { list.innerHTML = `<div class="cat-empty">No categories yet.</div>`; return; }

  list.innerHTML = cats.map(c => {
    if (c === editingCategoryName) {
      return `<div class="cat-row">
        <input class="cat-row-input" id="catEditInput" type="text" value="${c.replace(/"/g,'&quot;')}">
        <div class="cat-row-actions">
          <button class="cat-icon-btn confirm" onclick="confirmRenameCategory('${c.replace(/'/g,"\\'")}')" title="Save"><i class="fa-solid fa-check"></i></button>
          <button class="cat-icon-btn" onclick="cancelRenameCategory()" title="Cancel"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>`;
    }
    return `<div class="cat-row">
      <span class="cat-row-name" onclick="startRenameCategory('${c.replace(/'/g,"\\'")}')" title="Click to rename">${c}</span>
      <div class="cat-row-actions">
        <button class="cat-icon-btn" onclick="startRenameCategory('${c.replace(/'/g,"\\'")}')" title="Rename"><i class="fa-solid fa-pen"></i></button>
        <button class="cat-icon-btn danger" onclick="deleteCategoryFromModal('${c.replace(/'/g,"\\'")}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`;
  }).join('');

  if (editingCategoryName) {
    const input = document.getElementById('catEditInput');
    if (input) { input.focus(); input.select(); }
  }
}

function startRenameCategory(name){
  editingCategoryName = name;
  renderCategoryList();
}
function cancelRenameCategory(){
  editingCategoryName = null;
  renderCategoryList();
}
async function confirmRenameCategory(oldName){
  const input = document.getElementById('catEditInput');
  const newName = input ? input.value.trim() : '';
  if (!newName) { showToast('Category name cannot be empty.', 'error'); return; }
  try {
    await ProcurementService.renameCategory(oldName, newName, ProcurementService.resolveSession());
    editingCategoryName = null;
    showToast(`Renamed to "${newName}".`, 'success');
    renderCategoryList();
  } catch (err) {
    showToast(err.message || 'Failed to rename category.', 'error');
  }
}

async function deleteCategoryFromModal(name){
  if (!confirm(`Delete "${name}"? Any supplier using it will be moved to "Other".`)) return;
  try {
    await ProcurementService.deleteCategory(name, { reassignTo: 'Other' }, ProcurementService.resolveSession());
    showToast(`"${name}" deleted.`, 'success');
    renderCategoryList();
  } catch (err) {
    showToast(err.message || 'Failed to delete category.', 'error');
  }
}

async function addCategoryFromModal(){
  const input = document.getElementById('catNewInput');
  const name = input.value.trim();
  if (!name) { showToast('Enter a category name.', 'error'); return; }
  try {
    await ProcurementService.addCategory(name, ProcurementService.resolveSession());
    input.value = '';
    showToast(`"${name}" added.`, 'success');
    renderCategoryList();
  } catch (err) {
    showToast(err.message || 'Failed to add category.', 'error');
  }
}

function showToast(msg, type='success'){
  const icon = type==='success' ? 'fa-circle-check' : 'fa-circle-xmark';
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

// Init — populates suppliers, PRs (for per-supplier order-count/spend),
// and the category list, then renders from the caches.
async function init(){
  try {
    [allSuppliers, allPRsForSpend] = await Promise.all([
      ProcurementService.getSuppliers(),
      ProcurementService.getPRs(),
    ]);
    allSuppliers = (allSuppliers || []).map(function (s) {
      return Object.assign({}, s, {
        id: s.id || s._id,
        _id: s._id || s.id,
        cat: s.cat !== undefined ? s.cat : (s.category || 'General'),
        contact: s.contact !== undefined ? s.contact : (s.contactPerson || '—'),
      });
    });
    populateCategorySelects();
    renderKpis();
    renderSuppliers();
  } catch (err) {
    document.getElementById('spBody').innerHTML =
      `<tr class="empty-row"><td colspan="8" style="color:var(--red);"><i class="fa-solid fa-triangle-exclamation"></i> ${err.message || 'Failed to load suppliers.'}</td></tr>`;
  }
}
init();
</script>
