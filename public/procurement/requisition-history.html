<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>Requisition History | Aurum Procurement</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  /* Scroll behaviour copied EXACTLY from the working Restaurant Inventory
     page: html is auto-height so the whole page scrolls vertically like a
     normal document, and .tbl-wrap is the only element with its own
     horizontal scrollbar (for the wide table). No fixed-height flex/overflow
     tricks here — that's what was breaking scroll before. */
  html{ height:auto; }
  body{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:13px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:700; margin-bottom:8px; }

  /* ═══ KPI CARDS — same shape/tokens as the Restaurant pages ═══ */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; cursor:default; transition:transform .2s,box-shadow .2s,border-color .2s; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .ic-red{ background:var(--red-bg); color:var(--red); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  /* Toolbar — same pattern as Restaurant Inventory: status pills, search, filter selects */
  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; position:relative; z-index:20; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .toolbar-row.top{ justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .toolbar-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; position:relative; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:700; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; transition:border-color .2s; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-size:12.5px; cursor:pointer; outline:none; transition:border-color .2s; }
  .filter-select:focus{ border-color:var(--gold-border); }
  .status-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-pill{ display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text2); transition:all .15s; white-space:nowrap; }
  .status-pill:hover{ border-color:var(--gold-border); }
  .status-pill i{ font-size:6px; }
  .status-pill.on.all{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .status-pill.on.pending{ background:var(--amber-bg); border-color:rgba(247,144,9,.35); color:var(--amber); }
  .status-pill.on.review{ background:var(--blue-bg); border-color:rgba(47,111,237,.35); color:var(--blue); }
  .status-pill.on.approved{ background:var(--green-bg); border-color:rgba(18,183,106,.35); color:var(--green); }
  .status-pill.on.rejected{ background:var(--red-bg); border-color:rgba(240,68,56,.35); color:var(--red); }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-size:11.5px; font-weight:700; cursor:pointer; padding:8px 6px; display:inline-flex; align-items:center; gap:5px; }
  .btn-ghost:hover{ color:var(--gold); }

  /* ═══════════════════════════════════════════════════════════════
     Single-box date filter — one visible control, opens a popover
     with an inline calendar. FIX: the popover is now positioned with
     JS as `position:fixed`, anchored to the button's own on-screen
     rect (recalculated every time it opens, and on scroll/resize).
     That's what stops it from ever drifting down to the bottom of
     the page — it no longer depends on which ancestor happens to be
     the nearest `position:relative` box.
  ═══════════════════════════════════════════════════════════════ */
  .date-filter-btn{ display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .date-filter-btn.active{ border-color:var(--gold-border); color:var(--gold); background:var(--gold-dim); }
  .date-filter-panel{
    display:none; position:fixed; top:0; left:0; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:14px; box-shadow:var(--shadow-lg); z-index:500; width:260px;
  }
  .date-filter-panel.show{ display:block; }
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-header span{ font-size:12.5px; font-weight:700; color:var(--text); }
  .cal-nav{ background:var(--surface2); border:1px solid var(--border); border-radius:7px; width:24px; height:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text2); font-size:10px; }
  .cal-nav:hover{ border-color:var(--gold-border); color:var(--gold); }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
  .cal-weekdays span{ font-size:9px; text-transform:uppercase; color:var(--text3); text-align:center; font-weight:700; display:block; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-cell{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:7px; cursor:pointer; font-size:11.5px; color:var(--text2); }
  .cal-cell:hover{ background:var(--surface2); }
  .cal-cell.muted{ color:var(--text3); opacity:.35; cursor:default; }
  .cal-cell.muted:hover{ background:none; }
  .cal-cell.today{ box-shadow:inset 0 0 0 1px var(--gold-border); }
  .cal-cell.start, .cal-cell.end{ background:var(--gold); color:#fff; font-weight:700; }
  .cal-cell.in-range{ background:var(--gold-dim); color:var(--gold); border-radius:0; }
  .cal-summary{ font-size:11px; color:var(--text3); text-align:center; margin-top:10px; }
  .date-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }

  @media (max-width:700px){
    .toolbar-row.top{ flex-direction:column; align-items:stretch; }
    .toolbar-left{ flex-direction:column; align-items:stretch; }
    .toolbar-actions{ flex-direction:column; align-items:stretch; }
    .flt-group{ width:100%; }
    .search-box{ max-width:100%; }
    .filter-select{ width:100%; }
    .date-filter-panel{ width:calc(100vw - 28px); }
  }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; text-decoration:none; }
  .btn-primary{ background:var(--gold); color:#fff; font-weight:700; }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }

  /* Panel / Table */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:800; color:var(--text); }
  /* FIX: this wrapper is the ONLY thing that scrolls horizontally, and it
     now carries a visible scrollbar + a subtle right-edge fade so it's
     obvious (especially the Status column, which used to be missing
     from the table entirely — it's added back below) that there's more
     to scroll to. */
  .tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; position:relative; scrollbar-width:thin; }
  .tbl-wrap::-webkit-scrollbar{ height:8px; }
  .tbl-wrap::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:1000px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:700; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.center{ text-align:center; }
  tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  tbody td.center{ text-align:center; }
  .empty-row td{ text-align:center; padding:32px; color:var(--text3); white-space:normal; cursor:default; }
  .pr-no{ color:var(--gold); font-weight:700; }
  .dept-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text2); }
  .dept-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--purple); }

  .chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip i{ font-size:6px; }
  .chip-urgent{ background:var(--red-bg); color:var(--red); }
  .chip-normal{ background:var(--amber-bg); color:var(--amber); }

  /* Status column chips — same colour language as the status pills above */
  .chip-status-pending{ background:var(--amber-bg); color:var(--amber); }
  .chip-status-review{ background:var(--blue-bg); color:var(--blue); }
  .chip-status-approved{ background:var(--green-bg); color:var(--green); }
  .chip-status-rejected{ background:var(--red-bg); color:var(--red); }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:700; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  /* Print-only header, shown only inside @media print */
  .print-header{ display:none; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  @media print{
    #prc-sidebar, #prc-topbar, .toolbar, .kpi-row, .pagination, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
    .tbl-wrap{ overflow:visible !important; }
    .print-header{ display:block; margin-bottom:10px; }
    .print-header .pt{ font-size:18px; font-weight:800; color:#000; }
    .print-header .ps{ font-size:11px; color:#555; margin-top:2px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar rendered here by procurement-shell.js -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar rendered here by procurement-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">

      <div>
        <div class="section-title">Requisition History</div>
        <div class="kpi-row" id="kpiRow"></div>
      </div>

      <div class="toolbar no-print">
        <div class="toolbar-row top">
          <div class="toolbar-left">
            <div class="flt-group">
              <span class="flt-label">Status</span>
              <div class="status-pills" id="statusPills">
                <div class="status-pill on all" data-group="">All</div>
                <div class="status-pill" data-group="pending"><i class="fa-solid fa-circle" style="color:var(--amber)"></i>Pending</div>
                <div class="status-pill" data-group="review"><i class="fa-solid fa-circle" style="color:var(--blue)"></i>In Review</div>
                <div class="status-pill" data-group="approved"><i class="fa-solid fa-circle" style="color:var(--green)"></i>Approved</div>
                <div class="status-pill" data-group="rejected"><i class="fa-solid fa-circle" style="color:var(--red)"></i>Rejected</div>
              </div>
            </div>
            <div class="flt-group" style="flex:1;min-width:180px;max-width:260px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px;"></i>
                <input type="text" id="pSearch" placeholder="PR no., item, requester…" oninput="pPage=1;renderPRs()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Department</span>
              <select class="filter-select" id="pDept" onchange="pPage=1;renderPRs()">
                <option value="">All Departments</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Priority</span>
              <select class="filter-select" id="pPriority" onchange="pPage=1;renderPRs()">
                <option value="">All Priorities</option>
                <option value="Urgent">Urgent</option>
                <option value="Normal">Normal</option>
              </select>
            </div>
            <div class="flt-group" id="dateFilterWrap">
              <span class="flt-label">Date</span>
              <button type="button" class="filter-select date-filter-btn" id="dateFilterBtn" onclick="toggleDatePanel(event)">
                <i class="fa-solid fa-calendar-days"></i><span id="dateFilterLabel">All Dates</span>
              </button>
              <div class="date-filter-panel" id="dateFilterPanel">
                <div class="cal-header">
                  <button type="button" class="cal-nav" onclick="calPrevMonth(event)"><i class="fa-solid fa-chevron-left"></i></button>
                  <span id="calLabel">—</span>
                  <button type="button" class="cal-nav" onclick="calNextMonth(event)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="cal-weekdays">
                  <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <div class="cal-summary" id="calSummary">Select start date</div>
                <div class="date-actions">
                  <button class="btn-ghost" type="button" onclick="clearDateFilter(event)">Clear</button>
                  <button class="btn btn-primary btn-sm" type="button" onclick="applyDateFilter(event)">Apply</button>
                </div>
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Sort By</span>
              <select class="filter-select" id="pSort" onchange="pPage=1;renderPRs()">
                <option value="date_desc">Newest First</option>
                <option value="date_asc">Oldest First</option>
                <option value="amount_desc">Amount (High → Low)</option>
                <option value="amount_asc">Amount (Low → High)</option>
              </select>
            </div>
            <button class="btn-ghost" onclick="clearFilters()"><i class="fa-solid fa-xmark"></i> Clear Filters</button>
          </div>
          <div class="toolbar-actions">
            <a class="btn btn-primary btn-sm" href="new-requisition.html"><i class="fa-solid fa-plus"></i> New Requisition</a>
            <button class="btn btn-outline btn-sm" onclick="printFilteredTable()"><i class="fa-solid fa-print"></i> Print</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">All Purchase Requests</div>
          <span style="font-size:11px;color:var(--text3);" id="tblCount">—</span>
        </div>
        <div class="print-header">
          <div class="pt">Aurum Procurement — Requisition History</div>
          <div class="ps" id="printMeta"></div>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>PR No.</th><th>Item</th><th>Department</th><th>Requested By</th><th>Date</th>
                <th class="center">Total (₦)</th><th class="center">Priority</th><th class="center">Status</th>
              </tr>
            </thead>
            <tbody id="prBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="pPaginLabel">—</span>
          <div class="page-btns" id="pPageBtns"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="procurement-shell.js"></script>
<script src="procurement-api.js"></script>
<script src="procurement-modals.js"></script>
<script>
const shell = ProcurementShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'requisition-history.html',
  pageTitle:     'Requisition History',
  pageSubtitle:  'All purchase requests',
  apiMode:       ProcurementAPI.CONFIG.USE_PROD ? 'Live' : 'Demo',
  user:          { name: 'Procurement Officer', initials: 'PO' },
});

let pPage = 1;
const P_PAGE_SIZE = 10;
let statusGroup = '';
let dateFrom = '';
let dateTo = '';
let filteredPR = [];
let printMode = false;

const STAGE_TO_GROUP = { pending:'pending', accountant:'review', gm:'review', md:'review', approved:'approved', fulfilled:'approved', rejected:'rejected' };
const STAGE_LABEL = { pending:'Pending', accountant:'In Review', gm:'In Review', md:'In Review', approved:'Approved', fulfilled:'Fulfilled', rejected:'Rejected' };
const STAGE_CHIP_CLASS = { pending:'chip-status-pending', accountant:'chip-status-review', gm:'chip-status-review', md:'chip-status-review', approved:'chip-status-approved', fulfilled:'chip-status-approved', rejected:'chip-status-rejected' };
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateShort(d){ if(!d) return ''; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }

/* ═══ KPI CARDS — same markup pattern as the Restaurant pages ═══ */
function renderKpis(){
  const prs = ProcurementAPI.DEMO_PR;
  const total = prs.length;
  const approved = prs.filter(p=>p.approvalStage==='approved'||p.approvalStage==='fulfilled').length;
  const rejected = prs.filter(p=>p.approvalStage==='rejected').length;
  const monthPrefix = new Date().toISOString().slice(0,7);
  const thisMonth = prs.filter(p=>p.date.startsWith(monthPrefix)).length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card acc-blue">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-file-lines"></i></div><div class="kpi-label">Total Requests</div></div>
      <div class="kpi-value" style="color:var(--blue);">${total}</div>
      <div class="kpi-trend neutral">All time</div>
    </div>
    <div class="kpi-card acc-green">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-circle-check"></i></div><div class="kpi-label">Approved / Fulfilled</div></div>
      <div class="kpi-value" style="color:var(--green);">${approved}</div>
      <div class="kpi-trend up">${total?Math.round(approved/total*100):0}% success rate</div>
    </div>
    <div class="kpi-card acc-red">
      <div class="kpi-top"><div class="kpi-ic ic-red"><i class="fa-solid fa-circle-xmark"></i></div><div class="kpi-label">Rejected</div></div>
      <div class="kpi-value" style="color:var(--red);">${rejected}</div>
      <div class="kpi-trend ${rejected>0?'down':'up'}">${total?Math.round(rejected/total*100):0}% rejection rate</div>
    </div>
    <div class="kpi-card acc-purple">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-calendar-days"></i></div><div class="kpi-label">This Month</div></div>
      <div class="kpi-value" style="color:var(--purple);">${thisMonth}</div>
      <div class="kpi-trend info">New requests</div>
    </div>`;
}

function populateDeptFilter(){
  const sel = document.getElementById('pDept');
  const current = sel.value;
  const depts = [...new Set(ProcurementAPI.DEMO_PR.map(p=>p.dept))].sort();
  sel.innerHTML = `<option value="">All Departments</option>` + depts.map(d=>`<option value="${d}">${d}</option>`).join('');
  sel.value = current;
}

function bindStatusPills(){
  document.querySelectorAll('.status-pill').forEach(p => {
    p.addEventListener('click', () => {
      statusGroup = p.dataset.group;
      document.querySelectorAll('.status-pill').forEach(x => x.classList.remove('on'));
      p.classList.add('on', statusGroup || 'all');
      pPage = 1;
      renderPRs();
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   Single-box date filter — one visible control that opens a popover
   with an inline calendar. Click a start date, then an end date;
   the range highlights between them. FIX #1: the popover is anchored
   with `position:fixed`, computed from the button's real on-screen
   position every time it opens (and kept in sync on scroll/resize),
   so it always appears directly under the button instead of drifting
   to the bottom of the page. FIX #2: every click inside the popover
   (including each calendar cell) stops propagation, so picking a
   start date — or an end date — never triggers the "click outside"
   handler and closes the panel early. It only closes on Apply,
   Clear, or an actual click outside the popover.
═══════════════════════════════════════════════════════════════ */
let calYear, calMonth;
let rangeStart = null, rangeEnd = null;

function positionDatePanel(){
  const btn = document.getElementById('dateFilterBtn');
  const panel = document.getElementById('dateFilterPanel');
  const rect = btn.getBoundingClientRect();
  const panelWidth = panel.offsetWidth || 260;
  let left = rect.left;
  const maxLeft = window.innerWidth - panelWidth - 12;
  if (left > maxLeft) left = Math.max(12, maxLeft);
  if (left < 12) left = 12;
  let top = rect.bottom + 6;
  const panelHeight = panel.offsetHeight || 320;
  // If it would overflow the bottom of the viewport, open it upward instead.
  if (top + panelHeight > window.innerHeight - 12) {
    top = Math.max(12, rect.top - panelHeight - 6);
  }
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
}

function toggleDatePanel(e){
  e.stopPropagation();
  const panel = document.getElementById('dateFilterPanel');
  const opening = !panel.classList.contains('show');
  if (opening){
    rangeStart = dateFrom || null;
    rangeEnd = dateTo || null;
    const base = rangeStart ? new Date(rangeStart) : new Date();
    calYear = base.getFullYear();
    calMonth = base.getMonth();
    renderCalendar();
    panel.classList.add('show');
    positionDatePanel();
  } else {
    panel.classList.remove('show');
  }
}

function closeDatePanel(){
  document.getElementById('dateFilterPanel').classList.remove('show');
}

document.addEventListener('click', (e) => {
  const wrap = document.getElementById('dateFilterWrap');
  const panel = document.getElementById('dateFilterPanel');
  if (wrap && panel && !wrap.contains(e.target) && !panel.contains(e.target)) closeDatePanel();
});
window.addEventListener('resize', () => {
  if (document.getElementById('dateFilterPanel').classList.contains('show')) positionDatePanel();
});
window.addEventListener('scroll', () => {
  if (document.getElementById('dateFilterPanel').classList.contains('show')) positionDatePanel();
}, true);

function renderCalendar(){
  document.getElementById('calLabel').textContent = `${MONTH_NAMES[calMonth]} ${calYear}`;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const todayStr = ymd(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

  let cells = [];
  for (let i=firstDay-1;i>=0;i--) cells.push({ day: daysInPrevMonth-i, muted:true });
  for (let d=1; d<=daysInMonth; d++) cells.push({ day:d, muted:false, ym: ymd(calYear,calMonth,d) });
  let next = 1;
  while (cells.length < 42) cells.push({ day: next++, muted:true });

  document.getElementById('calGrid').innerHTML = cells.map(c => {
    if (c.muted) return `<div class="cal-cell muted">${c.day}</div>`;
    let cls = 'cal-cell';
    if (c.ym === todayStr) cls += ' today';
    if (rangeStart && rangeEnd && c.ym > rangeStart && c.ym < rangeEnd) cls += ' in-range';
    if (rangeStart && c.ym === rangeStart) cls += ' start';
    if (rangeEnd && c.ym === rangeEnd) cls += ' end';
    return `<div class="${cls}" onclick="pickCalDate(event,'${c.ym}')">${c.day}</div>`;
  }).join('');

  const summary = document.getElementById('calSummary');
  if (rangeStart && rangeEnd) summary.textContent = `${fmtDateShort(rangeStart)} – ${fmtDateShort(rangeEnd)}`;
  else if (rangeStart) summary.textContent = `${fmtDateShort(rangeStart)} – select end date`;
  else summary.textContent = 'Select start date';
}

function pickCalDate(e, ym){
  if (e) e.stopPropagation();
  if (!rangeStart || (rangeStart && rangeEnd)) { rangeStart = ym; rangeEnd = null; }
  else if (ym < rangeStart) { rangeStart = ym; rangeEnd = null; }
  else if (ym === rangeStart) { rangeEnd = ym; }
  else { rangeEnd = ym; }
  renderCalendar();
  // Panel height can change as the grid re-renders — keep it anchored correctly.
  positionDatePanel();
}

function calPrevMonth(e){ e.stopPropagation(); calMonth--; if (calMonth<0){ calMonth=11; calYear--; } renderCalendar(); }
function calNextMonth(e){ e.stopPropagation(); calMonth++; if (calMonth>11){ calMonth=0; calYear++; } renderCalendar(); }

function updateDateFilterLabel(){
  const btn = document.getElementById('dateFilterBtn');
  const label = document.getElementById('dateFilterLabel');
  if (dateFrom && dateTo) label.textContent = `${fmtDateShort(dateFrom)} – ${fmtDateShort(dateTo)}`;
  else if (dateFrom) label.textContent = `From ${fmtDateShort(dateFrom)}`;
  else label.textContent = 'All Dates';
  btn.classList.toggle('active', !!(dateFrom || dateTo));
}
function applyDateFilter(e){
  if (e) e.stopPropagation();
  dateFrom = rangeStart || '';
  dateTo = rangeEnd || rangeStart || '';
  updateDateFilterLabel();
  closeDatePanel();
  pPage = 1;
  renderPRs();
}
function clearDateFilter(e){
  if (e) e.stopPropagation();
  dateFrom = ''; dateTo = ''; rangeStart = null; rangeEnd = null;
  updateDateFilterLabel();
  renderCalendar();
  closeDatePanel();
  pPage = 1;
  renderPRs();
}

function clearFilters(){
  document.getElementById('pSearch').value = '';
  document.getElementById('pDept').value = '';
  document.getElementById('pPriority').value = '';
  document.getElementById('pSort').value = 'date_desc';
  statusGroup = '';
  document.querySelectorAll('.status-pill').forEach(x => x.classList.remove('on'));
  document.querySelector('.status-pill.all').classList.add('on');
  clearDateFilter();
}

function renderPagination(btnId,labelId,page,total,size,cb){
  const totalPages=Math.max(1,Math.ceil(total/size));
  const from=total===0?0:(page-1)*size+1, to=Math.min(page*size,total);
  document.getElementById(labelId).textContent = total===0?'No records':`${from}–${to} of ${total}`;
  const wrap=document.getElementById(btnId); wrap.innerHTML='';
  const mk=(txt,pg,dis,active)=>{const b=document.createElement('button');b.className='page-btn'+(active?' active':'');b.innerHTML=txt;b.disabled=dis;b.onclick=()=>cb(pg);return b;};
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-left"></i>',page-1,page===1));
  let s=Math.max(1,page-2), e=Math.min(totalPages,s+4); s=Math.max(1,e-4);
  for(let i=s;i<=e;i++) wrap.appendChild(mk(i,i,false,i===page));
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-right"></i>',page+1,page>=totalPages));
}

function renderPRs(){
  const q = (document.getElementById('pSearch').value||'').toLowerCase();
  const dept = document.getElementById('pDept').value;
  const priority = document.getElementById('pPriority').value;
  const sort = document.getElementById('pSort').value;

  filteredPR = ProcurementAPI.DEMO_PR.filter(p=>{
    const mq = !q || p.prNo.toLowerCase().includes(q) || p.item.toLowerCase().includes(q) || p.by.toLowerCase().includes(q);
    const mg = !statusGroup || STAGE_TO_GROUP[p.approvalStage] === statusGroup;
    const md = !dept || p.dept === dept;
    const mp = !priority || p.priority === priority;
    const mdF = !dateFrom || p.date >= dateFrom;
    const mdT = !dateTo || p.date <= dateTo;
    return mq && mg && md && mp && mdF && mdT;
  });

  if (sort==='date_desc') filteredPR.sort((a,b)=>b.date.localeCompare(a.date));
  else if (sort==='date_asc') filteredPR.sort((a,b)=>a.date.localeCompare(b.date));
  else if (sort==='amount_desc') filteredPR.sort((a,b)=>(b.totalAmount)-(a.totalAmount));
  else if (sort==='amount_asc') filteredPR.sort((a,b)=>(a.totalAmount)-(b.totalAmount));

  document.getElementById('tblCount').textContent = filteredPR.length + ' request' + (filteredPR.length!==1?'s':'');
  renderPRPage();
  renderKpis();
}

function rowHtml(p){
  const stage = p.approvalStage;
  return `
      <tr onclick="ProcurementModals.showPRDetail(ProcurementAPI.DEMO_PR.find(pr=>pr.id==='${p.id}'))">
        <td class="pr-no">${p.prNo}</td>
        <td>${p.item}</td>
        <td><span class="dept-chip"><span class="dept-dot"></span>${p.dept}</span></td>
        <td>${p.by}</td>
        <td>${fmtDate(p.date)}</td>
        <td class="center" style="font-weight:700;color:var(--gold);">${fmtN(p.totalAmount)}</td>
        <td class="center"><span class="chip ${p.priority==='Urgent'?'chip-urgent':'chip-normal'}"><i class="fa-solid fa-circle"></i>${p.priority}</span></td>
        <td class="center"><span class="chip ${STAGE_CHIP_CLASS[stage]||'chip-status-pending'}"><i class="fa-solid fa-circle"></i>${STAGE_LABEL[stage]||stage||'—'}</span></td>
      </tr>`;
}

function renderPRPage(){
  const total = filteredPR.length;
  if (printMode){
    document.getElementById('prBody').innerHTML = total===0
      ? `<tr class="empty-row"><td colspan="8">No purchase requests found.</td></tr>`
      : filteredPR.map(rowHtml).join('');
    return;
  }
  const start = (pPage-1)*P_PAGE_SIZE;
  const rows = filteredPR.slice(start, start+P_PAGE_SIZE);
  document.getElementById('prBody').innerHTML = rows.length===0
    ? `<tr class="empty-row"><td colspan="8">No purchase requests found.</td></tr>`
    : rows.map(rowHtml).join('');
  renderPagination('pPageBtns','pPaginLabel',pPage,total,P_PAGE_SIZE,p=>{pPage=p;renderPRPage();});
}

/* Print only the current filtered set (every matching row, not just the
   current page), then restore the normal paginated view afterwards. */
function printFilteredTable(){
  printMode = true;
  const stamp = new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('printMeta').textContent = `${filteredPR.length} request${filteredPR.length!==1?'s':''} · Printed ${stamp}`;
  renderPRPage();
  window.print();
}
window.addEventListener('afterprint', () => {
  if (!printMode) return;
  printMode = false;
  renderPRPage();
});

// Init
populateDeptFilter();
bindStatusPills();
renderKpis();
renderPRs();
</script>
</body>
