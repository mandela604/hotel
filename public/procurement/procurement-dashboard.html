<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard | Aurum Procurement</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  /* This page only owns layout + its own KPI/panel content.
     Sidebar + topbar look/markup live entirely in procurement-shell.js and
     stay on the shared dark/blue theme. The .content scope below re-declares
     the SAME variable names with light values, so only the main content
     area turns white — the sidebar never sees these overrides. Same
     palette + fonts + icon system as the Restaurant pages (Segoe UI,
     Font Awesome, kpi-top/kpi-ic cards). */
  :root{ --radius:14px; --radius-sm:10px; --transition:.3s cubic-bezier(.4,0,.2,1); }
  html, body{ height:100%; overflow:hidden; }
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:13px; transition:background .3s,color .3s;
  }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  /* ── Light-theme variables, scoped to content only — same tokens as the Restaurant pages ── */
  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:768px){ .content{ padding:16px 16px 24px; } }
  @media (max-width:480px){ .content{ padding:14px 12px 20px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:700; margin-bottom:8px; }

  /* ═══ KPI CARDS — same icon-box system as the Restaurant pages ═══ */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s; text-decoration:none; display:flex; flex-direction:column; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-card.acc-amber::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .ic-red{ background:var(--red-bg); color:var(--red); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  /* Row / Panel */
  .row{ display:grid; grid-template-columns:1.3fr .7fr; gap:14px; }
  @media (max-width:900px){ .row{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow); min-width:0; }
  @media (max-width:420px){ .panel{ padding:14px; } }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  .panel-title{ font-size:12px; font-weight:800; color:var(--text); letter-spacing:.8px; text-transform:uppercase; }
  .panel-action{ font-size:11.5px; color:var(--gold); text-decoration:none; font-weight:600; white-space:nowrap; background:none; border:none; font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .panel-action:hover{ color:var(--gold-light); }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:14px 0; text-align:center; }

  /* List rows — used for Approval Pipeline */
  .list-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); text-decoration:none; color:inherit; cursor:pointer; }
  .list-row:last-child{ border-bottom:none; padding-bottom:0; }
  .list-row:hover .list-name{ color:var(--gold); }
  .list-body{ flex:1; min-width:0; }
  .list-name{ font-size:12.5px; color:var(--text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .15s; }
  .list-meta{ font-size:11px; color:var(--text3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list-count{ font-size:18px; font-weight:800; flex-shrink:0; }

  /* Quick actions */
  .quick-list{ display:flex; flex-direction:column; gap:8px; }
  .quick-btn{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; display:flex;
    align-items:center; gap:12px; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text2); text-decoration:none; transition:all .15s; min-width:0; }
  .quick-btn:hover{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .quick-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; background:var(--blue-bg); color:var(--blue); }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @media print{
    #prc-sidebar, #prc-topbar, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar rendered here by procurement-shell.js -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar rendered here by procurement-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">

      <div>
        <div class="section-title">Procurement Overview</div>
        <div class="kpi-row" id="kpiRow"></div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Approval Pipeline</div>
          </div>
          <div id="approvalPipeline"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Quick Actions</div>
          </div>
          <div class="quick-list">
            <a class="quick-btn" href="po-form.html"><span class="quick-ic ic-blue"><i class="fa-solid fa-pen-to-square"></i></span>New Request</a>
            <a class="quick-btn" href="requisition-history.html"><span class="quick-ic ic-green"><i class="fa-solid fa-clipboard-check"></i></span>Review &amp; Approve</a>
            <a class="quick-btn" href="po-history.html"><span class="quick-ic ic-purple"><i class="fa-solid fa-chart-column"></i></span>PO History</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- LOAD ORDER: seed, then service, then shell — matches the Kitchen pattern
     and the real module layout (data/ + services/ one level up, shared
     with the rest of the app; procurement-shell.js stays alongside the
     pages themselves). -->
<script src="data/procurement-seed.js"></script>
<script src="services/procurement-service.js"></script>
<script src="procurement-shell.js"></script>
<script>
/* ═══════════════════════════════════════════
   Initialization & Rendering — same shape as kitchen-dashboard.html:
   svc.loadAll() populates svc.state, paint() reads only from svc.state,
   svc.onChange(paint) keeps the page live after any mutation made
   elsewhere (approve/reject/create PO/new PR), no matter which page did it.
═══════════════════════════════════════════ */
const svc = window.ProcurementService;
let shell = null;

function renderKpis(){
  const kpis = svc.dashboardKPIs();

  document.getElementById('kpiRow').innerHTML = `
    <a class="kpi-card acc-amber" href="requisition-history.html">
      <div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-hourglass-half"></i></div><div class="kpi-label">Pending Approval</div></div>
      <div class="kpi-value" style="color:var(--amber);">${kpis.pending}</div>
      <div class="kpi-trend ${kpis.pending>0?'warn':'up'}">${kpis.pending>0?'Needs review':'All clear'}</div>
    </a>
    <a class="kpi-card acc-green" href="po-history.html">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-circle-check"></i></div><div class="kpi-label">Approved This Month</div></div>
      <div class="kpi-value" style="color:var(--green);">${kpis.approvedThisMonth}</div>
      <div class="kpi-trend up">Requests cleared</div>
    </a>
    <a class="kpi-card acc-blue" href="po-history.html">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Spend This Month</div></div>
      <div class="kpi-value" style="color:var(--blue);">${svc.fmtN(kpis.spendThisMonth)}</div>
      <div class="kpi-trend info">Approved + fulfilled</div>
    </a>
    <a class="kpi-card acc-purple" href="requisition-history.html">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-star"></i></div><div class="kpi-label">Needs MD Approval</div></div>
      <div class="kpi-value" style="color:var(--purple);">${kpis.needsMD}</div>
      <div class="kpi-trend neutral">Above ₦100k</div>
    </a>`;

  shell.setPendingBadge(kpis.pending);
}

function renderApprovalPipeline(){
  const counts = svc.approvalPipelineCounts();
  const stages = [
    { key: 'pending',    label: 'Pending',    icon: 'fa-hourglass-half', cls: 'ic-amber',  color: 'var(--amber)' },
    { key: 'accountant', label: 'Accountant', icon: 'fa-calculator',     cls: 'ic-blue',   color: 'var(--blue)' },
    { key: 'gm',         label: 'GM',         icon: 'fa-user-tie',       cls: 'ic-green',  color: 'var(--green)' },
    { key: 'md',         label: 'MD',         icon: 'fa-star',          cls: 'ic-purple', color: 'var(--purple)' },
    { key: 'approved',   label: 'Approved',   icon: 'fa-circle-check',   cls: 'ic-green',  color: 'var(--green)' },
  ];

  const el = document.getElementById('approvalPipeline');
  el.innerHTML = stages.map(stage => {
    const count = counts[stage.key] || 0;
    return `
      <a class="list-row" href="requisition-history.html">
        <div class="kpi-ic ${stage.cls}"><i class="fa-solid ${stage.icon}"></i></div>
        <div class="list-body">
          <div class="list-name">${stage.label}</div>
          <div class="list-meta">${count} request${count!==1?'s':''}</div>
        </div>
        <div class="list-count" style="color:${stage.color};">${count}</div>
      </a>`;
  }).join('');
}

function paint(){
  if (!svc || !svc.state.ready) return;
  renderKpis();
  renderApprovalPipeline();
}

async function init(){
  shell = ProcurementShell.attach({
    sidebarTarget: '#sidebarSlot',
    topbarTarget:  '#topbarSlot',
    activeFile:    'procurement-dashboard.html',
    pageTitle:     'Dashboard',
    pageSubtitle:  'Procurement overview',
    apiMode:       svc && svc.CONFIG.USE_PROD ? 'Live' : 'Demo',
    user:          { name: 'Procurement Officer', initials: 'PO' },
  });

  if (!svc) {
    console.error('ProcurementService not found!');
    return;
  }

  await svc.loadAll();
  paint();

  // Keep the dashboard live: an approval, rejection, PO creation, or new
  // PR made from ANY procurement page fires this, not just this one.
  svc.onChange(paint);
}

window.addEventListener('load', init);
</script>
</body>
</html>
