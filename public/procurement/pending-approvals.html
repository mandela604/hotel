<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pending Approvals | Aurum Procurement</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --gold:#c9a84c; --gold-light:#e8c96a; --gold-dim:rgba(201,168,76,0.12); --gold-border:rgba(201,168,76,0.25);
    --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
    --red:#f87171; --red-bg:rgba(248,113,113,0.12);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
    --purple:#a78bfa; --purple-bg:rgba(167,139,250,0.12);
  }
  [data-theme="dark"]{
    --bg:#080f18; --surface:#111e2b; --surface2:#162435; --surface3:#1c2e40;
    --border:#1e3045; --border2:#243850; --text:#e8f0f8; --text2:#a8bece; --text3:#6a8a9e;
    --shadow:0 8px 32px rgba(0,0,0,0.5); --shadow-lg:0 16px 48px rgba(0,0,0,0.6);
  }
  [data-theme="light"]{
    --bg:#eef2f7; --surface:#ffffff; --surface2:#f4f7fb; --surface3:#e8edf5;
    --border:#dce4ef; --border2:#ccd6e5; --text:#0f2237; --text2:#4a6580; --text3:#8aa0b8;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  }
  html, body{ height:100%; overflow:hidden; }
  body{ font-family:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); font-size:14px; transition:background .3s,color .3s; }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{ flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0; }
  @media (max-width:768px){ .content{ padding:16px 16px 24px; } }
  @media (max-width:480px){ .content{ padding:14px 12px 20px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:500; margin-bottom:2px; }

  /* Demo banner */
  .demo-banner{ background:linear-gradient(90deg,var(--gold-dim),var(--surface2)); border:1px solid var(--gold-border); border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:10px; animation:fadeUp .4s ease both; }
  .demo-icon{ font-size:20px; }
  .demo-text{ flex:1; }
  .demo-title{ font-size:12px; font-weight:600; color:var(--gold); margin-bottom:2px; }
  .demo-desc{ font-size:11px; color:var(--text3); }
  .demo-btn{ padding:6px 12px; background:var(--gold); color:#0a1520; border:none; border-radius:8px; font-family:'Outfit',sans-serif; font-size:11px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .demo-btn:hover{ background:var(--gold-light); transform:translateY(-1px); }

  /* KPI */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; position:relative; overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s; text-decoration:none; display:block; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-accent{ position:absolute; bottom:-10px; right:-10px; font-size:50px; opacity:.07; line-height:1; pointer-events:none; }
  .kpi-label{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; font-weight:500; }
  .kpi-value{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1; margin-bottom:6px; }
  @media (max-width:420px){ .kpi-value{ font-size:21px; } }
  .kpi-trend{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); }

  /* Role selector */
  .role-selector{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .role-btn{ padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text2); font-family:'Outfit',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all .2s; }
  .role-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .role-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .role-btn .role-icon{ margin-right:6px; }

  /* Panel */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow); min-width:0; }
  @media (max-width:420px){ .panel{ padding:14px; } }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  .panel-title{ font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.8px; text-transform:uppercase; }
  .panel-action{ font-size:11.5px; color:var(--gold); text-decoration:none; font-weight:500; white-space:nowrap; background:none; border:none; font-family:'Outfit',sans-serif; cursor:pointer; }
  .panel-action:hover{ color:var(--gold-light); }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:14px 0; text-align:center; }

  /* List rows */
  .list-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); text-decoration:none; color:inherit; cursor:pointer; transition:background .15s; }
  .list-row:last-child{ border-bottom:none; padding-bottom:0; }
  .list-row:hover{ background:var(--surface2); }
  .list-row:hover .list-name{ color:var(--gold-light); }
  .list-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .list-body{ flex:1; min-width:0; }
  .list-name{ font-size:12.5px; color:var(--text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .15s; }
  .list-meta{ font-size:11px; color:var(--text3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; flex-shrink:0; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .chip-pending{ background:var(--amber-bg); color:var(--amber); } .chip-pending::before{ background:var(--amber); }
  .chip-approved{ background:var(--green-bg); color:var(--green); } .chip-approved::before{ background:var(--green); }
  .chip-fulfilled{ background:var(--purple-bg); color:var(--purple); } .chip-fulfilled::before{ background:var(--purple); }
  .chip-rejected{ background:var(--red-bg); color:var(--red); } .chip-rejected::before{ background:var(--red); }
  .chip-accountant{ background:var(--blue-bg); color:var(--blue); } .chip-accountant::before{ background:var(--blue); }
  .chip-gm{ background:var(--green-bg); color:var(--green); } .chip-gm::before{ background:var(--green); }
  .chip-md{ background:var(--purple-bg); color:var(--purple); } .chip-md::before{ background:var(--purple); }

  /* Quick actions */
  .quick-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:560px){ .quick-grid{ grid-template-columns:1fr 1fr; } }
  .quick-btn{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px 12px; cursor:pointer; display:flex;
    align-items:center; gap:10px; font-family:'Outfit',sans-serif; font-size:13px; font-weight:500; color:var(--text2); text-decoration:none; transition:all .2s; min-width:0; }
  .quick-btn:hover{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold-light); }
  .quick-icon{ font-size:17px; flex-shrink:0; }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @media print{
    #prc-sidebar, #prc-topbar, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar rendered here by procurement-shell.js -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar rendered here by procurement-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">
      <!-- Demo Mode Banner -->
      <div class="demo-banner">
        <span class="demo-icon">🎬</span>
        <div class="demo-text">
          <div class="demo-title">Demo Mode Active</div>
          <div class="demo-desc">Click any row to view details and take action. Switch roles to see different approval queues.</div>
        </div>
        <button class="demo-btn" onclick="resetDemoData()">🔄 Reset Demo</button>
      </div>

      <div>
        <div class="section-title">Pending Approvals — Your Action Required</div>
        <div class="kpi-row" id="kpiRow"></div>
      </div>

      <!-- Role selector for demo purposes -->
      <div class="panel" style="padding:14px 18px;">
        <div class="panel-head" style="margin-bottom:8px;"><div class="panel-title" style="font-size:11px;">View as Role (Demo)</div></div>
        <div class="role-selector">
          <button class="role-btn active" data-role="all" onclick="filterByRole('all')"><span class="role-icon">👁</span>All Pending</button>
          <button class="role-btn" data-role="accountant" onclick="filterByRole('accountant')"><span class="role-icon">🧮</span>Accountant</button>
          <button class="role-btn" data-role="gm" onclick="filterByRole('gm')"><span class="role-icon">👔</span>GM</button>
          <button class="role-btn" data-role="md" onclick="filterByRole('md')"><span class="role-icon">⭐</span>MD</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">All Pending Approvals</div>
          <span style="font-size:11px;color:var(--text3);">Click any row to review and take action</span>
        </div>
        <div id="approvalList"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><div class="panel-title">Quick Actions</div></div>
        <div class="quick-grid">
          <a class="quick-btn" href="dashboard.html"><span class="quick-icon">◈</span>Dashboard</a>
          <a class="quick-btn" href="new-requisition.html"><span class="quick-icon">📝</span>New Request</a>
          <a class="quick-btn" href="requisition-history.html"><span class="quick-icon">📊</span>History</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="procurement-shell.js"></script>
<script src="procurement-api.js"></script>
<script src="procurement-modals.js"></script>
<script>
const shell = ProcurementShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'pending-approvals.html',
  pageTitle:     'Pending Approvals',
  pageSubtitle:  'Your action required',
  apiMode:       ProcurementAPI.CONFIG.USE_PROD ? 'Live' : 'Demo',
  user:          { name: 'Approver', initials: 'AP' },
});

let currentRoleFilter = 'all';

function renderKpis(){
  const prs = ProcurementAPI.DEMO_PR;
  const pending = prs.filter(p=>p.approvalStage==='pending' || p.approvalStage==='accountant' || p.approvalStage==='gm' || p.approvalStage==='md').length;
  const urgent = prs.filter(p=>p.priority==='Urgent' && (p.approvalStage==='pending' || p.approvalStage==='accountant' || p.approvalStage==='gm' || p.approvalStage==='md')).length;
  const monthPrefix = new Date().toISOString().slice(0,7);
  const approvedThisMonth = prs.filter(p=>(p.approvalStage==='approved'||p.approvalStage==='fulfilled') && p.date.startsWith(monthPrefix)).length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card"><div class="kpi-accent">⏳</div>
      <div class="kpi-label">Pending Your Action</div><div class="kpi-value" style="color:var(--amber);">${pending}</div>
      <div class="kpi-trend ${pending>0?'warn':'up'}">${pending>0?'⚠ Needs review':'✓ All clear'}</div></div>
    <div class="kpi-card"><div class="kpi-accent">🚨</div>
      <div class="kpi-label">Urgent</div><div class="kpi-value" style="color:var(--red);">${urgent}</div>
      <div class="kpi-trend down">Requires immediate attention</div></div>
    <div class="kpi-card"><div class="kpi-accent">✓</div>
      <div class="kpi-label">Approved This Month</div><div class="kpi-value" style="color:var(--green);">${approvedThisMonth}</div>
      <div class="kpi-trend up">Requests cleared</div></div>
    <div class="kpi-card"><div class="kpi-accent">💰</div>
      <div class="kpi-label">Total Pending Value</div><div class="kpi-value" style="font-size:22px;">${fmtN(prs.filter(p=>p.approvalStage==='pending' || p.approvalStage==='accountant' || p.approvalStage==='gm' || p.approvalStage==='md').reduce((s,p)=>s+p.totalAmount,0))}</div>
      <div class="kpi-trend info">Awaiting approval</div></div>`;
}

function renderApprovals(){
  let pending = ProcurementAPI.DEMO_PR.filter(p=>p.approvalStage==='pending' || p.approvalStage==='accountant' || p.approvalStage==='gm' || p.approvalStage==='md');
  
  // Filter by role
  if (currentRoleFilter !== 'all') {
    pending = pending.filter(p => p.approvalStage === currentRoleFilter);
  }
  
  const el = document.getElementById('approvalList');
  el.innerHTML = pending.length===0
    ? `<div class="empty-note">No pending approvals${currentRoleFilter!=='all'?' for this role':''}. Great job! 🎉</div>`
    : pending.map(p => `
      <div class="list-row" onclick="ProcurementModals.showPRDetail(ProcurementAPI.DEMO_PR.find(pr=>pr.id==='${p.id}'))">
        <span class="list-dot" style="background:${p.priority==='Urgent'?'var(--red)':'var(--amber)'}"></span>
        <div class="list-body">
          <div class="list-name">${p.prNo} — ${p.item}</div>
          <div class="list-meta">${p.by} · ${p.dept} · ${fmtDate(p.date)} · Total: ${fmtN(p.totalAmount)}</div>
        </div>
        <span class="chip chip-${p.approvalStage}">${getStatusLabel(p.approvalStage)}</span>
        <span class="chip" style="background:${p.priority==='Urgent'?'var(--red-bg)':'var(--amber-bg)'};color:${p.priority==='Urgent'?'var(--red)':'var(--amber)'}">${p.priority}</span>
        ${p.needsMDApproval ? '<span class="chip" style="background:var(--purple-bg);color:var(--purple);">MD Required</span>' : ''}
      </div>`).join('');
}

function filterByRole(role){
  currentRoleFilter = role;
  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.role === role);
  });
  renderApprovals();
}

function getStatusLabel(status){
  const labels = { pending:'Pending', accountant:'Accountant Review', gm:'GM Review', md:'MD Review', approved:'Approved', fulfilled:'Fulfilled', rejected:'Rejected' };
  return labels[status] || status;
}

function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

async function resetDemoData(){
  const confirmed = await ProcurementModals.confirm('Reset all procurement data to demo defaults? This will clear any changes you made.', 'Reset Demo Data');
  if (!confirmed) return;
  
  localStorage.setItem('hotel-procurement', JSON.stringify(ProcurementAPI.DEMO_PR));
  localStorage.setItem('hotel-suppliers', JSON.stringify(ProcurementAPI.DEMO_SUPPLIERS));
  ProcurementModals.alert('Demo data reset successfully!', 'Success');
  location.reload();
}

// Init
renderKpis();
renderApprovals();
</script>
</body>
</html>
