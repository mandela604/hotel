<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>New Requisition | Aurum Procurement</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --gold:#c9a84c; --gold-light:#e8c96a; --gold-dim:rgba(201,168,76,0.12); --gold-border:rgba(201,168,76,0.25);
    --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
    --red:#f87171; --red-bg:rgba(248,113,113,0.12);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
    --purple:#a78bfa; --purple-bg:rgba(167,139,250,0.12);
  }
  [data-theme="dark"]{
    --bg:#080f18; --surface:#111e2b; --surface2:#162435; --surface3:#1c2e40;
    --border:#1e3045; --border2:#243850; --text:#e8f0f8; --text2:#a8bece; --text3:#6a8a9e;
    --shadow:0 8px 32px rgba(0,0,0,0.5); --shadow-lg:0 16px 48px rgba(0,0,0,0.6);
  }
  [data-theme="light"]{
    --bg:#eef2f7; --surface:#ffffff; --surface2:#f4f7fb; --surface3:#e8edf5;
    --border:#dce4ef; --border2:#ccd6e5; --text:#0f2237; --text2:#4a6580; --text3:#8aa0b8;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  }
  html, body{ height:100%; overflow:hidden; }
  body{ font-family:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); font-size:14px; transition:background .3s,color .3s; }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{ flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0; }
  @media (max-width:768px){ .content{ padding:16px 16px 24px; } }
  @media (max-width:480px){ .content{ padding:14px 12px 20px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:500; margin-bottom:2px; }

  /* Approval flow diagram */
  .flow-diagram{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow); }
  .flow-title{ font-size:11px; font-weight:700; color:var(--gold); letter-spacing:.8px; text-transform:uppercase; margin-bottom:14px; }
  .flow-steps{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .flow-step{ display:flex; align-items:center; gap:6px; padding:6px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; font-size:11px; color:var(--text2); }
  .flow-step.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .flow-step.completed{ background:var(--green-bg); border-color:rgba(74,222,128,0.3); color:var(--green); }
  .flow-arrow{ color:var(--text3); font-size:16px; }
  .flow-note{ font-size:10px; color:var(--text3); margin-top:8px; font-style:italic; }

  @media print{
    #prc-sidebar, #prc-topbar, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar rendered here by procurement-shell.js -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar rendered here by procurement-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">
      <div>
        <div class="section-title">Create Purchase Requisition</div>
      </div>

      <!-- Approval Flow Diagram -->
      <div class="flow-diagram">
        <div class="flow-title">Approval Workflow</div>
        <div class="flow-steps">
          <div class="flow-step active">1. Purchase Request</div>
          <span class="flow-arrow">→</span>
          <div class="flow-step">2. Accountant</div>
          <span class="flow-arrow">→</span>
          <div class="flow-step">3. GM</div>
          <span class="flow-arrow">→</span>
          <div class="flow-step" id="mdStep">4. MD <span style="font-size:9px;opacity:0.7;">(if >₦100k)</span></div>
          <span class="flow-arrow" id="poArrow" style="display:none;">→</span>
          <div class="flow-step" id="poStep" style="display:none;">5. Create PO</div>
        </div>
        <div class="flow-note">💡 All requests require Accountant + GM approval. Requests above ₦100,000 also require MD approval before PO can be created.</div>
      </div>

      <!-- Grace Hotel Request Form Component -->
      <div id="requestFormPlaceholder"></div>
    </div>
  </div>
</div>

<!-- Use the grace-request-form.js component -->
<script src="../../component/grace-request-form.js"></script>
<script src="procurement-shell.js"></script>
<script src="procurement-api.js"></script>
<script src="procurement-modals.js"></script>
<script>
const shell = ProcurementShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'new-requisition.html',
  pageTitle:     'New Requisition',
  pageSubtitle:  'Create purchase request',
  apiMode:       ProcurementAPI.CONFIG.USE_PROD ? 'Live' : 'Demo',
  user:          { name: 'Procurement Officer', initials: 'PO' },
});

// Attach the Grace Hotel Request Form
const form = GraceHotelRequestForm.attach('#requestFormPlaceholder', {
  defaultMode: 'purchase',
  pageSize: 5,
  showRecent: true,
  departments: ['Housekeeping', 'Restaurant / Bar', 'Kitchen', 'Pool Bar', 'Front Desk', 'Accounting', 'Maintenance'],
  fulfillStores: ['Central Store', 'Main Kitchen Store', 'Housekeeping Store'],
  currentUser: { name: 'Current User' },
  
  // Use ProcurementAPI storage adapter
  storage: {
    async get(key, shared) {
      if (shared) {
        // Use ProcurementAPI for shared data
        return null;
      }
      const v = localStorage.getItem(key);
      return v == null ? null : { key, value: v, shared: false };
    },
    async set(key, value, shared) {
      localStorage.setItem(key, value);
      return { key, value, shared: shared || false };
    },
    async delete(key, shared) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: shared || false };
    },
    async list(prefix, shared) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: shared || false };
    },
  },

  // When form is submitted, save via ProcurementAPI
  onSubmit: async (entry) => {
    try {
      // Calculate total amount
      const totalAmount = entry.items.reduce((sum, item) => {
        return sum + (parseFloat(item.qty) || 0) * (parseFloat(item.cost) || 0);
      }, 0);

      // Create PR via API
      const pr = await ProcurementAPI.createPR({
        item: entry.items.map(i => i.name).join(', '),
        cat: 'General',
        dept: entry.dept,
        priority: entry.priority,
        qty: entry.items.reduce((sum, i) => sum + (parseFloat(i.qty) || 0), 0),
        unit: entry.items[0]?.unit || 'Units',
        unitCost: totalAmount / (entry.items.reduce((sum, i) => sum + (parseFloat(i.qty) || 0), 0) || 1),
        needed: entry.needed,
        notes: entry.remark,
        supplier: entry.supplier || '',
        totalAmount: totalAmount
      });

      // Show success message with approval info
      const needsMD = totalAmount > ProcurementAPI.CONFIG.MD_APPROVAL_THRESHOLD;
      ProcurementModals.alert(
        `Requisition ${pr.prNo} submitted successfully!\n\n` +
        `Total: ₦${totalAmount.toLocaleString('en-NG')}\n` +
        `Status: Pending Accountant Approval\n\n` +
        `Approval Flow:\n` +
        `✓ Accountant (required)\n` +
        `✓ GM (required)\n` +
        `${needsMD ? '✓ MD (required - amount > ₦100,000)' : '✗ MD (not required - amount < ₦100,000)'}\n` +
        `→ Create PO`,
        'Success'
      );

      // Refresh the form
      form.refreshRecent();
    } catch (error) {
      ProcurementModals.alert('Error creating requisition: ' + error.message, 'Error');
    }
  },

  // When a recent request is clicked, show details
  onOpenRequest: (reqNo) => {
    ProcurementModals.alert('Request details for ' + reqNo + ' would open here.', 'Request Details');
  },
});

// Update flow diagram based on amount
function updateFlowDiagram() {
  // This would be dynamic based on form input
  // For now, show the static diagram
}
</script>
</body>
</html>
