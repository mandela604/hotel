<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title id="pageTitleTag">Sales | Grace Pool Bar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; overflow:hidden; }
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:13px; transition:background .3s,color .3s;
  }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:768px){ .content{ padding:16px 16px 24px; } }
  @media (max-width:480px){ .content{ padding:14px 12px 20px; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; flex-shrink:0; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden;
    box-shadow:var(--shadow); cursor:default; transition:transform .2s,box-shadow .2s,border-color .2s; display:flex; flex-direction:column; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .ic-red{ background:var(--red-bg); color:var(--red); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); }
  .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  #filterSlot{ flex-shrink:0; }
  #tableSlot{ flex-shrink:0; min-width:0; }

  .shift-note{
    font-size:11.5px; color:var(--text2); font-weight:600;
    display:flex; align-items:center; gap:6px; flex-shrink:0;
  }
  .shift-note i{ color:var(--gold); }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text); box-shadow:0 8px 28px rgba(15,34,55,0.18); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); }
  .toast.success{ border-left:3px solid var(--green); }
  .toast.error{ border-left:3px solid var(--red); }
  .toast.info{ border-left:3px solid var(--blue); }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @media (max-width:480px){ .toast{ left:12px; right:12px; bottom:12px; max-width:none; } }

  .fatal-panel{
    background:var(--surface); border:1px solid var(--red); border-left:3px solid var(--red); border-radius:14px;
    box-shadow:var(--shadow); padding:24px; color:var(--text); font-size:13px; line-height:1.6;
  }
  .fatal-panel b{ color:var(--red); }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  @media print{
    #pbs-sidebar, #pbs-topbar, #filterSlot, .st-pagin, .st-acts, .no-print, .shift-note{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .print-header{ display:block !important; margin-bottom:14px; }
  }
  .print-header{ display:none; }
  .print-header h2{ font-size:18px; font-weight:800; }
  .print-header p{ font-size:11px; color:#555; margin-top:3px; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <div class="kpi-row" id="kpiRow"></div>

      <div class="shift-note no-print" id="shiftNote">
        <i class="fa-solid fa-user-clock"></i>
        <span>Today's shift only · showing your sales</span>
      </div>

      <div id="filterSlot" class="no-print"></div>

      <div class="print-header"><h2 id="printHeaderTitle">Grace Hotel — Sales (My Shift)</h2><p id="printSub"></p></div>
      <div id="tableSlot"></div>

      <div class="fatal-panel no-print" id="fatalPanel" style="display:none;">
        <b>Could not load this page.</b>
        <div id="fatalMsg"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="../services/permissions.js"></script>
<script src="data/poolbar-seed.js"></script>
<script src="services/poolbar-service.js"></script>
<script src="../component/poolbar-shell.js"></script>
<script src="../component/sales-detail.js"></script>
<script src="../component/void-sale.js"></script>
<script src="../component/sales-filter-bar.js"></script>
<script src="../component/sales-table.js"></script>
<script>
/**
 * Sales page = TODAY + CURRENT STAFF only (via svc.getShiftSales).
 * Reports page keeps full history / all staff.
 *
 * 100% CALL-AND-RENDER — this page owns zero business logic. Every
 * filtering rule, KPI calculation, row/detail shape, and shift-copy
 * string is computed by PoolBarService; this file only wires DOM
 * elements, reads user input, and passes it straight through:
 *   svc.filterShiftSales(session, filterState) — status/payment/search filtering
 *   svc.getShiftKpiSummary(rows)               — revenue/received/units math
 *   svc.normalizeSaleForTable(sale)            — row shape for SalesTable
 *   svc.buildSaleDetailShape(sale)             — shape for SalesDetail/VoidSale
 *   svc.getShiftLabel/getShiftNoteText/getShiftTableTitle/getPrintSummary(session, ...)
 *   svc.getPaymentMethods() / getStatusOptions() / isMoneyReceived()
 *   svc.getDefaultPageSize() / getDepartmentName() / getOrderPageLink()
 *   svc.canVoidSale(session) / isManagerLike(session)
 * If any of these change on the backend, only services/poolbar-service.js
 * (or data/poolbar-seed.js) needs editing — never this file.
 */
const shell = PoolBarShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'poolbar-sales.html',
  pageTitle:     'Sales',
  pageSubtitle:  'Your sales for today\u2019s shift',
});

function currentShellTheme(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }
const _pbsThemeBtn = document.getElementById('pbs-themeBtn');
if (_pbsThemeBtn) {
  _pbsThemeBtn.addEventListener('click', () => {
    setTimeout(() => {
      document.dispatchEvent(new CustomEvent('aurum:themechange', { detail: { theme: currentShellTheme() } }));
    }, 0);
  });
}

const svc = window.PoolBarService;
let session = null;
let canVoid = false;
let salesDetail = null;
let voidSale = null;
let filterBar = null;
let salesTable = null;
let filterState = null;

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function applyModuleBranding() {
  const dept = svc.getDepartmentName();
  const titleTag = document.getElementById('pageTitleTag');
  if (titleTag) titleTag.textContent = 'Sales | Grace ' + dept;
  const printTitle = document.getElementById('printHeaderTitle');
  if (printTitle) printTitle.textContent = 'Grace Hotel — ' + dept + ' Sales (My Shift)';
  if (shell.setTitle) shell.setTitle('Sales', 'Your ' + dept + ' sales for today\u2019s shift');
}

function waitForSession(maxMs) {
  maxMs = maxMs || 800;
  return new Promise(function (resolve) {
    const started = Date.now();
    const tick = function () {
      const u = shell.getUser && shell.getUser();
      if (u && u.role) {
        resolve(u);
        return;
      }
      if (Date.now() - started >= maxMs) {
        resolve(shell.getUser && shell.getUser());
        return;
      }
      setTimeout(tick, 40);
    };
    tick();
  });
}

function fmtN(n) { return svc.fmtN(n); }

function renderKPIs(rows) {
  const k = svc.getShiftKpiSummary(rows);
  const who = svc.getShiftLabel(session);

  document.getElementById('kpiRow').innerHTML =
    '<div class="kpi-card acc-blue">' +
      '<div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-receipt"></i></div><div class="kpi-label">' + who + ' — Sales</div></div>' +
      '<div class="kpi-value" style="color:var(--gold);">' + k.total + '</div>' +
      '<div class="kpi-trend neutral">' + k.completed + ' completed · ' + k.voided + ' voided</div>' +
    '</div>' +

    '<div class="kpi-card acc-green">' +
      '<div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Revenue</div></div>' +
      '<div class="kpi-value" style="color:var(--green);">' + fmtN(k.revenue) + '</div>' +
      '<div class="kpi-trend up">All completed sales</div>' +
    '</div>' +

    '<div class="kpi-card acc-green">' +
      '<div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-wallet"></i></div><div class="kpi-label">Money received</div></div>' +
      '<div class="kpi-value" style="color:var(--green);">' + fmtN(k.moneyReceived) + '</div>' +
      '<div class="kpi-trend ' + (k.notReceivedTotal > 0 ? 'warn' : 'neutral') + '">' +
        (k.notReceivedTotal > 0
          ? 'Not yet received: ' + fmtN(k.notReceivedTotal)
          : 'All sales received in-till') +
      '</div>' +
    '</div>' +

    '<div class="kpi-card acc-blue">' +
      '<div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-boxes-stacked"></i></div><div class="kpi-label">Units Sold</div></div>' +
      '<div class="kpi-value" style="color:var(--gold);">' + k.units + '</div>' +
      '<div class="kpi-trend info">Across ' + k.completed + ' sale' + (k.completed !== 1 ? 's' : '') + '</div>' +
    '</div>';
}

function applyFilters(state) {
  if (!salesTable) return;
  filterState = state || filterState || {};
  const rows = svc.filterShiftSales(session, filterState);
  const tableRows = rows.map(svc.normalizeSaleForTable);
  renderKPIs(tableRows);
  salesTable.setTitle(svc.getShiftTableTitle(session));
  salesTable.setRows(tableRows);
}

function openDetail(s) {
  if (!s || !salesDetail) return;
  salesDetail.open(svc.buildSaleDetailShape(s));
}
function openVoidDirect(s) {
  if (!canVoid) { showToast("You don't have permission to void sales.", 'error'); return; }
  if (!s || !voidSale) return;
  voidSale.open(svc.buildSaleDetailShape(s));
}

async function performVoid(id, reason, voidedBy) {
  if (!canVoid) { showToast("You don't have permission to void sales.", 'error'); return; }
  try {
    const s = await svc.voidSale(id, reason, voidedBy || (session && session.name) || '');
    showToast((s && s.id ? s.id : id) + ' voided — stock restored.', 'error');
    applyFilters(filterBar ? filterBar.getState() : filterState);
  } catch (e) {
    showToast((e && e.message) || 'Could not void this sale.', 'error');
  }
}

function showToast(msg, type) {
  type = type || 'success';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + escapeHtml(msg);
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3400);
}

function showFatal(message) {
  document.getElementById('fatalMsg').textContent = message;
  document.getElementById('fatalPanel').style.display = 'block';
  document.getElementById('filterSlot').style.display = 'none';
  document.getElementById('tableSlot').style.display = 'none';
  document.getElementById('kpiRow').style.display = 'none';
  document.getElementById('shiftNote').style.display = 'none';
}

async function init() {
  try {
    if (!svc) throw new Error('PoolBarService not loaded.');

    applyModuleBranding();

    session = await waitForSession(800);
    if (!session) throw new Error('No session — please sign in again.');
    canVoid = !!svc.canVoidSale(session);

    const note = document.getElementById('shiftNote');
    if (note) note.querySelector('span').textContent = svc.getShiftNoteText(session);

    salesDetail = SalesDetail.create({
      theme: currentShellTheme(),
      ...(canVoid ? { onVoid: function (saleShape) { voidSale.open(saleShape); } } : {}),
    });
    voidSale = VoidSale.create({
      theme: currentShellTheme(),
      currentUser: {
        name: (session && session.name) || 'Staff',
        role: session.role,
      },
      onConfirm: function (saleShape, reason, voidedBy) {
        return performVoid(saleShape.id, reason, voidedBy || (session && session.name) || '');
      },
    });

    salesTable = SalesTable.create({
      target: '#tableSlot',
      pageSize: svc.getDefaultPageSize(),
      showSummary: true,
      showActions: true,
      showSource: false,
      canVoid: canVoid,
      title: 'Today',
      formatMoney: fmtN,
      onRowClick: openDetail,
      onView: openDetail,
      onVoid: openVoidDirect,
    });

    filterBar = SalesFilterBar.create({
      target: '#filterSlot',
      show: {
        period: false,
        status: true,
        source: false,
        payment: true,
        dateRange: false,
        search: true,
        clear: true,
        chips: true,
      },
      statusOptions: svc.getStatusOptions(),
      paymentOptions: svc.getPaymentMethods(),
      searchPlaceholder: 'Sale #, item, table…',
      defaultPeriod: 'today',
      actions: [
        { id: 'order', label: 'Order', icon: 'fa-cart-plus', variant: 'primary' },
        { id: 'print', label: 'Print', icon: 'fa-print', variant: 'outline' },
      ],
      onChange: function (state) {
        applyFilters(state);
      },
      onAction: function (id) {
        if (id === 'order') location.href = svc.getOrderPageLink();
        if (id === 'print') {
          const st = salesTable.getState();
          document.getElementById('printSub').textContent = svc.getPrintSummary(session, st.rows);
          window.print();
        }
      },
    });

    await svc.loadAll();
    applyFilters(filterBar.getState());

    if (svc.onChange) {
      svc.onChange(function () {
        applyFilters(filterBar.getState());
      });
    }
  } catch (err) {
    showFatal(err && err.message ? err.message : 'Failed to load sales.');
  }
}
init();
</script>
</body>
</html>
