<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Pending Requisitions | Aurum Pool Bar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
    --red:#f87171; --red-bg:rgba(248,113,113,0.12);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
  }
  html, body{ height:100%; overflow:hidden; }
  body{ font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); font-size:14px; transition:background .3s,color .3s; }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{ flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0; }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; cursor:default; transition:transform .2s,box-shadow .2s,border-color .2s; min-height:118px; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.pending{ background:linear-gradient(160deg, rgba(96,165,250,.07), var(--surface) 60%); border-color:rgba(96,165,250,.22); }
  .kpi-card.pending::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.variety{ background:linear-gradient(160deg, rgba(74,222,128,.07), var(--surface) 60%); border-color:rgba(74,222,128,.22); }
  .kpi-card.variety::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.waiting{ background:linear-gradient(160deg, rgba(251,191,36,.07), var(--surface) 60%); border-color:rgba(251,191,36,.22); }
  .kpi-card.waiting::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-accent{ position:absolute; bottom:-10px; right:-10px; font-size:46px; opacity:.16; line-height:1; pointer-events:none; }
  .kpi-label{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; font-weight:500; }
  .kpi-card.pending .kpi-label{ color:var(--blue); }
  .kpi-card.variety .kpi-label{ color:var(--green); }
  .kpi-card.waiting .kpi-label{ color:var(--amber); }
  .kpi-value{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1; margin-bottom:6px; }
  @media (max-width:420px){ .kpi-value{ font-size:21px; } }
  .kpi-trend{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:600; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-family:'Outfit',sans-serif; font-size:12.5px; cursor:pointer; outline:none; }
  .filter-select:focus{ border-color:var(--gold-border); }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-family:'Outfit',sans-serif; font-size:11.5px; cursor:pointer; padding:8px 6px; }
  .btn-ghost:hover{ color:var(--gold); }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:600; color:var(--text); }
  .tbl-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:600; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.center{ text-align:center; }
  tbody tr{ border-bottom:1px solid var(--border); }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  tbody td.center{ text-align:center; }
  .empty-row td{ text-align:center; padding:32px; color:var(--text3); white-space:normal; }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .chip-pending{ background:var(--amber-bg); color:var(--amber); } .chip-pending::before{ background:var(--amber); }
  .chip-partial{ background:var(--amber-bg); color:var(--amber); } .chip-partial::before{ background:var(--amber); }
  .chip-full{ background:var(--green-bg); color:var(--green); } .chip-full::before{ background:var(--green); }
  .chip-completed{ background:rgba(167,139,250,0.15); color:#a78bfa; } .chip-completed::before{ background:#a78bfa; }
  .chip-rejected{ background:var(--red-bg); color:var(--red); } .chip-rejected::before{ background:var(--red); }
  .chip-urgent{ background:var(--red-bg); color:var(--red); } .chip-urgent::before{ background:var(--red); }
  .chip-normal{ background:var(--blue-bg); color:var(--blue); } .chip-normal::before{ background:var(--blue); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }
  .act-btn{ background:none; border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:11px; font-weight:500; color:var(--text2); cursor:pointer; transition:all .15s; font-family:'Outfit',sans-serif; white-space:nowrap; }
  .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
  .modal-overlay.show{ display:flex; }
  .modal-wide{ width:min(1180px, 96vw); margin:auto; }
  .modal-close-row{ display:flex; justify-content:flex-end; margin-bottom:8px; }
  .modal-close-btn{ background:var(--surface); border:1px solid var(--border); color:var(--text2); border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:15px; }
  .modal-close-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  #approvalContainer{ background:transparent; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  @media print{
    #pbs-sidebar, #pbs-topbar, .toolbar, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
    .tbl-wrap{ overflow:visible !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar is rendered here by poolbar-shell.js — unchanged -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar is rendered here by poolbar-shell.js — unchanged -->
    <div id="topbarSlot"></div>

    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <div class="toolbar no-print">
        <div class="toolbar-row">
          <div class="toolbar-left">
            <div class="flt-group" style="flex:1;min-width:180px;max-width:260px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <span style="color:var(--text3);font-size:12px;">🔍</span>
                <input type="text" id="fSearch" placeholder="Req No., item…" oninput="render()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Status</span>
              <select class="filter-select" id="fStatus" onchange="render()">
                <option value="">Still Open (Pending/Partial/Full)</option>
                <option value="Pending">Pending</option>
                <option value="Partial">Partial</option>
                <option value="Full">Full — Awaiting Receipt Confirmation</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Priority</span>
              <select class="filter-select" id="fPriority" onchange="render()">
                <option value="">All</option><option>Urgent</option><option>Normal</option>
              </select>
            </div>
            <button class="btn-ghost" onclick="clearFilters()">✕ Clear Filters</button>
          </div>
          <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Requisitions Raised by Pool Bar to Store</div>
          <span style="font-size:11px;color:var(--text3);" id="tblCount">—</span>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Req. No.</th>
                <th>Requested By</th>
                <th class="center">Items</th>
                <th>Needed By</th>
                <th class="center">Priority</th>
                <th class="center">Status</th>
                <th class="no-print center">Actions</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- APPROVAL / DETAIL MODAL — hosts the shared GraceHotelStoreApproval widget -->
<div class="modal-overlay" id="approvalModal">
  <div class="modal-wide">
    <div class="modal-close-row">
      <button class="modal-close-btn" onclick="closeApprovalModal()">✕</button>
    </div>
    <div id="approvalContainer"></div>
  </div>
</div>

<script src="../component/poolbar-shell.js"></script>
<script src="../component/grace-store-approval.js"></script>
<script>
/* ═══════════════════════════════════════════
   Shell — sidebar + topbar, unchanged from before.
═══════════════════════════════════════════ */
const shell = PoolBarShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'poolbar-pending-requisitions.html',
  pageTitle:     'Pending Requisitions',
  pageSubtitle:  'Requisitions to Store — review, approve/issue, and confirm receipt',
  apiMode:       'Demo',
  user:          { name: 'Pool Bar Manager', initials: 'PB' },
});

/* ═══════════════════════════════════════════
   STORAGE — same adapter shape the Grace components expect.
   This page and grace-store-approval.js/grace-request-form.js
   all read/write the shared req:<NO> / req-index keys, so any
   page using GraceHotelRequestForm to raise a Bar requisition
   shows up here automatically.
═══════════════════════════════════════════ */
const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared}; }
};

const KEY_STOCK     = 'poolbar-stock';
const KEY_MOVEMENTS = 'poolbar-movements';
const DEPT_FILTER   = 'Bar'; // this page only shows requisitions raised by/for Pool Bar

async function loadShared(key, fallback){
  try {
    const r = await storage.get(key, true);
    if (r && r.value) { const parsed = JSON.parse(r.value); if (Array.isArray(parsed)) return parsed; }
  } catch(e){}
  return fallback;
}
async function saveShared(key, value){
  try { await storage.set(key, JSON.stringify(value), true); } catch(e){ console.warn('[sync]', key, e); }
}

const DEMO_STOCK = [
  { name:'Heineken', category:'Beers', unit:'Bottles', qty:48, min:12, batch:'REQ-00031', received:'17/07/26', price:1500 },
  { name:'Guinness',  category:'Beers', unit:'Bottles', qty:36, min:12, batch:'REQ-00031', received:'17/07/26', price:1600 },
];

/* Demo requisitions in the Grace shared shape — seeded only if
   req-index is empty, so real requests raised elsewhere always win. */
const DEMO_REQS = [
  {
    no:'BREQ-2025-00012', mode:'store_issue', by:'Chidi (Bar Steward)', dept:'Bar', needed:'2025-07-22', priority:'Urgent',
    remark:'Weekend VIP bookings — running low on premium spirits.',
    fulfillStore:'Central Store', supplier:null, linked:null, status:'Pending',
    dateRaised:'2025-07-19', dateRaisedDisplay:'19 Jul 2025 09:10',
    items:[
      { name:'Moët & Chandon', unit:'Bottles', qty:6, cost:45000, remark:'', issuedQty:0 },
      { name:'Hennessy VS', unit:'Bottles', qty:4, cost:38000, remark:'', issuedQty:0 },
    ],
  },
  {
    no:'BREQ-2025-00011', mode:'store_issue', by:'Ngozi (Bar Supervisor)', dept:'Bar', needed:'2025-07-20', priority:'Normal',
    remark:'Restock soft drinks and beer.',
    fulfillStore:'Central Store', supplier:null, linked:null, status:'Partial',
    dateRaised:'2025-07-18', dateRaisedDisplay:'18 Jul 2025 14:20',
    items:[
      { name:'Heineken', unit:'Bottles', qty:48, cost:1200, remark:'', issuedQty:48 },
      { name:'Bottled Water 1.5L', unit:'Cartons', qty:10, cost:2500, remark:'Only 6 cartons in store', issuedQty:6 },
    ],
  },
];

async function seedDemoIfEmpty(){
  let idx = [];
  try { const r = await storage.get('req-index', true); idx = r ? JSON.parse(r.value) : []; } catch(e){}
  if (idx.length > 0) return;
  for (const req of DEMO_REQS) {
    await storage.set(`req:${req.no}`, JSON.stringify(req), true);
    idx.push(req.no);
  }
  await storage.set('req-index', JSON.stringify(idx), true);
}

/* ═══════════════════════════════════════════
   LIST — pulls every requisition from the shared store, filtered
   to this department, and renders the summary table + KPIs.
═══════════════════════════════════════════ */
let allReqs = [];

async function loadAllReqs(){
  let idx = [];
  try { const r = await storage.get('req-index', true); idx = r ? JSON.parse(r.value) : []; } catch(e){}
  const rows = [];
  for (const no of idx) {
    try { const r = await storage.get(`req:${no}`, true); if (r) rows.push(JSON.parse(r.value)); } catch(e){}
  }
  allReqs = rows.filter(r => r.dept === DEPT_FILTER);
}

function fmtDate(d){ if (!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

function renderKPIs(rows){
  const stillOpen = rows.filter(r => r.status==='Pending' || r.status==='Partial' || r.status==='Full');
  const urgent = stillOpen.filter(r => r.priority==='Urgent').length;
  const itemsInvolved = new Set(stillOpen.flatMap(r => r.items.map(i=>i.name))).size;
  const awaitingReceipt = stillOpen.filter(r => r.status==='Full').length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card pending">
      <div class="kpi-accent" style="color:var(--blue)">🚚</div>
      <div class="kpi-label">Open Requisitions</div>
      <div class="kpi-value" style="color:var(--blue);">${stillOpen.length}</div>
      <div class="kpi-trend ${stillOpen.length>0?'warn':'up'}">${stillOpen.length>0?'Awaiting action':'All clear'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">⚠️</div>
      <div class="kpi-label">Urgent</div>
      <div class="kpi-value" style="color:var(--red);">${urgent}</div>
      <div class="kpi-trend ${urgent>0?'warn':'up'}">${urgent>0?'Needs priority review':'None urgent'}</div>
    </div>
    <div class="kpi-card variety">
      <div class="kpi-accent" style="color:var(--green)">🍹</div>
      <div class="kpi-label">Items Involved</div>
      <div class="kpi-value" style="color:var(--green);">${itemsInvolved}</div>
      <div class="kpi-trend up">Distinct items across open reqs</div>
    </div>
    <div class="kpi-card waiting">
      <div class="kpi-accent" style="color:var(--amber)">📥</div>
      <div class="kpi-label">Awaiting Receipt Confirmation</div>
      <div class="kpi-value" style="color:var(--amber);">${awaitingReceipt}</div>
      <div class="kpi-trend ${awaitingReceipt>0?'warn':'up'}">${awaitingReceipt>0?'Store has issued — confirm receipt':'Nothing to confirm'}</div>
    </div>`;
}

function clearFilters(){
  document.getElementById('fSearch').value = '';
  document.getElementById('fStatus').value = '';
  document.getElementById('fPriority').value = '';
  render();
}

function getFiltered(){
  const q = document.getElementById('fSearch').value.toLowerCase();
  const status = document.getElementById('fStatus').value;
  const priority = document.getElementById('fPriority').value;
  return allReqs.filter(r => {
    const mq = !q || r.no.toLowerCase().includes(q) || r.items.some(i=>i.name.toLowerCase().includes(q));
    const mStatus = status ? r.status === status : (r.status==='Pending'||r.status==='Partial'||r.status==='Full');
    const mPrio = !priority || r.priority === priority;
    return mq && mStatus && mPrio;
  }).sort((a,b) => b.dateRaised.localeCompare(a.dateRaised));
}

function render(){
  const rows = getFiltered();
  renderKPIs(allReqs);
  document.getElementById('tblCount').textContent = rows.length + ' requisition' + (rows.length!==1?'s':'');
  document.getElementById('tblBody').innerHTML = rows.length === 0
    ? `<tr class="empty-row"><td colspan="7">No requisitions match your filters.</td></tr>`
    : rows.map(r => `
      <tr>
        <td style="font-weight:600;">${r.no}</td>
        <td>${r.by}</td>
        <td class="center">${r.items.length}</td>
        <td>${fmtDate(r.needed)}</td>
        <td class="center"><span class="chip chip-${r.priority.toLowerCase()}">${r.priority}</span></td>
        <td class="center"><span class="chip chip-${r.status.toLowerCase()}">${r.status==='Full'?'Full — Confirm Receipt':r.status}</span></td>
        <td class="no-print center"><button class="act-btn" onclick="openApproval('${r.no}')">👁 Open</button></td>
      </tr>`).join('');

  shell.setPendingBadge(allReqs.filter(r=>r.status==='Pending'||r.status==='Partial'||r.status==='Full').length);
}

/* ═══════════════════════════════════════════
   APPROVAL MODAL — embeds GraceHotelStoreApproval, wires
   "Confirm Receipt" (the library renders the button but leaves it
   unbound), which is the moment stock actually lands in Pool Bar.
═══════════════════════════════════════════ */
let approvalWidget = null;

function stockForFn(name){
  const item = stock.find(i => i.name.toLowerCase() === (name||'').trim().toLowerCase());
  return item ? item.qty + 9999 : 9999; // Store-side availability isn't modeled here; assume ample stock
}

let stock = [];
let movements = [];

function openApproval(no){
  document.getElementById('approvalContainer').innerHTML = '';
  if (approvalWidget) approvalWidget.destroy();

  approvalWidget = GraceHotelStoreApproval.attach('#approvalContainer', {
    reqNo: no,
    storage: storage,
    showBackButton: false,
    preparedBy: 'Central Store Keeper',
    onApprove: () => { loadAllReqs().then(render); },
    onReject:  () => { loadAllReqs().then(render); },
  });

  document.getElementById('approvalModal').classList.add('show');
}
function closeApprovalModal(){
  document.getElementById('approvalModal').classList.remove('show');
}
document.getElementById('approvalModal').addEventListener('click', function(e){ if (e.target === this) closeApprovalModal(); });

/* Event delegation for the "Confirm Receipt (Recipient)" button —
   the library renders it (status Partial/Full) but has no handler
   for it, since confirming receipt is the requesting department's
   job, not Store's. We own that logic here. */
document.getElementById('approvalContainer').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-act="confirm"]');
  if (!btn || btn.disabled) return;
  if (!approvalWidget) return;
  const req = approvalWidget.getReq();
  if (!req || (req.status !== 'Partial' && req.status !== 'Full')) return;

  const stamp = new Date().toLocaleString('en-GB', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }).replace(',', '');

  req.items.forEach(item => {
    const issued = parseFloat(item.issuedQty) || 0;
    if (issued <= 0) return;
    const existing = stock.find(s => s.name.toLowerCase() === item.name.toLowerCase());
    if (existing) { existing.qty += issued; existing.received = stamp.split(' ')[0]; }
    else stock.push({ name:item.name, category:'General', unit:item.unit, qty:issued, min:6, batch:req.no, received:stamp.split(' ')[0], price:0 });
    movements.unshift({ date:stamp, item:item.name, qtyIn:issued, qtyOut:0, balance:(existing?existing.qty:issued), reason:`Requisition Receipt (${req.no})` });
  });

  req.status = 'Completed';
  await storage.set(`req:${req.no}`, JSON.stringify(req), true);
  await Promise.all([ saveShared(KEY_STOCK, stock), saveShared(KEY_MOVEMENTS, movements) ]);

  closeApprovalModal();
  await loadAllReqs();
  render();
});

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
async function init(){
  stock = await loadShared(KEY_STOCK, DEMO_STOCK);
  movements = await loadShared(KEY_MOVEMENTS, []);
  await seedDemoIfEmpty();
  await loadAllReqs();
  render();
}
init();
</script>
