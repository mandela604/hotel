<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Requisition History | Aurum Pool Bar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  /* ── Core palette defined HERE, in this page's own stylesheet, instead of
     relying on poolbar-shell.js to inject it after first paint. That gap
     between "page painted with undefined vars" and "shell.js ran" was the
     white-flash bug — this makes the very first frame already correct. ── */
  :root{
    --gold:#c9a84c; --gold-light:#e8c96a; --gold-dim:rgba(201,168,76,0.12); --gold-border:rgba(201,168,76,0.25);
    --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
    --red:#f87171; --red-bg:rgba(248,113,113,0.12);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
  }
  [data-theme="dark"]{
    --bg:#080f18; --surface:#111e2b; --surface2:#162435; --surface3:#1c2e40;
    --border:#1e3045; --border2:#243850; --text:#e8f0f8; --text2:#a8bece; --text3:#6a8a9e;
    --sidebar-bg:#0a1520; --shadow:0 8px 32px rgba(0,0,0,0.5); --shadow-lg:0 16px 48px rgba(0,0,0,0.6);
    --input-bg:#0d1a27; --modal-bg:#0a1520;
  }
  [data-theme="light"]{
    --bg:#eef2f7; --surface:#ffffff; --surface2:#f4f7fb; --surface3:#e8edf5;
    --border:#dce4ef; --border2:#ccd6e5; --text:#0f2237; --text2:#4a6580; --text3:#8aa0b8;
    --sidebar-bg:#ffffff; --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f0f4f9; --modal-bg:#f8fafc;
  }
  html, body{ height:100%; overflow:hidden; background:var(--bg); }
  body{ font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); font-size:14px; transition:background .3s,color .3s; }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{ flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0; }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; cursor:default; transition:transform .2s,box-shadow .2s,border-color .2s; min-height:118px; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.accepted{ background:linear-gradient(160deg, rgba(74,222,128,.07), var(--surface) 60%); border-color:rgba(74,222,128,.22); }
  .kpi-card.accepted::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.rejected{ background:linear-gradient(160deg, rgba(248,113,113,.07), var(--surface) 60%); border-color:rgba(248,113,113,.22); }
  .kpi-card.rejected::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-card.units{ background:linear-gradient(160deg, rgba(96,165,250,.07), var(--surface) 60%); border-color:rgba(96,165,250,.22); }
  .kpi-card.units::before{ background:linear-gradient(90deg,#60a5fa,transparent); }
  .kpi-accent{ position:absolute; bottom:-10px; right:-10px; font-size:46px; opacity:.16; line-height:1; pointer-events:none; }
  .kpi-label{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; font-weight:500; }
  .kpi-card.accepted .kpi-label{ color:var(--green); }
  .kpi-card.rejected .kpi-label{ color:var(--red); }
  .kpi-card.units .kpi-label{ color:#60a5fa; }
  .kpi-value{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1; margin-bottom:6px; }
  @media (max-width:420px){ .kpi-value{ font-size:21px; } }
  .kpi-trend{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:#60a5fa; }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; font-family:'Outfit',sans-serif; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:600; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .toolbar-row.top{ justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:600; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; transition:border-color .2s; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select, .filter-date{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-family:'Outfit',sans-serif; font-size:12.5px; cursor:pointer; outline:none; transition:border-color .2s; }
  .filter-select:focus, .filter-date:focus{ border-color:var(--gold-border); }
  .filter-date{ cursor:default; color-scheme:dark; }
  [data-theme="light"] .filter-date{ color-scheme:light; }
  .status-pills{ display:flex; gap:6px; }
  .status-pill{ display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text2); transition:all .15s; white-space:nowrap; }
  .status-pill:hover{ border-color:var(--gold-border); }
  .status-pill .pdot{ width:6px; height:6px; border-radius:50%; }
  .status-pill.on.all{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .status-pill.on.completed{ background:var(--green-bg); border-color:rgba(74,222,128,.4); color:var(--green); }
  .status-pill.on.rejected{ background:var(--red-bg); border-color:rgba(248,113,113,.4); color:var(--red); }
  .active-chips{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .active-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--gold-dim); border:1px solid var(--gold-border); color:var(--gold-light); font-size:11px; font-weight:500; padding:4px 8px 4px 10px; border-radius:20px; white-space:nowrap; }
  .active-chip button{ background:none; border:none; color:var(--gold-light); cursor:pointer; font-size:12px; line-height:1; padding:0; display:flex; }
  .active-chip button:hover{ color:#fff; }
  .toolbar-count{ font-size:11.5px; color:var(--text3); white-space:nowrap; }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-family:'Outfit',sans-serif; font-size:11.5px; cursor:pointer; padding:8px 6px; }
  .btn-ghost:hover{ color:var(--gold); }

  @media (max-width:700px){
    .toolbar-row.top{ flex-direction:column; align-items:stretch; }
    .toolbar-left{ flex-direction:column; align-items:stretch; }
    .flt-group{ width:100%; }
    .search-box{ max-width:100%; }
    .filter-select, .filter-date{ width:100%; }
    .status-pills{ flex-wrap:wrap; }
    .toolbar-row.top > .btn{ width:100%; justify-content:center; }
  }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:600; color:var(--text); }
  .tbl-wrap{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:840px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:600; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; }
  thead th[data-sortkey]:hover{ color:var(--gold); }
  thead th .sort-arrow{ font-size:9px; margin-left:3px; opacity:.6; }
  thead th.no-sort{ cursor:default; }
  /* Whole row is now a click target that opens the same detail view as
     "View" — so there's exactly one thing the row does, not two. */
  tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  .empty-row td{ text-align:center; padding:32px; color:var(--text3); white-space:normal; cursor:default; }
  .empty-row{ cursor:default; }
  .items-summary{ max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
  .items-summary .more{ color:var(--text3); }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .chip-completed{ background:var(--green-bg); color:var(--green); } .chip-completed::before{ background:var(--green); }
  .chip-rejected{ background:var(--red-bg); color:var(--red); } .chip-rejected::before{ background:var(--red); }
  .chip-urgent{ background:var(--red-bg); color:var(--red); } .chip-urgent::before{ background:var(--red); }
  .chip-normal{ background:var(--blue-bg); color:var(--blue); } .chip-normal::before{ background:var(--blue); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }
  .act-btn{ background:none; border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:11px; font-weight:500; color:var(--text2); cursor:pointer; transition:all .15s; font-family:'Outfit',sans-serif; white-space:nowrap; }
  .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
  .modal-overlay.show{ display:flex; }
  .modal-wide{ width:min(1180px, 96vw); margin:auto; }
  .modal-close-row{ display:flex; justify-content:flex-end; margin-bottom:8px; }
  .modal-close-btn{ background:var(--surface); border:1px solid var(--border); color:var(--text2); border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:15px; }
  .modal-close-btn:hover{ border-color:var(--gold-border); color:var(--gold); }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  @media print{
    #pbs-sidebar, #pbs-topbar, .toolbar, .pagination, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
    .tbl-wrap{ overflow:visible !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar is rendered here by poolbar-shell.js — unchanged -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar is rendered here by poolbar-shell.js — unchanged -->
    <div id="topbarSlot"></div>

    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <!-- ═══ FILTER BAR ═══ -->
      <div class="toolbar no-print">
        <div class="toolbar-row top">
          <div class="toolbar-left">
            <div class="flt-group">
              <span class="flt-label">Status</span>
              <div class="status-pills" id="statusPills">
                <div class="status-pill on all" data-status="">All</div>
                <div class="status-pill completed" data-status="Completed"><span class="pdot" style="background:var(--green)"></span>Completed</div>
                <div class="status-pill rejected" data-status="Rejected"><span class="pdot" style="background:var(--red)"></span>Rejected</div>
              </div>
            </div>
            <div class="flt-group" style="flex:1;min-width:180px;max-width:260px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <span style="color:var(--text3);font-size:12px;">🔍</span>
                <input type="text" id="fSearch" placeholder="Req No., item, requested by…" oninput="page=1;render()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Priority</span>
              <select class="filter-select" id="fPriority" onchange="page=1;render()">
                <option value="">All</option><option>Urgent</option><option>Normal</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Sort By</span>
              <select class="filter-select" id="fSort" onchange="page=1;render()">
                <option value="date_desc">Date Raised (Newest)</option>
                <option value="date_asc">Date Raised (Oldest)</option>
                <option value="items_desc">Items (High → Low)</option>
              </select>
            </div>
            <button class="btn-ghost" onclick="clearFilters()">✕ Clear Filters</button>
          </div>
          <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Requisition History — Pool Bar to Store</div>
          <span class="toolbar-count" id="tblCount">—</span>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th class="no-sort">Req. No.</th>
                <th class="no-sort">Requested By</th>
                <th class="no-sort">Items</th>
                <th data-sortkey="date">Date Raised <span class="sort-arrow" id="arrow-date"></span></th>
                <th class="no-sort">Needed By</th>
                <th class="no-sort">Priority</th>
                <th class="no-sort">Status</th>
                <th class="no-print no-sort">Actions</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="paginLabel">—</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- DETAIL MODAL — hosts the shared GraceHotelStoreApproval widget in
     read-only mode (Approve/Reject auto-disable for Completed/Rejected) -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-wide">
    <div class="modal-close-row">
      <button class="modal-close-btn" onclick="closeDetailModal()">✕</button>
    </div>
    <div id="detailContainer"></div>
  </div>
</div>

<script src="../component/poolbar-shell.js"></script>
<script src="../component/grace-store-approval.js"></script>
<script>
const shell = PoolBarShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'poolbar-requisition-history.html',
  pageTitle:     'Requisition History',
  pageSubtitle:  'Every completed or rejected requisition to Store',
  apiMode:       'Demo',
  user:          { name: 'Pool Bar Manager', initials: 'PB' },
});

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared}; }
};

/* Demo seed — only used the very first time, before anything syncs.
   Same shape/keys as poolbar-pending-requisitions.html so both pages
   read one shared list of Bar requisitions. */
const DEMO_HISTORY_REQS = [
  {
    no:'BREQ-2025-00009', mode:'store_issue', by:'Chidi (Bar Steward)', dept:'Bar', needed:'2025-07-15', priority:'Normal',
    remark:'Weekly beer restock.', fulfillStore:'Central Store', supplier:null, linked:null, status:'Full',
    dateRaised:'2025-07-13', dateRaisedDisplay:'13 Jul 2025 08:30',
    items:[ { name:'Star Lager', unit:'Bottles', qty:24, cost:1200, remark:'', issuedQty:24 } ],
  },
  {
    no:'BREQ-2025-00010', mode:'store_issue', by:'Ngozi (Bar Supervisor)', dept:'Bar', needed:'2025-07-16', priority:'Urgent',
    remark:'Ice cream for a private event.', fulfillStore:'Central Store', supplier:null, linked:null, status:'Rejected',
    dateRaised:'2025-07-14', dateRaisedDisplay:'14 Jul 2025 11:00', rejectReason:'Out of stock — none in Central Store until next delivery.',
    items:[ { name:'Ice Cream Tubs', unit:'Pieces', qty:10, cost:2500, remark:'', issuedQty:0 } ],
  },
];

async function seedDemoIfEmpty(){
  let idx = [];
  try { const r = await storage.get('req-index', true); idx = r ? JSON.parse(r.value) : []; } catch(e){}
  const existingNos = new Set(idx);
  let changed = false;
  for (const req of DEMO_HISTORY_REQS) {
    if (!existingNos.has(req.no)) {
      await storage.set(`req:${req.no}`, JSON.stringify(req), true);
      idx.push(req.no);
      changed = true;
    }
  }
  if (changed) await storage.set('req-index', JSON.stringify(idx), true);
}

/* ── Status vocabulary fix ──────────────────────────────────────────────
   The shared requisition store (fed by the Store module's approval flow)
   marks a fully-issued requisition with status 'Full', not 'Completed' —
   'Completed' never actually occurs on a real record, only on the two
   hardcoded demo rows above. That mismatch was why real requisitions
   never made it into this "history" list. isFinalCompleted() below is
   the single place that decides what counts as "Completed" for display,
   filtering, and the KPI cards, so it can't drift out of sync again. */
function isFinalCompleted(r){ return r.status === 'Full' || r.status === 'Completed'; }
function isFinalRejected(r){ return r.status === 'Rejected'; }
function displayStatus(r){
  if (isFinalCompleted(r)) return { label:'Completed', cls:'chip-completed' };
  if (isFinalRejected(r))  return { label:'Rejected',  cls:'chip-rejected'  };
  return { label:r.status||'—', cls:'' };
}

let allReqs = [];
let page = 1;
let statusFilter = '';
let sortKey = 'date', sortDir = 'desc';

async function loadAllReqs(){
  let idx = [];
  try { const r = await storage.get('req-index', true); idx = r ? JSON.parse(r.value) : []; } catch(e){}
  const rows = [];
  for (const no of idx) {
    try { const r = await storage.get(`req:${no}`, true); if (r) rows.push(JSON.parse(r.value)); } catch(e){}
  }
  // Dept match widened to catch both 'Bar' and 'Pool Bar' spellings so a
  // naming difference upstream can't silently drop rows from this list.
  allReqs = rows.filter(r => (r.dept||'').toLowerCase().includes('bar') && (isFinalCompleted(r) || isFinalRejected(r)));
}

function fmtDate(d){ if (!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function itemsSummary(r){
  const names = r.items.map(i => `${i.name} ×${i.qty}`);
  return names.length <= 2 ? names.join(', ') : `${names.slice(0,2).join(', ')} <span class="more">+${names.length-2} more</span>`;
}

function renderKPIs(rows){
  const completed = rows.filter(isFinalCompleted);
  const rejected = rows.filter(isFinalRejected);
  const totalUnits = completed.reduce((s,r)=>s+r.items.reduce((a,i)=>a+(parseFloat(i.issuedQty)||0),0),0);
  const total = rows.length;
  const acceptRate = total ? Math.round(completed.length/total*100) : 0;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card accepted">
      <div class="kpi-accent" style="color:var(--green)">✓</div>
      <div class="kpi-label">Completed Requisitions</div>
      <div class="kpi-value" style="color:var(--green);">${completed.length}</div>
      <div class="kpi-trend up">Added to Pool Bar Stock</div>
    </div>
    <div class="kpi-card rejected">
      <div class="kpi-accent" style="color:var(--red)">✕</div>
      <div class="kpi-label">Rejected Requisitions</div>
      <div class="kpi-value" style="color:var(--red);">${rejected.length}</div>
      <div class="kpi-trend ${rejected.length>0?'warn':'up'}">${rejected.length>0?'Sent back by Store':'None on record'}</div>
    </div>
    <div class="kpi-card units">
      <div class="kpi-accent" style="color:#60a5fa">📦</div>
      <div class="kpi-label">Total Units Received</div>
      <div class="kpi-value" style="color:#60a5fa;">${totalUnits}</div>
      <div class="kpi-trend info">Across ${completed.length} completed req${completed.length!==1?'s':''}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">📊</div>
      <div class="kpi-label">Acceptance Rate</div>
      <div class="kpi-value" style="color:var(--gold);">${acceptRate}%</div>
      <div class="kpi-trend ${acceptRate>=80?'up':acceptRate>=50?'warn':'down'}">${total} total record${total!==1?'s':''}</div>
    </div>`;
}

function bindStatusPills(){
  document.querySelectorAll('.status-pill').forEach(p => {
    p.addEventListener('click', () => {
      statusFilter = p.dataset.status;
      document.querySelectorAll('.status-pill').forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      page = 1;
      render();
    });
  });
}

function getFiltered(){
  const q = document.getElementById('fSearch').value.toLowerCase();
  const priority = document.getElementById('fPriority').value;
  const sortVal = document.getElementById('fSort').value;
  const [sk, sd] = sortVal.split('_');
  sortKey = sk; sortDir = sd;

  let rows = allReqs.filter(r => {
    const mq = !q || r.no.toLowerCase().includes(q) || r.by.toLowerCase().includes(q) || r.items.some(i=>i.name.toLowerCase().includes(q));
    const mStatus = !statusFilter
      || (statusFilter === 'Completed' && isFinalCompleted(r))
      || (statusFilter === 'Rejected' && isFinalRejected(r));
    const mPrio = !priority || r.priority === priority;
    return mq && mStatus && mPrio;
  });

  rows.sort((a,b) => {
    let cmp = 0;
    if (sortKey === 'date') cmp = a.dateRaised.localeCompare(b.dateRaised);
    else if (sortKey === 'items') cmp = a.items.length - b.items.length;
    return sortDir === 'desc' ? -cmp : cmp;
  });
  return rows;
}

function renderSortArrows(){
  const el = document.getElementById('arrow-date');
  if (el) el.textContent = sortKey==='date' ? (sortDir==='desc'?'▼':'▲') : '';
}

function clearFilters(){
  document.getElementById('fSearch').value = '';
  document.getElementById('fPriority').value = '';
  document.getElementById('fSort').value = 'date_desc';
  statusFilter = '';
  document.querySelectorAll('.status-pill').forEach(x => x.classList.remove('on'));
  document.querySelector('.status-pill.all').classList.add('on');
  page = 1;
  render();
}

const PAGE_SIZE = 8;
function renderPagination(total){
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  const from = total === 0 ? 0 : (page-1)*PAGE_SIZE + 1;
  const to = Math.min(page*PAGE_SIZE, total);
  document.getElementById('paginLabel').textContent = total === 0 ? 'No records' : `${from}–${to} of ${total}`;
  const wrap = document.getElementById('pageBtns');
  wrap.innerHTML = '';
  const mk = (label, p, disabled, active) => {
    const b = document.createElement('button'); b.className='page-btn'+(active?' active':''); b.textContent=label; b.disabled=!!disabled;
    b.onclick = () => { page = p; renderTable(); }; return b;
  };
  wrap.appendChild(mk('‹', page-1, page===1, false));
  let start = Math.max(1, page-2), end = Math.min(totalPages, start+4); start = Math.max(1, end-4);
  for (let i=start;i<=end;i++) wrap.appendChild(mk(String(i), i, false, i===page));
  wrap.appendChild(mk('›', page+1, page>=totalPages, false));
}

let _filteredCache = [];
function renderTable(){
  const rows = _filteredCache;
  document.getElementById('tblCount').textContent = rows.length + ' record' + (rows.length!==1?'s':'');
  const start = (page-1)*PAGE_SIZE;
  const pageRows = rows.slice(start, start+PAGE_SIZE);

  document.getElementById('tblBody').innerHTML = pageRows.length === 0
    ? `<tr class="empty-row"><td colspan="8">No requisition history matches your filters.</td></tr>`
    : pageRows.map(r => {
        const st = displayStatus(r);
        return `
      <tr onclick="openDetail('${r.no}')">
        <td style="font-weight:600;">${r.no}</td>
        <td>${r.by}</td>
        <td class="items-summary">${itemsSummary(r)}</td>
        <td>${r.dateRaisedDisplay || fmtDate(r.dateRaised)}</td>
        <td>${fmtDate(r.needed)}</td>
        <td><span class="chip chip-${r.priority.toLowerCase()}">${r.priority}</span></td>
        <td><span class="chip ${st.cls}">${st.label}</span></td>
        <td class="no-print" onclick="event.stopPropagation()"><button class="act-btn" onclick="openDetail('${r.no}')">👁 View</button></td>
      </tr>`;
      }).join('');

  renderPagination(rows.length);
}

function render(){
  _filteredCache = getFiltered();
  renderKPIs(allReqs);
  renderSortArrows();
  renderTable();
}

let detailWidget = null;
function openDetail(no){
  document.getElementById('detailContainer').innerHTML = '';
  if (detailWidget) detailWidget.destroy();
  detailWidget = GraceHotelStoreApproval.attach('#detailContainer', {
    reqNo: no,
    storage: storage,
    showBackButton: false,
    preparedBy: 'Central Store Keeper',
  });
  document.getElementById('detailModal').classList.add('show');
}
function closeDetailModal(){ document.getElementById('detailModal').classList.remove('show'); }
document.getElementById('detailModal').addEventListener('click', function(e){ if (e.target === this) closeDetailModal(); });

async function init(){
  await seedDemoIfEmpty();
  await loadAllReqs();
  bindStatusPills();
  render();
}
init();
</script>
</body>
