<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Requisition History | Grace Pool Bar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{ --radius:14px; --radius-sm:10px; --transition:.3s cubic-bezier(.4,0,.2,1); }
  html, body{ height:100%; overflow:hidden; }
  body{ font-family:'Outfit',sans-serif; font-size:14px; transition:background .3s,color .3s; }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  /* ═══ KPI CARDS — same icon-box system as poolbar-sales.html / poolbar-reports.html ═══ */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden;
    box-shadow:var(--shadow); cursor:default; transition:transform .2s,box-shadow .2s,border-color .2s; display:flex; flex-direction:column; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .ic-red{ background:var(--red-bg); color:var(--red); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1; margin:4px 0 6px; }
  @media (max-width:420px){ .kpi-value{ font-size:21px; } }
  .kpi-trend{ font-size:11px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; font-family:'Outfit',sans-serif; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:600; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .toolbar-row.top{ justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:600; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; transition:border-color .2s; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-family:'Outfit',sans-serif; font-size:12.5px; cursor:pointer; outline:none; transition:border-color .2s; }
  .filter-select:focus{ border-color:var(--gold-border); }
  .status-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-pill{ display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text2); transition:all .15s; white-space:nowrap; }
  .status-pill:hover{ border-color:var(--gold-border); }
  .status-pill .pdot{ width:6px; height:6px; border-radius:50%; }
  .status-pill.on.all{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .status-pill.on.completed{ background:var(--green-bg); border-color:rgba(18,183,106,.35); color:var(--green); }
  .status-pill.on.rejected{ background:var(--red-bg); border-color:rgba(240,68,56,.35); color:var(--red); }
  .status-pill.on.transfer{ background:var(--blue-bg); border-color:rgba(47,111,237,.35); color:var(--blue); }
  .toolbar-count{ font-size:11.5px; color:var(--text3); white-space:nowrap; }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-family:'Outfit',sans-serif; font-size:11.5px; font-weight:600; cursor:pointer; padding:8px 6px; display:inline-flex; align-items:center; gap:5px; }
  .btn-ghost:hover{ color:var(--gold); }

  @media (max-width:700px){
    .toolbar-row.top{ flex-direction:column; align-items:stretch; }
    .toolbar-left{ flex-direction:column; align-items:stretch; }
    .flt-group{ width:100%; }
    .search-box{ max-width:100%; }
    .filter-select{ width:100%; }
    .status-pills{ flex-wrap:wrap; }
    .toolbar-row.top > .btn{ width:100%; justify-content:center; }
  }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:700; color:var(--text); }
  .tbl-wrap{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:920px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:600; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; }
  thead th[data-sortkey]:hover{ color:var(--gold); }
  thead th .sort-arrow{ font-size:9px; margin-left:3px; opacity:.6; }
  thead th.no-sort{ cursor:default; }
  tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  .empty-row td{ text-align:center; padding:32px; color:var(--text3); white-space:normal; cursor:default; }
  .empty-row{ cursor:default; }
  .items-summary{ max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
  .items-summary .more{ color:var(--text3); }

  .chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip i{ font-size:6px; }
  .chip-completed{ background:var(--green-bg); color:var(--green); }
  .chip-rejected{ background:var(--red-bg); color:var(--red); }
  .chip-transfer{ background:var(--blue-bg); color:var(--blue); }
  .chip-urgent{ background:var(--red-bg); color:var(--red); }
  .chip-normal{ background:var(--blue-bg); color:var(--blue); }
  .chip-req{ background:var(--purple-bg); color:var(--purple); }
  .chip-store{ background:var(--amber-bg); color:var(--amber); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }
  .act-btn{ background:none; border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:11px; font-weight:500; color:var(--text2); cursor:pointer; transition:all .15s; font-family:'Outfit',sans-serif; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
  .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(15,34,55,0.45); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
  .modal-overlay.show{ display:flex; }
  .modal-wide{ width:min(1180px, 96vw); margin:auto; }
  .modal-close-row{ display:flex; justify-content:flex-end; margin-bottom:8px; }
  .modal-close-btn{ background:#fff; border:1px solid #eef0f6; color:#6b7280; border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .modal-close-btn:hover{ border-color:rgba(47,111,237,0.25); color:#2f6fed; }

  .xfer-detail{ background:#fff; border:1px solid #eef0f6; border-radius:14px; box-shadow:0 8px 40px rgba(15,34,55,0.10); overflow:hidden; }
  .xfer-head{ padding:18px 20px; border-bottom:1px solid #eef0f6; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .xfer-title{ font-size:15px; font-weight:700; color:#1c2440; }
  .xfer-meta{ font-size:12px; color:#9aa1b3; margin-top:4px; }
  .xfer-body{ padding:16px 20px; }
  .xfer-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:600px){ .xfer-grid{ grid-template-columns:1fr 1fr; } }
  .xfer-field label{ display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:#9aa1b3; font-weight:600; margin-bottom:3px; }
  .xfer-field div{ font-size:13px; color:#1c2440; font-weight:500; }
  .xfer-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .xfer-table th{ text-align:left; padding:8px 10px; font-size:9px; text-transform:uppercase; letter-spacing:1px; color:#9aa1b3; background:#f4f6fb; border-bottom:1px solid #eef0f6; }
  .xfer-table td{ padding:9px 10px; border-bottom:1px solid #eef0f6; color:#1c2440; }
  .xfer-table tr:last-child td{ border-bottom:none; }
  .xfer-note{ margin-top:12px; font-size:12.5px; color:#6b7280; background:#f4f6fb; border-radius:10px; padding:12px 14px; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#dfe3ec; border-radius:6px; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  @media print{
    #pbs-sidebar, #pbs-topbar, .toolbar, .pagination, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
    .tbl-wrap{ overflow:visible !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <div class="kpi-row" id="kpiRow"></div>
      <div class="toolbar no-print">
        <div class="toolbar-row top">
          <div class="toolbar-left">
            <div class="flt-group">
              <span class="flt-label">Status / Type</span>
              <div class="status-pills" id="statusPills">
                <div class="status-pill on all" data-status="">All</div>
                <div class="status-pill completed" data-status="Completed"><span class="pdot" style="background:var(--green)"></span>Completed</div>
                <div class="status-pill rejected" data-status="Rejected"><span class="pdot" style="background:var(--red)"></span>Rejected</div>
                <div class="status-pill transfer" data-status="Transfer"><span class="pdot" style="background:var(--blue)"></span>Store Transfer</div>
              </div>
            </div>
            <div class="flt-group" style="flex:1;min-width:180px;max-width:260px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px;"></i>
                <input type="text" id="fSearch" placeholder="No., item, by, from…" oninput="page=1;render()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Source</span>
              <select class="filter-select" id="fSource" onchange="page=1;render()">
                <option value="">All sources</option>
                <option value="requisition">Pool Bar Requisition</option>
                <option value="store_push">Store Transfer</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Priority</span>
              <select class="filter-select" id="fPriority" onchange="page=1;render()">
                <option value="">All</option><option>Urgent</option><option>Normal</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Sort By</span>
              <select class="filter-select" id="fSort" onchange="page=1;render()">
                <option value="date_desc">Date (Newest)</option>
                <option value="date_asc">Date (Oldest)</option>
                <option value="items_desc">Items (High → Low)</option>
              </select>
            </div>
            <button class="btn-ghost" onclick="clearFilters()"><i class="fa-solid fa-xmark"></i> Clear Filters</button>
          </div>
          <button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">History — Requisitions &amp; Store Transfers</div>
          <span class="toolbar-count" id="tblCount">—</span>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th class="no-sort">Ref. No.</th>
                <th class="no-sort">Source</th>
                <th class="no-sort">By / From</th>
                <th class="no-sort">Items</th>
                <th data-sortkey="date">Date <span class="sort-arrow" id="arrow-date"></span></th>
                <th class="no-sort">Needed By</th>
                <th class="no-sort">Priority</th>
                <th class="no-sort">Status</th>
                <th class="no-print no-sort">Actions</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="paginLabel">—</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal-wide">
    <div class="modal-close-row">
      <button class="modal-close-btn" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="detailContainer"></div>
  </div>
</div>

<script src="../component/poolbar-shell.js"></script>
<script src="../component/grace-store-approval.js"></script>
<script>
const shell = PoolBarShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'poolbar-requisition-history.html',
  pageTitle:     'Requisition History',
  pageSubtitle:  'Completed / rejected requisitions and Store transfers into Pool Bar',
  apiMode:       'Demo',
  user:          { name: 'Pool Bar Manager', initials: 'PB' },
});

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared}; }
};

const DEMO_HISTORY_REQS = [
  {
    no:'BREQ-2025-00009', mode:'store_issue', by:'Chidi (Bar Steward)', dept:'Bar', needed:'2025-07-15', priority:'Normal',
    remark:'Weekly beer restock.', fulfillStore:'Central Store', supplier:null, linked:null, status:'Full',
    dateRaised:'2025-07-13', dateRaisedDisplay:'13 Jul 2025 08:30',
    items:[ { name:'Star Lager', unit:'Bottles', qty:24, cost:1200, remark:'', issuedQty:24 } ],
  },
  {
    no:'BREQ-2025-00010', mode:'store_issue', by:'Ngozi (Bar Supervisor)', dept:'Bar', needed:'2025-07-16', priority:'Urgent',
    remark:'Ice cream for a private event.', fulfillStore:'Central Store', supplier:null, linked:null, status:'Rejected',
    dateRaised:'2025-07-14', dateRaisedDisplay:'14 Jul 2025 11:00', rejectReason:'Out of stock — none in Central Store until next delivery.',
    items:[ { name:'Ice Cream Tubs', unit:'Pieces', qty:10, cost:2500, remark:'', issuedQty:0 } ],
  },
];

const DEMO_STORE_TRANSFERS = [
  {
    no:'STX-00041', source:'store_push', from:'Central Store', sentBy:'Store Keeper',
    date:'2025-07-17', dateDisplay:'17 Jul 2025 09:15', status:'Received',
    remark:'Unsolicited restock — weekend rush prep.',
    items:[ { name:'Heineken', unit:'Bottles', qty:24 }, { name:'Bottled Water', unit:'Bottles', qty:48 } ],
  },
  {
    no:'STX-00038', source:'store_push', from:'Central Store', sentBy:'Store Keeper',
    date:'2025-07-12', dateDisplay:'12 Jul 2025 14:40', status:'Received',
    remark:'Surplus spirits moved to Pool Bar.',
    items:[ { name:'Hennessy VS', unit:'Bottles', qty:3 }, { name:'Jameson', unit:'Bottles', qty:2 } ],
  },
];

async function seedDemoIfEmpty(){
  let idx = [];
  try { const r = await storage.get('req-index', true); idx = r ? JSON.parse(r.value) : []; } catch(e){}
  const existingNos = new Set(idx);
  let changed = false;
  for (const req of DEMO_HISTORY_REQS) {
    if (!existingNos.has(req.no)) {
      await storage.set(`req:${req.no}`, JSON.stringify(req), true);
      idx.push(req.no); changed = true;
    }
  }
  if (changed) await storage.set('req-index', JSON.stringify(idx), true);
  try {
    const r = await storage.get('poolbar-store-transfers', true);
    if (!r || !r.value) await storage.set('poolbar-store-transfers', JSON.stringify(DEMO_STORE_TRANSFERS), true);
  } catch(e){}
}

function isFinalCompleted(r){ return r.status === 'Full' || r.status === 'Completed' || r.status === 'Received'; }
function isFinalRejected(r){ return r.status === 'Rejected'; }
function isStorePush(r){ return r.source === 'store_push' || r.kind === 'store_push'; }
function displayStatus(r){
  if (isStorePush(r)) return { label:'Store Transfer', cls:'chip-transfer' };
  if (isFinalCompleted(r)) return { label:'Completed', cls:'chip-completed' };
  if (isFinalRejected(r))  return { label:'Rejected',  cls:'chip-rejected'  };
  return { label:r.status||'—', cls:'' };
}
function displaySource(r){
  if (isStorePush(r)) return { label:'Store Transfer', cls:'chip-store' };
  return { label:'Requisition', cls:'chip-req' };
}

let allRows = [], page = 1, statusFilter = '', sortKey = 'date', sortDir = 'desc';

async function loadAll(){
  let idx = [];
  try { const r = await storage.get('req-index', true); idx = r ? JSON.parse(r.value) : []; } catch(e){}
  const reqs = [];
  for (const no of idx) {
    try {
      const r = await storage.get(`req:${no}`, true);
      if (r) {
        const row = JSON.parse(r.value);
        if ((row.dept||'').toLowerCase().includes('bar') && (isFinalCompleted(row) || isFinalRejected(row))) {
          row._kind = 'requisition'; reqs.push(row);
        }
      }
    } catch(e){}
  }
  let transfers = [];
  try {
    const r = await storage.get('poolbar-store-transfers', true);
    if (r && r.value) {
      const parsed = JSON.parse(r.value);
      if (Array.isArray(parsed)) {
        transfers = parsed.map(t => Object.assign({}, t, {
          _kind:'store_push', source:'store_push', by:t.sentBy||t.from||'Store',
          dateRaised:t.date, dateRaisedDisplay:t.dateDisplay||t.date, needed:t.date, priority:t.priority||'Normal',
        }));
      }
    }
  } catch(e){}
  allRows = reqs.concat(transfers);
}

function fmtDate(d){ if (!d) return '—'; const dt = new Date(d); if (isNaN(dt.getTime())) return d; return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function itemsSummary(r){ const names = (r.items||[]).map(i => `${i.name} ×${i.qty}`); return names.length <= 2 ? names.join(', ') : `${names.slice(0,2).join(', ')} <span class="more">+${names.length-2} more</span>`; }

/* ═══════════════════════════════════════════
   KPI CARDS — same markup/CSS pattern as poolbar-sales.html and
   poolbar-reports.html: kpi-top (colored fa-icon box + label),
   kpi-value, kpi-trend, plus the top accent border (acc-green /
   acc-blue / acc-red / acc-purple).
═══════════════════════════════════════════ */
function renderKPIs(rows){
  const completed = rows.filter(r => !isStorePush(r) && isFinalCompleted(r));
  const rejected = rows.filter(r => isFinalRejected(r));
  const transfers = rows.filter(isStorePush);
  const totalUnits = completed.concat(transfers).reduce((s,r)=>s+(r.items||[]).reduce((a,i)=>a+(parseFloat(i.issuedQty!=null?i.issuedQty:i.qty)||0),0),0);

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card acc-green">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-clipboard-check"></i></div><div class="kpi-label">Completed Requisitions</div></div>
      <div class="kpi-value" style="color:var(--green);">${completed.length}</div>
      <div class="kpi-trend up">Pool Bar requested · Store issued</div>
    </div>
    <div class="kpi-card acc-blue">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-truck"></i></div><div class="kpi-label">Store Transfers</div></div>
      <div class="kpi-value" style="color:var(--blue);">${transfers.length}</div>
      <div class="kpi-trend info">Store sent without requisition</div>
    </div>
    <div class="kpi-card acc-red">
      <div class="kpi-top"><div class="kpi-ic ic-red"><i class="fa-solid fa-ban"></i></div><div class="kpi-label">Rejected Requisitions</div></div>
      <div class="kpi-value" style="color:var(--red);">${rejected.length}</div>
      <div class="kpi-trend ${rejected.length>0?'warn':'up'}">${rejected.length>0?'Sent back by Store':'None on record'}</div>
    </div>
    <div class="kpi-card acc-purple">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-box"></i></div><div class="kpi-label">Units Received</div></div>
      <div class="kpi-value" style="color:var(--gold);">${totalUnits}</div>
      <div class="kpi-trend neutral">From completed + transfers</div>
    </div>`;
}

function bindStatusPills(){
  document.querySelectorAll('.status-pill').forEach(p => {
    p.addEventListener('click', () => {
      statusFilter = p.dataset.status;
      document.querySelectorAll('.status-pill').forEach(x => x.classList.remove('on'));
      p.classList.add('on'); page = 1; render();
    });
  });
}

function getFiltered(){
  const q = document.getElementById('fSearch').value.toLowerCase();
  const priority = document.getElementById('fPriority').value;
  const source = document.getElementById('fSource').value;
  const [sk, sd] = document.getElementById('fSort').value.split('_');
  sortKey = sk; sortDir = sd;
  let rows = allRows.filter(r => {
    const by = (r.by || r.sentBy || r.from || '').toLowerCase();
    const mq = !q || (r.no||'').toLowerCase().includes(q) || by.includes(q) || (r.items||[]).some(i=>(i.name||'').toLowerCase().includes(q));
    const mStatus = !statusFilter || (statusFilter==='Completed' && !isStorePush(r) && isFinalCompleted(r)) || (statusFilter==='Rejected' && isFinalRejected(r)) || (statusFilter==='Transfer' && isStorePush(r));
    const mPrio = !priority || (r.priority||'Normal') === priority;
    const mSrc = !source || (source==='requisition' && !isStorePush(r)) || (source==='store_push' && isStorePush(r));
    return mq && mStatus && mPrio && mSrc;
  });
  rows.sort((a,b) => {
    let cmp = 0;
    const da = a.dateRaised || a.date || '', db = b.dateRaised || b.date || '';
    if (sortKey==='date') cmp = String(da).localeCompare(String(db));
    else if (sortKey==='items') cmp = (a.items||[]).length - (b.items||[]).length;
    return sortDir==='desc' ? -cmp : cmp;
  });
  return rows;
}

function renderSortArrows(){ const el = document.getElementById('arrow-date'); if (el) el.textContent = sortKey==='date' ? (sortDir==='desc'?'▼':'▲') : ''; }
function clearFilters(){
  document.getElementById('fSearch').value = ''; document.getElementById('fPriority').value = '';
  document.getElementById('fSource').value = ''; document.getElementById('fSort').value = 'date_desc';
  statusFilter = ''; document.querySelectorAll('.status-pill').forEach(x => x.classList.remove('on'));
  document.querySelector('.status-pill.all').classList.add('on'); page = 1; render();
}

const PAGE_SIZE = 8;
function renderPagination(total){
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  const from = total===0?0:(page-1)*PAGE_SIZE+1, to = Math.min(page*PAGE_SIZE, total);
  document.getElementById('paginLabel').textContent = total===0?'No records':`${from}–${to} of ${total}`;
  const wrap = document.getElementById('pageBtns'); wrap.innerHTML = '';
  const mk = (label,p,disabled,active)=>{ const b=document.createElement('button'); b.className='page-btn'+(active?' active':''); b.innerHTML=label; b.disabled=!!disabled; b.onclick=()=>{page=p;renderTable();}; return b; };
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-left"></i>',page-1,page===1,false));
  let start=Math.max(1,page-2), end=Math.min(totalPages,start+4); start=Math.max(1,end-4);
  for (let i=start;i<=end;i++) wrap.appendChild(mk(String(i),i,false,i===page));
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-right"></i>',page+1,page>=totalPages,false));
}

let _filteredCache = [];
function renderTable(){
  const rows = _filteredCache;
  document.getElementById('tblCount').textContent = rows.length + ' record' + (rows.length!==1?'s':'');
  const pageRows = rows.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  document.getElementById('tblBody').innerHTML = pageRows.length===0
    ? `<tr class="empty-row"><td colspan="9">No history matches your filters.</td></tr>`
    : pageRows.map(r => {
        const st = displayStatus(r), src = displaySource(r);
        const byLine = isStorePush(r) ? `${r.sentBy||'Store'} · ${r.from||'Central Store'}` : (r.by||'—');
        return `<tr onclick="openDetail('${r.no}')">
          <td style="font-weight:600;">${r.no}</td>
          <td><span class="chip ${src.cls}"><i class="fa-solid fa-circle"></i>${src.label}</span></td>
          <td>${byLine}</td>
          <td class="items-summary">${itemsSummary(r)}</td>
          <td>${r.dateRaisedDisplay||fmtDate(r.dateRaised||r.date)}</td>
          <td>${isStorePush(r)?'—':fmtDate(r.needed)}</td>
          <td><span class="chip chip-${(r.priority||'Normal').toLowerCase()}"><i class="fa-solid fa-circle"></i>${r.priority||'Normal'}</span></td>
          <td><span class="chip ${st.cls}"><i class="fa-solid fa-circle"></i>${st.label}</span></td>
          <td class="no-print" onclick="event.stopPropagation()"><button class="act-btn" onclick="openDetail('${r.no}')"><i class="fa-solid fa-eye"></i> View</button></td>
        </tr>`;
      }).join('');
  renderPagination(rows.length);
}

function render(){ _filteredCache = getFiltered(); renderKPIs(allRows); renderSortArrows(); renderTable(); }

let detailWidget = null;
function openDetail(no){
  const row = allRows.find(r => r.no === no);
  const container = document.getElementById('detailContainer');
  container.innerHTML = '';
  if (detailWidget) { try { detailWidget.destroy(); } catch(e){} detailWidget = null; }
  if (row && isStorePush(row)) {
    container.innerHTML = `<div class="xfer-detail">
      <div class="xfer-head"><div><div class="xfer-title">${row.no} — Store Transfer</div><div class="xfer-meta">Sent by Store without a Pool Bar requisition</div></div><span class="chip chip-transfer"><i class="fa-solid fa-circle"></i>Store Transfer</span></div>
      <div class="xfer-body">
        <div class="xfer-grid">
          <div class="xfer-field"><label>From</label><div>${row.from||'Central Store'}</div></div>
          <div class="xfer-field"><label>Sent By</label><div>${row.sentBy||'—'}</div></div>
          <div class="xfer-field"><label>Date</label><div>${row.dateDisplay||fmtDate(row.date)}</div></div>
        </div>
        <table class="xfer-table"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th></tr></thead>
        <tbody>${(row.items||[]).map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.unit||''}</td></tr>`).join('')}</tbody></table>
        ${row.remark?`<div class="xfer-note">${row.remark}</div>`:''}
      </div></div>`;
  } else {
    detailWidget = GraceHotelStoreApproval.attach('#detailContainer', { reqNo:no, storage, showBackButton:false, preparedBy:'Central Store Keeper' });
  }
  document.getElementById('detailModal').classList.add('show');
}
function closeDetailModal(){ document.getElementById('detailModal').classList.remove('show'); }
document.getElementById('detailModal').addEventListener('click', function(e){ if (e.target===this) closeDetailModal(); });

async function init(){ await seedDemoIfEmpty(); await loadAll(); bindStatusPills(); render(); }
init();
</script>
