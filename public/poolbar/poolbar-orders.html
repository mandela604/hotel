<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Orders | Aurum Pool Bar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; overflow-x:hidden; }
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
}
.app{ display:flex; min-height:100vh; }
.main{ margin-left:250px; flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
@media (max-width:768px){ .main{ margin-left:0 !important; } }

.content{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
  --border:#eef0f6; --border2:#dfe3ec;
  --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
  --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
  --red:#f04438; --red-bg:#feecec;
  flex:1; padding:24px; min-width:0; overflow-x:hidden; background:var(--bg); color:var(--text);
}
@media (max-width:480px){ .content{ padding:14px; } }

.pb-fatal-banner{
  display:none; align-items:flex-start; gap:10px; background:var(--red-bg); border:1px solid rgba(240,68,56,.3);
  border-left:3px solid var(--red); border-radius:12px; padding:14px 16px; margin-bottom:16px; color:var(--text);
  font-size:13px; line-height:1.5;
}
.pb-fatal-banner.show{ display:flex; }
.pb-fatal-banner i{ color:var(--red); margin-top:2px; }
.pb-fatal-banner b{ color:var(--red); }

.pb-guest-warn{
  display:none; align-items:center; gap:8px; background:#fff4e5; border:1px solid rgba(247,144,9,.3);
  border-left:3px solid #f79009; border-radius:10px; padding:10px 14px; margin-bottom:14px; color:var(--text);
  font-size:12.5px; font-weight:600;
}
.pb-guest-warn.show{ display:flex; }
.pb-guest-warn i{ color:#f79009; }
</style>
</head>
<body>

<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <div class="pb-fatal-banner" id="fatalBanner">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div><b>Orders workspace could not load.</b><div id="fatalMsg"></div></div>
      </div>
      <div class="pb-guest-warn" id="guestWarn">
        <i class="fa-solid fa-circle-info"></i>
        <span id="guestWarnMsg">Room Charge guest lookup is unavailable right now — Room Charge sales can't be linked to a folio until this is resolved.</span>
      </div>
      <div id="ordersSlot"></div>
    </div>
  </div>
</div>

<!-- Load order: BookingData is preloaded here with plain script tags, so
     services/poolbar-service.js's ensureBookingData() finds
     window.BookingData already present and never needs to dynamically
     guess a relative path to it — PoolBarSeed.BOOKING_MODULE_PATHS
     becomes an unused fallback for pages that DON'T preload it, not a
     requirement for this one. Then this module's own data/poolbar-seed.js
     and services/poolbar-service.js (local subfolders), then the shared
     shell + orders-workspace components. -->

<script src="../services/permissions.js"></script>
<script src="../booking/data/booking-demo-seed.js"></script>
<script src="../booking/services/booking-service.js"></script>
<script src="data/poolbar-seed.js"></script>
<script src="services/poolbar-service.js"></script>
<script src="../component/poolbar-shell.js"></script>
<script src="../component/orders-workspace.js"></script>

<script>
'use strict';

function showFatal(message) {
  document.getElementById('fatalMsg').textContent = message;
  document.getElementById('fatalBanner').classList.add('show');
}
function showGuestWarn(message) {
  if (message) document.getElementById('guestWarnMsg').textContent = message;
  document.getElementById('guestWarn').classList.add('show');
}

async function init() {
  // PoolBarService owns all persistence — this page never touches
  // localStorage or BookingData directly.
  try {
    await PoolBarService.loadAll();
  } catch (err) {
    showFatal(err && err.message ? err.message : 'Failed to load Pool Bar data.');
    return;
  }

  // In-house guests come only from PoolBarService.getInHouseGuests().
  // It throws rather than falling back to fake data — Room Charge just
  // becomes unavailable if it fails, the rest of the page still works.
  let guests = [];
  try {
    guests = await PoolBarService.getInHouseGuests();
  } catch (err) {
    guests = [];
    showGuestWarn(err && err.message ? 'Room Charge guest lookup unavailable: ' + err.message : undefined);
  }

  // OrdersWorkspace requires a working service and throws synchronously
  // if one isn't provided — no demo/localStorage fallback inside it.
  // Payment methods are no longer passed here — OrdersWorkspace reads
  // them straight from PoolBarService (which reads them from
  // data/poolbar-seed.js), so changing the list only ever means editing
  // that one seed file.
  try {
    OrdersWorkspace.attach('#ordersSlot', {
      module: 'poolbar',
      service: PoolBarService,
      shell: PoolBarShell,
      shellOptions: {
        sidebarTarget: '#sidebarSlot',
        topbarTarget: '#topbarSlot',
        activeFile: 'poolbar-orders.html',
        pageTitle: 'Orders',
        pageSubtitle: 'Quick sale, open tabs, and active orders',
      },
      guests: guests,
      backHref: 'poolbar-sales.html',
      backLabel: 'Back to Sales',
      onError: function (err) {
        showFatal(err && err.message ? err.message : 'Orders workspace failed.');
      },
    });
  } catch (err) {
    showFatal(err && err.message ? err.message : 'Orders workspace failed to start.');
  }
}

init();
</script>
</body>
</html>
