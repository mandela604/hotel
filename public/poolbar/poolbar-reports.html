<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reports | Grace Pool Bar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  font-size:13px; transition:background .3s,color .3s;
}
.app{ display:flex; height:100vh; overflow:hidden; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
@media (max-width:768px){ .main{ margin-left:0 !important; } }

.content{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
  --border:#eef0f6; --border2:#dfe3ec;
  --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
  --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
  --green:#12b76a; --green-bg:#e9f9f0;
  --red:#f04438; --red-bg:#feecec;
  --amber:#f79009; --amber-bg:#fff4e5;
  --blue:#2f6fed; --blue-bg:#eaf1ff;
  --purple:#8b5cf6; --purple-bg:#f4efff;
  flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; gap:16px; min-height:0;
  background:var(--bg); color:var(--text);
}
@media (max-width:768px){ .content{ padding:16px 16px 24px; } }
@media (max-width:480px){ .content{ padding:14px 12px 20px; } }

/* ── KPI cards — same as sales page, with top accent border ── */
.kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
@media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }

.kpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px 14px 12px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); cursor:default;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  display:flex; flex-direction:column; animation:fadeUp .4s ease both;
}
.kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
.kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
.kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }

/* TOP ACCENT BORDER — same as poolbar-sales.html */
.kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
.kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
.kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
.kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
.kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }

.kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
.kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.ic-blue{ background:var(--blue-bg); color:var(--blue); }
.ic-green{ background:var(--green-bg); color:var(--green); }
.ic-amber{ background:var(--amber-bg); color:var(--amber); }
.ic-purple{ background:var(--purple-bg); color:var(--purple); }
.ic-red{ background:var(--red-bg); color:var(--red); }
.kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
.kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
@media (max-width:420px){ .kpi-value{ font-size:18px; } }
.kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
.kpi-trend.up{ color:var(--green); }
.kpi-trend.warn{ color:var(--amber); }
.kpi-trend.down{ color:var(--red); }
.kpi-trend.neutral{ color:var(--text3); }
.kpi-trend.info{ color:var(--blue); }

/* ── Filter / toolbar ── */
.toolbar{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px;
}
.toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
.toolbar-row.top{ justify-content:space-between; }
.toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
.flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:700; padding-left:2px; }
.search-box{
  display:flex; align-items:center; gap:7px; background:var(--surface2);
  border:1px solid var(--border); border-radius:10px; padding:8px 12px;
  transition:border-color .2s; min-width:180px; max-width:260px; flex:1;
}
.search-box:focus-within{ border-color:var(--gold-border); }
.search-box input{ background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; }
.search-box input::placeholder{ color:var(--text3); }
.filter-select, .filter-date{
  background:var(--surface2); border:1px solid var(--border); border-radius:10px;
  padding:8px 10px; color:var(--text); font-size:12.5px; cursor:pointer;
  outline:none; transition:border-color .2s; min-width:120px; color-scheme:light;
}
.filter-select:focus, .filter-date:focus{ border-color:var(--gold-border); }
.filter-date{ cursor:default; }
.btn-ghost{ background:none; border:none; color:var(--text3); font-size:11.5px; font-weight:700; cursor:pointer; padding:8px 6px; display:inline-flex; align-items:center; gap:5px; }
.btn-ghost:hover{ color:var(--gold); }
.btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
.btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
.btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
.btn-sm{ padding:6px 12px; font-size:11.5px; }

@media (max-width:900px){
  .toolbar-row.top{ flex-direction:column; align-items:stretch; }
  .toolbar-left{ flex-direction:column; align-items:stretch; }
  .flt-group{ width:100%; }
  .search-box{ max-width:100%; }
  .filter-select, .filter-date{ width:100%; }
  .toolbar-row.top > .btn{ width:100%; justify-content:center; }
  .btn-ghost{ align-self:flex-start; }
}

/* ── Panel / table ── */
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; flex-shrink:0; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
.panel-title{ font-size:13px; font-weight:800; color:var(--text); }
.toolbar-count{ font-size:11.5px; color:var(--text3); white-space:nowrap; font-weight:600; }
.tbl-wrap{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:860px; }
thead th{
  text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase;
  letter-spacing:1.5px; color:var(--text3); font-weight:700;
  background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap;
}
thead th.center{ text-align:center; }
tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
tbody tr:last-child{ border-bottom:none; }
tbody tr:hover{ background:var(--surface2); }
tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; }
tbody td.nowrap{ white-space:nowrap; }
tbody td.center{ text-align:center; }
.empty-row td{ text-align:center; padding:32px; color:var(--text3); cursor:default; }
.empty-row:hover td{ background:transparent !important; }

/* Mobile cards — same as sales page */
@media (max-width:880px){
  .tbl-wrap{ overflow-x:visible; }
  table{ min-width:0; width:100%; }
  thead{ display:none; }
  table, tbody, tr, td{ display:block; width:100%; }
  tbody tr{ background:var(--surface2); border:1px solid var(--border); border-radius:12px; margin:0 0 10px; padding:6px 14px; }
  tbody tr:last-child{ margin-bottom:0; }
  tbody td{ border:none; padding:8px 0; white-space:normal !important; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; text-align:right; }
  tbody td:not(:last-child){ border-bottom:1px dashed var(--border); }
  tbody td::before{ content:attr(data-label); font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:700; flex-shrink:0; text-align:left; padding-top:1px; }
  .empty-row{ display:block; }
  .empty-row td{ display:block; text-align:center; }
  .empty-row td::before{ content:none; }
}
@media (max-width:420px){
  tbody tr{ padding:4px 10px; }
  tbody td{ font-size:12px; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; }
  tbody td::before{ padding-top:0; }
}

.chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
.chip i{ font-size:6px; }
.chip-completed{ background:var(--green-bg); color:var(--green); }
.chip-voided{ background:var(--red-bg); color:var(--red); }
.chip-pay{ background:var(--gold-dim); color:var(--gold); }

/* ── Summary bar ── */
.summary-bar{ display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface2); border-top:1px solid var(--border); }
@media (max-width:560px){ .summary-bar{ grid-template-columns:1fr 1fr; } }
.sb-item{ text-align:center; padding:12px; border-right:1px solid var(--border); }
.sb-item:last-child{ border-right:none; }
@media (max-width:560px){ .sb-item:nth-child(2){ border-right:none; } }
.sb-lbl{ font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); margin-bottom:3px; font-weight:600; }
.sb-val{ font-size:17px; font-weight:800; color:var(--text); }

/* ── Pagination ── */
.pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
.page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
.page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; padding:0 7px; }
.page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
.page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:700; }
.page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

/* ── Sale detail modal ── */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,15,30,.52); z-index:800;
  opacity:0; pointer-events:none; transition:opacity .22s;
}
.modal-overlay.open{ opacity:1; pointer-events:auto; }
.modal-sheet{
  position:fixed; bottom:0; left:0; right:0; max-height:86vh;
  background:var(--surface); z-index:801; border-radius:20px 20px 0 0;
  transform:translateY(100%); transition:transform .32s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; box-shadow:0 -8px 40px rgba(15,34,55,.16);
}
.modal-sheet.open{ transform:translateY(0); }
.modal-handle{ width:36px; height:4px; border-radius:3px; background:var(--border2); margin:10px auto 0; opacity:.5; }
.modal-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:16px 22px 12px; border-bottom:1px solid var(--border); gap:12px;
}
.modal-head-left{ display:flex; flex-direction:column; gap:3px; }
.modal-sale-id{ font-size:18px; font-weight:800; color:var(--text); }
.modal-sale-date{ font-size:11.5px; color:var(--text3); font-weight:600; }
.modal-close-btn{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text2); cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px;
}
.modal-close-btn:hover{ border-color:var(--red); color:var(--red); }
.modal-body{ padding:18px 22px 28px; display:flex; flex-direction:column; gap:16px; }

.modal-meta-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media (max-width:560px){ .modal-meta-row{ grid-template-columns:1fr 1fr; } }
.modal-meta-item{ background:var(--surface2); border-radius:10px; padding:11px 13px; }
.mm-lbl{ font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); font-weight:700; margin-bottom:3px; }
.mm-val{ font-size:13px; font-weight:700; color:var(--text); }

.modal-section-lbl{ font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--text3); font-weight:700; margin-bottom:8px; }
.modal-items-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.modal-items-table th{ text-align:left; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); font-weight:700; padding:7px 10px; background:var(--surface2); border-radius:6px; }
.modal-items-table th.r{ text-align:right; }
.modal-items-table td{ padding:9px 10px; border-bottom:1px solid var(--border); color:var(--text); }
.modal-items-table td.r{ text-align:right; }
.modal-items-table tr:last-child td{ border-bottom:none; }

.modal-totals{ background:var(--surface2); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
.total-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text2); }
.total-row.net{ font-size:15px; font-weight:800; color:var(--text); border-top:1px solid var(--border); padding-top:8px; margin-top:2px; }

.void-info{ background:var(--red-bg); border:1px solid rgba(240,68,56,.25); border-radius:10px; padding:11px 14px; font-size:12px; color:var(--red); line-height:1.5; }
.void-info strong{ display:block; margin-bottom:3px; }

/* ── Print ── */
@media print{
  #pbs-sidebar, #pbs-topbar, .toolbar, .pagination, .no-print,
  .modal-overlay, .modal-sheet{ display:none !important; }
  .main{ margin-left:0 !important; }
  html, body{ height:auto; overflow:visible; }
  .app{ display:block; height:auto; }
  .main{ display:block; height:auto; }
  .content{ display:block; overflow:visible; padding:0; background:#fff !important; color:#000; }
  .print-header{ display:block !important; margin-bottom:16px; border-bottom:2px solid #000; padding-bottom:10px; }
  .panel{ box-shadow:none !important; border:1px solid #ccc !important; page-break-inside:avoid; }
  .tbl-wrap{ overflow:visible !important; }
  /* Force table layout — override mobile stacked cards */
  table{ min-width:0 !important; width:100% !important; }
  thead{ display:table-header-group !important; }
  thead th{ display:table-cell !important; font-size:9px; padding:6px 8px; background:#f0f0f0 !important; color:#333 !important; border-bottom:1px solid #ccc; }
  table, tbody, tr, td{ display:revert !important; }
  tbody tr{ background:#fff !important; border:none !important; border-radius:0 !important; margin:0 !important; padding:0 !important; }
  tbody td{ padding:7px 8px !important; border-bottom:1px solid #eee !important; font-size:11px; text-align:left !important; }
  tbody td::before{ display:none !important; }
  .summary-bar{ display:grid !important; }
  .sb-val{ font-size:14px !important; }
  .kpi-row{ display:none; }
}
.print-header{ display:none; }
.print-header h2{ font-size:16px; font-weight:800; margin-bottom:3px; }
.print-header p{ font-size:11px; color:#555; }
.print-header .ph-meta{ display:flex; gap:20px; margin-top:8px; font-size:10.5px; color:#444; flex-wrap:wrap; }
.print-header .ph-meta span{ font-weight:600; }

::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
@keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <!-- KPI row -->
      <div class="kpi-row" id="kpiRow"></div>

      <!-- Filter bar — no Generate button, only filters + Print -->
      <div class="toolbar no-print">
        <div class="toolbar-row top">
          <div class="toolbar-left">
            <div class="flt-group">
              <span class="flt-label">Date — From</span>
              <input type="date" class="filter-date" id="repFrom" onchange="repPage=1;generateReport()">
            </div>
            <div class="flt-group">
              <span class="flt-label">Date — To</span>
              <input type="date" class="filter-date" id="repTo" onchange="repPage=1;generateReport()">
            </div>
            <div class="flt-group">
              <span class="flt-label">Payment</span>
              <select class="filter-select" id="repPay" onchange="repPage=1;generateReport()">
                <option value="">All Payments</option>
                <option>Cash</option>
                <option>POS</option>
                <option>Transfer</option>
                <option>Room Charge</option>
                <option>Complimentary</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px;"></i>
                <input type="text" id="repSearch" placeholder="Sale #, item, staff…" oninput="repPage=1;generateReport()">
              </div>
            </div>
            <button class="btn-ghost" onclick="clearFilters()"><i class="fa-solid fa-xmark"></i> Clear</button>
          </div>
          <button class="btn btn-outline btn-sm no-print" onclick="printReport()">
            <i class="fa-solid fa-print"></i> Print Report
          </button>
        </div>
      </div>

      <!-- Main table panel -->
      <div class="panel">
        <!-- Print header — hidden on screen, shown on print -->
        <div class="print-header">
          <h2>Grace Hotel — Pool Bar Sales Report</h2>
          <p id="printSub"></p>
          <div class="ph-meta" id="printMeta"></div>
        </div>

        <div class="panel-head">
          <div class="panel-title" id="repPanelTitle">Full Report</div>
          <span class="toolbar-count" id="repCount">—</span>
        </div>

        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Sale No.</th>
                <th>Items</th>
                <th>Total (₦)</th>
                <th>Payment</th>
                <th>Staff</th>
                <th>Location</th>
                <th>Date &amp; Time</th>
                <th class="center">Status</th>
              </tr>
            </thead>
            <tbody id="repBody"></tbody>
          </table>
        </div>

        <div class="summary-bar">
          <div class="sb-item"><div class="sb-lbl">Sales</div><div class="sb-val" id="rp-cnt">0</div></div>
          <div class="sb-item"><div class="sb-lbl">Gross</div><div class="sb-val" id="rp-gross">₦0</div></div>
          <div class="sb-item"><div class="sb-lbl">Discounts</div><div class="sb-val" id="rp-disc">₦0</div></div>
          <div class="sb-item"><div class="sb-lbl">Net Revenue</div><div class="sb-val" id="rp-net">₦0</div></div>
        </div>

        <div class="pagination">
          <span id="repPagin">—</span>
          <div class="page-btns" id="repPageBtns"></div>
        </div>
      </div>

    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /app -->

<!-- Sale detail modal -->
<div class="modal-overlay" id="modalOv"></div>
<div class="modal-sheet" id="modalSheet">
  <div class="modal-handle"></div>
  <div class="modal-head">
    <div class="modal-head-left">
      <div class="modal-sale-id" id="mdId">—</div>
      <div class="modal-sale-date" id="mdDate">—</div>
    </div>
    <button class="modal-close-btn" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="modal-body">
    <div class="modal-meta-row" id="mdMeta"></div>
    <div>
      <div class="modal-section-lbl">Items Ordered</div>
      <table class="modal-items-table">
        <thead><tr><th>Item</th><th>Qty</th><th class="r">Unit Price</th><th class="r">Line Total</th></tr></thead>
        <tbody id="mdItems"></tbody>
      </table>
    </div>
    <div class="modal-totals" id="mdTotals"></div>
    <div id="mdVoidInfo" style="display:none"></div>
  </div>
</div>

<script src="../component/poolbar-shell.js"></script>
<script>
/* ══════════════════════════════════════
   SHELL
══════════════════════════════════════ */
const shell = PoolBarShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'poolbar-reports.html',
  pageTitle:     'Reports',
  pageSubtitle:  'Full sales history and revenue breakdown — Pool Bar',
  apiMode:       'Demo',
  user:          { name: 'Pool Bar Manager', initials: 'PB' },
});

/* ══════════════════════════════════════
   CONFIG & STORAGE
══════════════════════════════════════ */
const CFG = { API_BASE:'', API_KEY:'', USE_DEMO:true, PAGE_SIZE:10 };

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v == null ? null : { key, value: v, shared }; },
  async set(key, value, shared){ localStorage.setItem(key, value); return { key, value, shared }; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return { keys, prefix, shared }; }
};

const KEY_SALES = 'poolbar-sales';

async function loadShared(key, fallback) {
  try {
    const r = await storage.get(key, true);
    if (r && r.value) {
      const parsed = JSON.parse(r.value);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch(e) {}
  return fallback;
}

/* Same demo seed as sales page so totals agree */
const DEMO_SALES = [
  { id:'PBS-1012', items:[{name:'Heineken',qty:3,price:1500}], subtotal:4500, discount:0, total:4500, method:'Cash', staff:'Emeka S.', table:'Pool Deck 2', notes:'', date:'17/07/26 11:05 AM', status:'completed' },
  { id:'PBS-1011', items:[{name:'Chapman',qty:2,price:2500},{name:'Guinness',qty:2,price:1600}], subtotal:8200, discount:0, total:8200, method:'POS', staff:'Amaka O.', table:'Pool Lounge', notes:'', date:'17/07/26 10:40 AM', status:'completed' },
  { id:'PBS-1010', items:[{name:'Guinness',qty:1,price:1600}], subtotal:1600, discount:0, total:1600, method:'Transfer', staff:'Emeka S.', table:'Pool Deck 1', notes:'', date:'17/07/26 09:52 AM', status:'completed' },
  { id:'PBS-1009', items:[{name:'Heineken',qty:4,price:1500},{name:'Chapman',qty:1,price:2500}], subtotal:8500, discount:10, total:7650, method:'Room Charge', staff:'Amaka O.', table:'Pool Deck 4', notes:'', date:'16/07/26 07:30 PM', status:'completed' },
  { id:'PBS-1008', items:[{name:'Guinness',qty:2,price:1600}], subtotal:3200, discount:0, total:3200, method:'Cash', staff:'Emeka S.', table:'Pool Deck 1', notes:'Wrong order', date:'16/07/26 01:15 PM', status:'voided', voidReason:'Customer changed mind before it was served', voidDate:'16/07/26 01:20 PM', voidedBy:'Adaeze Nwankwo (Duty Manager)' },
];

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let sales = [];
let repPage = 1;
let filteredRep = [];

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function fmtN(n){ return '₦' + Math.round(n || 0).toLocaleString('en-NG'); }

function itemsLabel(s) {
  /* "Heineken ×3" or "Heineken ×3 +2 more" */
  if (!s.items || !s.items.length) return '—';
  const first = s.items[0];
  const label = first.name + ' ×' + first.qty;
  const rest  = s.items.length - 1;
  return rest > 0
    ? label + ' <span style="color:var(--text3);font-size:10.5px">+' + rest + ' more</span>'
    : label;
}

function parseSaleDate(str) {
  if (!str) return null;
  const parts = str.split(' ');
  const [d, m, y] = parts[0].split('/').map(Number);
  let hh = 0, mm = 0;
  if (parts[1]) { const [h, mi] = parts[1].split(':').map(Number); hh = h; mm = mi || 0; }
  if (parts[2]) {
    const ap = parts[2].toUpperCase();
    if (ap === 'PM' && hh < 12) hh += 12;
    if (ap === 'AM' && hh === 12) hh = 0;
  }
  return new Date(y < 100 ? 2000 + y : y, m - 1, d, hh, mm);
}

function dateOnly(dt) {
  return dt ? new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()) : null;
}

function todayDDMMYY() {
  const d = new Date();
  return String(d.getDate()).padStart(2,'0') + '/' +
         String(d.getMonth()+1).padStart(2,'0') + '/' +
         String(d.getFullYear()).slice(-2);
}

/* ══════════════════════════════════════
   KPI CARDS — top accent border like sales page
══════════════════════════════════════ */
function renderKPIs() {
  const completed = sales.filter(s => s.status === 'completed');
  const voided    = sales.filter(s => s.status === 'voided');
  const todayStr  = todayDDMMYY();
  const todayRev  = completed
    .filter(s => s.date && s.date.startsWith(todayStr))
    .reduce((n, s) => n + s.total, 0);
  const days      = new Set(completed.map(s => (s.date || '').split(' ')[0])).size || 1;
  const avgDaily  = completed.reduce((n, s) => n + s.total, 0) / days;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card acc-blue">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-receipt"></i></div><div class="kpi-label">Total Transactions</div></div>
      <div class="kpi-value" style="color:var(--blue)">${completed.length}</div>
      <div class="kpi-trend neutral">All-time completed sales</div>
    </div>
    <div class="kpi-card acc-green">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Today's Revenue</div></div>
      <div class="kpi-value" style="color:var(--green)">${fmtN(todayRev)}</div>
      <div class="kpi-trend up">Completed sales today</div>
    </div>
    <div class="kpi-card acc-purple">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-chart-line"></i></div><div class="kpi-label">Avg Daily Revenue</div></div>
      <div class="kpi-value" style="color:var(--purple)">${fmtN(avgDaily)}</div>
      <div class="kpi-trend info">Across ${days} active day${days !== 1 ? 's' : ''}</div>
    </div>
    <div class="kpi-card acc-red">
      <div class="kpi-top"><div class="kpi-ic ic-red"><i class="fa-solid fa-ban"></i></div><div class="kpi-label">Voided Sales</div></div>
      <div class="kpi-value" style="color:var(--red)">${voided.length}</div>
      <div class="kpi-trend ${voided.length > 0 ? 'warn' : 'up'}">${voided.length > 0 ? 'Excluded from revenue' : 'None on record'}</div>
    </div>`;
}

/* ══════════════════════════════════════
   FILTER + REPORT
══════════════════════════════════════ */
function clearFilters() {
  document.getElementById('repFrom').value  = '';
  document.getElementById('repTo').value    = '';
  document.getElementById('repPay').value   = '';
  document.getElementById('repSearch').value = '';
  repPage = 1;
  generateReport();
}

function generateReport() {
  const from = document.getElementById('repFrom').value;
  const to   = document.getElementById('repTo').value;
  const pay  = document.getElementById('repPay').value;
  const q    = document.getElementById('repSearch').value.toLowerCase();

  filteredRep = sales.filter(s => {
    const mq = !q
      || s.id.toLowerCase().includes(q)
      || (s.staff || '').toLowerCase().includes(q)
      || (s.table || '').toLowerCase().includes(q)
      || (s.items || []).some(i => i.name.toLowerCase().includes(q));
    const mPay  = !pay || s.method === pay;
    let mDate   = true;
    if (from || to) {
      const sd = dateOnly(parseSaleDate(s.date));
      if (from) { const f = new Date(from + 'T00:00:00'); if (!sd || sd < f) mDate = false; }
      if (to)   { const t = new Date(to   + 'T00:00:00'); if (!sd || sd > t) mDate = false; }
    }
    return mq && mPay && mDate;
  }).sort((a, b) => parseSaleDate(b.date) - parseSaleDate(a.date));

  /* Panel title */
  document.getElementById('repPanelTitle').textContent =
    (from || to) ? 'Report: ' + (from || '…') + ' → ' + (to || '…') : 'Full Report';
  document.getElementById('repCount').textContent =
    filteredRep.length + ' record' + (filteredRep.length !== 1 ? 's' : '');

  /* Summary bar */
  const comp  = filteredRep.filter(s => s.status === 'completed');
  const gross = comp.reduce((n, s) => n + s.subtotal, 0);
  const disc  = comp.reduce((n, s) => n + s.subtotal * (s.discount || 0) / 100, 0);
  const net   = comp.reduce((n, s) => n + s.total, 0);
  document.getElementById('rp-cnt').textContent   = filteredRep.length;
  document.getElementById('rp-gross').textContent = fmtN(gross);
  document.getElementById('rp-disc').textContent  = fmtN(disc);
  document.getElementById('rp-net').textContent   = fmtN(net);

  /* Print header text */
  const now = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  document.getElementById('printSub').textContent =
    'Generated: ' + now + ' · ' + filteredRep.length + ' records · Net: ' + fmtN(net);
  document.getElementById('printMeta').innerHTML =
    '<span>Period: ' + (from || 'All') + ' – ' + (to || 'All') + '</span>' +
    '<span>Payment filter: ' + (pay || 'All') + '</span>' +
    '<span>Printed by: Pool Bar Manager</span>';

  renderReportPage();
}

/* ══════════════════════════════════════
   TABLE + PAGINATION
══════════════════════════════════════ */
function renderPagination(total) {
  const totalPages = Math.max(1, Math.ceil(total / CFG.PAGE_SIZE));
  if (repPage > totalPages) repPage = totalPages;
  const from = total === 0 ? 0 : (repPage - 1) * CFG.PAGE_SIZE + 1;
  const to   = Math.min(repPage * CFG.PAGE_SIZE, total);
  document.getElementById('repPagin').textContent = total === 0 ? 'No records' : from + '–' + to + ' of ' + total;

  const wrap = document.getElementById('repPageBtns');
  wrap.innerHTML = '';

  function mk(label, p, disabled, active) {
    const b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.innerHTML = label;
    b.disabled  = !!disabled;
    b.addEventListener('click', () => { repPage = p; renderReportPage(); });
    return b;
  }
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-left"></i>', repPage - 1, repPage === 1, false));
  let start = Math.max(1, repPage - 2), end = Math.min(totalPages, start + 4);
  start = Math.max(1, end - 4);
  for (let i = start; i <= end; i++) wrap.appendChild(mk(String(i), i, false, i === repPage));
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-right"></i>', repPage + 1, repPage >= totalPages, false));
}

function renderReportPage() {
  const start    = (repPage - 1) * CFG.PAGE_SIZE;
  const pageRows = filteredRep.slice(start, start + CFG.PAGE_SIZE);

  if (pageRows.length === 0) {
    document.getElementById('repBody').innerHTML =
      '<tr class="empty-row"><td colspan="8">No sales match your filters.</td></tr>';
    renderPagination(0);
    return;
  }

  document.getElementById('repBody').innerHTML = pageRows.map(s => `
    <tr data-id="${s.id}">
      <td class="nowrap" data-label="Sale No." style="font-weight:700">${s.id}</td>
      <td data-label="Items">${itemsLabel(s)}</td>
      <td class="nowrap" data-label="Total" style="font-weight:700;color:var(--gold)">${fmtN(s.total)}</td>
      <td class="nowrap" data-label="Payment"><span class="chip chip-pay"><i class="fa-solid fa-circle"></i>${s.method}</span></td>
      <td class="nowrap" data-label="Staff">${s.staff || '—'}</td>
      <td class="nowrap" data-label="Location">${s.table || '—'}</td>
      <td class="nowrap" data-label="Date &amp; Time">${s.date}</td>
      <td class="center nowrap" data-label="Status"><span class="chip chip-${s.status}"><i class="fa-solid fa-circle"></i>${s.status === 'completed' ? 'Completed' : 'Voided'}</span></td>
    </tr>`).join('');

  /* click row → modal */
  document.querySelectorAll('#repBody tr[data-id]').forEach(row => {
    row.addEventListener('click', () => openSaleModal(row.dataset.id));
  });

  renderPagination(filteredRep.length);
}

/* ══════════════════════════════════════
   SALE DETAIL MODAL
══════════════════════════════════════ */
function openSaleModal(id) {
  const s = sales.find(x => x.id === id);
  if (!s) return;

  document.getElementById('mdId').textContent   = s.id;
  document.getElementById('mdDate').textContent = s.date || '—';

  /* meta row */
  document.getElementById('mdMeta').innerHTML = [
    { l:'Staff',    v: s.staff || '—' },
    { l:'Location', v: s.table || '—' },
    { l:'Payment',  v: s.method || '—' },
    { l:'Discount', v: (s.discount || 0) + '%' },
    { l:'Status',   v: '<span class="chip chip-' + s.status + '"><i class="fa-solid fa-circle"></i>' + (s.status === 'completed' ? 'Completed' : 'Voided') + '</span>' },
    { l:'Notes',    v: s.notes || '—' },
  ].map(m => '<div class="modal-meta-item"><div class="mm-lbl">' + m.l + '</div><div class="mm-val">' + m.v + '</div></div>').join('');

  /* items table */
  document.getElementById('mdItems').innerHTML = (s.items || []).map(item => {
    const lineTotal = item.qty * item.price;
    return '<tr>' +
      '<td>' + item.name + '</td>' +
      '<td>' + item.qty + '</td>' +
      '<td class="r">' + fmtN(item.price) + '</td>' +
      '<td class="r">' + fmtN(lineTotal) + '</td>' +
    '</tr>';
  }).join('');

  /* totals */
  const discAmt = s.subtotal * (s.discount || 0) / 100;
  document.getElementById('mdTotals').innerHTML =
    '<div class="total-row"><span>Subtotal</span><span>' + fmtN(s.subtotal) + '</span></div>' +
    (discAmt > 0 ? '<div class="total-row"><span>Discount (' + s.discount + '%)</span><span>−' + fmtN(discAmt) + '</span></div>' : '') +
    '<div class="total-row net"><span>Net Total</span><span>' + fmtN(s.total) + '</span></div>';

  /* void info */
  const vi = document.getElementById('mdVoidInfo');
  if (s.status === 'voided' && s.voidReason) {
    vi.style.display = 'block';
    vi.innerHTML = '<div class="void-info"><strong><i class="fa-solid fa-ban"></i> Voided</strong>Reason: ' + s.voidReason + '<br>By: ' + (s.voidedBy || '—') + ' · ' + (s.voidDate || '') + '</div>';
  } else {
    vi.style.display = 'none';
  }

  document.getElementById('modalOv').classList.add('open');
  document.getElementById('modalSheet').classList.add('open');
  document.getElementById('modalSheet').scrollTop = 0;
}

function closeModal() {
  document.getElementById('modalOv').classList.remove('open');
  document.getElementById('modalSheet').classList.remove('open');
}

document.getElementById('modalOv').addEventListener('click', closeModal);
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ══════════════════════════════════════
   PRINT — clean list, forced table layout
══════════════════════════════════════ */
function printReport() {
  /* Populate print header before printing */
  const from = document.getElementById('repFrom').value;
  const to   = document.getElementById('repTo').value;
  const pay  = document.getElementById('repPay').value;
  const net  = document.getElementById('rp-net').textContent;
  const now  = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  document.getElementById('printSub').textContent =
    'Generated: ' + now + ' · ' + filteredRep.length + ' records · Net Revenue: ' + net;
  document.getElementById('printMeta').innerHTML =
    '<span>Period: ' + (from || 'All dates') + ' – ' + (to || 'All dates') + '</span>' +
    '<span>Payment: ' + (pay || 'All') + '</span>' +
    '<span>Printed by: Pool Bar Manager</span>';
  window.print();
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
async function init() {
  sales = await loadShared(KEY_SALES, DEMO_SALES);
  renderKPIs();
  repPage = 1;
  generateReport();
}
init();
</script>
