<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reports | Grace Pool Bar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  font-size:13px; transition:background .3s,color .3s;
}
.app{ display:flex; height:100vh; overflow:hidden; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
@media (max-width:768px){ .main{ margin-left:0 !important; } }
.content{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
  --border:#eef0f6; --border2:#dfe3ec;
  --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
  --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
  --green:#12b76a; --green-bg:#e9f9f0;
  --red:#f04438; --red-bg:#feecec;
  --amber:#f79009; --amber-bg:#fff4e5;
  --blue:#2f6fed; --blue-bg:#eaf1ff;
  --purple:#8b5cf6; --purple-bg:#f4efff;
  flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; gap:16px; min-height:0;
  background:var(--bg); color:var(--text);
}
@media (max-width:768px){ .content{ padding:16px 16px 24px; } }
@media (max-width:480px){ .content{ padding:14px 12px 20px; } }
.kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; flex-shrink:0; }
@media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
.kpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px 14px 12px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); display:flex; flex-direction:column;
}
.kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
.kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
.kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
.kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
.kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
.kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
.kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.ic-blue{ background:var(--blue-bg); color:var(--blue); }
.ic-green{ background:var(--green-bg); color:var(--green); }
.ic-purple{ background:var(--purple-bg); color:var(--purple); }
.ic-red{ background:var(--red-bg); color:var(--red); }
.kpi-label{ font-size:11px; color:var(--text2); font-weight:600; }
.kpi-value{ font-size:22px; font-weight:800; margin:4px 0 2px; line-height:1; }
.kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); }
.kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); }
.kpi-trend.neutral{ color:var(--text3); } .kpi-trend.info{ color:var(--blue); }
#filterSlot, #tableSlot{ flex-shrink:0; min-width:0; }
.modal-overlay{ position:fixed; inset:0; background:rgba(10,15,30,.52); z-index:800; opacity:0; pointer-events:none; transition:opacity .22s; }
.modal-overlay.open{ opacity:1; pointer-events:auto; }
.modal-sheet{
  position:fixed; bottom:0; left:0; right:0; max-height:86vh;
  background:var(--surface); z-index:801; border-radius:20px 20px 0 0;
  transform:translateY(100%); transition:transform .32s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; box-shadow:0 -8px 40px rgba(15,34,55,.16);
}
.modal-sheet.open{ transform:translateY(0); }
.modal-handle{ width:36px; height:4px; border-radius:3px; background:var(--border2); margin:10px auto 0; opacity:.5; }
.modal-head{ display:flex; align-items:flex-start; justify-content:space-between; padding:16px 22px 12px; border-bottom:1px solid var(--border); gap:12px; }
.modal-sale-id{ font-size:18px; font-weight:800; }
.modal-sale-date{ font-size:11.5px; color:var(--text3); font-weight:600; }
.modal-close-btn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text2); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-body{ padding:18px 22px 28px; display:flex; flex-direction:column; gap:16px; }
.modal-meta-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media (max-width:560px){ .modal-meta-row{ grid-template-columns:1fr 1fr; } }
.modal-meta-item{ background:var(--surface2); border-radius:10px; padding:11px 13px; }
.mm-lbl{ font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); font-weight:700; margin-bottom:3px; }
.mm-val{ font-size:13px; font-weight:700; }
.modal-section-lbl{ font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--text3); font-weight:700; margin-bottom:8px; }
.modal-items-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.modal-items-table th{ text-align:left; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); font-weight:700; padding:7px 10px; background:var(--surface2); }
.modal-items-table th.r, .modal-items-table td.r{ text-align:right; }
.modal-items-table td{ padding:9px 10px; border-bottom:1px solid var(--border); }
.modal-totals{ background:var(--surface2); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
.total-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text2); }
.total-row.net{ font-size:15px; font-weight:800; color:var(--text); border-top:1px solid var(--border); padding-top:8px; }
.void-info{ background:var(--red-bg); border:1px solid rgba(240,68,56,.25); border-radius:10px; padding:11px 14px; font-size:12px; color:var(--red); line-height:1.5; }
.chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
.chip i{ font-size:6px; }
/* Chip color is set inline per-row from the sale status's configured
   color (see statusColorFor()/statusLabelFor()) — no status name
   (completed/voided/…) is baked into the stylesheet. */
.chip{ background:var(--dyn-color-bg, var(--surface3)); color:var(--dyn-color, var(--text2)); }
.restricted-panel{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); padding:48px 24px; text-align:center; color:var(--text3);
}
.restricted-panel i{ font-size:26px; color:var(--amber); margin-bottom:12px; display:block; }
.restricted-panel h3{ font-size:15px; color:var(--text); font-weight:800; margin-bottom:6px; }
.restricted-panel p{ font-size:12.5px; max-width:360px; margin:0 auto; line-height:1.6; }
.fatal-panel{
  background:var(--surface); border:1px solid var(--red); border-left:3px solid var(--red); border-radius:14px;
  box-shadow:var(--shadow); padding:24px; color:var(--text); font-size:13px; line-height:1.6;
}
.fatal-panel b{ color:var(--red); }
@media print{
  #pbs-sidebar, #pbs-topbar, #filterSlot, .no-print,
  .modal-overlay, .modal-sheet, .st-pagin{ display:none !important; }
  .main{ margin-left:0 !important; }
  html, body{ height:auto; overflow:visible; }
  .app{ display:block; height:auto; }
  .content{ overflow:visible; padding:0; background:#fff !important; }
  .print-header{ display:block !important; margin-bottom:16px; border-bottom:2px solid #000; padding-bottom:10px; }
  .kpi-row{ display:none; }
}
.print-header{ display:none; }
.print-header h2{ font-size:16px; font-weight:800; margin-bottom:3px; }
.print-header p{ font-size:11px; color:#555; }
.print-header .ph-meta{ display:flex; gap:20px; margin-top:8px; font-size:10.5px; color:#444; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content" id="pageContent">
      <div class="kpi-row" id="kpiRow"></div>
      <div id="filterSlot" class="no-print"></div>
      <div class="print-header no-print">
        <h2>Grace Hotel — Pool Bar Sales Report</h2>
        <p id="printSub"></p>
        <div class="ph-meta" id="printMeta"></div>
      </div>
      <div id="tableSlot"></div>
      <div class="restricted-panel no-print" id="restrictedPanel" style="display:none;">
        <i class="fa-solid fa-lock"></i>
        <h3>Reports Restricted</h3>
        <p>You don't have permission to view Pool Bar reports. Contact a manager or admin if you need access.</p>
      </div>
      <div class="fatal-panel no-print" id="fatalPanel" style="display:none;">
        <b>Could not load this page.</b>
        <div id="fatalMsg"></div>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalOv"></div>
<div class="modal-sheet" id="modalSheet">
  <div class="modal-handle"></div>
  <div class="modal-head">
    <div>
      <div class="modal-sale-id" id="mdId">—</div>
      <div class="modal-sale-date" id="mdDate">—</div>
    </div>
    <button class="modal-close-btn" id="modalCloseBtn" type="button"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="modal-body">
    <div class="modal-meta-row" id="mdMeta"></div>
    <div>
      <div class="modal-section-lbl">Items Ordered</div>
      <table class="modal-items-table">
        <thead><tr><th>Item</th><th>Qty</th><th class="r">Unit Price</th><th class="r">Line Total</th></tr></thead>
        <tbody id="mdItems"></tbody>
      </table>
    </div>
    <div class="modal-totals" id="mdTotals"></div>
    <div id="mdVoidInfo" style="display:none"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="../services/permissions.js"></script>
<script src="data/poolbar-seed.js"></script>
<script src="services/poolbar-service.js"></script>
<script src="../component/poolbar-shell.js"></script>
<script src="../component/sales-filter-bar.js"></script>
<script src="../component/sales-table.js"></script>
<script>
const shell = PoolBarShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget: '#topbarSlot',
  activeFile: 'poolbar-reports.html',
  pageTitle: 'Reports',
  pageSubtitle: 'Full sales history and revenue breakdown — Pool Bar',
});
const svc = PoolBarService;
const { fmtN, todayDDMMYY, parseStamp, dateOnly } = svc;
// Sale-status vocabulary and money-received rules are the service's
// business logic, never re-typed as string literals on this page.
const completedStatus = svc.getCompletedSaleStatus();
const voidedStatus = svc.getStatusConstants ? svc.getStatusConstants().SALE_VOIDED : null;
const roomChargeMethod = svc.getRoomChargeMethodName ? svc.getRoomChargeMethodName() : null;
const emptyValue = svc.getEmptyValuePlaceholder ? svc.getEmptyValuePlaceholder() : '—';
// Session comes ONLY from the shell (Demo → CONFIG.DEMO_USER, Live → real
// API user, Live-fail → shell already redirected to login). No hardcoded
// session object, no hardcoded shell `user` option, no permission bypass —
// same pattern as poolbar-dashboard.html.
let session = null;
let canViewReports = false;
function getSession() {
  const u = shell.getUser && shell.getUser();
  if (!u) throw new Error('No session — please sign in again.');
  return u;
}
function showFatal(message) {
  document.getElementById('fatalMsg').textContent = message;
  document.getElementById('fatalPanel').style.display = 'block';
  document.getElementById('filterSlot').style.display = 'none';
  document.getElementById('tableSlot').style.display = 'none';
  document.getElementById('kpiRow').style.display = 'none';
  document.getElementById('restrictedPanel').style.display = 'none';
}
let filterBar = null;
let salesTable = null;
function itemsQty(s) {
  return (s.items || []).reduce((sum, i) => sum + (i.qty || 0), 0);
}
// Sale-status display — driven entirely by svc.getSaleStatusOptions().
function statusOptionFor(status) {
  const opts = svc.getSaleStatusOptions ? svc.getSaleStatusOptions() : [];
  return opts.find(o => o.value === status) || null;
}
function statusLabelFor(status) {
  const opt = statusOptionFor(status);
  if (opt && opt.label) return opt.label;
  if (!status) return emptyValue;
  return status.charAt(0).toUpperCase() + status.slice(1);
}
function statusColorFor(status) {
  const opt = statusOptionFor(status);
  return {
    color: (opt && opt.color) || 'var(--text2)',
    colorBg: (opt && opt.colorBg) || 'var(--surface3)',
  };
}
/**
 * KPI cards mirror poolbar-sales.html layout:
 * 1. Transactions (blue / gold value)
 * 2. Revenue (green)
 * 3. Money received — green figure, orange "still owed" trend when relevant
 * 4. Units Sold (blue / gold value)
 * Always computed from the CURRENTLY FILTERED rows, not all-time state.
 */
function renderKPIs(rows) {
  const completed = rows.filter(s => s.status === completedStatus);
  const voided = rows.filter(s => s.status === voidedStatus);
  const revenue = completed.reduce((n, s) => n + (s.total || 0), 0);
  const units = completed.reduce((n, s) => n + itemsQty(s), 0);
  const moneyReceived = completed
    .filter(s => svc.isMoneyReceived(s.method))
    .reduce((n, s) => n + (s.total || 0), 0);
  const roomCharge = completed
    .filter(s => roomChargeMethod && (s.method || '') === roomChargeMethod)
    .reduce((n, s) => n + (s.total || 0), 0);
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card acc-blue">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-receipt"></i></div><div class="kpi-label">Transactions</div></div>
      <div class="kpi-value" style="color:var(--gold)">${rows.length}</div>
      <div class="kpi-trend neutral">${completed.length} completed · ${voided.length} voided</div>
    </div>
    <div class="kpi-card acc-green">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Revenue</div></div>
      <div class="kpi-value" style="color:var(--green)">${fmtN(revenue)}</div>
      <div class="kpi-trend up">All sales (incl. room charge)</div>
    </div>
    <div class="kpi-card acc-green">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-wallet"></i></div><div class="kpi-label">Money received</div></div>
      <div class="kpi-value" style="color:var(--green)">${fmtN(moneyReceived)}</div>
      <div class="kpi-trend ${roomCharge > 0 ? 'warn' : 'neutral'}">${roomCharge > 0 ? 'Room charge still owed ' + fmtN(roomCharge) : 'No room charges'}</div>
    </div>
    <div class="kpi-card acc-blue">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-boxes-stacked"></i></div><div class="kpi-label">Units Sold</div></div>
      <div class="kpi-value" style="color:var(--gold)">${units}</div>
      <div class="kpi-trend info">Across ${completed.length} sale${completed.length !== 1 ? 's' : ''}</div>
    </div>`;
}
function applyFilters(state) {
  const bounds = state.bounds || { start: null, end: null, label: 'All time' };
  const filtered = svc.filterSales({
    search: state.search || '',
    payment: state.payment || '',
    status: state.status || '',
    staff: state.staff || '',
    dateRange: bounds,
  });
  const title = svc.getReportTitle(bounds.label);
  if (salesTable) {
    salesTable.setTitle(title);
    salesTable.setRows(filtered);
  }
  // KPI cards always reflect the same filtered rows as the table.
  renderKPIs(filtered);
  const comp = filtered.filter(s => s.status === completedStatus);
  const net = comp.reduce((n, s) => n + s.total, 0);
  const now = new Date().toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  });
  document.getElementById('printSub').textContent =
    'Generated: ' + now + ' · ' + filtered.length + ' records · Net: ' + fmtN(net);
  document.getElementById('printMeta').innerHTML =
    '<span>Period: ' + (bounds.label || 'All') + '</span>' +
    '<span>Payment: ' + (state.payment || 'All') + '</span>' +
    '<span>Staff: ' + (state.staff || 'All') + '</span>';
}
function openSaleModal(saleOrId) {
  const id = typeof saleOrId === 'string' ? saleOrId : (saleOrId && saleOrId.id);
  const s = svc.state.sales.find(x => x.id === id);
  if (!s) return;

  const detail = svc.buildSaleDetailShape(s);

  document.getElementById('mdId').textContent = detail.id;
  document.getElementById('mdDate').textContent = detail.date || emptyValue;
  const statusColors = statusColorFor(detail.status);
  document.getElementById('mdMeta').innerHTML = [
    { l: 'Staff', v: detail.staff || emptyValue },
    { l: 'Location', v: detail.table || emptyValue },
    { l: 'Payment', v: detail.method || emptyValue },
    { l: 'Discount', v: detail.discount > 0 ? '−' + fmtN(detail.discount) : emptyValue },
    { l: 'Status', v: '<span class="chip" style="--dyn-color:' + statusColors.color + ';--dyn-color-bg:' + statusColors.colorBg + ';"><i class="fa-solid fa-circle"></i>' + statusLabelFor(detail.status) + '</span>' },
    { l: 'Notes', v: detail.notes || emptyValue },
  ].map(m => '<div class="modal-meta-item"><div class="mm-lbl">' + m.l + '</div><div class="mm-val">' + m.v + '</div></div>').join('');

  document.getElementById('mdItems').innerHTML = (detail.items || []).map(item => {
    const lineTotal = item.qty * item.price;
    return '<tr><td>' + item.name + '</td><td>' + item.qty + '</td><td class="r">' + fmtN(item.price) + '</td><td class="r">' + fmtN(lineTotal) + '</td></tr>';
  }).join('');

  const subtotal = (detail.items || []).reduce((n, i) => n + (i.qty || 0) * (i.price || 0), 0);
  document.getElementById('mdTotals').innerHTML =
    '<div class="total-row"><span>Subtotal</span><span>' + fmtN(subtotal) + '</span></div>' +
    (detail.discount > 0 ? '<div class="total-row"><span>Discount</span><span>−' + fmtN(detail.discount) + '</span></div>' : '') +
    '<div class="total-row net"><span>Net Total</span><span>' + fmtN(detail.total) + '</span></div>';

  const vi = document.getElementById('mdVoidInfo');
  if (detail.status === voidedStatus && detail.voidReason) {
    vi.style.display = 'block';
    vi.innerHTML = '<div class="void-info"><strong><i class="fa-solid fa-ban"></i> Voided</strong> Reason: ' + detail.voidReason +
      (s.voidedBy ? '<br>By: ' + (s.voidedBy || emptyValue) + ' · ' + (s.voidDate || '') : '') +
      '</div>';
  } else {
    vi.style.display = 'none';
  }
  document.getElementById('modalOv').classList.add('open');
  document.getElementById('modalSheet').classList.add('open');
  document.getElementById('modalSheet').scrollTop = 0;
}
function closeModal() {
  document.getElementById('modalOv').classList.remove('open');
  document.getElementById('modalSheet').classList.remove('open');
}
document.getElementById('modalOv').addEventListener('click', closeModal);
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function printReport() {
  window.print();
}
function applyPermissionGate() {
  document.getElementById('filterSlot').style.display = canViewReports ? '' : 'none';
  document.getElementById('tableSlot').style.display = canViewReports ? '' : 'none';
  document.getElementById('kpiRow').style.display = canViewReports ? '' : 'none';
  document.getElementById('restrictedPanel').style.display = canViewReports ? 'none' : 'block';
}
function mountFilterBar() {
  filterBar = SalesFilterBar.create({
    target: '#filterSlot',
    show: {
      period: true,
      status: true,
      source: true,
      payment: true,
      staff: true,
      dateRange: true,
      search: true,
      clear: true,
      chips: true,
    },
    staffOptions: svc.listStaffNames(),
    paymentOptions: svc.getPaymentMethods ? svc.getPaymentMethods() : [],
    searchPlaceholder: 'Sale #, item, staff…',
    defaultPeriod: 'all',
    actions: [
      { id: 'print', label: 'Print Report', icon: 'fa-print', variant: 'outline' },
    ],
    onChange: (state) => applyFilters(state),
    onAction: (actionId) => {
      if (actionId === 'print') printReport();
    },
  });
}
function mountTable() {
  salesTable = SalesTable.create({
    target: '#tableSlot',
    pageSize: 10,
    showSummary: true,
    showActions: false,
    showSource: true,
    canVoid: false,
    title: 'Full Report',
    emptyText: 'No sales match your filters.',
    formatMoney: fmtN,
    onRowClick: (sale) => openSaleModal(sale),
  });
}
async function init() {
  try {
    // Real session only — throws (and is caught below) if the shell has
    // no user yet, same as poolbar-dashboard.html. No hardcoded fallback.
    session = getSession();
    // No manager/admin OR-bypass — canViewReports is exactly what the
    // service's permission check says, nothing more.
    canViewReports = svc.can(session, 'canViewReports');
    applyPermissionGate();
    if (!canViewReports) return;
    await svc.loadAll();
    mountTable();
    mountFilterBar();
    applyFilters(filterBar.getState());
    svc.onChange(() => {
      if (filterBar) {
        filterBar.setStaffOptions(svc.listStaffNames());
        applyFilters(filterBar.getState());
      }
    });
  } catch (err) {
    showFatal(err && err.message ? err.message : 'Failed to load reports.');
  }
}
init();
</script>
</body>
</html>
