<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Dashboard | Grace Pool Bar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{ --radius:14px; --radius-sm:10px; --transition:.3s cubic-bezier(.4,0,.2,1); }
  html, body{ height:100%; overflow:hidden; }
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:13px; transition:background .3s,color .3s;
  }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:16px; min-height:0;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:700; margin-bottom:2px; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s; text-decoration:none; display:flex; flex-direction:column; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); }

  .row{ display:grid; grid-template-columns:1.3fr .7fr; gap:14px; }
  @media (max-width:900px){ .row{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow); min-width:0; }
  @media (max-width:420px){ .panel{ padding:14px; } }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  .panel-title{ font-size:12.5px; font-weight:800; color:var(--text); }
  .panel-action{ font-size:11.5px; color:var(--gold); text-decoration:none; font-weight:700; white-space:nowrap; background:none; border:none; font-family:inherit; cursor:pointer; }
  .panel-action:hover{ color:var(--gold-light); }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:14px 0; text-align:center; font-weight:600; }

  .rev-total{ font-size:28px; font-weight:800; color:var(--gold); line-height:1; }
  .rev-sub-label{ font-size:11px; color:var(--text3); margin:4px 0 16px; font-weight:600; }
  .bar-row{ margin-bottom:12px; } .bar-row:last-child{ margin-bottom:0; }
  .bar-meta{ display:flex; justify-content:space-between; margin-bottom:5px; }
  .bar-name{ font-size:12.5px; color:var(--text2); font-weight:600; } .bar-count{ font-size:11.5px; color:var(--text3); font-weight:600; }
  .bar-track{ height:6px; background:var(--surface3); border-radius:20px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:20px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width 1.2s cubic-bezier(.4,0,.2,1); }
  .bar-fill.blue{ background:linear-gradient(90deg,#60a5fa,#93c5fd); }
  .bar-fill.purple{ background:linear-gradient(90deg,#a78bfa,#c4b5fd); }

  .list-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); text-decoration:none; color:inherit; cursor:pointer; }
  .list-row:last-child{ border-bottom:none; padding-bottom:0; }
  .list-row:hover .list-name{ color:var(--gold); }
  .list-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .list-body{ flex:1; min-width:0; }
  .list-name{ font-size:12.6px; color:var(--text); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .15s; }
  .list-meta{ font-size:11px; color:var(--text3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap; flex-shrink:0; }
  .chip i{ font-size:7px; }
  .chip-sent{ background:var(--blue-bg); color:var(--blue); }
  .chip-low{ background:var(--amber-bg); color:var(--amber); }
  .chip-out{ background:var(--red-bg); color:var(--red); }
  .chip-ok{ background:var(--green-bg); color:var(--green); }

  .quick-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:560px){ .quick-grid{ grid-template-columns:1fr 1fr; } }
  .quick-btn{
    background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    padding:12px 10px; cursor:pointer; display:flex; align-items:center; gap:8px;
    font-family:inherit; font-size:12.3px; font-weight:700; color:var(--text2);
    text-decoration:none; transition:all .2s; min-width:0; overflow:hidden;
  }
  .quick-btn:hover{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .quick-icon{ width:28px; height:28px; border-radius:8px; background:var(--blue-bg); color:var(--blue); display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
  .quick-btn:hover .quick-icon{ background:var(--gold); color:#fff; }
  .quick-label{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @media print{
    #pbs-sidebar, #pbs-topbar, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div>
        <div class="section-title">Pool Bar Overview</div>
        <div class="kpi-row" id="kpiRow"></div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Revenue Breakdown — Today</div>
            <button class="panel-action" onclick="location.href='poolbar-reports.html'">Full Report →</button>
          </div>
          <div class="rev-total" id="revTotal">₦0</div>
          <div class="rev-sub-label">Pool Bar sales, from drinks served today</div>
          <div id="revBars"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Pool Bar Stock Status</div>
            <button class="panel-action" onclick="location.href='poolbar-stock.html'">View All →</button>
          </div>
          <div id="stockSnap"></div>
        </div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Pending Requisitions from Store</div>
            <button class="panel-action" onclick="location.href='poolbar-pending-requisitions.html'">Review All →</button>
          </div>
          <div id="pendingReq"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Low Stock Alerts</div>
            <button class="panel-action" onclick="location.href='poolbar-stock.html'">Open Stock →</button>
          </div>
          <div id="lowStock"></div>
        </div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Recent Sales</div>
            <button class="panel-action" onclick="location.href='poolbar-sales.html'">View All →</button>
          </div>
          <div id="recentSales"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Quick Actions</div></div>
          <div class="quick-grid">
            <a class="quick-btn" href="poolbar-pending-requisitions.html" title="Pending Requisitions">
              <span class="quick-icon"><i class="fa-solid fa-truck"></i></span>
              <span class="quick-label">Pending Requisitions</span>
            </a>
            <a class="quick-btn" href="poolbar-orders.html" title="Open POS">
              <span class="quick-icon"><i class="fa-solid fa-receipt"></i></span>
              <span class="quick-label">Open POS</span>
            </a>
            <a class="quick-btn" href="poolbar-stock.html" title="Pool Bar Stock">
              <span class="quick-icon"><i class="fa-solid fa-box"></i></span>
              <span class="quick-label">Pool Bar Stock</span>
            </a>
            <a class="quick-btn" href="poolbar-requisition-history.html" title="Requisition History">
              <span class="quick-icon"><i class="fa-solid fa-clock-rotate-left"></i></span>
              <span class="quick-label">Requisition History</span>
            </a>
            <a class="quick-btn" href="poolbar-reports.html" title="Daily Report">
              <span class="quick-icon"><i class="fa-solid fa-chart-column"></i></span>
              <span class="quick-label">Daily Report</span>
            </a>
            <a class="quick-btn" href="javascript:window.print()" title="Print Report">
              <span class="quick-icon"><i class="fa-solid fa-print"></i></span>
              <span class="quick-label">Print Report</span>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../component/poolbar-shell.js"></script>
<script>
const shell = PoolBarShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'poolbar-dashboard.html',
  pageTitle:     'Dashboard',
  pageSubtitle:  'Pool Bar operations overview',
  apiMode:       'Demo',
  user:          { name: 'Pool Bar Manager', initials: 'PB' },
});

const CFG = { API_BASE:'', API_KEY:'', USE_DEMO:true };

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared}; }
};

async function apiFetch(method, path){
  if (!CFG.API_BASE) throw new Error('No API_BASE configured');
  const opts = { method, headers:{ 'Content-Type':'application/json' } };
  if (CFG.API_KEY) opts.headers['Authorization'] = `Bearer ${CFG.API_KEY}`;
  const res = await fetch(CFG.API_BASE + path, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

const KEY_STOCK    = 'poolbar-stock';
const KEY_PENDING  = 'poolbar-pending-requisitions';
const KEY_SALES    = 'poolbar-sales';

const DEMO_STOCK = [
  { name:'Heineken',       category:'Beers',      unit:'Bottles', qty:48, min:12, batch:'REQ-00031', received:'17/07/26', price:1500 },
  { name:'Guinness',       category:'Beers',      unit:'Bottles', qty:36, min:12, batch:'REQ-00031', received:'17/07/26', price:1600 },
  { name:'Star Lager',     category:'Beers',      unit:'Bottles', qty:8,  min:12, batch:'REQ-00029', received:'15/07/26', price:1200 },
  { name:'Hennessy VS',    category:'Spirits',    unit:'Bottles', qty:5,  min:3,  batch:'REQ-00027', received:'14/07/26', price:4000 },
];
const DEMO_PENDING = [
  { no:'REQ-00034', item:'Moët & Chandon', qty:6,  unit:'Bottles', from:'Main Store', sentBy:'Store Keeper', date:'17/07/26 09:40 AM', prodNo:'STK-00512' },
  { no:'REQ-00035', item:'Bottled Water',  qty:48, unit:'Bottles', from:'Main Store', sentBy:'Store Keeper', date:'17/07/26 10:10 AM', prodNo:'STK-00518' },
];
const DEMO_SALES = [
  { id:'PBS-1021', item:'Heineken',  qty:3, total:4500,  method:'Cash',     time:'11:15 AM' },
  { id:'PBS-1020', item:'Mojito',    qty:2, total:11000, method:'POS',      time:'10:50 AM' },
  { id:'PBS-1019', item:'Chapman',   qty:1, total:2500,  method:'Transfer', time:'09:40 AM' },
];

function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function stockLevel(i){ return i.qty<=0 ? 'out' : (i.qty<=i.min ? 'low' : 'ok'); }
const LEVEL_CHIP  = { ok:'chip-ok', low:'chip-low', out:'chip-out' };
const LEVEL_LABEL = { ok:'In Stock', low:'Low', out:'Out of Stock' };

async function loadShared(key, fallback){
  try {
    const r = await storage.get(key, true);
    if (r && r.value) { const parsed = JSON.parse(r.value); if (Array.isArray(parsed) && parsed.length) return parsed; }
  } catch(e){}
  return fallback;
}

function renderKPIs(stock, pending, sales){
  const pendingN = pending.length;
  const lowStock = stock.filter(i => stockLevel(i) !== 'ok').length;
  const today    = sales.reduce((s,x)=>s+x.total,0);
  const units    = stock.reduce((s,i)=>s+i.qty,0);

  document.getElementById('kpiRow').innerHTML = `
    <a class="kpi-card" href="poolbar-pending-requisitions.html">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-truck"></i></div><div class="kpi-label">Pending Requisitions</div></div>
      <div class="kpi-value" style="color:var(--blue);">${pendingN}</div>
      <div class="kpi-trend ${pendingN>0?'warn':'up'}">${pendingN>0?'Awaiting review':'All clear'}</div>
    </a>
    <a class="kpi-card" href="poolbar-stock.html">
      <div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="kpi-label">Low Stock Alerts</div></div>
      <div class="kpi-value" style="color:var(--amber);">${lowStock}</div>
      <div class="kpi-trend ${lowStock>0?'warn':'up'}">${lowStock>0?'Needs restocking':'All above threshold'}</div>
    </a>
    <a class="kpi-card" href="poolbar-sales.html">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-naira-sign"></i></div><div class="kpi-label">Today's Sales</div></div>
      <div class="kpi-value">${fmtN(today)}</div>
      <div class="kpi-trend up">${sales.length} sale${sales.length!==1?'s':''} recorded</div>
    </a>
    <a class="kpi-card" href="poolbar-stock.html">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-box"></i></div><div class="kpi-label">Units On Hand</div></div>
      <div class="kpi-value">${units}</div>
      <div class="kpi-trend">Across ${stock.length} items</div>
    </a>`;

  shell.setPendingBadge(pendingN);
}

function renderRevenue(sales){
  const total = sales.reduce((s,x)=>s+x.total,0);
  const byMethod = {};
  sales.forEach(s => { byMethod[s.method] = (byMethod[s.method]||0) + s.total; });
  const max = Math.max(...Object.values(byMethod), 1);
  const colorCls = { Cash:'', POS:'blue', Transfer:'purple' };

  document.getElementById('revTotal').textContent = fmtN(total);
  document.getElementById('revBars').innerHTML = Object.entries(byMethod).length === 0
    ? `<div class="empty-note">No sales recorded today.</div>`
    : Object.entries(byMethod).map(([m,v]) => `
      <div class="bar-row">
        <div class="bar-meta"><span class="bar-name">${m}</span><span class="bar-count">${fmtN(v)}</span></div>
        <div class="bar-track"><div class="bar-fill ${colorCls[m]||''}" style="width:${Math.round(v/max*100)}%"></div></div>
      </div>`).join('');
}

function renderStockSnapshot(stock){
  const el = document.getElementById('stockSnap');
  el.innerHTML = stock.length === 0
    ? `<div class="empty-note">No items in Pool Bar Stock yet.</div>`
    : stock.map(i => { const lvl = stockLevel(i); return `
      <a class="list-row" href="poolbar-stock.html">
        <span class="list-dot" style="background:${lvl==='ok'?'var(--green)':lvl==='low'?'var(--amber)':'var(--red)'}"></span>
        <div class="list-body"><div class="list-name">${i.name}</div><div class="list-meta">${i.qty} ${i.unit} on hand · batch ${i.batch}</div></div>
        <span class="chip ${LEVEL_CHIP[lvl]}"><i class="fa-solid fa-circle"></i>${LEVEL_LABEL[lvl]}</span>
      </a>`; }).join('');
}

function renderPendingRequisitions(pending){
  const el = document.getElementById('pendingReq');
  el.innerHTML = pending.length === 0
    ? `<div class="empty-note">No requisitions awaiting review.</div>`
    : pending.map(p => `
      <a class="list-row" href="poolbar-pending-requisitions.html">
        <span class="list-dot" style="background:var(--blue)"></span>
        <div class="list-body"><div class="list-name">${p.no} — ${p.item}</div><div class="list-meta">${p.qty} ${p.unit} · from ${p.from} · ${p.date}</div></div>
        <span class="chip chip-sent"><i class="fa-solid fa-circle"></i>Sent</span>
      </a>`).join('');
}

function renderLowStock(stock){
  const el = document.getElementById('lowStock');
  const alerts = stock.filter(i => stockLevel(i) !== 'ok');
  el.innerHTML = alerts.length === 0
    ? `<div class="empty-note">All items above their reorder threshold.</div>`
    : alerts.map(i => { const lvl = stockLevel(i); return `
      <a class="list-row" href="poolbar-stock.html">
        <span class="list-dot" style="background:${lvl==='out'?'var(--red)':'var(--amber)'}"></span>
        <div class="list-body"><div class="list-name">${i.name}</div><div class="list-meta">${i.qty} ${i.unit} on hand · reorder at ${i.min}</div></div>
        <span class="chip ${lvl==='out'?'chip-out':'chip-low'}"><i class="fa-solid fa-circle"></i>${lvl==='out'?'OUT':'LOW'}</span>
      </a>`; }).join('');
}

function renderRecentSales(sales){
  const el = document.getElementById('recentSales');
  el.innerHTML = sales.length === 0
    ? `<div class="empty-note">No sales recorded yet today.</div>`
    : sales.map(s => `
      <a class="list-row" href="poolbar-sales.html">
        <span class="list-dot" style="background:var(--gold)"></span>
        <div class="list-body"><div class="list-name">${s.id} — ${s.item} ×${s.qty}</div><div class="list-meta">${s.method} · ${s.time}</div></div>
        <span style="font-size:12.5px;font-weight:700;color:var(--gold);flex-shrink:0;">${fmtN(s.total)}</span>
      </a>`).join('');
}

async function init(){
  let stock, pending, sales;
  if (!CFG.USE_DEMO) {
    try {
      const data = await apiFetch('GET', '/api/poolbar/dashboard-summary');
      stock = data.stock; pending = data.pending; sales = data.sales;
      shell.setApiMode('Live');
    } catch(e) { console.warn('[API] Falling back to local demo data:', e.message); }
  }
  if (!stock)   stock   = await loadShared(KEY_STOCK, DEMO_STOCK);
  if (!pending) pending = await loadShared(KEY_PENDING, DEMO_PENDING);
  if (!sales)   sales   = await loadShared(KEY_SALES, DEMO_SALES);

  renderKPIs(stock, pending, sales);
  renderRevenue(sales);
  renderStockSnapshot(stock);
  renderPendingRequisitions(pending);
  renderLowStock(stock);
  renderRecentSales(sales);
}
init();
</script>
</body>
</html>
