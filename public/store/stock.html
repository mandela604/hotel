<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stock | Grace Hotel HMS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  font-size:13px; transition:background .3s,color .3s;
}
.app{ display:flex; height:100vh; overflow:hidden; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
@media (max-width:768px){ .main{ margin-left:0 !important; } }

/* ── Content area — same light palette + tokens as guests.html / booking-list.html ── */
.content{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
  --border:#eef0f6; --border2:#dfe3ec;
  --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
  --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
  --green:#12b76a; --green-bg:#e9f9f0;
  --red:#f04438;  --red-bg:#feecec;
  --amber:#f79009; --amber-bg:#fff4e5;
  --blue:#2f6fed;  --blue-bg:#eaf1ff;
  --purple:#8b5cf6; --purple-bg:#f4efff;
  --pink:#ec4899; --pink-bg:#fdf2f8;
  flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; gap:16px; min-height:0;
  background:var(--bg); color:var(--text);
}
@media (max-width:768px){ .content{ padding:16px 16px 24px; } }
@media (max-width:480px){ .content{ padding:14px 12px 20px; } }

/* ── KPI cards — identical to guests.html / booking-list.html ── */
.kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
@media (max-width:900px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
.kpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px 14px 12px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s;
  display:flex; flex-direction:column; animation:fadeUp .4s ease both;
}
.kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
.kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
.kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
.kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
.kpi-card.acc-green::before{  background:linear-gradient(90deg,var(--green),transparent); }
.kpi-card.acc-amber::before{  background:linear-gradient(90deg,var(--amber),transparent); }
.kpi-card.acc-red::before{    background:linear-gradient(90deg,var(--red),transparent); }
.kpi-card.acc-blue::before{   background:linear-gradient(90deg,var(--blue),transparent); }
.kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
.kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.ic-blue{  background:var(--blue-bg);  color:var(--blue);  }
.ic-green{ background:var(--green-bg); color:var(--green); }
.ic-amber{ background:var(--amber-bg); color:var(--amber); }
.ic-red{   background:var(--red-bg);   color:var(--red);   }
.kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
.kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
@media (max-width:420px){ .kpi-value{ font-size:18px; } }
.kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
.kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); }

/* ── Toolbar / filter card — same as guests.html ── */
.toolbar{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; flex-shrink:0;
}
.toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; justify-content:space-between; }
.toolbar-left{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; flex:1; min-width:0; }
.toolbar-right{ display:flex; gap:8px; flex-shrink:0; }
.flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:700; padding-left:2px; }
.search-box{
  display:flex; align-items:center; gap:7px; background:var(--surface2);
  border:1px solid var(--border); border-radius:10px; padding:8px 12px;
  transition:border-color .2s; min-width:200px; max-width:280px; flex:1;
}
.search-box:focus-within{ border-color:var(--gold-border); }
.search-box input{ background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; font-family:inherit; }
.search-box input::placeholder{ color:var(--text3); }
.filter-select{
  background:var(--surface2); border:1px solid var(--border); border-radius:10px;
  padding:8px 10px; color:var(--text); font-size:12.5px; cursor:pointer;
  outline:none; transition:border-color .2s; color-scheme:light; font-family:inherit;
}
.filter-select:focus{ border-color:var(--gold-border); }
.btn-ghost{ background:none; border:none; color:var(--text3); font-size:11.5px; font-weight:700; cursor:pointer; padding:8px 6px; display:inline-flex; align-items:center; gap:5px; font-family:inherit; }
.btn-ghost:hover{ color:var(--gold); }
.btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; font-family:inherit; }
.btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
.btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
.btn-primary{ background:var(--gold); color:#fff; font-weight:700; }
.btn-primary:hover{ background:var(--gold-light); }
.btn-sm{ padding:6px 12px; font-size:11.5px; }
@media (max-width:900px){
  .toolbar-row{ flex-direction:column; align-items:stretch; }
  .toolbar-left{ flex-direction:column; align-items:stretch; }
  .toolbar-right{ width:100%; }
  .toolbar-right .btn{ flex:1; justify-content:center; }
  .flt-group{ width:100%; }
  .search-box{ max-width:100%; }
  .filter-select{ width:100%; }
}

/* status chips — level filter row, same pattern as booking-list.html */
.status-chips{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
.status-chips::-webkit-scrollbar{ height:0; }
.sc-btn{ flex-shrink:0; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:5px 13px; font-size:11.5px; font-weight:600; color:var(--text2); cursor:pointer; transition:all .2s; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
.sc-btn:hover, .sc-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
.sc-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* ── Panel ── */
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; flex-shrink:0; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
.panel-title{ font-size:13px; font-weight:800; color:var(--text); }
.panel-count{ font-size:11.5px; color:var(--text3); font-weight:600; white-space:nowrap; }

/* ── Table ── */
.tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:900px; }
thead th{
  text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase;
  letter-spacing:1.5px; color:var(--text3); font-weight:700;
  background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap;
}
thead th.center{ text-align:center; }
tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; }
tbody tr:last-child{ border-bottom:none; }
tbody tr:hover{ background:var(--surface2); }
tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; }
tbody td.center{ text-align:center; }
.item-name{ font-weight:700; }
.cat-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text2); }
.cat-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; white-space:nowrap; }
.chip i{ font-size:6px; }
.chip-ok{ background:var(--green-bg); color:var(--green); }
.chip-low{ background:var(--amber-bg); color:var(--amber); }
.chip-out{ background:var(--red-bg); color:var(--red); }
.act-btns{ display:flex; gap:5px; flex-wrap:nowrap; justify-content:center; }
.act-btn{ background:none; border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:11px; font-weight:600; color:var(--text2); cursor:pointer; transition:all .15s; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; font-family:inherit; }
.act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
.act-btn.danger:hover{ border-color:rgba(240,68,56,0.4); color:var(--red); }
.empty-row td{ text-align:center; padding:32px; color:var(--text3); }
tfoot td{ padding:11px 14px; font-weight:800; font-size:12.5px; color:var(--text); background:var(--surface2); border-top:1px solid var(--border); white-space:nowrap; }

/* mobile cards — same pattern as guests.html */
@media (max-width:960px){
  .tbl-wrap{ overflow-x:visible; }
  table{ min-width:0; width:100%; }
  thead{ display:none; }
  table, tbody, tr, td{ display:block; width:100%; }
  tfoot{ display:none; }
  tbody tr{ background:var(--surface2); border:1px solid var(--border); border-radius:12px; margin:0 0 10px; padding:6px 14px; }
  tbody tr:last-child{ margin-bottom:0; }
  tbody td{ border:none; padding:8px 0; white-space:normal !important; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; text-align:right; }
  tbody td:not(:last-child){ border-bottom:1px dashed var(--border); }
  tbody td::before{ content:attr(data-label); font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:700; flex-shrink:0; text-align:left; padding-top:1px; }
  tbody td .act-btns{ justify-content:flex-end; }
  .empty-row{ display:block; }
  .empty-row td{ display:block; text-align:center; }
  .empty-row td::before{ content:none; }
}
@media (max-width:420px){
  tbody tr{ padding:4px 10px; }
  tbody td{ font-size:12px; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; }
  tbody td::before{ padding-top:0; }
}

/* ── Pagination ── */
.pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
.page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
.page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; padding:0 7px; font-family:inherit; }
.page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
.page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:700; }
.page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

/* ── Modal ── */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(15,20,40,0.55); backdrop-filter:blur(4px); z-index:300;
  align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto;
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
}
.modal-overlay.show{ display:flex; }
.modal{ background:#fff; border:1px solid #eef0f6; border-radius:18px; padding:24px; width:min(520px,96vw); box-shadow:0 30px 80px rgba(15,20,40,0.25); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; color:#1c2440; }
.modal-sm{ width:min(380px,96vw); }
@keyframes modalIn{ from{opacity:0;transform:translateY(14px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
.modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.modal-title{ font-size:18px; font-weight:800; color:#1c2440; }
.modal-close{ background:#f4f6fb; border:1px solid #eef0f6; border-radius:8px; width:30px; height:30px; color:#6b7280; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; }
.modal-close:hover{ color:var(--red); border-color:rgba(240,68,56,0.3); }
.form-section-title{ font-size:9px; text-transform:uppercase; letter-spacing:2px; color:var(--gold); font-weight:800; margin-bottom:10px; padding-bottom:7px; border-bottom:1px solid var(--gold-border); }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
@media (max-width:480px){ .form-row{ grid-template-columns:1fr; } }
.form-group{ display:flex; flex-direction:column; gap:5px; }
.form-group.span2{ grid-column:span 2; }
@media (max-width:480px){ .form-group.span2{ grid-column:span 1; } }
.form-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.2px; color:#9aa1b3; font-weight:700; }
.form-input, .form-select{ background:#f4f6fb; border:1px solid #eef0f6; border-radius:9px; padding:9px 12px; color:#1c2440; font-family:inherit; font-size:13px; outline:none; transition:border-color .2s; width:100%; }
.form-input:focus, .form-select:focus{ border-color:var(--gold-border); }
.modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid #eef0f6; flex-wrap:wrap; }
.val-note{ font-size:12.5px; color:#6b7280; margin-bottom:14px; line-height:1.6; }
.val-note strong{ color:#1c2440; }

/* toast */
.toast{ position:fixed; bottom:20px; right:20px; background:var(--surface,#fff); border:1px solid var(--border,#eef0f6); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text,#1c2440); box-shadow:var(--shadow-lg,0 8px 28px rgba(15,34,55,.15)); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); font-family:inherit; }
.toast.success{ border-left:3px solid var(--green,#12b76a); }
.toast.error{   border-left:3px solid var(--red,#f04438); }
.toast.info{    border-left:3px solid var(--blue,#2f6fed); }
@keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@media (max-width:480px){ .toast{ left:12px; right:12px; bottom:12px; max-width:none; } }

::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
@keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

@media print{
  #sidebarSlot,#topbarSlot,.toolbar,.status-chips,.act-btns,.pagination,.modal-overlay{ display:none !important; }
  .main{ margin-left:0 !important; }
  body{ background:#fff !important; color:#000 !important; }
  .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
  .tbl-wrap{ overflow:visible !important; }
  table{ min-width:0 !important; }
  thead{ display:table-header-group !important; }
  table,tbody,tr,td{ display:revert !important; }
  tbody td::before{ display:none !important; }
}
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <div class="toolbar no-print">
        <div class="toolbar-row">
          <div class="toolbar-left">
            <div class="flt-group" style="flex:1;min-width:200px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px"></i>
                <input type="text" id="fSearch" placeholder="Item name…" oninput="page=1;render()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Category</span>
              <select class="filter-select" id="fCat" onchange="page=1;render()">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Sort</span>
              <select class="filter-select" id="fSort" onchange="page=1;render()">
                <option value="name_asc">Name A–Z</option>
                <option value="qty_asc">Lowest Stock First</option>
                <option value="value_desc">Highest Value First</option>
              </select>
            </div>
            <button class="btn-ghost" onclick="clearFilters()"><i class="fa-solid fa-xmark"></i> Clear</button>
          </div>
          <div class="toolbar-right">
            <button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
            <button class="btn btn-primary btn-sm" onclick="openItemModal()"><i class="fa-solid fa-plus"></i> Add Item</button>
          </div>
        </div>
        <div class="status-chips" id="levelTabs"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Stock Items</div>
          <span class="panel-count" id="tableCount">—</span>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th class="center">Unit</th>
                <th class="center">On Hand</th>
                <th class="center">Reorder Level</th>
                <th class="center">Unit Cost (₦)</th>
                <th class="center">Total Value (₦)</th>
                <th class="center">Status</th>
                <th class="center no-print">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
            <tfoot>
              <tr>
                <td colspan="6">Total Value (Filtered)</td>
                <td class="center" id="footTotal">₦0</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="pagination">
          <span id="paginLabel">—</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ADD / EDIT ITEM MODAL -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="itemModalTitle">Add Stock Item</div>
      <button class="modal-close" onclick="closeModal('itemModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-section-title">Item Details</div>
    <div class="form-row">
      <div class="form-group span2">
        <label class="form-label">Item Name</label>
        <input class="form-input" type="text" id="fName" placeholder="e.g. Rice (Long Grain)">
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-select" id="fItemCat">
          <option>Food</option><option>Beverages</option><option>Cleaning Supplies</option>
          <option>Linen & Amenities</option><option>Equipment</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Unit</label>
        <select class="form-select" id="fUnit">
          <option>kg</option><option>Ltr</option><option>Bottles</option><option>Cans</option>
          <option>Pieces</option><option>Packs</option><option>Cartons</option><option>Bags</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Quantity On Hand</label>
        <input class="form-input" type="number" id="fQty" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Reorder Level</label>
        <input class="form-input" type="number" id="fReorder" placeholder="0" min="0">
      </div>
      <div class="form-group span2">
        <label class="form-label">Unit Cost (₦)</label>
        <input class="form-input" type="number" id="fCost" placeholder="0" min="0">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('itemModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem()"><i class="fa-solid fa-check"></i> Save Item</button>
    </div>
  </div>
</div>

<!-- RESTOCK MODAL -->
<div class="modal-overlay" id="restockModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">Restock Item</div>
      <button class="modal-close" onclick="closeModal('restockModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="val-note">Adding stock for <strong id="restockName"></strong> — currently <strong id="restockCurrent"></strong> on hand.</div>
    <div class="form-group">
      <label class="form-label">Quantity to Add</label>
      <input class="form-input" type="number" id="restockQty" placeholder="0" min="1">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('restockModal')">Cancel</button>
      <button class="btn btn-primary" onclick="confirmRestock()"><i class="fa-solid fa-plus"></i> Add Stock</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--red);">Delete Item</div>
      <button class="modal-close" onclick="closeModal('deleteModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p class="val-note" id="deleteMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('deleteModal')">Cancel</button>
      <button class="act-btn danger" style="padding:9px 16px;font-size:13px;" onclick="confirmDelete()"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
  </div>
</div>

<script src="../component/store-shell.js"></script>
<script type="module">
import { getStoreData, saveStock } from '../services/store-data.js';

/* ═══════════════════════════════════════════
   Shell — sidebar + topbar. Page-specific topbar buttons (Print, Add
   Item) go through topbarActionsHtml since the shell only owns the
   generic chrome (title, date, API badge) — same pattern as every
   other Store page.
═══════════════════════════════════════════ */
const shell = GraceStoreShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'stock.html',
  pageTitle:     'Stock',
  pageSubtitle:  'Central Store inventory — on-hand quantities, reorder levels and value',
  apiMode:       'Demo',
  user:          { name: 'Store Manager', initials: 'SM' },
});

/* ═══════════════════════════════════════════
   DATA — sourced from the shared store-data.js service, same as
   dashboard.html / all-requisitions.html. STOCK is kept in memory
   here and pushed back through saveStock() after every change.
═══════════════════════════════════════════ */
const PAGE_SIZE = 10;
let STOCK = [];

function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function stockLevel(s){ return s.qty<=0 ? 'out' : (s.qty<=s.reorder ? 'low' : 'ok'); }
function itemValue(s){ return s.qty * s.cost; }
function genId(){ return 's' + Date.now(); }

const CAT_COLOR = {
  'Food':'var(--green)', 'Beverages':'var(--blue)', 'Cleaning Supplies':'var(--amber)',
  'Linen & Amenities':'var(--pink)', 'Equipment':'var(--purple)', 'Other':'var(--text3)'
};
const LEVEL_LABEL = { ok:'In Stock', low:'Low Stock', out:'Out of Stock' };
const LEVEL_CHIP  = { ok:'chip-ok', low:'chip-low', out:'chip-out' };
const LEVEL_TABS  = [
  {k:'',    l:'All',           dot:'var(--gold)'},
  {k:'ok',  l:'In Stock',      dot:'var(--green)'},
  {k:'low', l:'Low Stock',     dot:'var(--amber)'},
  {k:'out', l:'Out of Stock',  dot:'var(--red)'},
];

let page = 1;
let activeLevel = '';

async function persistStock(){
  try { await saveStock(STOCK); }
  catch(e){ showToast(e.message || 'Failed to save stock.', 'error'); }
}

/* ═══════════════════════════════════════════
   KPIs
═══════════════════════════════════════════ */
function renderKPIs(){
  const total = STOCK.length;
  const low   = STOCK.filter(s=>stockLevel(s)==='low').length;
  const out   = STOCK.filter(s=>stockLevel(s)==='out').length;
  const value = STOCK.reduce((sum,s)=>sum+itemValue(s),0);

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card acc-blue">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-boxes-stacked"></i></div><div class="kpi-label">Total SKUs</div></div>
      <div class="kpi-value" style="color:var(--blue)">${total}</div>
      <div class="kpi-trend neutral">Across ${new Set(STOCK.map(s=>s.cat)).size} categories</div>
    </div>
    <div class="kpi-card acc-amber" onclick="setLevel('low')">
      <div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="kpi-label">Low Stock</div></div>
      <div class="kpi-value" style="color:var(--amber)">${low}</div>
      <div class="kpi-trend ${low>0?'warn':'up'}">${low>0?'Needs reordering':'All above threshold'}</div>
    </div>
    <div class="kpi-card acc-red" onclick="setLevel('out')">
      <div class="kpi-top"><div class="kpi-ic ic-red"><i class="fa-solid fa-ban"></i></div><div class="kpi-label">Out of Stock</div></div>
      <div class="kpi-value" style="color:var(--red)">${out}</div>
      <div class="kpi-trend ${out>0?'down':'up'}">${out>0?'Unavailable to issue':'None'}</div>
    </div>
    <div class="kpi-card acc-green">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Total Stock Value</div></div>
      <div class="kpi-value" style="color:var(--green);font-size:${value>=1000000?'17px':'22px'}">${fmtN(value)}</div>
      <div class="kpi-trend up">At current unit cost</div>
    </div>`;
}

/* ═══════════════════════════════════════════
   CATEGORY FILTER
═══════════════════════════════════════════ */
function populateCategoryFilter(){
  const sel = document.getElementById('fCat');
  const cur = sel.value;
  const cats = [...new Set(STOCK.map(s=>s.cat))].sort();
  sel.innerHTML = '<option value="">All Categories</option>' + cats.map(c=>`<option${c===cur?' selected':''}>${c}</option>`).join('');
}

/* ═══════════════════════════════════════════
   LEVEL TABS
═══════════════════════════════════════════ */
function renderLevelTabs(){
  document.getElementById('levelTabs').innerHTML = LEVEL_TABS.map(t => `
    <button class="sc-btn ${t.k===activeLevel?'active':''}" onclick="setLevel('${t.k}')">
      <span class="sc-dot" style="background:${t.dot}"></span>${t.l}
    </button>`).join('');
}
window.setLevel = function(k){ activeLevel = k; page = 1; render(); };

window.clearFilters = function(){
  document.getElementById('fSearch').value = '';
  document.getElementById('fCat').value = '';
  document.getElementById('fSort').value = 'name_asc';
  activeLevel = '';
  page = 1;
  render();
};

/* ═══════════════════════════════════════════
   FILTER / SORT
═══════════════════════════════════════════ */
function getFiltered(){
  const q    = document.getElementById('fSearch').value.toLowerCase();
  const cat  = document.getElementById('fCat').value;
  const sort = document.getElementById('fSort').value;

  let rows = STOCK.filter(s => {
    const mq = !q || s.name.toLowerCase().includes(q);
    const mc = !cat || s.cat === cat;
    const ml = !activeLevel || stockLevel(s) === activeLevel;
    return mq && mc && ml;
  });

  if (sort === 'name_asc') rows.sort((a,b)=>a.name.localeCompare(b.name));
  else if (sort === 'qty_asc') rows.sort((a,b)=>a.qty-b.qty);
  else if (sort === 'value_desc') rows.sort((a,b)=>itemValue(b)-itemValue(a));

  return rows;
}

/* ═══════════════════════════════════════════
   PAGINATION
═══════════════════════════════════════════ */
function renderPagination(total){
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const from = total === 0 ? 0 : (page-1)*PAGE_SIZE + 1;
  const to   = Math.min(page*PAGE_SIZE, total);
  document.getElementById('paginLabel').textContent = total === 0 ? 'No records' : `${from}–${to} of ${total}`;
  const wrap = document.getElementById('pageBtns');
  wrap.innerHTML = '';
  function mk(html, p, dis, active){
    const b = document.createElement('button');
    b.className = 'page-btn'+(active?' active':'');
    b.innerHTML = html; b.disabled = !!dis;
    b.onclick = () => { page = p; render(); };
    return b;
  }
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-left" style="font-size:9px"></i>', page-1, page===1, false));
  let start = Math.max(1, page-2), end = Math.min(totalPages, start+4);
  start = Math.max(1, end-4);
  for (let i=start;i<=end;i++) wrap.appendChild(mk(i, i, false, i===page));
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-right" style="font-size:9px"></i>', page+1, page>=totalPages, false));
}

/* ═══════════════════════════════════════════
   RENDER TABLE
═══════════════════════════════════════════ */
function render(){
  renderLevelTabs();
  const rows = getFiltered();
  document.getElementById('tableCount').textContent = rows.length + ' item' + (rows.length!==1?'s':'');

  const start = (page-1)*PAGE_SIZE;
  const pageRows = rows.slice(start, start+PAGE_SIZE);

  document.getElementById('tbody').innerHTML = pageRows.length === 0
    ? `<tr class="empty-row"><td colspan="9">No stock items match your filters.</td></tr>`
    : pageRows.map(s => {
        const lvl = stockLevel(s);
        return `<tr>
          <td class="item-name" data-label="Item">${s.name}</td>
          <td data-label="Category"><span class="cat-chip"><span class="cat-dot" style="background:${CAT_COLOR[s.cat]||'var(--text3)'}"></span>${s.cat}</span></td>
          <td class="center" data-label="Unit">${s.unit}</td>
          <td class="center" data-label="On Hand">${s.qty}</td>
          <td class="center" data-label="Reorder Level">${s.reorder}</td>
          <td class="center" data-label="Unit Cost">${fmtN(s.cost)}</td>
          <td class="center" data-label="Total Value">${fmtN(itemValue(s))}</td>
          <td class="center" data-label="Status"><span class="chip ${LEVEL_CHIP[lvl]}"><i class="fa-solid fa-circle"></i>${LEVEL_LABEL[lvl]}</span></td>
          <td class="center no-print" data-label="Actions">
            <div class="act-btns">
              <button class="act-btn" onclick="openRestockModal('${s.id}')"><i class="fa-solid fa-plus"></i> Restock</button>
              <button class="act-btn" onclick="openItemModal('${s.id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="act-btn danger" onclick="openDeleteModal('${s.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </td>
        </tr>`;
      }).join('');

  document.getElementById('footTotal').textContent = fmtN(rows.reduce((sum,s)=>sum+itemValue(s),0));
  renderPagination(rows.length);
}

/* ═══════════════════════════════════════════
   ADD / EDIT MODAL
═══════════════════════════════════════════ */
let editItemId = null;
window.openItemModal = function(id=null){
  editItemId = id;
  const isEdit = !!id;
  document.getElementById('itemModalTitle').textContent = isEdit ? 'Edit Stock Item' : 'Add Stock Item';
  if (isEdit) {
    const s = STOCK.find(x=>x.id===id);
    document.getElementById('fName').value = s.name;
    document.getElementById('fItemCat').value = s.cat;
    document.getElementById('fUnit').value = s.unit;
    document.getElementById('fQty').value = s.qty;
    document.getElementById('fReorder').value = s.reorder;
    document.getElementById('fCost').value = s.cost;
  } else {
    document.getElementById('fName').value = '';
    document.getElementById('fItemCat').value = 'Food';
    document.getElementById('fUnit').value = 'kg';
    document.getElementById('fQty').value = '';
    document.getElementById('fReorder').value = '';
    document.getElementById('fCost').value = '';
  }
  document.getElementById('itemModal').classList.add('show');
};

window.saveItem = async function(){
  const name = document.getElementById('fName').value.trim();
  if (!name) { showToast('Please enter an item name.', 'error'); return; }
  const entry = {
    id: editItemId || genId(),
    name,
    cat: document.getElementById('fItemCat').value,
    unit: document.getElementById('fUnit').value,
    qty: parseFloat(document.getElementById('fQty').value) || 0,
    reorder: parseFloat(document.getElementById('fReorder').value) || 0,
    cost: parseFloat(document.getElementById('fCost').value) || 0,
  };
  if (editItemId) {
    const idx = STOCK.findIndex(s=>s.id===editItemId);
    STOCK[idx] = entry;
    showToast('Item updated.', 'success');
  } else {
    STOCK.push(entry);
    showToast('Item added.', 'success');
  }
  closeModal('itemModal');
  populateCategoryFilter();
  renderKPIs();
  render();
  await persistStock();
};

/* ═══════════════════════════════════════════
   RESTOCK MODAL
═══════════════════════════════════════════ */
let restockId = null;
window.openRestockModal = function(id){
  restockId = id;
  const s = STOCK.find(x=>x.id===id);
  document.getElementById('restockName').textContent = s.name;
  document.getElementById('restockCurrent').textContent = `${s.qty} ${s.unit}`;
  document.getElementById('restockQty').value = '';
  document.getElementById('restockModal').classList.add('show');
};
window.confirmRestock = async function(){
  const add = parseFloat(document.getElementById('restockQty').value) || 0;
  if (add < 1) { showToast('Enter a valid quantity.', 'error'); return; }
  const s = STOCK.find(x=>x.id===restockId);
  s.qty += add;
  closeModal('restockModal');
  showToast(`Added ${add} ${s.unit} of ${s.name}.`, 'success');
  renderKPIs();
  render();
  await persistStock();
};

/* ═══════════════════════════════════════════
   DELETE MODAL
═══════════════════════════════════════════ */
let deleteId = null;
window.openDeleteModal = function(id){
  deleteId = id;
  const s = STOCK.find(x=>x.id===id);
  document.getElementById('deleteMsg').textContent = `Delete "${s.name}" from stock? This cannot be undone.`;
  document.getElementById('deleteModal').classList.add('show');
};
window.confirmDelete = async function(){
  const s = STOCK.find(x=>x.id===deleteId);
  STOCK = STOCK.filter(x=>x.id!==deleteId);
  closeModal('deleteModal');
  showToast(`"${s.name}" removed.`, 'error');
  populateCategoryFilter();
  renderKPIs();
  render();
  await persistStock();
};

/* ═══════════════════════════════════════════
   MODAL HELPERS
═══════════════════════════════════════════ */
window.closeModal = function(id){ document.getElementById(id).classList.remove('show'); };
['itemModal','restockModal','deleteModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e){ if (e.target===this) closeModal(id); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') ['itemModal','restockModal','deleteModal'].forEach(closeModal); });

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
function showToast(msg, type='success'){
  const icon = type==='success'?'fa-circle-check':type==='error'?'fa-circle-xmark':'fa-circle-info';
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = '<i class="fa-solid '+icon+'"></i> '+msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3400);
}

/* ═══════════════════════════════════════════
   INIT — pulls stock from the shared store-data.js service
═══════════════════════════════════════════ */
async function init(){
  try {
    const { stock } = await getStoreData();
    STOCK = stock;
  } catch (err) {
    console.error('[Stock] Failed to load store data:', err);
    showToast(err.message || 'Failed to load stock data.', 'error');
    STOCK = [];
  }
  populateCategoryFilter();
  renderKPIs();
  render();
}
init();
</script>
</body>
</html>
