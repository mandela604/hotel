<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock | Grace Hotel HMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a84c;
    --gold-light:#e8c96a;
    --gold-dim: rgba(201,168,76,0.12);
    --gold-border: rgba(201,168,76,0.25);
    --navy:#0a1520;
    --green:#4ade80;
    --green-bg: rgba(74,222,128,0.12);
    --amber:#fbbf24;
    --amber-bg: rgba(251,191,36,0.12);
    --red:#f87171;
    --red-bg: rgba(248,113,113,0.12);
    --blue:#60a5fa;
    --blue-bg: rgba(96,165,250,0.12);
    --text-dark:#e8f0f8;
    --text-mid:#a8bece;
    --text-light:#6a8a9e;
    --border:#1e3045;
    --bg:#080f18;
    --white:#111e2b;
    --surface2:#162435;
    --input-bg:#0d1a27;
    --modal-bg:#0c1824;
  }
  /* This page only owns layout + its own KPI/table/modal content now.
     Sidebar + topbar look/markup live entirely in store-shell.js. */
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; overflow:hidden; }
  body{
    font-family: 'Outfit', 'Segoe UI', Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text-dark);
    font-size:14px;
  }
  .app{ display:flex; height:100vh; overflow:hidden; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; }
  @media (max-width: 860px){ .main{ width:100%; } }

  .content{ flex:1; padding:16px 24px 24px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:14px; min-height:0; }
  @media (max-width: 640px){ .content{ padding:14px 14px 20px; } }

  /* KPI */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; flex-shrink:0; }
  @media (max-width: 900px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  .kpi-card{ background:var(--white); border:1px solid var(--border); border-radius:12px; padding:14px 16px; position:relative; overflow:hidden; cursor:pointer; transition:transform .15s, border-color .15s; }
  .kpi-card:hover{ transform:translateY(-2px); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, var(--gold), transparent); }
  .kpi-label{ font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-light); margin-bottom:6px; font-weight:500; }
  .kpi-value{ font-family:'Cormorant Garamond', serif; font-size:24px; font-weight:700; color:var(--text-dark); line-height:1; }
  .kpi-value.amber{ color:var(--amber); } .kpi-value.green{ color:var(--green); } .kpi-value.red{ color:var(--red); } .kpi-value.blue{ color:var(--blue); }
  .kpi-sub{ font-size:10.5px; color:var(--text-light); margin-top:5px; }

  /* Filters card */
  .card{ background:var(--white); border:1px solid var(--border); border-radius:12px; }
  .toolbar{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; padding:16px 18px; flex-shrink:0; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field-label{ font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-light); font-weight:500; }
  .search-wrap{ display:flex; align-items:center; gap:7px; background:var(--input-bg); border:1px solid var(--border); border-radius:8px; padding:8px 12px; min-width:200px; flex:1; max-width:280px; }
  .search-wrap:focus-within{ border-color:var(--gold-border); }
  .search-wrap input{ background:none; border:none; outline:none; color:var(--text-dark); font-family:'Outfit',sans-serif; font-size:13px; width:100%; }
  .search-wrap input::placeholder{ color:var(--text-light); }
  .sel{ background:var(--input-bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text-dark); font-family:'Outfit',sans-serif; font-size:12.5px; cursor:pointer; outline:none; transition:border-color .2s; }
  .sel:focus{ border-color:var(--gold-border); }
  .btn-ghost{ background:none; border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:500; color:var(--text-mid); cursor:pointer; transition:all .2s; }
  .btn-ghost:hover{ border-color:var(--red); color:var(--red); }
  @media (max-width: 700px){ .toolbar{ flex-direction:column; align-items:stretch; } .search-wrap{ max-width:100%; } }

  .level-tabs{ display:flex; gap:6px; padding:0 18px 14px; flex-wrap:wrap; }
  .ltab{ background:none; border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:12px; font-weight:500; color:var(--text-mid); cursor:pointer; transition:all .2s; font-family:'Outfit',sans-serif; display:inline-flex; align-items:center; gap:6px; }
  .ltab .dot{ width:7px; height:7px; border-radius:50%; }
  .ltab:hover, .ltab.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold-light); }

  /* Table */
  .table-card{ display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
  .table-head-row{ display:flex; align-items:center; justify-content:space-between; padding:0 18px 12px; flex-wrap:wrap; gap:8px; }
  .table-title{ font-size:12px; font-weight:700; color:var(--gold); letter-spacing:0.8px; text-transform:uppercase; }
  .table-count{ font-size:11.5px; color:var(--text-light); }
  .table-scroll{ overflow-x:auto; }
  table{ width:100%; min-width:900px; border-collapse:collapse; }
  thead th{ text-align:left; font-size:10.5px; color:var(--text-light); font-weight:700; letter-spacing:0.3px; text-transform:uppercase; padding:10px 14px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--surface2); white-space:nowrap; }
  thead th.center{ text-align:center; }
  tbody td{ padding:11px 14px; font-size:12.5px; border-bottom:1px solid var(--border); color:var(--text-dark); vertical-align:middle; white-space:nowrap; }
  tbody tr{ cursor:default; transition:background .15s; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td.center{ text-align:center; }
  .item-name{ font-weight:600; }
  .cat-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-mid); }
  .cat-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .status-chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap; }
  .status-chip::before{ content:''; width:6px; height:6px; border-radius:50%; }
  .chip-ok{ background:var(--green-bg); color:var(--green); } .chip-ok::before{ background:var(--green); }
  .chip-low{ background:var(--amber-bg); color:var(--amber); } .chip-low::before{ background:var(--amber); }
  .chip-out{ background:var(--red-bg); color:var(--red); } .chip-out::before{ background:var(--red); }
  .act-btns{ display:flex; gap:4px; flex-wrap:nowrap; }
  .act-btn{ background:none; border:1px solid var(--border); border-radius:6px; padding:5px 10px; font-size:11px; font-weight:600; color:var(--text-mid); cursor:pointer; transition:all .15s; font-family:'Outfit',sans-serif; white-space:nowrap; }
  .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .act-btn.danger:hover{ border-color:var(--red); color:var(--red); }

  .empty-row td{ text-align:center; padding:36px; color:var(--text-light); }

  tfoot td{ padding:11px 14px; font-weight:700; font-size:12.5px; color:var(--text-dark); background:var(--surface2); border-top:1px solid var(--border); white-space:nowrap; }

  /* Pagination */
  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:12px; color:var(--text-light); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text-light); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; transition:all .15s; font-family:'Outfit',sans-serif; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:600; }
  .page-btn:disabled{ opacity:0.3; cursor:default; pointer-events:none; }

  /* Modal */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--modal-bg); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(520px, 96vw); box-shadow:0 32px 80px rgba(0,0,0,0.6); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; }
  .modal-sm{ width:min(380px, 96vw); }
  @keyframes modalIn{ from{opacity:0;transform:translateY(16px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .modal-title{ font-family:'Cormorant Garamond', serif; font-size:18px; font-weight:700; color:var(--text-dark); }
  .modal-close{ background:none; border:none; color:var(--text-light); font-size:18px; cursor:pointer; padding:4px; line-height:1; transition:color .2s; }
  .modal-close:hover{ color:var(--text-dark); }
  .form-section-title{ font-size:9px; text-transform:uppercase; letter-spacing:2px; color:var(--gold); font-weight:600; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--gold-border); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  @media (max-width: 480px){ .form-row{ grid-template-columns:1fr; } }
  .form-group{ display:flex; flex-direction:column; gap:5px; }
  .form-group.span2{ grid-column:span 2; }
  @media (max-width: 480px){ .form-group.span2{ grid-column:span 1; } }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-light); font-weight:500; }
  .form-input, .form-select{ background:var(--input-bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text-dark); font-family:'Outfit',sans-serif; font-size:13px; outline:none; transition:border-color .2s; width:100%; }
  .form-input:focus, .form-select:focus{ border-color:var(--gold-border); }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .val-note{ font-size:12px; color:var(--text-mid); margin-bottom:14px; }
  .val-note strong{ color:var(--text-dark); }

  /* Toast */
  .toast{ position:fixed; bottom:20px; right:20px; background:var(--white); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text-dark); box-shadow:0 8px 28px rgba(0,0,0,0.3); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn 0.3s ease; max-width:calc(100vw - 40px); }
  .toast.success{ border-left:3px solid var(--green); }
  .toast.error{ border-left:3px solid var(--red); }
  .toast.info{ border-left:3px solid var(--blue); }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  /* Topbar action buttons rendered inside store-shell.js's slot — styled here since they're page-specific */
  .print-btn{ display:flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid var(--border); border-radius:8px; background:var(--white); font-size:12.5px; font-weight:600; color:var(--text-dark); cursor:pointer; font-family:'Outfit',sans-serif; }
  .print-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .btn-primary{
    background:var(--gold); color:#0a1520; border:none; border-radius:8px;
    padding:9px 16px; font-family:'Outfit',sans-serif; font-size:13px; font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:all .2s;
  }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar is rendered here by store-shell.js -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar is rendered here by store-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">

      <!-- KPI -->
      <div class="kpi-row" id="kpiRow"></div>

      <!-- Filters -->
      <div class="card">
        <div class="toolbar">
          <div class="field" style="flex:1;min-width:200px;max-width:280px;">
            <div class="field-label">Search</div>
            <div class="search-wrap">
              <span style="color:var(--text-light);font-size:13px;">🔍</span>
              <input type="text" id="fSearch" placeholder="Item name…" oninput="page=1;render()">
            </div>
          </div>
          <div class="field">
            <div class="field-label">Category</div>
            <select class="sel" id="fCat" onchange="page=1;render()">
              <option value="">All Categories</option>
            </select>
          </div>
          <div class="field">
            <div class="field-label">Sort</div>
            <select class="sel" id="fSort" onchange="page=1;render()">
              <option value="name_asc">Name A–Z</option>
              <option value="qty_asc">Lowest Stock First</option>
              <option value="value_desc">Highest Value First</option>
            </select>
          </div>
          <button class="btn-ghost" onclick="clearFilters()">Clear Filters</button>
        </div>
        <div class="level-tabs" id="levelTabs"></div>
      </div>

      <!-- Table -->
      <div class="card table-card">
        <div class="table-head-row" style="padding-top:18px;">
          <div class="table-title">Stock Items</div>
          <div class="table-count" id="tableCount">—</div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th class="center">Unit</th>
                <th class="center">On Hand</th>
                <th class="center">Reorder Level</th>
                <th class="center">Unit Cost (₦)</th>
                <th class="center">Total Value (₦)</th>
                <th class="center">Status</th>
                <th class="center">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
            <tfoot>
              <tr>
                <td colspan="6">TOTAL VALUE (FILTERED)</td>
                <td class="center" id="footTotal">₦0</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="pagination">
          <span id="paginLabel">—</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ADD / EDIT ITEM MODAL -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="itemModalTitle">Add Stock Item</div>
      <button class="modal-close" onclick="closeModal('itemModal')">✕</button>
    </div>
    <div class="form-section-title">Item Details</div>
    <div class="form-row">
      <div class="form-group span2">
        <label class="form-label">Item Name</label>
        <input class="form-input" type="text" id="fName" placeholder="e.g. Rice (Long Grain)">
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-select" id="fItemCat">
          <option>Food</option><option>Beverages</option><option>Cleaning Supplies</option>
          <option>Linen & Amenities</option><option>Equipment</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Unit</label>
        <select class="form-select" id="fUnit">
          <option>kg</option><option>Ltr</option><option>Bottles</option><option>Cans</option>
          <option>Pieces</option><option>Packs</option><option>Cartons</option><option>Bags</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Quantity On Hand</label>
        <input class="form-input" type="number" id="fQty" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Reorder Level</label>
        <input class="form-input" type="number" id="fReorder" placeholder="0" min="0">
      </div>
      <div class="form-group span2">
        <label class="form-label">Unit Cost (₦)</label>
        <input class="form-input" type="number" id="fCost" placeholder="0" min="0">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal('itemModal')">Cancel</button>
      <button class="btn-primary" onclick="saveItem()">✓ Save Item</button>
    </div>
  </div>
</div>

<!-- RESTOCK MODAL -->
<div class="modal-overlay" id="restockModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">Restock Item</div>
      <button class="modal-close" onclick="closeModal('restockModal')">✕</button>
    </div>
    <div class="val-note">Adding stock for <strong id="restockName"></strong> — currently <strong id="restockCurrent"></strong> on hand.</div>
    <div class="form-group">
      <label class="form-label">Quantity to Add</label>
      <input class="form-input" type="number" id="restockQty" placeholder="0" min="1">
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal('restockModal')">Cancel</button>
      <button class="btn-primary" onclick="confirmRestock()">＋ Add Stock</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--red);">Delete Item</div>
      <button class="modal-close" onclick="closeModal('deleteModal')">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text-mid);margin-bottom:18px;line-height:1.6;" id="deleteMsg"></p>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal('deleteModal')">Cancel</button>
      <button class="act-btn danger" style="padding:9px 16px;font-size:13px;" onclick="confirmDelete()">🗑 Delete</button>
    </div>
  </div>
</div>

<script src="../component/store-shell.js"></script>
<script>
/* ═══════════════════════════════════════════
   Shell — sidebar + topbar for this page. The topbar's page-specific
   buttons (Print, Add Item) go through topbarActionsHtml since the
   shell only owns the generic chrome (title, date, API badge).
═══════════════════════════════════════════ */
const shell = GraceStoreShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'stock.html',
  pageTitle:     'Stock',
  pageSubtitle:  'Central Store inventory — on-hand quantities, reorder levels and value',
  apiMode:       'Demo',
  topbarActionsHtml: `
    <button class="print-btn" onclick="window.print()">🖶 <span class="print-label">Print</span></button>
    <button class="btn-primary" onclick="openItemModal()">＋ Add Item</button>
  `,
});

/* ═══════════════════════════════════════════
   CONFIG & API LAYER
   Set CFG.API_BASE and CFG.USE_DEMO = false to go live.
   Everything below auto-falls back to demo data if the API
   is unreachable, so the page always renders something.
═══════════════════════════════════════════ */
const CFG = {
  API_BASE : '',           // e.g. 'https://api.yourhotel.ng/v1'
  API_KEY  : '',           // Bearer token, if required
  USE_DEMO : true,         // false = call the real API first, fallback to demo on failure
  PAGE_SIZE: 10,
};

// Storage shim: window.storage when available (Claude.ai preview), otherwise
// localStorage. This is how Stock stays in sync with New Request / Store Approval —
// they all read/write the same 'stock-items' shared record. Serve all three pages
// from one local server for the localStorage fallback to be shared between them.
const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },
  async list(prefix, shared){ const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared}; }
};
const STOCK_KEY = 'stock-items';

async function apiFetch(method, path, body = null) {
  if (!CFG.API_BASE) throw new Error('No API_BASE configured');
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (CFG.API_KEY) opts.headers['Authorization'] = `Bearer ${CFG.API_KEY}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(CFG.API_BASE + path, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* Fire-and-forget writes — never block the UI on network failure */
function apiSave(method, path, body) {
  if (CFG.USE_DEMO) return;
  apiFetch(method, path, body).catch(e => console.warn('[API write]', e.message));
}

async function loadLiveData() {
  if (CFG.USE_DEMO) return;
  try {
    const data = await apiFetch('GET', '/api/stock');
    if (Array.isArray(data) && data.length) {
      STOCK = data;
      shell.setApiMode('Live');
      populateCategoryFilter();
      renderKPIs();
      render();
    }
  } catch (e) {
    console.warn('[API] Using demo stock data:', e.message);
  }
}

/* ═══════════════════════════════════════════
   DEMO DATA (fallback / starting state — used only
   the very first time, before anything is synced)
═══════════════════════════════════════════ */

  {id:'s01', name:'Rice (Long Grain)',        cat:'Food',                unit:'kg',      qty:112, reorder:40, cost:1200},

/* Push the current STOCK array to shared storage so New Request and Store
   Approval can read live quantities and unit costs. Called after every
   add/edit/restock/delete, and once on first load to seed the shared copy. */
async function syncStock(){
  try { await storage.set(STOCK_KEY, JSON.stringify(STOCK), true); } catch(e){ console.warn('[stock sync]', e); }
}
/* On load, prefer whatever is already in shared storage (e.g. quantities
   Store Approval has already deducted) over the hardcoded demo array. */
async function loadSyncedStock(){
  try {
    const r = await storage.get(STOCK_KEY, true);
    if (r && r.value) {
      const parsed = JSON.parse(r.value);
      if (Array.isArray(parsed) && parsed.length) { STOCK = parsed; return; }
    }
  } catch(e){}
  await syncStock(); // nothing synced yet — seed shared storage with the demo data
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
const LEVEL_TABS = [
  {k:'', l:'All'},
  {k:'ok', l:'In Stock'},
  {k:'low', l:'Low Stock'},
  {k:'out', l:'Out of Stock'},
];
let page = 1;
let activeLevel = '';

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function fmtN(n){ return '₦' + Math.round(n).toLocaleString('en-NG'); }
function stockLevel(s){ return s.qty<=0 ? 'out' : (s.qty<=s.reorder ? 'low' : 'ok'); }
function itemValue(s){ return s.qty * s.cost; }
function genId(){ return 's' + Date.now(); }

const CAT_COLOR = {
  'Food':'var(--green)', 'Beverages':'var(--blue)', 'Cleaning Supplies':'var(--amber)',
  'Linen & Amenities':'#f472b6', 'Equipment':'#a78bfa', 'Other':'var(--text-light)'
};
const LEVEL_LABEL = { ok:'In Stock', low:'Low Stock', out:'Out of Stock' };
const LEVEL_CHIP  = { ok:'chip-ok', low:'chip-low', out:'chip-out' };

/* ═══════════════════════════════════════════
   KPIs
═══════════════════════════════════════════ */
function renderKPIs(){
  const total = STOCK.length;
  const low = STOCK.filter(s=>stockLevel(s)==='low').length;
  const out = STOCK.filter(s=>stockLevel(s)==='out').length;
  const value = STOCK.reduce((sum,s)=>sum+itemValue(s),0);
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Total SKUs</div>
      <div class="kpi-value">${total}</div>
      <div class="kpi-sub">Across ${new Set(STOCK.map(s=>s.cat)).size} categories</div>
    </div>
    <div class="kpi-card" onclick="setLevel('low')">
      <div class="kpi-label">Low Stock</div>
      <div class="kpi-value amber">${low}</div>
      <div class="kpi-sub">${low>0?'⚠ Needs reordering':'✓ All above threshold'}</div>
    </div>
    <div class="kpi-card" onclick="setLevel('out')">
      <div class="kpi-label">Out of Stock</div>
      <div class="kpi-value red">${out}</div>
      <div class="kpi-sub">${out>0?'⚠ Unavailable to issue':'✓ None'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Stock Value</div>
      <div class="kpi-value green">${fmtN(value)}</div>
      <div class="kpi-sub">At current unit cost</div>
    </div>`;
}

/* ═══════════════════════════════════════════
   CATEGORY FILTER
═══════════════════════════════════════════ */
function populateCategoryFilter(){
  const sel = document.getElementById('fCat');
  const cur = sel.value;
  const cats = [...new Set(STOCK.map(s=>s.cat))].sort();
  sel.innerHTML = '<option value="">All Categories</option>' + cats.map(c=>`<option${c===cur?' selected':''}>${c}</option>`).join('');
}

/* ═══════════════════════════════════════════
   LEVEL TABS
═══════════════════════════════════════════ */
function renderLevelTabs(){
  document.getElementById('levelTabs').innerHTML = LEVEL_TABS.map(t => {
    const dotColor = t.k==='' ? 'var(--gold)' : `var(--${ {low:'amber',out:'red',ok:'green'}[t.k] })`;
    return `<button class="ltab ${t.k===activeLevel?'active':''}" onclick="setLevel('${t.k}')">
      <span class="dot" style="background:${dotColor}"></span>${t.l}
    </button>`;
  }).join('');
}
function setLevel(k){ activeLevel = k; page = 1; render(); }

function clearFilters(){
  document.getElementById('fSearch').value = '';
  document.getElementById('fCat').value = '';
  document.getElementById('fSort').value = 'name_asc';
  activeLevel = '';
  page = 1;
  render();
}

/* ═══════════════════════════════════════════
   FILTER / SORT
═══════════════════════════════════════════ */
function getFiltered(){
  const q = document.getElementById('fSearch').value.toLowerCase();
  const cat = document.getElementById('fCat').value;
  const sort = document.getElementById('fSort').value;

  let rows = STOCK.filter(s => {
    const mq = !q || s.name.toLowerCase().includes(q);
    const mc = !cat || s.cat === cat;
    const ml = !activeLevel || stockLevel(s) === activeLevel;
    return mq && mc && ml;
  });

  if (sort === 'name_asc') rows.sort((a,b)=>a.name.localeCompare(b.name));
  else if (sort === 'qty_asc') rows.sort((a,b)=>a.qty-b.qty);
  else if (sort === 'value_desc') rows.sort((a,b)=>itemValue(b)-itemValue(a));

  return rows;
}

/* ═══════════════════════════════════════════
   PAGINATION
═══════════════════════════════════════════ */
function renderPagination(total){
  const totalPages = Math.max(1, Math.ceil(total / CFG.PAGE_SIZE));
  const from = total === 0 ? 0 : (page-1)*CFG.PAGE_SIZE + 1;
  const to = Math.min(page*CFG.PAGE_SIZE, total);
  document.getElementById('paginLabel').textContent = total === 0 ? 'No records' : `${from}–${to} of ${total}`;
  const wrap = document.getElementById('pageBtns');
  wrap.innerHTML = '';
  const prev = document.createElement('button');
  prev.className='page-btn'; prev.textContent='‹'; prev.disabled = (page===1);
  prev.onclick = () => { page--; render(); };
  wrap.appendChild(prev);
  let start = Math.max(1, page-2), end = Math.min(totalPages, start+4);
  start = Math.max(1, end-4);
  for (let i=start;i<=end;i++){
    const b = document.createElement('button');
    b.className = 'page-btn' + (i===page?' active':'');
    b.textContent = i;
    b.onclick = (function(p){ return () => { page=p; render(); }; })(i);
    wrap.appendChild(b);
  }
  const next = document.createElement('button');
  next.className='page-btn'; next.textContent='›'; next.disabled = (page>=totalPages);
  next.onclick = () => { page++; render(); };
  wrap.appendChild(next);
}

/* ═══════════════════════════════════════════
   RENDER TABLE
═══════════════════════════════════════════ */
function render(){
  renderLevelTabs();
  const rows = getFiltered();
  document.getElementById('tableCount').textContent = rows.length + ' item' + (rows.length!==1?'s':'');

  const start = (page-1)*CFG.PAGE_SIZE;
  const pageRows = rows.slice(start, start+CFG.PAGE_SIZE);

  document.getElementById('tbody').innerHTML = pageRows.length === 0
    ? `<tr class="empty-row"><td colspan="9">No stock items match your filters.</td></tr>`
    : pageRows.map(s => {
        const lvl = stockLevel(s);
        return `<tr>
          <td class="item-name">${s.name}</td>
          <td><span class="cat-chip"><span class="cat-dot" style="background:${CAT_COLOR[s.cat]||'var(--text-light)'}"></span>${s.cat}</span></td>
          <td class="center">${s.unit}</td>
          <td class="center">${s.qty}</td>
          <td class="center">${s.reorder}</td>
          <td class="center">${fmtN(s.cost)}</td>
          <td class="center">${fmtN(itemValue(s))}</td>
          <td class="center"><span class="status-chip ${LEVEL_CHIP[lvl]}">${LEVEL_LABEL[lvl]}</span></td>
          <td class="center">
            <div class="act-btns">
              <button class="act-btn" onclick="openRestockModal('${s.id}')">＋ Restock</button>
              <button class="act-btn" onclick="openItemModal('${s.id}')">✏</button>
              <button class="act-btn danger" onclick="openDeleteModal('${s.id}')">🗑</button>
            </div>
          </td>
        </tr>`;
      }).join('');

  document.getElementById('footTotal').textContent = fmtN(rows.reduce((sum,s)=>sum+itemValue(s),0));
  renderPagination(rows.length);
}

/* ═══════════════════════════════════════════
   ADD / EDIT MODAL
═══════════════════════════════════════════ */
let editItemId = null;
function openItemModal(id=null){
  editItemId = id;
  const isEdit = !!id;
  document.getElementById('itemModalTitle').textContent = isEdit ? 'Edit Stock Item' : 'Add Stock Item';
  if (isEdit) {
    const s = STOCK.find(x=>x.id===id);
    document.getElementById('fName').value = s.name;
    document.getElementById('fItemCat').value = s.cat;
    document.getElementById('fUnit').value = s.unit;
    document.getElementById('fQty').value = s.qty;
    document.getElementById('fReorder').value = s.reorder;
    document.getElementById('fCost').value = s.cost;
  } else {
    document.getElementById('fName').value = '';
    document.getElementById('fItemCat').value = 'Food';
    document.getElementById('fUnit').value = 'kg';
    document.getElementById('fQty').value = '';
    document.getElementById('fReorder').value = '';
    document.getElementById('fCost').value = '';
  }
  document.getElementById('itemModal').classList.add('show');
}

function saveItem(){
  const name = document.getElementById('fName').value.trim();
  if (!name) { showToast('Please enter an item name.', 'error'); return; }
  const entry = {
    id: editItemId || genId(),
    name,
    cat: document.getElementById('fItemCat').value,
    unit: document.getElementById('fUnit').value,
    qty: parseFloat(document.getElementById('fQty').value) || 0,
    reorder: parseFloat(document.getElementById('fReorder').value) || 0,
    cost: parseFloat(document.getElementById('fCost').value) || 0,
  };
  if (editItemId) {
    const idx = STOCK.findIndex(s=>s.id===editItemId);
    STOCK[idx] = entry;
    apiSave('PUT', `/api/stock/${entry.id}`, entry);
    showToast('Item updated.', 'success');
  } else {
    STOCK.push(entry);
    apiSave('POST', '/api/stock', entry);
    showToast('Item added.', 'success');
  }
  closeModal('itemModal');
  populateCategoryFilter();
  renderKPIs();
  render();
  syncStock();
}

/* ═══════════════════════════════════════════
   RESTOCK MODAL
═══════════════════════════════════════════ */
let restockId = null;
function openRestockModal(id){
  restockId = id;
  const s = STOCK.find(x=>x.id===id);
  document.getElementById('restockName').textContent = s.name;
  document.getElementById('restockCurrent').textContent = `${s.qty} ${s.unit}`;
  document.getElementById('restockQty').value = '';
  document.getElementById('restockModal').classList.add('show');
}
function confirmRestock(){
  const add = parseFloat(document.getElementById('restockQty').value) || 0;
  if (add < 1) { showToast('Enter a valid quantity.', 'error'); return; }
  const s = STOCK.find(x=>x.id===restockId);
  s.qty += add;
  apiSave('PATCH', `/api/stock/${restockId}/restock`, { add });
  closeModal('restockModal');
  showToast(`Added ${add} ${s.unit} of ${s.name}.`, 'success');
  renderKPIs();
  render();
  syncStock();
}

/* ═══════════════════════════════════════════
   DELETE MODAL
═══════════════════════════════════════════ */
let deleteId = null;
function openDeleteModal(id){
  deleteId = id;
  const s = STOCK.find(x=>x.id===id);
  document.getElementById('deleteMsg').textContent = `Delete "${s.name}" from stock? This cannot be undone.`;
  document.getElementById('deleteModal').classList.add('show');
}
function confirmDelete(){
  const s = STOCK.find(x=>x.id===deleteId);
  STOCK = STOCK.filter(x=>x.id!==deleteId);
  apiSave('DELETE', `/api/stock/${deleteId}`);
  closeModal('deleteModal');
  showToast(`"${s.name}" removed.`, 'error');
  populateCategoryFilter();
  renderKPIs();
  render();
  syncStock();
}

/* ═══════════════════════════════════════════
   MODAL HELPERS
═══════════════════════════════════════════ */
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
['itemModal','restockModal','deleteModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e){ if (e.target===this) closeModal(id); });
});

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
function showToast(msg, type='success'){
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = (type==='success'?'✓ ':type==='error'?'✕ ':'ℹ ') + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
async function init(){
  await loadSyncedStock();   // pull the latest shared stock (qty + cost) if it exists
  populateCategoryFilter();
  renderKPIs();
  render();
  loadLiveData();            // tries the real API when CFG.USE_DEMO = false; silently keeps synced data otherwise
}
init();
</script>
