<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aurum Hotel — All Bookings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ── Base styles ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --radius: 14px; --radius-sm: 10px; --transition: 0.3s cubic-bezier(.4,0,.2,1); }
html, body { height: 100%; overflow-x: hidden; }
body {
  overflow-y: auto; /* no forced scrollbar */
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  transition: background var(--transition), color var(--transition);
}
.app { display: flex; min-height: 100vh; }
.main { margin-left: 250px; flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; transition: margin-left var(--transition); }
@media (max-width: 768px) { .main { margin-left: 0 !important; } }

.content {
  --bg: #f4f6fb; --surface: #ffffff; --surface2: #f4f6fb; --surface3: #eef0f6;
  --border: #eef0f6; --border2: #dfe3ec;
  --text: #1c2440; --text2: #6b7280; --text3: #9aa1b3;
  --shadow: 0 4px 20px rgba(15,34,55,0.07); --shadow-lg: 0 8px 40px rgba(15,34,55,0.10);
  --gold: #2f6fed; --gold-light: #5b8ff9; --gold-dim: rgba(47,111,237,0.10); --gold-border: rgba(47,111,237,0.25);
  --green: #12b76a; --green-bg: #e9f9f0;
  --red: #f04438; --red-bg: #feecec;
  --amber: #f79009; --amber-bg: #fff4e5;
  --blue: #2f6fed; --blue-bg: #eaf1ff;
  --purple: #8b5cf6; --purple-bg: #f4efff;
}
.content { flex: 1; padding: 24px; min-width: 0; overflow-x: hidden; background: var(--bg); color: var(--text); }
@media (max-width: 480px) { .content { padding: 14px; } }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ── KPIs ── */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
@media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px) { .kpi-row { grid-template-columns: 1fr 1fr; gap: 10px; } }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 14px 12px; position: relative; overflow: hidden;
  box-shadow: var(--shadow); cursor: pointer; transition: transform .2s, box-shadow .2s, border-color .2s; display: flex; flex-direction: column; animation: fadeUp .4s ease both; }
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--gold-border); }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); }
.kpi-card.acc-green::before { background: linear-gradient(90deg, var(--green), transparent); }
.kpi-card.acc-blue::before { background: linear-gradient(90deg, var(--blue), transparent); }
.kpi-card.acc-amber::before { background: linear-gradient(90deg, var(--amber), transparent); }
.kpi-card.acc-purple::before { background: linear-gradient(90deg, var(--purple), transparent); }
.kpi-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.kpi-ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.ic-blue { background: var(--blue-bg); color: var(--blue); }
.ic-green { background: var(--green-bg); color: var(--green); }
.ic-amber { background: var(--amber-bg); color: var(--amber); }
.ic-purple { background: var(--purple-bg); color: var(--purple); }
.kpi-label { font-size: 11px; color: var(--text2); font-weight: 600; line-height: 1.3; }
.kpi-value { font-size: 22px; font-weight: 800; color: var(--text); margin: 4px 0 2px; line-height: 1; }
.kpi-trend { font-size: 10.5px; font-weight: 600; color: var(--text3); margin-top: auto; }
.kpi-trend.up { color: var(--green); } .kpi-trend.warn { color: var(--amber); } .kpi-trend.neutral { color: var(--text3); }

/* ── Toolbar & chips ── */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
.toolbar-right { display: flex; gap: 7px; flex-shrink: 0; }
.search-wrap { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; flex: 1; min-width: 160px; max-width: 260px; }
.search-wrap:focus-within { border-color: var(--gold-border); }
.search-wrap i { color: var(--text3); font-size: 12.5px; }
.search-wrap input { background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 13px; width: 100%; }
.filter-sel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text); font-family: inherit; font-size: 12.5px; cursor: pointer; outline: none; }
@media (max-width: 700px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar-left { flex-direction: column; align-items: stretch; }
  .toolbar-right { width: 100%; }
  .toolbar-right .btn-primary, .toolbar-right .btn-outline { flex: 1; justify-content: center; }
  .search-wrap { max-width: 100%; }
  .filter-sel { width: 100%; }
}

.btn-primary { background: var(--gold); color: #fff; border: 1px solid var(--gold); border-radius: var(--radius-sm); padding: 9px 16px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; box-shadow: 0 4px 10px rgba(47,111,237,0.28); }
.btn-primary:hover { background: var(--gold-light); }
.btn-outline { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn-outline:hover { border-color: var(--gold-border); color: var(--gold); }

.status-chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; }
.sc-btn { flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 13px; font-size: 11.5px; font-weight: 600; color: var(--text2); cursor: pointer; font-family: inherit; }
.sc-btn:hover, .sc-btn.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }

/* ── Guest name truncation ── */
.ft-guest-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 120px;
  display: inline-block;
}

/* ── Delete modal ── */
.confirm-modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(15,20,40,0.55); backdrop-filter: blur(5px); z-index: 300;
  align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
}
.confirm-modal-overlay.show { display: flex; }
.confirm-modal { background: #ffffff; border: 1px solid #eef0f6; border-radius: 14px; padding: 22px; width: min(380px, 90vw); margin: 80px auto auto; }

.toast {
  position: fixed; bottom: 20px; right: 20px; background: #ffffff; border: 1px solid #eef0f6; border-radius: var(--radius-sm);
  padding: 11px 16px; font-size: 13px; color: #1c2440; box-shadow: 0 8px 28px rgba(15,20,40,0.18); z-index: 999;
  display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 40px); font-weight: 600;
}
.toast.success { border-left: 3px solid #12b76a; }
.toast.error   { border-left: 3px solid #f04438; }
.toast.info    { border-left: 3px solid #2f6fed; }

@media print {
  #sidebarSlot, #topbarSlot, .toolbar, .status-chips, .act-btns, .no-print, .kpi-row { display: none !important; }
  .main { margin-left: 0 !important; }
  .content { padding: 0 !important; }
}


::-webkit-scrollbar {
  display: none;
}

* {
  scrollbar-width: none; 
}

body {
  -ms-overflow-style: none;
}

</style>
</head>
<body>

<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <!-- KPIs -->
      <div class="kpi-row" id="kpiRow"></div>

      <!-- Status chips -->
      <div class="status-chips no-print" id="statusChips">
        <button class="sc-btn active" data-s="" onclick="setStatusChip('',this)">All</button>
        <button class="sc-btn" data-s="checkedin" onclick="setStatusChip('checkedin',this)">Checked In</button>
        <button class="sc-btn" data-s="reserved" onclick="setStatusChip('reserved',this)">Reserved</button>
        <button class="sc-btn" data-s="checkout" onclick="setStatusChip('checkout',this)">Check-out</button>
        <button class="sc-btn" data-s="maintenance" onclick="setStatusChip('maintenance',this)">Maintenance</button>
      </div>

      <!-- Toolbar -->
      <div class="toolbar no-print">
        <div class="toolbar-left">
          <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Guest, room, phone…" id="bkSearch" oninput="filterBookings()">
          </div>
          <select class="filter-sel" id="bkType" onchange="filterBookings()">
            <option value="">All Types</option>
            <option value="Standard">Standard</option>
            <option value="Deluxe">Deluxe</option>
            <option value="Suite">Suite</option>
            <option value="Conference">Conference</option>
          </select>
          <input type="date" class="filter-sel" id="bkFrom" onchange="filterBookings()" title="Check-in from">
          <input type="date" class="filter-sel" id="bkTo" onchange="filterBookings()" title="Check-in to">
        </div>
        <div class="toolbar-right">
          <button class="btn-outline" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
          <button class="btn-primary" id="newBookingBtn" onclick="openNewBooking()"><i class="fa-solid fa-plus"></i> New Booking</button>
        </div>
      </div>

      <!-- FrontDeskTable mounts here -->
      <div id="tableSlot"></div>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="confirm-modal-overlay" id="deleteModal" onclick="handleModalBackdrop(event,'deleteModal')">
  <div class="confirm-modal">
    <h3 style="font-size:18px;font-weight:800;color:var(--red);margin-bottom:8px;">Delete Booking</h3>
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.6;">Delete booking for <strong id="delGuest"></strong> in Room <strong id="delRoom"></strong>? This cannot be undone.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn-outline" onclick="closeModal('deleteModal')">Cancel</button>
      <button style="background:var(--red-bg);border:1px solid rgba(240,68,56,0.3);border-radius:var(--radius-sm);padding:9px 16px;color:var(--red);cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;" onclick="confirmDelete()"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
  </div>
</div>

<!-- ─── SCRIPTS ─── -->
<script src="../services/permissions.js"></script>
<script src="services/booking-service.js"></script>
<script src="../component/booking-shell.js"></script>
<script src="../component/booking-modal.js"></script>
<script src="../component/front-desk-table.js"></script>

<script>
'use strict';

/* ═══ Shell ═══ */
var shell = BookingShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'booking-list.html',
  pageTitle:     'All Bookings',
  pageSubtitle:  'Every reservation, current & past',
});

/* ═══ Globals ═══ */
var allRooms = [];
var bookings = [];
var currentSession = null;
var filteredBk = [];
var deleteIdx = null;

/* ═══ BookingModal instance ═══ */
var bookingModal = BookingModal.create({
  service: window.BookingData,
  onSaved: function () { refreshAndRender(); },
  onDeleted: function () { refreshAndRender(); },
});

/* ═══ Permissions helpers ═══ */
function getSession() {
  return shell.getUser();
}

function P() { return window.Permissions || null; }
function hasPermission(session, permission, module) {
  var x = P();
  if (x && x.hasPermission) return x.hasPermission(session, permission, module);
  return !!(session && String(session.role).toLowerCase() === 'admin');
}
function canEdit(session, module, entity) {
  var x = P();
  if (x && x.canEdit) return x.canEdit(session, module, entity);
  return hasPermission(session, 'canEdit', module);
}
function canDelete(session, module, entity) {
  var x = P();
  if (x && x.canDelete) return x.canDelete(session, module, entity);
  return !!(session && String(session.role).toLowerCase() === 'admin');
}

/* ═══ Custom column definitions ═══ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var DOT_CLASS = { Standard: 'ft-dot-standard', Deluxe: 'ft-dot-deluxe', Suite: 'ft-dot-suite', Conference: 'ft-dot-conf' };

// Room column: no status chip, just room · type with dot
var roomColumn = {
  id: 'room',
  label: 'Room',
  cell: function (b) {
    var dot = DOT_CLASS[b.type] || 'ft-dot-default';
    return '<span class="ft-room"><span class="ft-dot ' + dot + '"></span>' + esc(b.room) + ' · ' + esc(b.type || '') + '</span>';
  }
};

// Guest column: only name, truncated to one line
var guestColumn = {
  id: 'guest',
  label: 'Guest',
  cell: function (b) {
    return '<div class="ft-guest-name">' + esc(b.guest || '—') + '</div>';
  }
};

/* ═══ Table instance ═══ */
var table = null;

function mountTable() {
  if (table) { table.destroy(); table = null; }

  table = FrontDeskTable.create({
    target: '#tableSlot',
    title: 'All Bookings',
    pageSize: 10,
    // Use custom room and guest, others built-in
    columns: [roomColumn, guestColumn, 'checkin', 'checkout', 'nights', 'total', 'paid', 'balance', 'payment', 'status', 'actions'],
    summaryLabels: {
      count: 'Bookings',
      total: 'Total Revenue',
      paid: 'Collected',
      balance: 'Balance'
    },
    emptyText: 'No bookings found.',
    sortable: true,
    // Sort by createdAt (newest first) — if not present, fallback to checkin desc
    sortKey: 'createdAt',
    sortDir: 'desc',
    getRowPerm: function (b, session) {
      var s = session || getSession();
      return {
        canView: false,
        canEdit: canEdit(s, 'booking', b),
        canDelete: canDelete(s, 'booking', b)
      };
    },
    onView: function (b) { bookingModal.openView(b); },
    onEdit: function (b) {
      if (canEdit(getSession(), 'booking', b)) {
        bookingModal.openEdit(b);
      } else {
        showToast("You don't have permission to edit this booking.", 'error');
      }
    },
    onDelete: function (b) {
      if (canDelete(getSession(), 'booking', b)) {
        openDelete(b);
      } else {
        showToast("You don't have permission to delete this booking.", 'error');
      }
    },
    onRowClick: function (b) { bookingModal.openView(b); },
  });

  applyPermissionsUI();
}

/* ═══ KPIs ═══ */
function renderKPIs() {
  var checkedIn = bookings.filter(function (b) { return b.status === 'checkedin'; }).length;
  var reserved = bookings.filter(function (b) { return b.status === 'reserved'; }).length;
  var available = bookings.filter(function (b) { return b.status === 'vacant'; }).length;
  var maintenance = bookings.filter(function (b) { return b.status === 'maintenance'; }).length;

  document.getElementById('kpiRow').innerHTML =
    '<div class="kpi-card acc-green" onclick="setStatusFromKpi(\'checkedin\')"><div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-door-open"></i></div><div class="kpi-label">Checked In</div></div><div class="kpi-value" style="color:var(--green)">' + checkedIn + '</div><div class="kpi-trend up">Currently occupied</div></div>' +
    '<div class="kpi-card acc-blue" onclick="setStatusFromKpi(\'reserved\')"><div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-calendar-check"></i></div><div class="kpi-label">Reserved</div></div><div class="kpi-value" style="color:var(--blue)">' + reserved + '</div><div class="kpi-trend ' + (reserved > 0 ? 'warn' : 'up') + '">' + (reserved > 0 ? 'Upcoming arrivals' : 'None on record') + '</div></div>' +
    '<div class="kpi-card acc-purple" onclick="setStatusFromKpi(\'\')"><div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-bed"></i></div><div class="kpi-label">Available Rooms</div></div><div class="kpi-value" style="color:var(--purple)">' + available + '</div><div class="kpi-trend neutral">Across ' + allRooms.length + ' rooms</div></div>' +
    '<div class="kpi-card acc-amber" onclick="setStatusFromKpi(\'maintenance\')"><div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-screwdriver-wrench"></i></div><div class="kpi-label">Maintenance</div></div><div class="kpi-value" style="color:var(--amber)">' + maintenance + '</div><div class="kpi-trend ' + (maintenance > 0 ? 'warn' : 'up') + '">' + (maintenance > 0 ? 'Out of service' : 'None on record') + '</div></div>';
}

function setStatusFromKpi(status) {
  var btn = document.querySelector('.sc-btn[data-s="' + status + '"]') || document.querySelector('.sc-btn[data-s=""]');
  setStatusChip(status, btn);
}

function setStatusChip(s, btn) {
  document.querySelectorAll('.sc-btn').forEach(function (b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  filterBookings();
}

/* ═══ Filtering ═══ */
function filterBookings() {
  var q = (document.getElementById('bkSearch').value || '').toLowerCase();
  var t = document.getElementById('bkType').value;
  var df = document.getElementById('bkFrom').value;
  var dt = document.getElementById('bkTo').value;
  var statusChip = document.querySelector('.sc-btn.active') ? document.querySelector('.sc-btn.active').dataset.s : '';

  filteredBk = bookings.filter(function (b) {
    if (!b.guest) return false;
    var mq = !q || String(b.room).indexOf(q) !== -1 || (b.guest || '').toLowerCase().indexOf(q) !== -1 || (b.phone || '').indexOf(q) !== -1;
    var ms = !statusChip || b.status === statusChip;
    var mt = !t || b.type === t;
    var mf = !df || (b.checkin && b.checkin >= df);
    var md = !dt || (b.checkin && b.checkin <= dt);
    return mq && ms && mt && mf && md;
  });

  if (table) table.setRows(filteredBk);
  renderKPIs();
  applyPermissionsUI();
  if (shell.setPendingBadge) {
    shell.setPendingBadge(bookings.filter(function (b) { return b.status === 'reserved'; }).length);
  }
}

function applyPermissionsUI() {
  var session = getSession();
  var newBtn = document.getElementById('newBookingBtn');
  if (newBtn) newBtn.style.display = hasPermission(session, 'canCreate', 'booking') ? '' : 'none';
  if (table) table.setSession(session);
}

/* ═══ New Booking ═══ */
function openNewBooking() {
  if (!hasPermission(getSession(), 'canCreate', 'booking')) {
    showToast("You don't have permission to create bookings.", 'error');
    return;
  }
  bookingModal.openNew();
}

/* ═══ Delete ═══ */
function openDelete(b) {
  deleteIdx = b;
  document.getElementById('delGuest').textContent = b.guest;
  document.getElementById('delRoom').textContent = b.room;
  document.getElementById('deleteModal').classList.add('show');
}

async function confirmDelete() {
  if (!deleteIdx) return;
  try {
    var roomNum = deleteIdx.room;
    await BookingData.deleteBooking(roomNum);
    closeModal('deleteModal');
    deleteIdx = null;
    showToast('Booking deleted. Room marked as Available.', 'info');
    await refreshAndRender();
  } catch (err) {
    showToast((err && err.message) || 'Failed to delete booking.', 'error');
  }
}

/* ═══ Refresh data ═══ */
async function refreshAndRender() {
  try {
    var data = await BookingData.getBookingData();
    allRooms = data.rooms || [];
    bookings = data.bookings || [];
    bookingModal.setSession(getSession());
    applyPermissionsUI();
    filterBookings();
  } catch (err) {
    showToast((err && err.message) || 'Failed to refresh bookings.', 'error');
  }
}

/* ═══ Utilities ═══ */
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function handleModalBackdrop(e, id) {
  if (e.target === document.getElementById(id)) closeModal(id);
}

function showToast(msg, type) {
  type = type || 'success';
  var icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3400);
}

/* ═══ Init ═══ */
async function init() {
  if (!window.BookingData) {
    document.getElementById('tableSlot').innerHTML =
      '<div style="padding:24px;text-align:center;color:var(--text3);">BookingData not loaded. Check script order.</div>';
    return;
  }

  try {
    var data = await BookingData.getBookingData();
    allRooms = data.rooms || [];
    bookings = data.bookings || [];    bookingModal.setSession(getSession());

    mountTable();
    filterBookings();
    applyPermissionsUI();

    if (shell.setPendingBadge) {
      shell.setPendingBadge(bookings.filter(function (b) { return b.status === 'reserved'; }).length);
    }

    var st = new URLSearchParams(location.search).get('status');
    if (st) {
      var btn = document.querySelector('.sc-btn[data-s="' + st + '"]');
      if (btn) setStatusChip(st, btn);
    }

    setTimeout(function () {
      applyPermissionsUI();
      bookingModal.setSession(getSession());
    }, 400);

  } catch (err) {
    document.getElementById('tableSlot').innerHTML =
      '<div style="padding:24px;text-align:center;color:var(--red);"><i class="fa-solid fa-triangle-exclamation"></i> ' + ((err && err.message) || "Couldn't load bookings.") + '</div>';
    showToast('Failed to load bookings.', 'error');
  }
}
init();
</script>
</body>
</html>
