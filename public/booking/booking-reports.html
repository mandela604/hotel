<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aurum Hotel — Reports & Revenue</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* This page owns layout + its own Reports content only. Sidebar +
   topbar look/markup live entirely in booking-shell.js — same split
   used by booking-dashboard.html, booking-rooms.html and booking-list.html. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root { --radius: 14px; --radius-sm: 10px; --transition: 0.3s cubic-bezier(.4,0,.2,1); }

html, body { height: 100%; overflow-x: hidden; }
body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); transition: background var(--transition), color var(--transition); }

.app { display: flex; min-height: 100vh; }
.main { margin-left: 250px; flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; transition: margin-left var(--transition); }
@media (max-width: 768px) { .main { margin-left: 0 !important; } }

.content { flex: 1; padding: 24px; min-width: 0; overflow-x: hidden; }
@media (max-width: 480px) { .content { padding: 14px; } }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
.section-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); font-weight: 500; }

/* ═══════════ REVENUE KPI CARDS ═══════════ */
.rev-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
@media (max-width: 720px) { .rev-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 460px) { .rev-grid { grid-template-columns: 1fr; } }
.rev-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; animation: fadeUp 0.4s ease both; }
.rev-card:nth-child(1){animation-delay:.04s} .rev-card:nth-child(2){animation-delay:.08s} .rev-card:nth-child(3){animation-delay:.12s}
.rev-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); }
.rev-card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text3); margin-bottom: 6px; }
.rev-card-value { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; color: var(--text); word-break: break-word; }
.rev-card-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* By room type mini-breakdown */
.type-rev-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
@media (max-width: 720px) { .type-rev-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 400px) { .type-rev-grid { grid-template-columns: 1fr; } }
.type-rev-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; box-shadow: var(--shadow); }
.type-rev-name { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text2); margin-bottom: 6px; }
.type-rev-value { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; color: var(--text); }
.type-rev-sub { font-size: 10.5px; color: var(--text3); margin-top: 2px; }

/* ═══════════ FILTERS ═══════════ */
.report-filters { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; box-shadow: var(--shadow); }
.rep-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
.rep-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); font-weight: 500; }
.rep-input { background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text); font-family: 'Outfit', sans-serif; font-size: 12.5px; outline: none; transition: border-color 0.2s; width: 100%; }
.rep-input:focus { border-color: var(--gold-border); }
.rep-actions { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .report-filters { flex-direction: column; align-items: stretch; }
  .rep-group { min-width: 0; }
  .rep-actions { width: 100%; }
  .rep-actions button { flex: 1; justify-content: center; }
}

/* ═══════════ QUICK RANGE CHIPS ═══════════ */
.range-chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
.range-chips::-webkit-scrollbar { height: 0; }
.rg-btn { flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 13px; font-size: 11.5px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all 0.2s; font-family: 'Outfit', sans-serif; }
.rg-btn:hover, .rg-btn.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }

/* ═══════════ BUTTONS ═══════════ */
.btn-primary { background: var(--gold); color: #0a1520; border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
.btn-outline { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-family: 'Outfit', sans-serif; font-size: 12.5px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-outline:hover { border-color: var(--gold-border); color: var(--gold); }

/* ═══════════ PANEL ═══════════ */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; animation: fadeUp 0.4s ease both; overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 14px; flex-wrap: wrap; gap: 8px; }
.panel-title { font-size: 13px; font-weight: 600; color: var(--text); }
.panel-sub { font-size: 11.5px; color: var(--text3); }

/* ═══════════ TABLE (desktop / tablet) ═══════════ */
.table-wrap { overflow-x: auto; width: 100%; }
.bk-table { width: 100%; border-collapse: collapse; min-width: 860px; }
.bk-table thead th { text-align: left; padding: 9px 12px; font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); font-weight: 500; background: var(--surface2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.bk-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
.bk-table tbody tr:last-child { border-bottom: none; }
.bk-table tbody tr:hover { background: var(--surface2); }
.bk-table tbody td { padding: 9px 12px; color: var(--text); vertical-align: middle; font-size: 12.5px; }

.room-badge { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap; }
.rt-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot-standard { background: var(--blue); } .dot-deluxe { background: var(--purple); } .dot-suite { background: var(--gold); } .dot-conf { background: #34d399; }
.status-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.status-chip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
.chip-checkedin { background: var(--green-bg); color: var(--green); } .chip-checkedin::before { background: var(--green); }
.chip-checkout  { background: var(--red-bg); color: var(--red); } .chip-checkout::before  { background: var(--red); }
.chip-reserved  { background: var(--blue-bg); color: var(--blue); } .chip-reserved::before  { background: var(--blue); }
.chip-vacant    { background: rgba(156,163,175,0.12); color: #9ca3af; } .chip-vacant::before  { background: #9ca3af; }
.chip-maintenance { background: rgba(251,146,60,0.12); color: #fb923c; } .chip-maintenance::before { background: #fb923c; }

/* ═══════════ MOBILE CARD LIST — table restyles into stacked cards ═══════════ */
@media (max-width: 780px) {
  .table-wrap { overflow-x: visible; }
  .bk-table { min-width: 0; }
  .bk-table thead { display: none; }
  .bk-table, .bk-table tbody, .bk-table tr, .bk-table td { display: block; width: 100%; }
  .bk-table tbody tr { border: 1px solid var(--border); border-radius: var(--radius-sm); margin: 10px; padding: 4px 4px 2px; }
  .bk-table tbody tr:hover { background: var(--surface); }
  .bk-table tbody td { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; border-bottom: 1px dashed var(--border); text-align: right; }
  .bk-table tbody td:last-child { border-bottom: none; }
  .bk-table tbody td::before { content: attr(data-label); font-size: 9.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); font-weight: 500; text-align: left; flex-shrink: 0; }
  .bk-table tbody td.mcard-head { padding: 10px 10px 8px; border-bottom: 1px solid var(--border); }
  .bk-table tbody td.mcard-head::before { display: none; }
}

/* ═══════════ SUMMARY ROW ═══════════ */
.summary-row { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface2); border-top: 1px solid var(--border); }
.sr-item { text-align: center; padding: 10px 12px; border-right: 1px solid var(--border); }
.sr-item:last-child { border-right: none; }
.sr-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); margin-bottom: 3px; }
.sr-val { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 700; color: var(--text); }
@media (max-width: 560px) {
  .summary-row { grid-template-columns: repeat(2, 1fr); }
  .sr-item:nth-child(1), .sr-item:nth-child(2) { border-bottom: 1px solid var(--border); }
  .sr-item:nth-child(2) { border-right: none; }
}

/* ═══════════ PAGINATION ═══════════ */
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text3); flex-wrap: wrap; gap: 8px; }
.page-btns { display: flex; gap: 3px; flex-wrap: wrap; }
.page-btn { min-width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: none; color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; font-family: 'Outfit', sans-serif; padding: 0 7px; }
.page-btn:hover { border-color: var(--gold-border); color: var(--gold); }
.page-btn.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); font-weight: 600; }
.page-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

/* ═══════════ TOAST ═══════════ */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 16px; font-size: 13px; color: var(--text); box-shadow: 0 8px 28px rgba(0,0,0,0.3); z-index: 999; display: flex; align-items: center; gap: 8px; animation: toastIn 0.3s ease; max-width: calc(100vw - 40px); }
.toast.success { border-left: 3px solid var(--green); }
.toast.error   { border-left: 3px solid var(--red); }
.toast.info    { border-left: 3px solid var(--blue); }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@media (max-width: 480px) { .toast { left: 14px; right: 14px; bottom: 14px; max-width: none; } }

/* Print */
@media print {
  #sidebarSlot, #topbarSlot, .report-filters, .range-chips, .rep-actions, .no-print { display: none !important; }
  .main { margin-left: 0 !important; }
  .content { padding: 0 !important; overflow: visible !important; }
  body { background: #fff !important; color: #000 !important; }
  .panel, .rev-card, .type-rev-card { box-shadow: none !important; border: 1px solid #ccc !important; }
  @page { margin: 16mm; }
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 5px; }
</style>
</head>

    </div>

</div>

  async delete(key, shared){ localStorage.removeItem(key); return {key, deleted:true, shared}; },

async function loadShared(key, fallback) {
  try {
    const r = await storage.get(key, true);
    if (r && r.value) { const parsed = JSON.parse(r.value); if (Array.isArray(parsed) && parsed.length) return parsed; }
  } catch (e) {}
  return fallback;
}
async function saveShared(key, value) {
  try { await storage.set(key, JSON.stringify(value), true); } catch (e) { console.warn('[sync]', key, e); }
}

let allRooms = [];
let bookings = [];

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let repPage      = 1;
let filteredRep  = [];
const PAGE_REP   = 12;
const TODAY      = new Date().toISOString().split('T')[0];

/* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
function nights(ci, co) { if (!ci || !co) return 0; const n = (new Date(co) - new Date(ci)) / 86400000; return n > 0 ? n : 0; }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}); }
function fmtN(n) { return '₦' + Math.round(n).toLocaleString('en-NG'); }
function calcTotal(b) { const n = nights(b.checkin, b.checkout) || 1; return b.rate * n * (1 - (b.discount || 0) / 100); }
function calcBal(b) { return Math.max(0, calcTotal(b) - (b.paid || 0)); }

const DOT_CLASS = { Standard:'dot-standard', Deluxe:'dot-deluxe', Suite:'dot-suite', Conference:'dot-conf' };
const CHIP_CLS  = { checkedin:'chip-checkedin', checkout:'chip-checkout', reserved:'chip-reserved', vacant:'chip-vacant', maintenance:'chip-maintenance' };
const CHIP_LBL  = { checkedin:'Checked In', checkout:'Check-out', reserved:'Reserved', vacant:'Vacant', maintenance:'Maintenance' };
const TYPE_ICON = { Standard:'🛏', Deluxe:'✨', Suite:'👑', Conference:'🏛' };

/* ═══════════════════════════════════════════════
   PAGINATION
═══════════════════════════════════════════════ */
function renderPagination(btnId, labelId, page, total, size, cb) {
  const totalPages = Math.max(1, Math.ceil(total / size));
  const from = total === 0 ? 0 : (page - 1) * size + 1;
  const to   = Math.min(page * size, total);
  document.getElementById(labelId).textContent = total === 0 ? 'No records' : `${from}–${to} of ${total}`;
  const wrap = document.getElementById(btnId);
  wrap.innerHTML = '';
  const prev = document.createElement('button');
  prev.className = 'page-btn'; prev.textContent = '‹'; prev.disabled = (page === 1);
  prev.onclick = () => cb(page - 1); wrap.appendChild(prev);
  let start = Math.max(1, page - 2), end = Math.min(totalPages, start + 4);
  start = Math.max(1, end - 4);
  for (let i = start; i <= end; i++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i === page ? ' active' : '');
    btn.textContent = i; btn.onclick = (function(p){return () => cb(p);})(i);
    wrap.appendChild(btn);
  }
  const next = document.createElement('button');
  next.className = 'page-btn'; next.textContent = '›'; next.disabled = (page >= totalPages);
  next.onclick = () => cb(page + 1); wrap.appendChild(next);
}

/* ═══════════════════════════════════════════════
   QUICK RANGE
═══════════════════════════════════════════════ */
function fmtISO(d) { return d.toISOString().split('T')[0]; }
function applyQuickRange(r, btn) {
  document.querySelectorAll('.rg-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const now = new Date();
  let from = '', to = '';
  if (r === 'today') { from = TODAY; to = TODAY; }
  else if (r === '7') { const d = new Date(now); d.setDate(d.getDate() - 6); from = fmtISO(d); to = TODAY; }
  else if (r === '30') { const d = new Date(now); d.setDate(d.getDate() - 29); from = fmtISO(d); to = TODAY; }
  else if (r === 'month') { from = fmtISO(new Date(now.getFullYear(), now.getMonth(), 1)); to = TODAY; }
  else if (r === 'all') { from = ''; to = ''; }
  document.getElementById('repFrom').value = from;
  document.getElementById('repTo').value   = to;
  repPage = 1;
  generateReport();
}
function clearQuickRange() {
  document.querySelectorAll('.rg-btn').forEach(b => b.classList.remove('active'));
}

/* ═══════════════════════════════════════════════
   REVENUE CARDS (respects current filters)
═══════════════════════════════════════════════ */
function renderRevCards(rows) {
  const totRev  = rows.reduce((s, b) => s + calcTotal(b), 0);
  const totPaid = rows.reduce((s, b) => s + (b.paid || 0), 0);
  const totBal  = rows.reduce((s, b) => s + calcBal(b), 0);
  const collRate = totRev > 0 ? Math.round(totPaid / totRev * 100) : 0;

  document.getElementById('revCards').innerHTML = `
    <div class="rev-card"><div class="rev-card-label">Total Revenue</div><div class="rev-card-value">${fmtN(totRev)}</div><div class="rev-card-sub">${rows.length} booking${rows.length!==1?'s':''} in range</div></div>
    <div class="rev-card"><div class="rev-card-label">Total Collected</div><div class="rev-card-value" style="color:var(--green);">${fmtN(totPaid)}</div><div class="rev-card-sub">${collRate}% collection rate</div></div>
    <div class="rev-card"><div class="rev-card-label">Outstanding Balance</div><div class="rev-card-value" style="color:var(--red);">${fmtN(totBal)}</div><div class="rev-card-sub">Pending collection</div></div>`;

  const types = ['Standard','Deluxe','Suite','Conference'];
  document.getElementById('typeRevGrid').innerHTML = types.map(t => {
    const trows = rows.filter(b => b.type === t);
    const trev  = trows.reduce((s, b) => s + calcTotal(b), 0);
    return `<div class="type-rev-card">
      <div class="type-rev-name">${TYPE_ICON[t]||''} ${t}</div>
      <div class="type-rev-value">${fmtN(trev)}</div>
      <div class="type-rev-sub">${trows.length} booking${trows.length!==1?'s':''}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════
   GENERATE REPORT
═══════════════════════════════════════════════ */
function generateReport() {
  const from   = document.getElementById('repFrom').value;
  const to     = document.getElementById('repTo').value;
  const type   = document.getElementById('repType').value;
  const status = document.getElementById('repStatus').value;
  const pay    = document.getElementById('repPay').value;

  filteredRep = bookings.filter(b => {
    if (!b.guest) return false;
    if (type   && b.type !== type)     return false;
    if (status && b.status !== status) return false;
    if (pay    && b.payStatus !== pay) return false;
    if (from   && b.checkin && b.checkin < from) return false;
    if (to     && b.checkin && b.checkin > to)   return false;
    return true;
  });

  document.getElementById('repRangeLabel').textContent = from || to
    ? `${from ? fmtDate(from) : 'Start'} → ${to ? fmtDate(to) : 'Present'}`
    : 'All time';

  renderRevCards(filteredRep);

  const totRev  = filteredRep.reduce((s, b) => s + calcTotal(b), 0);
  const totPaid = filteredRep.reduce((s, b) => s + (b.paid || 0), 0);
  const totBal  = filteredRep.reduce((s, b) => s + calcBal(b), 0);

  document.getElementById('repTitle').textContent = from || to ? `Report: ${from ? fmtDate(from) : ''} ${from && to ? '→' : ''} ${to ? fmtDate(to) : ''}` : type ? type + ' Rooms Report' : 'Full Report';
  document.getElementById('repCount').textContent  = filteredRep.length + ' record' + (filteredRep.length !== 1 ? 's' : '');
  document.getElementById('rep-cnt').textContent    = filteredRep.length;
  document.getElementById('rep-total').textContent  = fmtN(totRev);
  document.getElementById('rep-paid').textContent   = fmtN(totPaid);
  document.getElementById('rep-bal').textContent    = fmtN(totBal);

  repPage = 1;
  renderRepPage();
}

function renderRepPage() {
  const total = filteredRep.length;
  const start = (repPage - 1) * PAGE_REP;
  const page  = filteredRep.slice(start, start + PAGE_REP);
  document.getElementById('repBody').innerHTML = page.length === 0
    ? `<tr><td colspan="14" style="text-align:center;padding:28px;color:var(--text3);">No records match filters</td></tr>`
    : page.map(b => {
        const bal = calcBal(b);
        return `<tr>
          <td class="mcard-head" data-label="Room"><span class="room-badge"><span class="rt-dot ${DOT_CLASS[b.type]}"></span>${b.room}</span><span class="status-chip ${CHIP_CLS[b.status]||'chip-vacant'}">${CHIP_LBL[b.status]||b.status}</span></td>
          <td data-label="Guest" style="font-weight:500;">${b.guest}</td>
          <td data-label="Type">${b.type}</td>
          <td data-label="Check-in">${fmtDate(b.checkin)}</td>
          <td data-label="Check-out">${fmtDate(b.checkout)}</td>
          <td data-label="Nights">${nights(b.checkin,b.checkout)||1}</td>
          <td data-label="Rate/Night">${fmtN(b.rate)}</td>
          <td data-label="Discount">${b.discount||0}%</td>
          <td data-label="Total"><strong>${fmtN(calcTotal(b))}</strong></td>
          <td data-label="Paid"><span style="color:var(--green);">${fmtN(b.paid||0)}</span></td>
          <td data-label="Balance"><span style="color:${bal>0?'var(--red)':'var(--green)'};font-weight:600;">${fmtN(bal)}</span></td>
          <td data-label="Method">${b.payMethod}</td>
          <td data-label="Status"><span class="status-chip ${CHIP_CLS[b.status]||'chip-vacant'}">${CHIP_LBL[b.status]||b.status}</span></td>
          <td data-label="Recorded By">${b.recordedBy||'—'}</td>
        </tr>`;
      }).join('');
  renderPagination('repPageBtns', 'repPaginLabel', repPage, total, PAGE_REP, p => { repPage = p; renderRepPage(); });
}

/* ═══════════════════════════════════════════════
   CSV EXPORT
═══════════════════════════════════════════════ */
function exportCsv() {
  if (filteredRep.length === 0) { showToast('No records to export.', 'error'); return; }
  const headers = ['Room','Guest','Type','Check-in','Check-out','Nights','Rate/Night','Discount %','Total','Paid','Balance','Payment Method','Status','Recorded By'];
  const rows = filteredRep.map(b => [
    b.room, b.guest, b.type, b.checkin, b.checkout, nights(b.checkin,b.checkout)||1,
    b.rate, b.discount||0, Math.round(calcTotal(b)), b.paid||0, Math.round(calcBal(b)), b.payMethod, CHIP_LBL[b.status]||b.status, b.recordedBy||''
  ]);
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `aurum-hotel-bookings-report-${TODAY}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Report exported as CSV.', 'success');
}

function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = (type === 'success' ? '✓ ' : type === 'error' ? '✕ ' : 'ℹ ') + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
async function init() {
  allRooms = await loadShared(KEY_ROOMS, DEMO_ROOMS);
  bookings = await loadShared(KEY_BOOKINGS, DEMO_BOOKINGS);
  await Promise.all([ saveShared(KEY_ROOMS, allRooms), saveShared(KEY_BOOKINGS, bookings) ]);
  shell.setPendingBadge(bookings.filter(b => b.status === 'reserved').length);
  document.getElementById('repFrom').value = '';
  document.getElementById('repTo').value   = '';
  generateReport();
}
init();
