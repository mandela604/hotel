<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aurum Hotel — Reports & Revenue</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --radius: 14px; --radius-sm: 10px; --transition: 0.3s cubic-bezier(.4,0,.2,1); }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  transition: background var(--transition), color var(--transition);
  -ms-overflow-style: none;
}
.app { display: flex; min-height: 100vh; }
.main { margin-left: 250px; flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; transition: margin-left var(--transition); }
@media (max-width: 768px) { .main { margin-left: 0 !important; } }

.content, .modal-overlay {
  --bg: #f4f6fb; --surface: #ffffff; --surface2: #f4f6fb; --surface3: #eef0f6;
  --border: #eef0f6; --border2: #dfe3ec;
  --text: #1c2440; --text2: #6b7280; --text3: #9aa1b3;
  --shadow: 0 4px 20px rgba(15,34,55,0.07); --shadow-lg: 0 8px 40px rgba(15,34,55,0.10);
  --input-bg: #f4f6fb; --modal-bg: #ffffff;
  --gold: #2f6fed; --gold-light: #5b8ff9; --gold-dim: rgba(47,111,237,0.10); --gold-border: rgba(47,111,237,0.25);
  --green: #12b76a; --green-bg: #e9f9f0; --red: #f04438; --red-bg: #feecec; --amber: #f79009; --amber-bg: #fff4e5; --blue: #2f6fed; --blue-bg: #eaf1ff; --purple: #8b5cf6; --purple-bg: #f4efff;
}
.content { flex: 1; padding: 24px; min-width: 0; overflow-x: hidden; background: var(--bg); color: var(--text); display: flex; flex-direction: column; gap: 16px; }

::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }

/* ── KPIs ── */
.kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; }
@media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px) { .kpi-row { grid-template-columns: 1fr 1fr; gap: 10px; } }

.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 14px 12px; position: relative; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg,var(--gold),transparent); }
.kpi-card.green::before { background: linear-gradient(90deg,var(--green),transparent); }
.kpi-card.red::before { background: linear-gradient(90deg,var(--red),transparent); }
.kpi-card.purple::before { background: linear-gradient(90deg,var(--purple),transparent); }
.kpi-card.teal::before { background: linear-gradient(90deg,#14b8a6,transparent); }
.kpi-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.kpi-ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.ic-gold { background: var(--gold-dim); color: var(--gold); }
.ic-green { background: var(--green-bg); color: var(--green); }
.ic-red { background: var(--red-bg); color: var(--red); }
.ic-purple { background: var(--purple-bg); color: var(--purple); }
.ic-teal { background: rgba(20,184,166,.12); color: #14b8a6; }
.kpi-label { font-size: 11px; color: var(--text2); font-weight: 600; line-height: 1.3; }
.kpi-value { font-size: 22px; font-weight: 800; color: var(--text); margin: 4px 0 2px; line-height: 1; }
.kpi-val.green { color: var(--green); } .kpi-val.red { color: var(--red); } .kpi-val.purple { color: var(--purple); } .kpi-val.teal { color: #14b8a6; }
.kpi-sub { font-size: 10.5px; font-weight: 600; color: var(--text3); margin-top: auto; }

.role-note { display: none; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--amber); background: var(--amber-bg); border: 1px solid rgba(247,144,9,.25); border-radius: 9px; padding: 7px 12px; flex-shrink: 0; }

/* ── CUSTOM INLINE FILTER BAR ── */
.fb-container {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  flex-shrink: 0;
}
.fb-row {
  display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px;
}
.fb-group { display: flex; flex-direction: column; gap: 4px; }
.fb-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--text3); font-weight: 700; padding-left: 2px; }
.fb-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.fb-pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 20px;
  font-size: 11.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text2); transition: all .15s; white-space: nowrap;
}
.fb-pill:hover { border-color: var(--gold-border); color: var(--gold); }
.fb-pill.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }

/* ── The colored dot inside status pills ── */
.fb-pill .fb-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.fb-select, .fb-input, .fb-search {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; color: var(--text); font-size: 12.5px; cursor: pointer; outline: none;
  font-family: inherit; width: 100%; 
  min-width: 130px; max-width: 150px;
}
.fb-select:focus, .fb-input:focus { border-color: var(--gold-border); }
.fb-search { min-width: 180px; max-width: 200px; }
.fb-date-wrap { position: relative; display: flex; align-items: center; width: 100%; min-width: 190px; max-width: 190px; }
.fb-date-wrap i.cal { position: absolute; left: 12px; color: var(--text3); font-size: 13px; pointer-events: none; }
.fb-date-wrap input.fb-input { padding-left: 32px; cursor: pointer; min-width: 100%; max-width: 100%; }

.fb-ghost { background: none; border: none; color: var(--text3); font-size: 11.5px; font-weight: 700; cursor: pointer; padding: 8px 6px; display: inline-flex; align-items: center; gap: 5px; }
.fb-ghost:hover { color: var(--gold); }
.fb-btn-primary {
  background: var(--gold); color: #fff; border: 1px solid var(--gold); border-radius: 10px;
  padding: 8px 14px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(47,111,237,0.28);
  white-space: nowrap;
}
.fb-btn-primary:hover { background: var(--gold-light); }

@media (max-width: 1024px) {
  .fb-row { gap: 10px; }
  .fb-group { flex: 1 1 auto; min-width: 140px; }
  .fb-select, .fb-input, .fb-search, .fb-date-wrap { min-width: 0; max-width: 100%; width: 100%; }
}
@media (max-width: 600px) {
  .fb-row { flex-direction: column; align-items: stretch; }
  .fb-group { width: 100%; }
  .fb-btn-primary { width: 100%; justify-content: center; }
}

/* ── Table guest column truncation ── */
.ft-guest-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; display: inline-block; }

@media print { #sidebarSlot, #topbarSlot, .fb-container, .role-note, .no-print, .modal-overlay { display: none !important; } .main { margin-left: 0 !important; } .content { padding: 0 !important; overflow: visible !important; background: #fff !important; } .kpi-row { grid-template-columns: repeat(5, 1fr); } }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <!-- KPI Row -->
      <div class="kpi-row" id="kpiRow">
        <div class="kpi-card"><div class="kpi-top"><div class="kpi-ic ic-gold"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Total Revenue</div></div><div class="kpi-value" id="kpi-revenue">₦0</div><div class="kpi-sub" id="kpi-revenue-sub">0 bookings</div></div>
        <div class="kpi-card green"><div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-circle-check"></i></div><div class="kpi-label">Collected</div></div><div class="kpi-value kpi-val green" id="kpi-collected">₦0</div><div class="kpi-sub" id="kpi-collected-sub">0% collection</div></div>
        <div class="kpi-card red"><div class="kpi-top"><div class="kpi-ic ic-red"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="kpi-label">Balance Due</div></div><div class="kpi-value kpi-val red" id="kpi-balance">₦0</div><div class="kpi-sub">Outstanding</div></div>
        <div class="kpi-card purple"><div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-moon"></i></div><div class="kpi-label">Total Nights</div></div><div class="kpi-value kpi-val purple" id="kpi-nights">0</div><div class="kpi-sub">room-nights booked</div></div>
        <div class="kpi-card teal"><div class="kpi-top"><div class="kpi-ic ic-teal"><i class="fa-solid fa-check-double"></i></div><div class="kpi-label">Fully Paid</div></div><div class="kpi-value kpi-val teal" id="kpi-paidcount">0</div><div class="kpi-sub" id="kpi-paidcount-sub">of 0 bookings</div></div>
      </div>

      <!-- CUSTOM INLINE FILTER BAR -->
      <div class="fb-container no-print">
        <!-- Row 1: Period (Pills) & Status (Pills) -->
        <div class="fb-row">
          <div class="fb-group">
            <span class="fb-label">Period</span>
            <div class="fb-pills" id="periodPills">
              <button class="fb-pill active" data-period="all" onclick="setPeriod('all', this)">All Time</button>
              <button class="fb-pill" data-period="today" onclick="setPeriod('today', this)">Today</button>
              <button class="fb-pill" data-period="7d" onclick="setPeriod('7d', this)">Last 7 Days</button>
              <button class="fb-pill" data-period="30d" onclick="setPeriod('30d', this)">Last 30 Days</button>
            </div>
          </div>
          <div class="fb-group">
            <span class="fb-label">Status</span>
            <div class="fb-pills" id="fbStatusPills">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>

        <!-- Row 2: Payment, Staff, Date, Search, Clear, Print -->
        <div class="fb-row">
          <div class="fb-group">
            <span class="fb-label">Payment</span>
            <select class="fb-select" id="fbPayment" onchange="applyInlineFilters()">
              <option value="">All Payments</option>
              <option value="Fully Paid">Fully Paid</option>
              <option value="Deposit Paid">Deposit Paid</option>
              <option value="Pending">Pending</option>
            </select>
          </div>
          <div class="fb-group">
            <span class="fb-label">Staff</span>
            <select class="fb-select" id="fbStaff" onchange="applyInlineFilters()">
              <option value="">All Staff</option>
            </select>
          </div>
          <div class="fb-group">
            <span class="fb-label">Date</span>
            <div class="fb-date-wrap">
              <i class="fa-solid fa-calendar-days cal"></i>
              <input type="text" class="fb-input" id="fbDateRange" placeholder="Date range" readonly>
            </div>
          </div>
          <div class="fb-group">
            <span class="fb-label">Search</span>
            <input type="text" class="fb-input fb-search" id="fbSearch" placeholder="Room #, guest, staff…" oninput="applyInlineFilters()">
          </div>
          <div class="fb-group">
            <span class="fb-label">&nbsp;</span>
            <button class="fb-ghost" id="fbClear" onclick="clearInlineFilters()"><i class="fa-solid fa-xmark"></i> Clear</button>
          </div>
          <div class="fb-group">
            <span class="fb-label">&nbsp;</span>
            <button class="fb-btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Report</button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div id="tableSlot"></div>
    </div>
  </div>
</div>

<!-- ─── SCRIPTS ─── -->
<script src="../services/permissions.js"></script>
<script src="services/booking-service.js"></script>
<script src="../component/booking-shell.js"></script>
<script src="../component/booking-modal.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="../component/front-desk-table.js"></script>

<script>
'use strict';

/* ═══════════════════════════════════════════════
   Shell — session comes from shell.getUser(), never a local demo object.
═══════════════════════════════════════════════ */
const shell = BookingShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'booking-reports.html',
  pageTitle:     'Reports & Revenue',
  pageSubtitle:  'Financial performance across all bookings',
});

let allRooms = [];
let bookings = [];
let currentSession = null;
let table = null;
let fp = null; // Flatpickr instance for inline date picker
const TODAY = new Date().toISOString().split('T')[0];

/* ═══════════════════════════════════════════════
   Booking Modal — clicking a report row opens the same
   BookingModal used on the Rooms page, in read-only "view" mode.
═══════════════════════════════════════════════ */
const bookingModal = BookingModal.create({
  service: BookingData,
  session: shell.getUser(),
  onSaved: async () => {
    const fresh = await BookingData.getBookingData();
    allRooms = fresh.rooms;
    bookings = fresh.bookings;
    applyInlineFilters();
  },
});

/* ═══════════════════════════════════════════════
   Helpers — thin wrappers around BookingData so this page never
   redefines the nights/total/paid/balance rules itself.
═══════════════════════════════════════════════ */
function nights(ci, co) { return BookingData.nights(ci, co); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtN(n) { return '₦' + Math.round(n).toLocaleString('en-NG'); }
function calcTotal(b) { return BookingData.calcTotal(b); }
function calcPaid(b) { return BookingData.calcPaid(b); }
function calcBal(b) { return BookingData.calcBal(b); }

function isPrivileged() { return !!currentSession && (currentSession.role === 'manager' || currentSession.role === 'admin'); }

function applyRoleUI() {
  const notice = document.getElementById('roleNotice');
  if (!notice) return;
  if (isPrivileged()) { notice.style.display = 'none'; } 
  else { notice.style.display = 'flex'; notice.innerHTML = `<i class="fa-solid fa-lock"></i> Showing today's data only — full-range reports require manager or admin access.`; }
}

function updateKPI(rows) {
  const totRev = rows.reduce((s,b) => s+calcTotal(b), 0);
  const totPaid = rows.reduce((s,b) => s+calcPaid(b), 0);
  const totBal = rows.reduce((s,b) => s+calcBal(b), 0);
  const collRate = totRev>0 ? Math.round(totPaid/totRev*100) : 0;
  const nights_ = rows.reduce((s,b) => s+(nights(b.checkin,b.checkout)||0), 0);
  const fullyPaid = rows.filter(b=>b.payStatus==='Fully Paid').length;

  document.getElementById('kpi-revenue').textContent = fmtN(totRev);
  document.getElementById('kpi-revenue-sub').textContent = `${rows.length} bookings`;
  document.getElementById('kpi-collected').textContent = fmtN(totPaid);
  document.getElementById('kpi-collected-sub').textContent = `${collRate}% collection`;
  document.getElementById('kpi-balance').textContent = fmtN(totBal);
  document.getElementById('kpi-nights').textContent = nights_.toLocaleString();
  document.getElementById('kpi-paidcount').textContent = fullyPaid;
  document.getElementById('kpi-paidcount-sub').textContent = `of ${rows.length} bookings`;
}

/* ── INLINE FILTER LOGIC ── */
function setPeriod(value, btn) {
  document.querySelectorAll('#periodPills .fb-pill').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const now = new Date();
  let from='', to='';
  if (value === 'today')  { from=TODAY; to=TODAY; }
  else if (value === '7d') { const d=new Date(now); d.setDate(d.getDate()-6); from=d.toISOString().split('T')[0]; to=TODAY; }
  else if (value === '30d'){ const d=new Date(now); d.setDate(d.getDate()-29); from=d.toISOString().split('T')[0]; to=TODAY; }
  
  if (fp) {
    fp.setDate(from && to ? [from, to] : []);
    if (!from) fp.clear();
  }
  applyInlineFilters();
}

function setStatusPill(value, btn) {
  document.querySelectorAll('#fbStatusPills .fb-pill').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyInlineFilters();
}

function clearInlineFilters() {
  document.querySelectorAll('#fbStatusPills .fb-pill').forEach(b => b.classList.remove('active'));
  document.querySelector('#fbStatusPills .fb-pill[data-status=""]').classList.add('active');
  
  document.getElementById('fbPayment').value = '';
  document.getElementById('fbStaff').value = '';
  document.getElementById('fbSearch').value = '';
  if (fp) fp.clear();
  
  document.querySelectorAll('#periodPills .fb-pill').forEach(b => b.classList.remove('active'));
  document.querySelector('#periodPills .fb-pill[data-period="all"]').classList.add('active');
  applyInlineFilters();
}

function applyInlineFilters() {
  const activeStatusPill = document.querySelector('#fbStatusPills .fb-pill.active');
  const status = activeStatusPill ? activeStatusPill.dataset.status : '';
  
  const payStatus = document.getElementById('fbPayment').value;
  const staff = document.getElementById('fbStaff').value;
  const search = document.getElementById('fbSearch').value;

  let bounds = { start: null, end: null, label: 'All time' };
  if (fp && fp.selectedDates && fp.selectedDates.length === 2) {
    bounds.start = fp.selectedDates[0];
    bounds.end = fp.selectedDates[1];
    bounds.label = 'Custom Range';
  }

  // Non-privileged staff are restricted to today's data regardless of
  // what the date picker shows — the UI notice is decorative, this is
  // the real enforcement boundary.
  if (!isPrivileged()) {
    const todayStart = new Date(TODAY);
    const todayEnd   = new Date(TODAY);
    bounds = { start: todayStart, end: todayEnd, label: "Today's Report" };
    // Lock the date picker to today so the UI reflects the restriction
    if (fp) fp.setDate([TODAY, TODAY]);
  }

  const filtered = bookings.filter(b => {
    if (!b.guest && b.status !== 'vacant' && b.status !== 'maintenance') return true;
    if (status && b.status !== status) return false;
    if (payStatus && b.payStatus !== payStatus) return false;
    if (staff && b.recordedBy !== staff) return false;
    if (search) {
      const q = search.toLowerCase().trim();
      const hit = (b.room||'').toLowerCase().includes(q) || (b.guest||'').toLowerCase().includes(q) || (b.type||'').toLowerCase().includes(q) || (b.phone||'').toLowerCase().includes(q) || (b.recordedBy||'').toLowerCase().includes(q);
      if (!hit) return false;
    }
    if (bounds.start && bounds.end) {
      const checkinDate = new Date(b.checkin);
      if (!checkinDate || isNaN(checkinDate.getTime())) return false;
      const d = new Date(checkinDate.getFullYear(), checkinDate.getMonth(), checkinDate.getDate());
      if (d < bounds.start || d > bounds.end) return false;
    }
    return true;
  });

  const title = bounds.label && bounds.label !== 'All time' ? 'Report: ' + bounds.label : 'Full Report';
  if (table) { table.setTitle(title); table.setRows(filtered); }
  updateKPI(filtered);
  if (shell.setPendingBadge) shell.setPendingBadge(bookings.filter(b=>b.status==='reserved').length);
}

/* ═══════════════════════════════════════════════
   Row click → open the report in the shared BookingModal (view mode)
═══════════════════════════════════════════════ */
function openReportInModal(b) {
  if (!b) return;
  bookingModal.setSession(shell.getUser());
  bookingModal.openView(b);
}

const PAY_CLS = {'Fully Paid':'pay-full','Deposit Paid':'pay-deposit','Pending':'pay-pending'};
const DOT_CLASS = { Standard: 'ft-dot-standard', Deluxe: 'ft-dot-deluxe', Suite: 'ft-dot-suite', Conference: 'ft-dot-conf' };
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
const roomColumn = { id: 'room', label: 'Room', cell: (b) => { const dot = DOT_CLASS[b.type] || 'ft-dot-default'; return '<span class="ft-room"><span class="ft-dot ' + dot + '"></span>' + esc(b.room) + ' · ' + esc(b.type || '') + '</span>'; } };
const guestColumn = { id: 'guest', label: 'Guest', cell: (b) => { return '<div class="ft-guest-name">' + esc(b.guest || '—') + '</div>'; } };

/* ── Status colors — same source of truth used for the status filter
   pills below, and now also for the table's Status column, so both
   match booking-rooms.html's room-card colors exactly (available/
   vacant=green, checkedin=gold, cleaning=sky-blue, reserved=purple,
   checkout=red, maintenance=amber). Hoisted to top level so both the
   pill-population code in init() and statusColumn below share one map
   instead of drifting apart. ── */
const statusColorMap = {
  'vacant':     'var(--green)',
  'checkedin':  'var(--gold)',
  'cleaning':   '#0ea5e9',
  'reserved':   'var(--purple)',
  'checkout':   'var(--red)',
  'maintenance':'var(--amber)'
};
const statusBgMap = {
  'vacant':     'var(--green-bg)',
  'checkedin':  'var(--gold-dim)',
  'cleaning':   '#e0f2fe',
  'reserved':   'var(--purple-bg)',
  'checkout':   'var(--red-bg)',
  'maintenance':'var(--amber-bg)'
};
// Custom column (same pattern as roomColumn/guestColumn above) so the
// chip's colors are guaranteed to match statusColorMap/statusBgMap
// exactly, rather than depending on FrontDeskTable's own internal
// tone→class mapping (which is what produced the mismatch).
const statusColumn = {
  id: 'status',
  label: 'Status',
  cell: (b) => {
    const def = BookingData.getStatusConfig().find(s => s.value === b.status);
    const label = def ? def.label : (b.status || '—');
    const color = statusColorMap[b.status] || 'var(--text3)';
    const bg = statusBgMap[b.status] || 'var(--surface2)';
    return '<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;background:' + bg + ';color:' + color + ';">'
      + '<span style="width:5px;height:5px;border-radius:50%;background:' + color + ';flex-shrink:0;"></span>'
      + esc(label) + '</span>';
  }
};

/* ═══════════════════════════════════════════════
   Init — single call into BookingData. No local demo arrays, no direct
   storage access: this page only calls BookingData.* and renders.
═══════════════════════════════════════════════ */
async function init() {
  if (!window.BookingData) {
    document.getElementById('tableSlot').innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);">BookingData not loaded. Check script order.</div>';
    return;
  }
  try {
    const data = await BookingData.getBookingData();
    allRooms = data.rooms;
    // Exclude the vacant "room keeper" booking records (created alongside
    // every room). They are placeholders, not real bookings — the report
    // should only show actual booked rooms with revenue.
    bookings = (data.bookings || []).filter(b => b.status !== 'vacant');
    currentSession = shell.getUser();
    bookingModal.setSession(currentSession);

    const staffNames = [...new Set(bookings.map(b => b.recordedBy).filter(Boolean))].sort();

    // 1. Populate Status Pills (Colors match the Rooms page exactly —
    // via the shared statusColorMap declared above)
    const statusPillsContainer = document.getElementById('fbStatusPills');

    // Add 'All' option (no dot)
    let allBtn = document.createElement('button');
    allBtn.className = 'fb-pill active';
    allBtn.dataset.status = '';
    allBtn.textContent = 'All';
    allBtn.onclick = function() { setStatusPill('', this); };
    statusPillsContainer.appendChild(allBtn);

    // Dynamically create status pills with colored dots using Rooms page colors
    BookingData.getStatusConfig().forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'fb-pill';
      btn.dataset.status = s.value;
      const color = statusColorMap[s.value] || s.color; // fallback to service color if mapping missing
      btn.innerHTML = `<span class="fb-dot" style="background-color: ${color};"></span> ${s.label}`;
      btn.onclick = function() { setStatusPill(s.value, this); };
      statusPillsContainer.appendChild(btn);
    });

    // 2. Populate Staff Dropdown
    const staffSel = document.getElementById('fbStaff');
    staffNames.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      staffSel.appendChild(opt);
    });

    // 3. Initialize Flatpickr (Range)
    const dateInput = document.getElementById('fbDateRange');
    fp = flatpickr(dateInput, {
      mode: 'range',
      dateFormat: 'd/m/Y',
      onChange: function() { applyInlineFilters(); }
    });

    // 4. Mount Table — rows now open the shared BookingModal in view mode
    table = FrontDeskTable.create({
      target: '#tableSlot',
      title: 'Full Report',
      columns: [roomColumn, guestColumn, 'checkin', 'checkout', 'nights', 'total', 'paid', 'balance', 'payment', statusColumn, 'actions'],
      summaryLabels: { count:'Records', total:'Total Revenue', paid:'Collected', balance:'Balance Due' },
      calc: { nights, total: calcTotal, paid: calcPaid, balance: calcBal },
      statusMap: BookingData.getStatusConfig().reduce((map, s) => { map[s.value] = { label: s.label, cls: 'ft-chip-' + s.tone }; return map; }, {}),
      getRowPerm: (b, session) => ({ canView: true, canEdit: false, canDelete: false }),
      onRowClick: (b) => openReportInModal(b),
      onView: (b) => openReportInModal(b)
    });

    applyInlineFilters();

    // For non-privileged staff: lock the date range picker and period pills
    // so the restriction is visible in the UI as well as enforced in code.
    applyRoleUI();
    if (!isPrivileged()) {
      const dateInput = document.getElementById('fbDateRange');
      if (dateInput) dateInput.setAttribute('disabled', 'disabled');
      document.querySelectorAll('#periodPills .fb-pill').forEach(b => {
        b.setAttribute('disabled', 'disabled');
        b.style.pointerEvents = 'none';
        b.style.opacity = '0.4';
      });
    }

  } catch (err) {
    console.error('[Reports] Failed to load:', err);
    document.getElementById('tableSlot').innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);">Could not load report data.</div>';
  }
}
init();
</script>
</body>
</html>
