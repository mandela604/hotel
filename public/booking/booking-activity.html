<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Activity Log | Boston Leisure Hotel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--radius:14px;--radius-sm:10px;--bg:#f4f6fb;--surface:#fff;--surface2:#f4f6fb;
--border:#eef0f6;--border2:#dfe3ec;--text:#1c2440;--text2:#6b7280;--text3:#9aa1b3;
--gold:#2f6fed;--gold-light:#5b8ff9;--gold-dim:rgba(47,111,237,.1);--gold-border:rgba(47,111,237,.25);
--green:#12b76a;--green-bg:#e9f9f0;--red:#f04438;--amber:#f79009;--amber-bg:#fff4e5;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:13px;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
.main{margin-left:256px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
@media(max-width:768px){.main{margin-left:0 !important;}}
.content{flex:1;padding:20px 24px 28px;min-width:0;display:flex;flex-direction:column;gap:16px;}
@media(max-width:480px){.content{padding:16px 14px 22px;}}
.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 4px 20px rgba(15,34,55,.07);}
.flt-group{display:flex;flex-direction:column;gap:5px;}
.flt-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);font-weight:700;}
.form-select,.form-input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:12.5px;color:var(--text);outline:none;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid transparent;}
.btn-primary{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn-primary:hover{background:var(--gold-light);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--gold-border);color:var(--gold);}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 20px rgba(15,34,55,.07);overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px;flex-wrap:wrap;gap:8px;}
.panel-title{font-size:14px;font-weight:800;} .panel-sub{font-size:11.5px;color:var(--text3);font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:10px 20px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;}
td{padding:11px 20px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.chip-booking{background:var(--gold-dim);color:var(--gold);}
.chip-other{background:var(--surface2);color:var(--text2);}
.empty{text-align:center;padding:28px;color:var(--text3);}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);flex-wrap:wrap;gap:8px;font-weight:600;}
.page-btns{display:flex;gap:3px;flex-wrap:wrap;}
.page-btn{min-width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;font-size:12px;font-family:inherit;padding:0 7px;font-weight:600;}
.page-btn.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold);font-weight:700;}
.page-btn:disabled{opacity:.3;pointer-events:none;}
.toast{position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:12.5px;box-shadow:0 8px 28px rgba(15,20,40,.18);z-index:9999;font-weight:600;}
.toast.error{border-left:3px solid var(--red);}
</style>
</head>
<body>
<div class="app" style="display:flex;min-height:100vh;width:100%;">
<div id="sidebarSlot"></div>
<div class="main">
<div id="topbarSlot"></div>
<div class="content">
<div class="toolbar">
<div class="flt-group"><span class="flt-label">Search</span><input class="form-input" type="search" id="q" placeholder="Who, what, room…" style="min-width:200px;"></div>
<div class="flt-group"><span class="flt-label">Department</span><select class="form-select" id="dept"><option value="">All departments</option></select></div>
<div class="flt-group"><span class="flt-label">From</span><input class="form-input" type="date" id="from"></div>
<div class="flt-group"><span class="flt-label">To</span><input class="form-input" type="date" id="to"></div>
<button class="btn btn-primary" onclick="loadLog()"><i class="fa-solid fa-rotate"></i> Load</button>
<button class="btn btn-outline" onclick="clearFilters()">Clear</button>
</div>
<div class="panel">
<div class="panel-head"><div><div class="panel-title">Front Desk Activity Log</div><div class="panel-sub" id="logSub">Who did what, when.</div></div></div>
<div style="overflow-x:auto;"><table>
<thead><tr><th>Time</th><th>Who</th><th>Department</th><th>Details</th></tr></thead>
<tbody id="logBody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
</table></div>
<div class="pagination"><span id="paginLabel">—</span><div class="page-btns" id="pageBtns"></div></div>
</div>
</div>
</div>
</div>
<script src="../component/booking-shell.js"></script>
<script>
(function(){
'use strict';
var shell = BookingShell.attach({ sidebarTarget:'#sidebarSlot', topbarTarget:'#topbarSlot', activeFile:'booking-activity.html', pageTitle:'Activity Log', pageSubtitle:'Who did what, when — front desk trail' });
var page = 1, pages = 1, total = 0;
var PAGE_SIZE = 20, timer = null;
function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':s); return d.innerHTML; }
function fmtTime(ts){ try { var d=new Date(ts); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); } catch(e){ return '—'; } }
function whoOf(text){
  var m = String(text||'').match(/(?:^|\s)by\s+([A-Z][A-Za-z .'\-]{1,60})\s*$/);
  return m ? m[1].trim() : '—';
}
window.clearFilters = function(){
  document.getElementById('q').value='';
  document.getElementById('dept').value='';
  document.getElementById('from').value='';
  document.getElementById('to').value='';
  page = 1; loadLog();
};
function deptChip(d){
  return '<span class="chip ' + (String(d||'').toLowerCase()==='booking' ? 'chip-booking' : 'chip-other') + '">' + esc(d||'—') + '</span>';
}
window.loadLog = async function(){
  var body = document.getElementById('logBody');
  body.innerHTML = '<tr><td colspan="4" class="empty">Loading…</td></tr>';
  try{
    var p = new URLSearchParams({ page: page, limit: PAGE_SIZE });
    var q = document.getElementById('q').value.trim();
    var dept = document.getElementById('dept').value;
    var from = document.getElementById('from').value;
    var to = document.getElementById('to').value;
    if (q) p.set('search', q);
    if (dept) p.set('dept', dept);
    if (from) p.set('from', from);
    if (to) p.set('to', to);
    var r = await fetch('/api/activity?' + p.toString(), { credentials: 'include' });
    var j = await r.json();
    if (!r.ok || !j.success) throw new Error((j && j.error) || ('Request failed (' + r.status + ')'));
    var rows = j.data || [];
    total = j.total || rows.length; pages = j.pages || 1;
    // department options from data seen so far + current selection kept
    var sel = document.getElementById('dept');
    if (sel.options.length <= 1) {
      var depts = {};
      rows.forEach(function(x){ if (x.dept) depts[x.dept] = 1; });
      Object.keys(depts).sort().forEach(function(d){
        if (!sel.querySelector('option[value="' + d.replace(/"/g,'') + '"]')) {
          var o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o);
        }
      });
    }
    document.getElementById('logSub').textContent = total + ' entr' + (total===1?'y':'ies');
    document.getElementById('paginLabel').textContent = total === 0 ? 'No records' : (((page-1)*PAGE_SIZE+1) + '–' + Math.min(page*PAGE_SIZE,total) + ' of ' + total);
    body.innerHTML = rows.length ? rows.map(function(x){
      return '<tr><td style="white-space:nowrap;">' + fmtTime(x.createdAt) + '</td>' +
        '<td style="font-weight:700;">' + esc(whoOf(x.text)) + '</td>' +
        '<td>' + deptChip(x.dept) + '</td>' +
        '<td>' + esc(x.text) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="empty">No activity matches these filters.</td></tr>';
    renderPages();
  }catch(e){
    body.innerHTML = '<tr><td colspan="4" class="empty">Failed: ' + esc(e.message) + '</td></tr>';
  }
};
function renderPages(){
  var wrap = document.getElementById('pageBtns');
  wrap.innerHTML = '';
  function mk(label, pg, dis, active){
    var b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.innerHTML = label; b.disabled = !!dis;
    b.onclick = function(){ page = pg; loadLog(); };
    return b;
  }
  wrap.appendChild(mk('‹', page-1, page===1, false));
  var totalPages = Math.max(1, pages);
  var start = Math.max(1, Math.min(page-2, totalPages-4)), end = Math.min(totalPages, start+4);
  for (var i=start;i<=end;i++) wrap.appendChild(mk(i, i, false, i===page));
  wrap.appendChild(mk('›', page+1, page>=totalPages, false));
}
// Live refresh on new activity (shell auto-refresh hook)
window.refreshDataAndRender = function(){ loadLog(); };
['q'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(){
    clearTimeout(timer); timer = setTimeout(function(){ page = 1; loadLog(); }, 400);
  });
});
['dept','from','to'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){ page = 1; loadLog(); });
});
loadLog();
})();
</script>
</body>
</html>
