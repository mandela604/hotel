<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aurum Hotel — Rooms</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ── Same styles as before, unchanged ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --radius: 14px; --radius-sm: 10px; --transition: 0.3s cubic-bezier(.4,0,.2,1); }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  transition: background var(--transition), color var(--transition);
}
.app { display: flex; min-height: 100vh; }
.main { margin-left: 250px; flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; transition: margin-left var(--transition); }
@media (max-width: 768px) { .main { margin-left: 0 !important; } }

.content {
  flex: 1; padding: 24px; min-width: 0; overflow-x: hidden;
  --bg: #f4f6fb; --surface: #ffffff; --surface2: #f4f6fb; --surface3: #eef0f6;
  --border: #eef0f6; --border2: #dfe3ec;
  --text: #1c2440; --text2: #6b7280; --text3: #9aa1b3;
  --shadow: 0 4px 20px rgba(15,34,55,0.07); --shadow-lg: 0 8px 40px rgba(15,34,55,0.10);
  --input-bg: #f4f6fb; --modal-bg: #ffffff;
  --gold: #2f6fed; --gold-light: #5b8ff9; --gold-dim: rgba(47,111,237,0.10); --gold-border: rgba(47,111,237,0.25);
  --green: #12b76a; --green-bg: #e9f9f0;
  --red: #f04438; --red-bg: #feecec;
  --amber: #f79009; --amber-bg: #fff4e5;
  --blue: #2f6fed; --blue-bg: #eaf1ff;
  --purple: #8b5cf6; --purple-bg: #f4efff;
  background: var(--bg);
  color: var(--text);
}
@media (max-width: 480px) { .content { padding: 14px; } }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.status-chips { display: flex; align-items: center; gap: 7px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; margin-bottom: 10px; flex-wrap: wrap; }
.status-chips::-webkit-scrollbar { height: 0; }
.sc-btn { flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 13px; font-size: 11.5px; font-weight: 600; color: var(--text2); cursor: pointer; transition: all 0.2s; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
.sc-btn:hover, .sc-btn.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }
.sc-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.stat-pills { display: flex; gap: 7px; margin-left: auto; flex-wrap: wrap; }
.stat-chip { flex-shrink: 0; border-radius: 20px; padding: 5px 13px; font-size: 11.5px; font-weight: 700; cursor: default; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid; }
.stat-chip i { font-size: 10.5px; }
.stat-chip.occ { background: var(--green-bg); border-color: rgba(18,183,106,0.25); color: var(--green); }
.stat-chip.rev { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }
.stat-chip strong { font-weight: 800; }
@media (max-width: 700px) { .stat-pills { margin-left: 0; width: 100%; } }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
.toolbar-right { display: flex; gap: 7px; flex-shrink: 0; }
.search-wrap { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; transition: border-color 0.2s; flex: 1; min-width: 160px; max-width: 260px; }
.search-wrap:focus-within { border-color: var(--gold-border); }
.search-wrap i { color: var(--text3); font-size: 12.5px; }
.search-wrap input { background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 13px; width: 100%; }
.search-wrap input::placeholder { color: var(--text3); }
.filter-sel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text); font-family: inherit; font-size: 12.5px; cursor: pointer; outline: none; transition: border-color 0.2s; }
.filter-sel:focus { border-color: var(--gold-border); }
@media (max-width: 700px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar-left { flex-direction: column; align-items: stretch; }
  .toolbar-right { width: 100%; }
  .toolbar-right .btn-primary, .toolbar-right .btn-outline { flex: 1; justify-content: center; }
  .search-wrap { max-width: 100%; }
  .filter-sel { width: 100%; }
}

.btn-primary { background: var(--gold); color: #fff; border: 1px solid var(--gold); border-radius: var(--radius-sm); padding: 9px 16px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; box-shadow: 0 4px 10px rgba(47,111,237,0.28); }
.btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
.btn-primary i { font-size: 11px; }
.btn-outline { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text); cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn-outline:hover { border-color: var(--gold-border); color: var(--gold); }
.btn-outline i { color: var(--text3); font-size: 12px; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; animation: fadeUp 0.4s ease both; overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 14px; flex-wrap: wrap; gap: 8px; }
.panel-title { font-size: 14px; font-weight: 800; color: var(--text); }
.panel-sub { font-size: 11.5px; color: var(--text3); font-weight: 600; }

.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 0 20px 20px; align-items: stretch; }
@media (max-width: 480px) { .room-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); padding: 0 14px 14px; } }

.room-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
  display: flex; flex-direction: column; min-height: 208px;
}
.room-card:hover { transform: translateY(-2px); border-color: var(--gold-border); box-shadow: 0 6px 20px rgba(47,111,237,0.10); }
.room-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.room-card.available::before   { background: var(--green); }
.room-card.checkedin::before   { background: var(--gold); }
.room-card.reserved::before    { background: var(--purple); }
.room-card.checkout::before    { background: var(--red); }
.room-card.no-show::before     { background: var(--red); }
.room-card.cancelled::before   { background: var(--red); }
.room-card.maintenance::before { background: var(--amber); }

.room-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; min-height: 26px; }
.room-num { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1; }
.room-type-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); font-weight: 700; margin: 3px 0 9px; min-height: 12px; }

.room-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 9.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.room-chip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
.rc-available   { background: var(--green-bg); color: var(--green); }   .rc-available::before   { background: var(--green); }
.rc-checkedin   { background: var(--gold-dim); color: var(--gold); }    .rc-checkedin::before   { background: var(--gold); }
.rc-reserved    { background: var(--purple-bg); color: var(--purple); }.rc-reserved::before    { background: var(--purple); }
.rc-checkout    { background: var(--red-bg); color: var(--red); }       .rc-checkout::before    { background: var(--red); }
.rc-noshow      { background: var(--red-bg); color: var(--red); }       .rc-noshow::before      { background: var(--red); }
.rc-cancelled   { background: var(--red-bg); color: var(--red); }       .rc-cancelled::before   { background: var(--red); }
.rc-maintenance { background: var(--amber-bg); color: var(--amber); }   .rc-maintenance::before { background: var(--amber); }

.room-guest-block { min-height: 34px; margin-bottom: 8px; }
.room-guest-name { font-size: 11.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-guest-empty { font-size: 11px; color: var(--text3); font-style: italic; }
.room-dates { font-size: 10px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.room-rate { font-size: 11px; color: var(--text2); font-weight: 700; margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--border); }
.room-rate span { color: var(--text3); font-weight: 500; }

.room-acts { display: flex; gap: 6px; margin-top: 9px; min-height: 30px; }
.room-act-btn { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 0; font-size: 10.5px; font-weight: 700; color: var(--text2); cursor: pointer; transition: all 0.15s; font-family: inherit; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.room-act-btn:hover { border-color: var(--gold-border); color: var(--gold); background: var(--gold-dim); }
.room-act-btn.primary { background: var(--gold); border-color: var(--gold); color: #fff; box-shadow: 0 3px 8px rgba(47,111,237,0.25); }
.room-act-btn.primary:hover { background: var(--gold-light); color: #fff; }
.room-act-btn.danger:hover { border-color: rgba(240,68,56,0.4); color: var(--red); background: var(--red-bg); }

.room-empty { grid-column: 1/-1; text-align: center; padding: 30px 0; color: var(--text3); font-size: 12.5px; }

.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text3); flex-wrap: wrap; gap: 8px; font-weight: 600; }
.page-btns { display: flex; gap: 3px; flex-wrap: wrap; }
.page-btn { min-width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; font-family: inherit; padding: 0 7px; font-weight: 600; }
.page-btn:hover { border-color: var(--gold-border); color: var(--gold); }
.page-btn.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); font-weight: 700; }
.page-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

/* ── MODAL OVERLAY (for Room Status and Room Edit) ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(15,20,40,0.55); backdrop-filter: blur(5px); z-index: 300;
  align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto;
  --bg: #f4f6fb; --surface: #ffffff; --surface2: #f4f6fb; --surface3: #eef0f6;
  --border: #eef0f6; --border2: #dfe3ec;
  --text: #1c2440; --text2: #6b7280; --text3: #9aa1b3;
  --input-bg: #f4f6fb; --modal-bg: #ffffff;
  --gold: #2f6fed; --gold-light: #5b8ff9; --gold-dim: rgba(47,111,237,0.10); --gold-border: rgba(47,111,237,0.25);
  --green: #12b76a; --green-bg: #e9f9f0;
  --red: #f04438; --red-bg: #feecec;
  --amber: #f79009; --amber-bg: #fff4e5;
  --blue: #2f6fed; --blue-bg: #eaf1ff;
  --purple: #8b5cf6; --purple-bg: #f4efff;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
}
.modal-overlay.show { display: flex; }
.modal { background: var(--modal-bg); border: 1px solid var(--border); border-radius: 18px; padding: 24px; width: min(680px, 96vw); box-shadow: 0 30px 80px rgba(15,20,40,0.25); animation: modalIn 0.25s cubic-bezier(.4,0,.2,1); margin: auto; }
.modal-sm { width: min(440px, 96vw); }
@media (max-width: 480px) { .modal { padding: 18px; border-radius: 14px; } }
.confirm-modal { background: var(--modal-bg); border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: min(380px, 90vw); box-shadow: 0 20px 60px rgba(15,20,40,0.25); animation: modalIn 0.2s ease; margin: 80px auto auto; }
@keyframes modalIn { from{opacity:0;transform:translateY(14px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-title { font-size: 19px; font-weight: 800; color: var(--text); }
.modal-sub { font-size: 11.5px; color: var(--text3); margin-top: 2px; font-weight: 600; }
.modal-close { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; color: var(--text2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.modal-close:hover { color: var(--text); border-color: var(--gold-border); }

.form-section { margin-bottom: 16px; }
.form-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); font-weight: 800; margin-bottom: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--gold-border); display: flex; align-items: center; gap: 7px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 500px) { .form-grid, .form-grid-3 { grid-template-columns: 1fr; } }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.span2 { grid-column: span 2; }
@media (max-width: 500px) { .form-group.span2 { grid-column: span 1; } }
.form-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); font-weight: 700; }
.form-input, .form-select { background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.2s; width: 100%; }
.form-input:focus, .form-select:focus { border-color: var(--gold-border); }
.form-input[readonly] { opacity: 0.6; cursor: default; }
.form-hint { font-size: 10.5px; color: var(--text3); margin-top: 4px; }

.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
@media (max-width: 480px) { .modal-footer { flex-direction: column-reverse; } .modal-footer button { width: 100%; justify-content: center; } }

.toast {
  position: fixed; bottom: 20px; right: 20px; background: #ffffff; border: 1px solid #eef0f6; border-radius: var(--radius-sm);
  padding: 11px 16px; font-size: 13px; color: #1c2440; box-shadow: 0 8px 28px rgba(15,20,40,0.18); z-index: 999;
  display: flex; align-items: center; gap: 8px; animation: toastIn 0.3s ease; max-width: calc(100vw - 40px);
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; font-weight: 600;
}
.toast.success { border-left: 3px solid #12b76a; }
.toast.error   { border-left: 3px solid #f04438; }
.toast.info    { border-left: 3px solid #2f6fed; }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@media (max-width: 480px) { .toast { left: 14px; right: 14px; bottom: 14px; max-width: none; } }

@media print {
  #sidebarSlot, #topbarSlot, .status-chips, .toolbar, .room-acts, .pagination, .no-print { display: none !important; }
  .main { margin-left: 0 !important; }
  .content { padding: 0 !important; overflow: visible !important; }
  body { background: #fff !important; color: #000 !important; }
  .panel { box-shadow: none !important; border: 1px solid #ccc !important; }
  @page { margin: 16mm; }
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 5px; }

.room-card.cleaning::before { background: #0ea5e9; }
.rc-cleaning { background: #e0f2fe; color: #0ea5e9; }
.rc-cleaning::before { background: #0ea5e9; }
.skeleton{ background:linear-gradient(90deg,#eef0f6 25%,#dfe3ec 50%,#eef0f6 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton-card{ height:88px; border-radius:14px; }
.skeleton-line{ height:12px; border-radius:6px; margin:6px 0; }
.skeleton-btn{ height:32px; border-radius:8px; width:90px; }
.btn-loading{ opacity:.7; pointer-events:none; }
.btn-loading i{ animation:spin 0.8s linear infinite; }
@keyframes spin{to{transform:rotate(360deg)}}

/*#bks-apiBadge { display: none; }*/

</style>
</head>
<body>

<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="status-chips no-print" id="roomFilters">
        <button class="sc-btn active" data-f="all" onclick="filterRooms('all',this)">All Rooms</button>
        <button class="sc-btn" data-f="available" onclick="filterRooms('available',this)"><span class="sc-dot" style="background:var(--green)"></span>Available</button>
        <button class="sc-btn" data-f="checkedin" onclick="filterRooms('checkedin',this)"><span class="sc-dot" style="background:var(--gold)"></span>Occupied</button>
        <button class="sc-btn" data-f="cleaning" onclick="filterRooms('cleaning',this)"><span class="sc-dot" style="background:#0ea5e9"></span>Cleaning</button>
        <button class="sc-btn" data-f="reserved" onclick="filterRooms('reserved',this)"><span class="sc-dot" style="background:var(--purple)"></span>Reserved</button>
        <button class="sc-btn" data-f="checkout" onclick="filterRooms('checkout',this)"><span class="sc-dot" style="background:var(--red)"></span>Check-out</button>
        <button class="sc-btn" data-f="maintenance" onclick="filterRooms('maintenance',this)"><span class="sc-dot" style="background:var(--amber)"></span>Maintenance</button>

        <div class="stat-pills">
          <span class="stat-chip occ"><i class="fa-solid fa-chart-pie"></i> Occupancy <strong id="occRateVal">0%</strong></span>
          <span class="stat-chip rev"><i class="fa-solid fa-sack-dollar"></i> Revenue <strong id="revenueVal">₦0</strong></span>
        </div>
      </div>

      <div class="toolbar no-print">
        <div class="toolbar-left">
          <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="roomSearch" placeholder="Room number…" oninput="roomsPage=1;renderRoomGrid(roomFilter)">
          </div>
          <select class="filter-sel" id="roomTypeFilter" onchange="roomsPage=1;renderRoomGrid(roomFilter)">
            <option value="">All Types</option>
            <option value="Standard">Standard</option>
            <option value="Deluxe">Deluxe</option>
            <option value="Suite">Suite</option>
            <option value="Conference">Conference</option>
          </select>
        </div>
        <div class="toolbar-right">
          <button class="btn-outline" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
          <button class="btn-outline" id="addRoomBtn" onclick="openRoomModal('add')"><i class="fa-solid fa-plus"></i> Add Room</button>
          <button class="btn-primary" id="newBookingBtn" onclick="openBookingModal()"><i class="fa-solid fa-plus"></i> New Booking</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title" id="roomsTitle">All Rooms</div>
          <div class="panel-sub" id="roomsCount">—</div>
        </div>
        <div class="room-grid" id="roomGrid"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>
        <div class="pagination">
          <span id="roomPaginLabel">—</span>
          <div class="page-btns" id="roomPageBtns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ROOM MODAL (Add/Edit Room) -->
<div class="modal-overlay" id="roomModal" onclick="handleModalBackdrop(event,'roomModal')">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="roomModalTitle">Add Room</div>
        <div class="modal-sub" id="roomModalSub">Room details only — no guest information</div>
      </div>
      <button class="modal-close" onclick="closeModal('roomModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-section">
      <div class="form-section-title"><i class="fa-solid fa-bed"></i> Room Details</div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Room Number</label><input class="form-input" type="text" id="rmNum" placeholder="e.g. 205"></div>
        <div class="form-group"><label class="form-label">Room Type</label>
          <select class="form-select" id="rmType"><option>Standard</option><option>Deluxe</option><option>Suite</option><option>Conference</option></select>
        </div>
        <div class="form-group"><label class="form-label">Rate / Night (₦)</label><input class="form-input" type="number" id="rmRate" placeholder="0"></div>
        <div class="form-group" id="rmStatusWrap"><label class="form-label">Initial Status</label>

<!-- ─── SCRIPTS ─── -->
<script src="../services/permissions.js"></script>
<script src="services/booking-service.js"></script>
<script src="../component/booking-shell.js"></script>
<script src="../component/booking-modal.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════
   Shell
═══════════════════════════════════════════════ */
const shell = BookingShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'booking-rooms.html',
  pageTitle:     'Rooms',
  pageSubtitle:  'Room inventory & live status',
});

function getSession() {
  return shell.getUser();
}

function hasPermission(session, permission, module) {
  if (window.Permissions && typeof Permissions.hasPermission === 'function') {
    return Permissions.hasPermission(session, permission, module);
  }
  return !!(session && String(session.role).toLowerCase() === 'admin');
}
function btnLoad(id, on){ const b=document.getElementById(id); if(!b) return; if(on){ b.dataset.orig=b.innerHTML; b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Loading...'; b.disabled=true; } else { if(b.dataset.orig) b.innerHTML=b.dataset.orig; b.disabled=false; } }

/* ═══════════════════════════════════════════════
   Global state
═══════════════════════════════════════════════ */
let allRooms = [];
let bookings = [];
let guests   = [];
let roomFilter = 'all';
let roomsPage  = 1;
let roomModalMode = 'add';
let roomEditNum   = null;
let statusRoom    = null;
const PAGE_ROOMS  = 24;

/* ═══════════════════════════════════════════════
   BookingModal instance
═══════════════════════════════════════════════ */
const bookingModal = BookingModal.create({
  service: BookingData,
  session: getSession(),
  onSaved: function (row) {
    // Refresh data and re-render
    refreshDataAndRender();
  },
  onDeleted: function (roomNum) {
    refreshDataAndRender();
  },
});

/* ═══════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════ */
function nights(ci, co) {
  if (!ci || !co) return 0;
  const n = (new Date(co) - new Date(ci)) / 86400000;
  return n > 0 ? n : 0;
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtN(n) { return '₦' + Math.round(n).toLocaleString('en-NG'); }
function getRoomStatus(num) {
  const b = bookings.find(r => r.room === num);
  if (!b || !b.status) return 'available';
  if (b.status === 'vacant') return 'available';
  if (b.status === 'reserved' && b.checkin) {
    var today = new Date(); today.setHours(0,0,0,0);
    var resStart = new Date(b.checkin); resStart.setHours(0,0,0,0);
    if (today < resStart) return 'available';
  }
  return b.status;
}
function perms() {
  const session = getSession();
  return {
    canCreate:   hasPermission(session, 'canCreate', 'booking'),
    canEditRoom: hasPermission(session, 'canEdit', 'booking'),
    canCheckin:  hasPermission(session, 'canCheckin', 'booking'),
    canCheckout: hasPermission(session, 'canCheckout', 'booking'),
  };
}
function applyPermissionUI() {
  const p = perms();
  document.getElementById('addRoomBtn').style.display   = p.canEditRoom ? '' : 'none';
  document.getElementById('newBookingBtn').style.display = p.canCreate ? '' : 'none';
  return p;
}

const RC_CLS = { available: 'rc-available', checkedin: 'rc-checkedin', reserved: 'rc-reserved', checkout: 'rc-checkout', maintenance: 'rc-maintenance', cleaning: 'rc-cleaning', 'no-show': 'rc-noshow', cancelled: 'rc-cancelled' };
const RC_LBL = { available: 'Available', checkedin: 'Occupied', reserved: 'Reserved', checkout: 'Check-out', maintenance: 'Maintenance', cleaning: 'Cleaning', 'no-show': 'No-Show', cancelled: 'Cancelled' };
const STATUS_OPTS = {
  available:   [{ v: 'maintenance', l: 'Put Under Maintenance' }],
  checkedin:   [{ v: 'cleaning', l: 'Check out → Cleaning' }, { v: 'cancel-refund', l: 'Cancel & Refund' }],
  reserved:    [{ v: 'checkedin', l: 'Check In' }, { v: 'no-show', l: 'Mark No-Show' }, { v: 'cancel-refund', l: 'Cancel & Refund' }, { v: 'vacant', l: 'Cancel / Make Available' }, { v: 'maintenance', l: 'Put Under Maintenance' }],
  checkout:    [{ v: 'vacant', l: 'Mark Available' }, { v: 'maintenance', l: 'Put Under Maintenance' }],
  maintenance: [{ v: 'vacant', l: 'Mark Available' }],
  cleaning:    [{ v: 'vacant', l: 'Mark Available' }, { v: 'maintenance', l: 'Put Under Maintenance' }],
  'no-show':   [{ v: 'cancel-refund', l: 'Cancel & Refund' }, { v: 'vacant', l: 'Mark Available' }],
  cancelled:   [{ v: 'vacant', l: 'Mark Available' }],
};

/* ═══════════════════════════════════════════════
   Data & Rendering
═══════════════════════════════════════════════ */
async function refreshDataAndRender() {
  try {
    const data = await BookingData.getBookingData();
    allRooms = data.rooms;
    bookings = data.bookings;
    guests   = data.guests || [];
    // Update session in modal
    const session = getSession();
    bookingModal.setSession(session);
    renderRoomGrid(roomFilter);
  } catch (err) {
    showToast(err.message || 'Failed to refresh data.', 'error');
  }
}

function renderPagination(btnId, labelId, page, total, size, cb) {
  const totalPages = Math.max(1, Math.ceil(total / size));
  const from = total === 0 ? 0 : (page - 1) * size + 1;
  const to   = Math.min(page * size, total);
  document.getElementById(labelId).textContent = total === 0 ? 'No rooms' : from + '–' + to + ' of ' + total;
  const wrap = document.getElementById(btnId);
  wrap.innerHTML = '';
  const prev = document.createElement('button');
  prev.className = 'page-btn'; prev.textContent = '‹'; prev.disabled = (page === 1);
  prev.onclick = () => cb(page - 1); wrap.appendChild(prev);
  let start = Math.max(1, page - 2), end = Math.min(totalPages, start + 4);
  start = Math.max(1, end - 4);
  for (let i = start; i <= end; i++) {
    (function (pg) {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (pg === page ? ' active' : '');
      btn.textContent = pg;
      btn.onclick = () => cb(pg);
      wrap.appendChild(btn);
    })(i);
  }
  const next = document.createElement('button');
  next.className = 'page-btn'; next.textContent = '›'; next.disabled = (page >= totalPages);
  next.onclick = () => cb(page + 1); wrap.appendChild(next);
}

function updateStatPills() {
  const totalRooms = allRooms.length || 1;
  const occupied = allRooms.filter(r => getRoomStatus(r.num) === 'checkedin').length;
  const occRate = Math.round((occupied / totalRooms) * 100);
  const revenue = bookings.reduce((sum, b) => sum + (BookingData.calcPaid(b)), 0);
  document.getElementById('occRateVal').textContent = occRate + '%';
  document.getElementById('revenueVal').textContent = fmtN(revenue);
}

function filterRooms(st, btn) {
  document.querySelectorAll('#roomFilters .sc-btn[data-f]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  roomFilter = st || 'all';
  roomsPage  = 1;
  renderRoomGrid(roomFilter);
}

function renderRoomGrid(filter) {
  const p = applyPermissionUI();
  const typeF = document.getElementById('roomTypeFilter').value || '';
  const q     = document.getElementById('roomSearch').value.trim().toLowerCase();
  const filtered = allRooms.filter(r => {
    const st = getRoomStatus(r.num) || 'available';
    const mf = filter === 'all' || st === filter;
    const mt = !typeF || r.type === typeF;
    const mq = !q || r.num.toLowerCase().includes(q);
    return mf && mt && mq;
  });

  document.getElementById('roomsTitle').textContent = filter === 'all' ? 'All Rooms' : (RC_LBL[filter] || 'Filtered') + ' Rooms';
  document.getElementById('roomsCount').textContent  = filtered.length + ' of ' + allRooms.length + ' rooms';

  const total = filtered.length;
  const start = (roomsPage - 1) * PAGE_ROOMS;
  const page  = filtered.slice(start, start + PAGE_ROOMS);
  const grid  = document.getElementById('roomGrid');

  if (page.length === 0) {
    grid.innerHTML = '<div class="room-empty">No rooms match these filters.</div>';
  } else {
    grid.innerHTML = page.map(r => {
      const st = getRoomStatus(r.num) || 'available';  // fallback
      const bk = bookings.find(b => b.room === r.num);
      const hasGuest = st !== 'available' && st !== 'maintenance' && st !== 'checkout' && st !== 'cleaning' && bk && bk.guest;

      const guestBlock = hasGuest
        ? '<div class="room-guest-name">' + bk.guest.split(',')[0] + '</div><div class="room-dates">' + fmtDate(bk.checkin) + ' → ' + fmtDate(bk.checkout) + '</div>'
        : '<div class="room-guest-empty">' + (st === 'maintenance' ? (r.notes || (bk && bk.notes) || 'Under maintenance') : st === 'cleaning' ? 'Under cleaning' : st === 'checkout' ? 'Checked out — awaiting cleaning' : 'No active booking') + '</div><div class="room-dates">&nbsp;</div>';

      const isMgr = (getSession() && /^(manager|admin)$/i.test(getSession().role||'')) || p.canEditRoom;
      let acts = '';
      if (st === 'available') {
        acts = '<div class="room-acts">' +
          '<button class="room-act-btn primary" onclick="event.stopPropagation();openBookingForRoom(\'' + r.num + '\')"><i class="fa-solid fa-clipboard-check"></i> Book</button>' +
          (isMgr ? '<button class="room-act-btn" onclick="event.stopPropagation();openRoomModal(\'edit\',\'' + r.num + '\')"><i class="fa-solid fa-pen"></i> Edit</button>' : '') +
          '</div>';
      } else {
        acts = '<div class="room-acts">' +
          '<button class="room-act-btn" onclick="event.stopPropagation();openRoomStatusModal(\'' + r.num + '\')"><i class="fa-solid fa-gear"></i> Status</button>' +
          (isMgr ? '<button class="room-act-btn" onclick="event.stopPropagation();openRoomModal(\'edit\',\'' + r.num + '\')"><i class="fa-solid fa-pen"></i> Edit</button>' : '') +
          '</div>';
      }

      // Card click opens booking modal — occupied fills guest details, available opens new booking
      return '<div class="room-card ' + st + '" onclick="openBookingFromCard(\'' + r.num + '\')" style="cursor:pointer;">' +
        '<div class="room-card-head">' +
          '<div class="room-num">' + r.num + '</div>' +
          '<span class="room-chip ' + (RC_CLS[st] || '') + '">' + (RC_LBL[st] || st) + '</span>' +
        '</div>' +
        '<div class="room-type-lbl">' + r.type + '</div>' +
        '<div class="room-guest-block">' + guestBlock + '</div>' +
        '<div class="room-rate"><span>Rate</span> ' + fmtN(r.rate) + '/night</div>' +
        acts +
      '</div>';
    }).join('');
  }

  renderPagination('roomPageBtns', 'roomPaginLabel', roomsPage, total, PAGE_ROOMS, p => {
    roomsPage = p;
    renderRoomGrid(roomFilter);
  });

  updateStatPills();
  if (shell.setPendingBadge) {
    shell.setPendingBadge(bookings.filter(b => b.status === 'reserved').length);
  }
}



/* ═══════════════════════════════════════════════
   BookingModal wrappers
═══════════════════════════════════════════════ */
function openBookingModal() {
  const session = getSession();
  if (!perms().canCreate) {
    showToast("You don't have permission to create bookings.", 'error');
    return;
  }
  // Pass current session to modal
  bookingModal.setSession(session);
  bookingModal.openNew({});
}

function openBookingForRoom(num) {
  const session = getSession();
  if (!perms().canCreate) {
    showToast("You don't have permission to create bookings.", 'error');
    return;
  }
  bookingModal.setSession(session);
  bookingModal.openNew({ room: num });
}

function openBookingFromCard(num) {
  const session = getSession();
  const bk = bookings.find(function(b){ return b.room === num; });
  const st = bk ? (bk.status || 'vacant') : 'vacant';
  bookingModal.setSession(session);
  if (st === 'checkout' || st === 'cleaning') {
    showToast('Room ' + num + ' is ' + (st === 'cleaning' ? 'under cleaning' : 'checked out — awaiting cleaning') + '. Set status to Available to receive new bookings.', 'info');
    return;
  }
  const isOccupied = bk && bk.guest && st !== 'vacant';
  if (isOccupied) {
    try { bookingModal.openEdit(bk); } catch(e) { bookingModal.openView(bk); }
  } else {
    bookingModal.openNew({ room: num });
  }
}

/* ═══════════════════════════════════════════════
   Room Modal (Add/Edit Room)
═══════════════════════════════════════════════ */
function openRoomModal(mode, num) {
  if (!perms().canEditRoom) {
    showToast("You don't have permission to manage rooms.", 'error');
    return;
  }
  roomModalMode = mode;
  roomEditNum = num || null;
  const isEdit = mode === 'edit';

  document.getElementById('roomModalTitle').textContent   = isEdit ? 'Edit Room ' + num : 'Add Room';
  document.getElementById('roomModalSub').textContent     = isEdit ? 'Room details only — guest info is never shown here' : 'Room details only — no guest information';
  document.getElementById('roomModalSaveBtn').innerHTML   = isEdit ? '<i class="fa-solid fa-check"></i> Save Changes' : '<i class="fa-solid fa-plus"></i> Add Room';
  document.getElementById('rmEditHint').style.display     = isEdit ? 'block' : 'none';
  document.getElementById('rmStatusWrap').style.display   = isEdit ? 'none' : 'flex';

  if (isEdit) {
    const r = allRooms.find(x => x.num === num);
    document.getElementById('rmNum').value   = r ? r.num : num;
    document.getElementById('rmNum').readOnly = false;
    document.getElementById('rmType').value  = r ? r.type : 'Standard';
    document.getElementById('rmRate').value  = r ? r.rate : '';
    document.getElementById('rmNotes').value = r ? (r.notes || '') : '';
  } else {
    document.getElementById('rmNum').readOnly = false;
    document.getElementById('rmNum').value   = '';
    document.getElementById('rmType').value  = 'Standard';
    document.getElementById('rmRate').value  = '';
    document.getElementById('rmNotes').value = '';
    document.getElementById('rmStatus').value = 'vacant';
  }
  document.getElementById('roomModal').classList.add('show');
}

async function saveRoomModal() {
  if (!perms().canEditRoom) {
    showToast("You don't have permission to manage rooms.", 'error');
    return;
  }
  const num   = document.getElementById('rmNum').value.trim();
  const type  = document.getElementById('rmType').value;
  const rate  = parseFloat(document.getElementById('rmRate').value) || 0;
  const notes = document.getElementById('rmNotes').value.trim();
  if (!num) { showToast('Please enter a room number.', 'error'); return; }
  btnLoad('roomModalSaveBtn', true);
  try {
    if (roomModalMode === 'add') {
      if (allRooms.find(r => r.num === num)) {
        showToast('Room ' + num + ' already exists.', 'error');
        return;
      }
      const status = document.getElementById('rmStatus').value;
      await BookingData.saveRoom({ num, type, rate, notes });
      if (status === 'maintenance') {
        await BookingData.setRoomStatus(num, 'maintenance', { notes });
      }
      showToast('Room ' + num + ' added.', 'success');
    } else {
      await BookingData.saveRoom({ num: num, originalNum: roomEditNum, type, rate, notes });
      showToast('Room ' + num + ' updated.', 'success');
    }
    closeModal('roomModal');
    await refreshDataAndRender();
  } catch (err) {
    showToast(err.message || 'Failed to save room.', 'error');
  } finally { btnLoad('roomModalSaveBtn', false); }
}

/* ═══════════════════════════════════════════════
   Room Status Modal
═══════════════════════════════════════════════ */
function openRoomStatusModal(num) {
  const p = perms();
  if (!p.canCheckin && !p.canCheckout && !p.canEditRoom) {
    showToast("You don't have permission to change room status.", 'error');
    return;
  }
  statusRoom = num;
  const r   = allRooms.find(x => x.num === num);
  const bk  = bookings.find(b => b.room === num);
  const cur = getRoomStatus(num);
  document.getElementById('rsRoomNum').textContent   = num;
  document.getElementById('rsRoomType').textContent  = (r && r.type) || '';
  document.getElementById('rsCurStatus').textContent = RC_LBL[cur] || cur;
  document.getElementById('rsNote').value            = (bk && bk.notes) || '';
  const opts = STATUS_OPTS[cur] || [];
  const sel  = document.getElementById('rsNewStatus');
  sel.innerHTML = opts.length === 0
    ? '<option value="">No changes available</option>'
    : opts.map(o => '<option value="' + o.v + '">' + o.l + '</option>').join('');
  document.getElementById('roomStatusModal').classList.add('show');
}

async function saveRoomStatus() {
  if (!statusRoom) return;
  const newSt = document.getElementById('rsNewStatus').value;
  if (!newSt) return;
  const note = document.getElementById('rsNote').value.trim();
  const curSt = getRoomStatus(statusRoom);
  btnLoad('roomStatusSaveBtn', true);
  try {
    // Check-in and check-out are their own backend endpoints — they carry
    // logic (setting real checkin/checkout timestamps, finalizing the
    // stay, etc.) that the generic status PUT does not. Route those two
    // transitions accordingly; everything else (vacant, maintenance,
    // cancel) still goes through the plain status change.
    if (newSt === 'checkedin') {
      await BookingData.checkinBooking(statusRoom, { notes: note });
    } else if (newSt === 'no-show') {
      await fetch('/api/booking/bookings/' + encodeURIComponent(statusRoom) + '/no-show', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({}) }).then(function(r){ return r.json(); }).then(function(d){ if(!d.success) throw new Error(d.error); });
    } else if (newSt === 'cancel-refund') {
      openRefundModal(statusRoom);
      closeModal('roomStatusModal');
      btnLoad('roomStatusSaveBtn', false);
      return;
    } else if (curSt === 'checkedin') {
      // checkoutBooking() always lands the room on 'cleaning' itself —
      // staff can move it further (Available/Maintenance) afterward as
      // its own separate action, not bundled into checkout.
      await BookingData.checkoutBooking(statusRoom);
    } else {
      await BookingData.setRoomStatus(statusRoom, newSt, { notes: note });
    }
    closeModal('roomStatusModal');
    showToast('Room ' + statusRoom + ' → ' + (RC_LBL[newSt] || newSt) + '.', 'success');
    await refreshDataAndRender();
  } catch (err) {
    showToast(err.message || 'Failed to update status.', 'error');
  } finally { btnLoad('roomStatusSaveBtn', false); }
}

/* ═══════════════════════════════════════════════
   Utilities
═══════════════════════════════════════════════ */
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function handleModalBackdrop(e, id) {
  if (e.target === document.getElementById(id)) closeModal(id);
}

function showToast(msg, type) {
  type = type || 'success';
  const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

/* ═══════════════════════════════════════════════
   Init
═══════════════════════════════════════════════ */
async function init() {
  if (!window.BookingData) {
    document.getElementById('roomGrid').innerHTML =
      '<div class="room-empty">BookingData not loaded. Check script order.</div>';
    return;
  }
  try {
    const data = await BookingData.getBookingData();
    allRooms = data.rooms;
    bookings = data.bookings;
    guests   = data.guests || [];
    const session = getSession();
    bookingModal.setSession(session);
    renderRoomGrid('all');
  } catch (err) {
    showToast(err.message || 'Failed to load room data.', 'error');
    document.getElementById('roomGrid').innerHTML =
      '<div class="room-empty">Couldn\'t load room data. Please refresh.</div>';
  }
}

/* ── Cancel & Refund Modal ── */
var refundRoom = null;
function openRefundModal(room) {
  refundRoom = room;
  var bk = bookings.find(function(b){ return b.room === room; });
  if (!bk) return;
  document.getElementById('rfRoomNum').textContent = room;
  document.getElementById('rfGuestName').textContent = bk.guest || '—';
  var totalPaid = (bk.payments || []).reduce(function(s,p){ return s + (Number(p.amount)||0); }, 0) || Number(bk.paid) || 0;
  document.getElementById('rfTotalPaid').textContent = '₦' + totalPaid.toLocaleString();
  document.getElementById('rfType').value = 'none';
  document.getElementById('rfAmount').value = '';
  document.getElementById('rfReason').value = '';
  toggleRefundAmount();
  document.getElementById('refundModal').classList.add('show');
}
function toggleRefundAmount() {
  var t = document.getElementById('rfType').value;
  document.getElementById('rfAmountGroup').style.display = t === 'partial' ? '' : 'none';
}
async function saveCancelRefund() {
  if (!refundRoom) return;
  var refundType = document.getElementById('rfType').value;
  var refundAmount = document.getElementById('rfAmount').value;
  var reason = document.getElementById('rfReason').value.trim();
  btnLoad('refundSaveBtn', true);
  try {
    await fetch('/api/booking/bookings/' + encodeURIComponent(refundRoom) + '/cancel-refund', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ refundType: refundType, refundAmount: Number(refundAmount) || 0, reason: reason })
    }).then(function(r){ return r.json(); }).then(function(d){ if(!d.success) throw new Error(d.error); });
    closeModal('refundModal');
    showToast('Room ' + refundRoom + ' cancelled.', 'success');
    await refreshDataAndRender();
  } catch (err) {
    showToast(err.message || 'Failed to cancel booking.', 'error');
  }
  btnLoad('refundSaveBtn', false);
}

init();
</script>
</body>
</html>
