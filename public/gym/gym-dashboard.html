<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Dashboard | Gym & Fitness — Aurum Hotel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ── Base styles ── */
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{ --radius:14px; --radius-sm:10px; --transition:.3s cubic-bezier(.4,0,.2,1); }
  html{ height:auto; visibility:hidden; }
  html.gym-ready{ visibility:visible; }
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:13px; min-height:100vh;
    background:var(--bg); color:var(--text);
    transition:background .3s,color .3s;
  }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    padding:20px 24px 28px;
    display:flex; flex-direction:column; gap:16px;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:700; margin-bottom:8px; }

  /* ═══ KPI ROW (identical to restaurant) ═══ */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 14px 12px; position:relative; overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s;
    text-decoration:none; display:flex; flex-direction:column; animation:fadeUp .4s ease both; color:inherit;
  }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-card.acc-amber::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.neutral{ color:var(--text3); }

  /* ── Panel / Table (original gym dashboard styles) ── */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:600; color:var(--text); }
  .tbl-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:860px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:600; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.center{ text-align:center; }
  tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  tbody td.center{ text-align:center; }
  .empty-row td{ text-align:center; padding:32px; color:var(--text3); white-space:normal; }
  .mem-name{ font-weight:600; }
  .mem-avatar{ width:28px; height:28px; border-radius:50%; background:var(--gold-dim); border:1.5px solid var(--gold-border); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--gold); margin-right:9px; flex-shrink:0; }
  .mem-cell{ display:flex; align-items:center; }
  .mem-sub{ font-size:10.5px; color:var(--text3); margin-top:1px; }

  .plan-chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .plan-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .chip-active{ background:var(--green-bg); color:var(--green); } .chip-active::before{ background:var(--green); }
  .chip-expiring{ background:var(--amber-bg); color:var(--amber); } .chip-expiring::before{ background:var(--amber); }
  .chip-expired{ background:var(--red-bg); color:var(--red); } .chip-expired::before{ background:var(--red); }
  .chip-frozen{ background:var(--blue-bg); color:var(--blue); } .chip-frozen::before{ background:var(--blue); }

  .act-btns{ display:flex; gap:5px; flex-wrap:nowrap; }
  .act-btn{ background:none; border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:11px; font-weight:500; color:var(--text2); cursor:pointer; transition:all .15s; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
  .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .act-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .act-btn.green:hover{ border-color:var(--green); color:var(--green); }
  .act-btn:disabled{ opacity:.35; cursor:not-allowed; pointer-events:none; }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:600; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-primary{ background:var(--gold); color:#fff; font-weight:600; }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }

  .btn-ghost{ background:none; border:none; color:var(--text3); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:11.5px; cursor:pointer; padding:8px 6px; }
  .btn-ghost:hover{ color:var(--gold); }

  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:12.5px; cursor:pointer; outline:none; max-width:160px; }
  .filter-select:focus{ border-color:var(--gold-border); }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .toolbar-row.top{ justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .toolbar-btns{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:600; padding-left:2px; }

  .status-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-pill{ display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text2); transition:all .15s; white-space:nowrap; }
  .status-pill:hover{ border-color:var(--gold-border); }
  .status-pill .pdot{ width:6px; height:6px; border-radius:50%; }
  .status-pill.on.all{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .status-pill.on.active{ background:var(--green-bg); border-color:rgba(18,183,106,.4); color:var(--green); }
  .status-pill.on.expiring{ background:var(--amber-bg); border-color:rgba(247,144,9,.4); color:var(--amber); }
  .status-pill.on.expired{ background:var(--red-bg); border-color:rgba(240,68,56,.4); color:var(--red); }
  .status-pill.on.frozen{ background:var(--blue-bg); border-color:rgba(47,111,237,.4); color:var(--blue); }

  @media (max-width:700px){
    .toolbar-row.top{ flex-direction:column; align-items:stretch; }
    .toolbar-left{ flex-direction:column; align-items:stretch; }
    .flt-group{ width:100%; }
    .search-box{ max-width:100%; }
    .filter-select{ width:100%; max-width:none; }
    .toolbar-btns{ width:100%; }
    .toolbar-btns .btn{ flex:1; justify-content:center; }
  }

  /* ── Modals (unchanged from original) ── */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto;
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec; --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--modal-bg,var(--surface)); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(560px,96vw); box-shadow:0 32px 80px rgba(15,34,55,0.25); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; position:relative; overflow:hidden; }
  .modal::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
  .modal.mode-delete::before{ background:var(--red); }
  .modal-sm{ width:min(420px,96vw); }
  .modal-lg{ width:min(640px,96vw); }
  @keyframes modalIn{ from{opacity:0;transform:translateY(16px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:19px; font-weight:700; color:var(--text); }
  .modal-close{ background:none; border:none; color:var(--text3); font-size:18px; cursor:pointer; padding:4px; line-height:1; }
  .modal-close:hover{ color:var(--text); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  @media (max-width:480px){ .form-row{ grid-template-columns:1fr; } }
  .form-group{ display:flex; flex-direction:column; gap:5px; }
  .form-group.span2{ grid-column:span 2; }
  @media (max-width:480px){ .form-group.span2{ grid-column:span 1; } }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:500; }
  .form-label.required::after{ content:' *'; color:var(--red); }
  .form-input, .form-select, .form-textarea{ background:var(--input-bg,var(--surface2)); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:13px; outline:none; transition:border-color .2s; width:100%; }
  .form-input:focus, .form-select:focus, .form-textarea:focus{ border-color:var(--gold-border); }
  .form-input:read-only{ opacity:.7; cursor:default; }
  .form-textarea{ resize:vertical; min-height:60px; }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .val-note{ font-size:12px; color:var(--text2); margin-bottom:14px; line-height:1.5; }
  .val-note strong{ color:var(--text); }

  .detail-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .detail-avatar{ width:54px; height:54px; border-radius:50%; background:var(--gold-dim); border:2px solid var(--gold-border); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:var(--gold); flex-shrink:0; }
  .detail-name{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:21px; font-weight:700; color:var(--text); line-height:1.2; }
  .detail-subline{ display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
  @media (max-width:480px){ .detail-grid{ grid-template-columns:1fr 1fr; } }
  .detail-stat{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .detail-stat-label{ font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:600; margin-bottom:4px; }
  .detail-stat-val{ font-size:12.5px; color:var(--text); font-weight:600; line-height:1.4; }
  .plan-detail-card{ border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; }
  .plan-detail-top{ display:flex; align-items:center; justify-content:space-between; font-size:13px; margin-bottom:6px; flex-wrap:wrap; gap:6px; }
  .plan-detail-notes{ font-size:12px; color:var(--text2); line-height:1.5; white-space:pre-line; }
  .detail-section{ margin-bottom:14px; }
  .detail-section-title{ font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--gold); font-weight:700; margin-bottom:8px; }
  .detail-section-body{ font-size:12.5px; color:var(--text2); line-height:1.55; }
  .checkin-row{ display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--text2); padding:6px 0; border-bottom:1px solid var(--border); }
  .checkin-row:last-child{ border-bottom:none; }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:12px 0; text-align:center; }
  .plan-list{ display:flex; flex-direction:column; gap:12px; }
  .plan-card{ border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--surface2); }
  .plan-card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .plan-form{ background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .color-swatches{ display:flex; align-items:center; gap:8px; padding-top:4px; }
  .color-swatch{ width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .15s; display:inline-block; }
  .color-swatch:hover{ transform:scale(1.1); }
  .color-swatch.on{ border-color:var(--text); box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--text); }
  .guest-result{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; transition:background .15s; border:1px solid var(--border); margin-bottom:4px; }
  .guest-result:hover{ background:var(--surface2); border-color:var(--gold-border); }
  .guest-result.selected{ background:var(--gold-dim); border-color:var(--gold-border); }
  .guest-result-avatar{ width:30px; height:30px; border-radius:50%; background:var(--gold-dim); border:1.5px solid var(--gold-border); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--gold); flex-shrink:0; }
  .guest-result-info{ flex:1; min-width:0; }
  .guest-result-name{ font-size:12.5px; font-weight:600; color:var(--text); }
  .guest-result-meta{ font-size:10.5px; color:var(--text3); }

  /* Toast */
  .toast{ position:fixed; bottom:20px; right:20px; background:#ffffff; border:1px solid #eef0f6; border-radius:10px; padding:11px 16px; font-size:12.5px; color:#1c2440; box-shadow:0 8px 28px rgba(15,34,55,0.18); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-weight:600; }
  .toast.success{ border-left:3px solid #12b76a; }
  .toast.error{ border-left:3px solid #f04438; }
  .toast.info{ border-left:3px solid #2f6fed; }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  @media print{
    .gym-sidebar, .gym-topbar, .toolbar, .pagination, .act-btns, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
    .tbl-wrap{ overflow:visible !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar + topbar rendered by gym-shell.js -->
  <div id="sidebarSlot"></div>

  <div class="main" id="mainWrap">

<script>
/* ═══════════════════════════════════════════
   Shell — sidebar + topbar for the Gym module.
═══════════════════════════════════════════ */
var shell = GymShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'gym-dashboard.html',
  pageTitle:     'Dashboard',
  pageSubtitle:  'Gym & Fitness operations',
});
document.documentElement.classList.add('gym-ready');

/* ═══════════════════════════════════════════
   STORAGE & DATA (from GymService)
═══════════════════════════════════════════ */
var members  = [];
var plans    = [];
var checkins = [];
var guests   = [];
var page = 1;
var statusFilter = '';
var activeId = null;
var editingPlanId = null;
var deleteTarget = null;
var detailMemberId = null;
var editMemberId = null;
var selectedGuestId = null;

var PAGE_SIZE = 8;
var DETAIL_CHECKIN_PAGE_SIZE = 5;

/* ═══════════════════════════════════════════
   Session & Permissions
═══════════════════════════════════════════ */
var session = null;
var canEdit = false;
var canDelete = false;
var canManagePlans = false;
var canCreate = false;

function waitForSession(maxMs) {
  maxMs = maxMs || 800;
  return new Promise(function (resolve) {
    var started = Date.now();
    var tick = function () {
      var u = shell.getUser && shell.getUser();
      if (u && u.role) { resolve(u); return; }
      if (Date.now() - started >= maxMs) {
        resolve(shell.getUser && shell.getUser());
        return;
      }
      setTimeout(tick, 40);
    };
    tick();
  });
}

function P() { return window.Permissions || null; }
function hasPermission(session, permission, module) {
  var x = P();
  if (x && x.hasPermission) return x.hasPermission(session, permission, module);
  return !!(session && String(session.role).toLowerCase() === 'admin');
}

/* ═══════════════════════════════════════════
   HELPERS (delegated to GymService)
═══════════════════════════════════════════ */
function _esc(s) { return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtN(n) { return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function fmtDate(s) { if(!s) return '—'; return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso) { if(!iso) return '—'; var d = new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ', ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function timeAgo(iso) { if (!iso) return '—'; var mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000); if (mins < 1) return 'Just now'; if (mins < 60) return mins + 'm ago'; var hrs = Math.floor(mins/60); if (hrs < 24) return hrs + 'h ago'; var days = Math.floor(hrs/24); if (days < 7) return days + 'd ago'; return fmtDateTime(iso); }
function daysUntil(s) { if(!s) return null; var d = new Date(s+'T00:00:00'); var t = new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function initials(name){ return (name||'').split(' ').filter(Boolean).map(function(w){ return w[0]; }).join('').toUpperCase().slice(0,2); }
function genId(prefix){ return prefix + Date.now() + Math.floor(Math.random()*1000); }

function computeStatus(m){
  if (!m.planId) return 'expired';
  if (m.status === 'frozen') return 'frozen';
  var days = daysUntil(m.expiry);
  if (days === null) return 'active';
  if (days < 0) return 'expired';
  if (days <= 7) return 'expiring';
  return 'active';
}
var STATUS_LABEL = { active:'Active', expiring:'Expiring', expired:'Expired', frozen:'Inactive' };
var STATUS_CHIP  = { active:'chip-active', expiring:'chip-expiring', expired:'chip-expired', frozen:'chip-frozen' };

var COLOR_TOKENS = {
  gold:   { bg:'var(--gold-dim)',   fg:'var(--gold-light)', dot:'var(--gold)' },
  blue:   { bg:'var(--blue-bg)',    fg:'var(--blue)',       dot:'var(--blue)' },
  purple: { bg:'var(--purple-bg)',  fg:'var(--purple)',     dot:'var(--purple)' },
  green:  { bg:'var(--green-bg)',   fg:'var(--green)',      dot:'var(--green)' },
  amber:  { bg:'var(--amber-bg)',   fg:'var(--amber)',      dot:'var(--amber)' },
};

function planById(id) { return plans.find(function(p){ return p.id === id; }) || { id:null, name:'No Plan', price:0, durationDays:0, notes:'', color:'blue' }; }
function planChipHtml(plan) {
  var c = COLOR_TOKENS[plan.color] || COLOR_TOKENS.blue;
  return '<span class="plan-chip" style="background:'+c.bg+';color:'+c.fg+';"><span class="plan-dot" style="background:'+c.dot+';"></span>'+_esc(plan.name)+'</span>';
}

/* ═══════════════════════════════════════════
   RENDER KPIs — MATCHES RESTAURANT DASHBOARD
═══════════════════════════════════════════ */
function renderKPIs() {
  var withStatus = members.map(function(m){ return {_s: computeStatus(m), m:m}; });
  var active   = withStatus.filter(function(x){ return x._s === 'active'; }).length;
  var expiring = withStatus.filter(function(x){ return x._s === 'expiring'; }).length;
  var expired  = withStatus.filter(function(x){ return x._s === 'expired'; }).length;
  var revenue  = withStatus.filter(function(x){ return x._s === 'active' || x._s === 'expiring'; })
    .reduce(function(sum, x){ return sum + (planById(x.m.planId).price || 0); }, 0);

  document.getElementById('kpiRow').innerHTML =
    '<a class="kpi-card acc-green" href="#" onclick="setStatus(\'active\')">' +
      '<div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-users"></i></div><div class="kpi-label">Active Members</div></div>' +
      '<div class="kpi-value" style="color:var(--green);">' + active + '</div>' +
      '<div class="kpi-trend up">' + members.length + ' total on file</div>' +
    '</a>' +
    '<a class="kpi-card acc-amber" href="#" onclick="setStatus(\'expiring\')">' +
      '<div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-clock"></i></div><div class="kpi-label">Expiring Within 7 Days</div></div>' +
      '<div class="kpi-value" style="color:var(--amber);">' + expiring + '</div>' +
      '<div class="kpi-trend ' + (expiring > 0 ? 'warn' : 'up') + '">' + (expiring > 0 ? 'Needs renewal outreach' : 'None due') + '</div>' +
    '</a>' +
    '<a class="kpi-card acc-blue" href="#" onclick="setStatus(\'expired\')">' +
      '<div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-user-slash"></i></div><div class="kpi-label">Expired Memberships</div></div>' +
      '<div class="kpi-value" style="color:var(--blue);">' + expired + '</div>' +
      '<div class="kpi-trend ' + (expired > 0 ? 'warn' : 'up') + '">' + (expired > 0 ? 'Access should be blocked' : 'All current') + '</div>' +
    '</a>' +
    '<a class="kpi-card acc-purple" href="#" onclick="openPlansModal()">' +
      '<div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-chart-line"></i></div><div class="kpi-label">Est. Monthly Revenue</div></div>' +
      '<div class="kpi-value" style="color:var(--purple);">' + fmtN(revenue) + '</div>' +
      '<div class="kpi-trend neutral">' + plans.length + ' active plan' + (plans.length !== 1 ? 's' : '') + ' on offer</div>' +
    '</a>';
}

/* ═══════════════════════════════════════════
   STATUS PILLS / FILTERS (unchanged)
═══════════════════════════════════════════ */
function bindStatusPills() {
  document.querySelectorAll('.status-pill').forEach(function(p) {
    p.addEventListener('click', function() { setStatus(p.dataset.status); });
  });
}
function setStatus(s) {
  statusFilter = s;
  document.querySelectorAll('.status-pill').forEach(function(x) { x.classList.remove('on'); });
  var target = document.querySelector('.status-pill[data-status="' + s + '"]');
  if (target) target.classList.add('on');
  page = 1;
  render();
}
function clearFilters() {
  document.getElementById('fSearch').value = '';
  document.getElementById('fPlan').value = '';
  document.getElementById('fSort').value = 'name_asc';
  statusFilter = '';
  document.querySelectorAll('.status-pill').forEach(function(x) { x.classList.remove('on'); });
  document.querySelector('.status-pill.all').classList.add('on');
  page = 1;
  render();
}
function populatePlanFilter() {
  var sel = document.getElementById('fPlan');
  var cur = sel.value;
  sel.innerHTML = '<option value="">All Plans</option>' + plans.map(function(p) { return '<option value="' + p.id + '">' + _esc(p.name) + '</option>'; }).join('');
  if ([].slice.call(sel.options).some(function(o) { return o.value === cur; })) sel.value = cur;
}

function getFiltered() {
  var q = document.getElementById('fSearch').value.toLowerCase();
  var planFilter = document.getElementById('fPlan').value;
  var sort = document.getElementById('fSort').value;
  var rows = members.map(function(m) { return {_s: computeStatus(m), m:m}; }).filter(function(x) {
    var mq = !q || x.m.name.toLowerCase().includes(q) || (x.m.room||'').toLowerCase().includes(q) || (x.m.phone||'').toLowerCase().includes(q);
    var mp = !planFilter || x.m.planId === planFilter;
    var ms = !statusFilter || x._s === statusFilter;
    return mq && mp && ms;
  });
  if (sort === 'name_asc') rows.sort(function(a,b) { return a.m.name.localeCompare(b.m.name); });
  else if (sort === 'expiry_asc') rows.sort(function(a,b) { return (a.m.expiry||'').localeCompare(b.m.expiry||''); });
  else if (sort === 'joined_desc') rows.sort(function(a,b) { return (b.m.joined||'').localeCompare(a.m.joined||''); });
  return rows;
}

/* ═══════════════════════════════════════════
   PAGINATION (unchanged)
═══════════════════════════════════════════ */
function renderPagination(total) {
  var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  var from = total === 0 ? 0 : (page-1)*PAGE_SIZE + 1;
  var to = Math.min(page*PAGE_SIZE, total);
  document.getElementById('paginLabel').textContent = total === 0 ? 'No records' : from + '–' + to + ' of ' + total;
  var wrap = document.getElementById('pageBtns');
  wrap.innerHTML = '';
  var mk = function(label, p, disabled, active) {
    var b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.textContent = label; b.disabled = !!disabled;
    b.onclick = function() { page = p; render(); };
    return b;
  };
  wrap.appendChild(mk('‹', page-1, page===1, false));
  var start = Math.max(1, page-2), end = Math.min(totalPages, start+4); start = Math.max(1, end-4);
  for (var i=start; i<=end; i++) wrap.appendChild(mk(String(i), i, false, i===page));
  wrap.appendChild(mk('›', page+1, page>=totalPages, false));
}

/* ═══════════════════════════════════════════
   RENDER MEMBERS TABLE (unchanged)
═══════════════════════════════════════════ */
function render() {
  renderKPIs();
  var rows = getFiltered();
  document.getElementById('tblCount').textContent = rows.length + ' member' + (rows.length!==1?'s':'');
  var start = (page-1)*PAGE_SIZE;
  var pageRows = rows.slice(start, start+PAGE_SIZE);
  document.getElementById('tblBody').innerHTML = pageRows.length === 0
    ? '<tr class="empty-row"><td colspan="8">No members match your filters.</td></tr>'
    : pageRows.map(function(x) {
        var m = x.m;
        var plan = planById(m.planId);
        var s = x._s;
        var showDelete = canDelete;
        var showEdit = canEdit;
        return '<tr onclick="openDetail(\'' + m.id + '\')">' +
          '<td><div class="mem-cell"><span class="mem-avatar">' + initials(m.name) + '</span><span class="mem-name">' + _esc(m.name) + '</span></div></td>' +
          '<td>' + (m.planId ? planChipHtml(plan) : '<span style="color:var(--text3);font-size:11px;">— Not set</span>') + '</td>' +
          '<td>' + _esc(m.room || '—') + (m.phone ? '<div class="mem-sub">' + _esc(m.phone) + '</div>' : '') + '</td>' +
          '<td>' + fmtDate(m.joined) + '</td>' +
          '<td>' + fmtDate(m.expiry) + '</td>' +
          '<td class="center">' + (m.checkins || 0) + '</td>' +
          '<td><span class="chip ' + STATUS_CHIP[s] + '">' + STATUS_LABEL[s] + '</span></td>' +
          '<td class="no-print center" onclick="event.stopPropagation()">' +
            '<div class="act-btns">' +
              '<button class="act-btn" onclick="openDetail(\'' + m.id + '\')"><i class="fa-regular fa-eye"></i> View</button>' +
              '<button class="act-btn green" onclick="openCheckin(\'' + m.id + '\")" ' + (s === 'expired' || s === 'frozen' ? 'disabled title="Cannot check in — ' + STATUS_LABEL[s].toLowerCase() + '"' : '') + '><i class="fa-solid fa-check"></i> Check-in</button>' +
              '<button class="act-btn" onclick="openRenew(\'' + m.id + '\')"><i class="fa-solid fa-rotate"></i> Renew</button>' +
              (showEdit ? '<button class="act-btn" onclick="openMemberModal(\'' + m.id + '\')"><i class="fa-solid fa-pen"></i></button>' : '') +
              (showDelete ? '<button class="act-btn danger" onclick="openDeleteModal(\'member\',\'' + m.id + '\')"><i class="fa-solid fa-trash"></i></button>' : '') +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');
  renderPagination(rows.length);
}

/* ═══════════════════════════════════════════
   Auto-calculate expiry date when plan changes
═══════════════════════════════════════════ */
function onPlanChange() {
  var planId = document.getElementById('mPlan').value;
  var plan = plans.find(function(p) { return p.id === planId; });
  if (plan && plan.durationDays) {
    var today = new Date(); today.setHours(0,0,0,0);
    var joinedVal = document.getElementById('mJoined').value;
    var base = joinedVal ? new Date(joinedVal + 'T00:00:00') : today;
    if (base < today) base = today;
    var d = new Date(base);
    d.setDate(d.getDate() + plan.durationDays);
    document.getElementById('mExpiry').value = d.toISOString().split('T')[0];
  } else {
    document.getElementById('mExpiry').value = '';
  }
}

function togglePaymentMethod() {
  var isCharge = document.querySelector('input[name="paymentMethod"]:checked').value === 'charge';
  document.getElementById('guestSearchSection').style.display = isCharge ? 'block' : 'none';
  if (!isCharge) {
    selectedGuestId = null;
    document.getElementById('guestResults').innerHTML = '';
  }
}

function searchGuests() {
  var q = document.getElementById('guestSearch').value.toLowerCase().trim();
  var results = document.getElementById('guestResults');
  if (!q) { results.innerHTML = ''; return; }
  var matches = guests.filter(function(g) {
    return g.name.toLowerCase().includes(q) || g.room.toLowerCase().includes(q) || (g.phone||'').includes(q);
  }).slice(0, 6);
  if (matches.length === 0) {
    results.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:6px;">No guests found</div>';
    return;
  }
  results.innerHTML = matches.map(function(g) {
    return '<div class="guest-result' + (selectedGuestId === g.id ? ' selected' : '') + '" onclick="selectGuest(\'' + g.id + '\')">' +
      '<span class="guest-result-avatar">' + initials(g.name) + '</span>' +
      '<div class="guest-result-info">' +
        '<div class="guest-result-name">' + _esc(g.name) + '</div>' +
        '<div class="guest-result-meta">' + _esc(g.room) + ' · ' + _esc(g.phone) + '</div>' +
      '</div>' +
      (selectedGuestId === g.id ? '<i class="fa-solid fa-check" style="color:var(--gold);font-size:14px;"></i>' : '') +
    '</div>';
  }).join('');
}

function selectGuest(id) {
  selectedGuestId = id;
  var g = guests.find(function(x) { return x.id === id; });
  if (g) {
    document.getElementById('guestSearch').value = g.name + ' (' + g.room + ')';
    document.getElementById('mRoom').value = g.room;
    document.getElementById('mPhone').value = g.phone || '';
    document.getElementById('mName').value = g.name;
    showToast('Filled in ' + g.name + '\'s details from Room ' + g.room + '.', 'info');
  }
  searchGuests();
}

/* ═══════════════════════════════════════════
   ADD / EDIT MEMBER MODAL
═══════════════════════════════════════════ */
function populateMemberPlanSelect(selectedId) {
  var sel = document.getElementById('mPlan');
  sel.innerHTML = '<option value="">— Select a Plan —</option>' + plans.map(function(p) { return '<option value="' + p.id + '">' + _esc(p.name) + ' — ' + fmtN(p.price) + '</option>'; }).join('');
  if (selectedId && [].slice.call(sel.options).some(function(o) { return o.value === selectedId; })) sel.value = selectedId;
}

function openMemberModal(id) {
  if (!canCreate && !id) { showToast('You do not have permission to add members.', 'error'); return; }
  if (id && !canEdit) { showToast('You do not have permission to edit members.', 'error'); return; }
  editMemberId = id || null;
  var isEdit = !!id;
  document.getElementById('memberModalTitle').textContent = isEdit ? 'Edit Member' : 'New Gym Member';
  if (isEdit) {
    var m = members.find(function(x) { return x.id === id; });
    if (!m) return;
    document.getElementById('mName').value = m.name;
    populateMemberPlanSelect(m.planId);
    document.getElementById('mRoom').value = m.room || '';
    document.getElementById('mPhone').value = m.phone || '';
    document.getElementById('mJoined').value = m.joined || '';
    document.getElementById('mExpiry').value = m.expiry || '';
    document.getElementById('mNotes').value = m.notes || '';
    document.querySelector('.form-group.span2:last-child').style.display = 'none';
  } else {
    document.getElementById('mName').value = '';
    populateMemberPlanSelect(null);
    document.getElementById('mRoom').value = '';
    document.getElementById('mPhone').value = '';
    document.getElementById('mJoined').value = new Date().toISOString().split('T')[0];
    document.getElementById('mExpiry').value = '';
    document.getElementById('mNotes').value = '';
    document.querySelector('.form-group.span2:last-child').style.display = 'block';
    selectedGuestId = null;
    document.getElementById('guestSearch').value = '';
    document.getElementById('guestResults').innerHTML = '';
    document.querySelector('input[name="paymentMethod"][value="cash"]').checked = true;
    togglePaymentMethod();
  }
  document.getElementById('memberModal').classList.add('show');
}

async function saveMember() {
  var name = document.getElementById('mName').value.trim();
  if (!name) { showToast('Please enter the member\'s name.', 'error'); return; }
  var planId = document.getElementById('mPlan').value;
  if (!planId) { showToast('Please select a membership plan before saving.', 'error'); return; }
  var entry = {
    id: editMemberId || genId('gm'),
    name: name,
    planId: planId,
    room: document.getElementById('mRoom').value.trim(),
    phone: document.getElementById('mPhone').value.trim(),
    joined: document.getElementById('mJoined').value,
    expiry: document.getElementById('mExpiry').value,
    notes: document.getElementById('mNotes').value.trim(),
    checkins: editMemberId ? (members.find(function(m) { return m.id === editMemberId; }) || {}).checkins || 0 : 0,
    lastCheckin: editMemberId ? (members.find(function(m) { return m.id === editMemberId; }) || {}).lastCheckin || null : null,
    status: editMemberId ? (members.find(function(m) { return m.id === editMemberId; }) || {}).status || 'active' : 'active',
  };
  try {
    if (editMemberId) {
      await GymService.editMember(editMemberId, entry);
      showToast('Member updated.', 'success');
    } else {
      await GymService.addMember(entry);
      var paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      if (paymentMethod === 'charge' && selectedGuestId) {
        var guest = guests.find(function(g) { return g.id === selectedGuestId; });
        var plan = planById(planId);
        showToast(name + ' added. ' + fmtN(plan.price) + ' charged to ' + guest.name + ' (' + guest.room + ').', 'success');
      } else if (paymentMethod === 'cash') {
        var plan2 = planById(planId);
        showToast(name + ' added. ' + fmtN(plan2.price) + ' collected in cash.', 'success');
      } else {
        showToast('Member added.', 'success');
      }
    }
    closeModal('memberModal');
    refreshData();
  } catch (err) {
    showToast(err.message || 'Could not save member.', 'error');
  }
}

/* ═══════════════════════════════════════════
   CHECK-IN
═══════════════════════════════════════════ */
function openCheckin(id) {
  var m = members.find(function(x) { return x.id === id; });
  if (!m) return;
  var s = computeStatus(m);
  if (s === 'expired') { showToast('Cannot check in — membership has expired. Please renew first.', 'error'); return; }
  if (s === 'frozen') { showToast('Cannot check in — membership is inactive.', 'error'); return; }
  activeId = id;
  document.getElementById('ciName').textContent = m.name;
  document.getElementById('ciNote').innerHTML = 'Log a gym visit for <strong>' + _esc(m.name) + '</strong>.';
  document.getElementById('checkinModal').classList.add('show');
}
async function confirmCheckin() {
  try {
    await GymService.checkIn(activeId);
    closeModal('checkinModal');
    refreshData();
    var m = members.find(function(x) { return x.id === activeId; });
    showToast((m ? m.name : 'Member') + ' checked in.', 'success');
  } catch (err) {
    showToast(err.message || 'Check-in failed.', 'error');
  }
}

/* ═══════════════════════════════════════════
   RENEW
═══════════════════════════════════════════ */
function openRenew(id) {
  activeId = id;
  var m = members.find(function(x) { return x.id === id; });
  document.getElementById('rnName').textContent = m.name;
  var plan = planById(m.planId);
  var base = m.expiry && new Date(m.expiry + 'T00:00:00') > new Date() ? m.expiry : new Date().toISOString().split('T')[0];
  var d = new Date(base + 'T00:00:00'); d.setDate(d.getDate() + (plan.durationDays || 30));
  document.getElementById('rnExpiry').value = d.toISOString().split('T')[0];
  document.getElementById('renewModal').classList.add('show');
}
async function confirmRenew() {
  var newExpiry = document.getElementById('rnExpiry').value;
  if (!newExpiry) { showToast('Please choose a new expiry date.', 'error'); return; }
  try {
    await GymService.renewMember(activeId, newExpiry);
    closeModal('renewModal');
    refreshData();
    var m = members.find(function(x) { return x.id === activeId; });
    showToast((m ? m.name : 'Member') + '\'s membership renewed to ' + fmtDate(newExpiry) + '.', 'success');
  } catch (err) {
    showToast(err.message || 'Renewal failed.', 'error');
  }
}

   MEMBERSHIP PLANS
═══════════════════════════════════════════ */
function openPlansModal() {
  if (!canManagePlans) { showToast('You do not have permission to manage plans.', 'error'); return; }
  hidePlanForm();
  renderPlanList();
  document.getElementById('plansModal').classList.add('show');
}
function colorSwatchesHtml(selected) {

}
function showPlanForm(id) {

    '<div class="plan-form" style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;">' +

        '<div class="form-group"><label class="form-label">Plan Name</label><input class="form-input" id="pfName" placeholder="e.g. Basic"></div>' +
        '<div class="form-group"><label class="form-label">Price (₦)</label><input class="form-input" type="number" id="pfPrice" placeholder="0" min="0"></div>' +

      '<div class="modal-footer" style="margin-top:0;padding-top:12px;">' +
        '<button class="btn btn-outline btn-sm" onclick="hidePlanForm()">Cancel</button>' +

function hidePlanForm() {

  document.getElementById('planFormWrap').style.display = 'none';

  document.getElementById('addPlanBtn').style.display = 'inline-flex';
}
async function savePlan() {
  var name = document.getElementById('pfName').value.trim();
  if (!name) { showToast('Please enter a plan name.', 'error'); return; }
  var price = parseFloat(document.getElementById('pfPrice').value) || 0;
  var durationDays = parseInt(document.getElementById('pfDuration').value, 10) || 1;
  var notes = document.getElementById('pfNotes').value.trim();
  var colorEl = document.querySelector('#pfColorRow .color-swatch.on');
  var color = colorEl ? colorEl.dataset.color : 'blue';

      await GymService.addPlan({ name:name, price:price, durationDays:durationDays, notes:notes, color:color });
      showToast('Plan added.', 'success');
    }
    hidePlanForm();
    refreshData();
  } catch (err) {
    showToast(err.message || 'Could not save plan.', 'error');
  }
}
function renderPlanList() {

/* ═══════════════════════════════════════════
   DELETE
═══════════════════════════════════════════ */
function openDeleteModal(type, id) {
  if (type === 'plan') {
    var p = plans.find(function(x) { return x.id === id; });
    var inUse = members.filter(function(m) { return m.planId === id; }).length;
    if (inUse > 0) { showToast('Can\'t delete "' + p.name + '" — ' + inUse + ' member' + (inUse!==1?'s are':' is') + ' still on this plan.', 'error'); return; }
    deleteTarget = { type:type, id:id };
    document.getElementById('deleteModalTitle').textContent = 'Delete Plan';
    document.getElementById('deleteMsg').textContent = 'Delete the "' + p.name + '" plan? This cannot be undone.';
  } else {
    var m = members.find(function(x) { return x.id === id; });
    if (!canDelete) { showToast('You do not have permission to delete members.', 'error'); return; }
    deleteTarget = { type:type, id:id };
    document.getElementById('deleteModalTitle').textContent = 'Remove Member';
    document.getElementById('deleteMsg').textContent = 'Remove "' + m.name + '" from the gym member list? This cannot be undone.';
  }
  document.getElementById('deleteModal').classList.add('show');
}
async function confirmDelete() {
  if (!deleteTarget) { closeModal('deleteModal'); return; }
  try {
    if (deleteTarget.type === 'plan') {
      await GymService.deletePlan(deleteTarget.id);
      closeModal('deleteModal');
      refreshData();
      showToast('Plan deleted.', 'error');
    } else {
      await GymService.deleteMember(deleteTarget.id);
      closeModal('deleteModal');
      if (document.getElementById('detailModal').classList.contains('show') && detailMemberId === deleteTarget.id) closeModal('detailModal');
      refreshData();
      showToast('Member removed.', 'error');
    }
  } catch (err) {
    showToast(err.message || 'Delete failed.', 'error');
  }
  deleteTarget = null;
}

/* ═══════════════════════════════════════════
   REFRESH DATA from service
═══════════════════════════════════════════ */
async function refreshData() {
  try {
    var state = GymService.state;
    members = state.members || [];
    plans = state.plans || [];
    checkins = state.checkins || [];
    guests = state.guests || [];
    populatePlanFilter();
    render();
    if (document.getElementById('detailModal').classList.contains('show') && detailMemberId) renderDetail();
    if (document.getElementById('plansModal').classList.contains('show')) renderPlanList();
    applyPermissionUI();
    if (shell.setExpiringBadge) {
      var exp = members.filter(function(m) { return computeStatus(m) === 'expiring'; }).length;
      shell.setExpiringBadge(exp);
    }
    if (shell.setPendingBadge) {
      shell.setPendingBadge(checkins.length);
    }
  } catch (err) {
    showToast(err.message || 'Failed to refresh data.', 'error');
  }
}

/* ═══════════════════════════════════════════
   PERMISSION UI
═══════════════════════════════════════════ */
function applyPermissionUI() {
  var newMemberBtn = document.getElementById('newMemberBtn');
  var managePlansBtn = document.getElementById('managePlansBtn');
  if (newMemberBtn) newMemberBtn.style.display = canCreate ? '' : 'none';
  if (managePlansBtn) managePlansBtn.style.display = canManagePlans ? '' : 'none';
  var addPlanBtn = document.getElementById('addPlanBtn');
  if (addPlanBtn) addPlanBtn.style.display = (canCreate && canManagePlans) ? '' : 'none';
}

/* ═══════════════════════════════════════════
   MODAL / TOAST HELPERS
═══════════════════════════════════════════ */
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
['memberModal','checkinModal','renewModal','plansModal','deleteModal','detailModal'].forEach(function(id) {
  document.getElementById(id).addEventListener('click', function(e) { if (e.target === this) closeModal(id); });
});

function showToast(msg, type) {
  type = type || 'success';
  var icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3200);
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
async function init() {
  if (!window.GymService) {
    document.getElementById('kpiRow').innerHTML = '<div class="empty-note">GymService not loaded.</div>';
    return;
  }
  try {
    await GymService.loadAll(GymSeed);
    var state = GymService.state;
    members = state.members || [];
    plans = state.plans || [];
    checkins = state.checkins || [];
    guests = state.guests || [];

    session = await waitForSession(800);
    if (window.Permissions) {
      canEdit = Permissions.hasPermission(session, 'canEdit', 'gym');
      canDelete = Permissions.hasPermission(session, 'canDelete', 'gym');
      canManagePlans = Permissions.hasPermission(session, 'canManagePlans', 'gym') || Permissions.hasPermission(session, 'canManagePlans', null);
      canCreate = Permissions.hasPermission(session, 'canCreate', 'gym');
    } else {
      var role = (session && session.role) || '';
      if (role === 'admin' || role === 'manager') {
        canEdit = true;
        canDelete = (role === 'admin');
        canManagePlans = true;
        canCreate = true;
      } else if (role === 'staff' && session && session.privilege === 'gym_attendant') {
        canEdit = true;
        canDelete = false;
        canManagePlans = false;
        canCreate = true;
      }
    }

    populatePlanFilter();
    bindStatusPills();
    render();
    applyPermissionUI();

    GymService.onChange(function() { refreshData(); });

    var exp = members.filter(function(m) { return computeStatus(m) === 'expiring'; }).length;
    if (shell.setExpiringBadge) shell.setExpiringBadge(exp);
    if (shell.setPendingBadge) shell.setPendingBadge(checkins.length);

    setTimeout(function() {
      session = shell.getUser && shell.getUser() || session;
      applyPermissionUI();
    }, 400);

  } catch (err) {
    console.error(err);
    document.getElementById('kpiRow').innerHTML = '<div class="empty-note">Could not load gym data.</div>';
    showToast('Failed to load gym data.', 'error');
  }
}
init();
</script>
