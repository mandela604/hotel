<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Revenue Report | Gym & Fitness — Aurum Hotel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; visibility:hidden; }
  html.gym-ready{ visibility:visible; }
  body{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:256px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px;
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec; --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:8px; }
  .section-title{ font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:600; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:700; color:var(--text); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-primary{ background:var(--gold); color:#fff; font-weight:700; box-shadow:0 4px 10px rgba(47,111,237,0.28); }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }

  .filter-body{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:16px; }
  .flt-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; margin-bottom:8px; display:block; }
  .range-pills{ display:flex; gap:7px; flex-wrap:wrap; }
  .range-pill{ padding:7px 14px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text2); transition:all .15s; white-space:nowrap; }
  .range-pill:hover{ border-color:var(--gold-border); color:var(--gold); }
  .range-pill.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:700; }
  .filter-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .form-group{ display:flex; flex-direction:column; gap:5px; }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; }
  .form-input{ background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13px; outline:none; transition:border-color .2s; }
  .form-input:focus{ border-color:var(--gold-border); }
  .preview-line{ font-size:11.5px; color:var(--text3); }
  .preview-line b{ color:var(--text2); font-weight:700; }

  .report-letterhead{ text-align:center; padding:26px 24px 22px; border-bottom:2px solid var(--gold); }
  .report-hotel-name{ font-size:25px; font-weight:800; color:var(--text); letter-spacing:.5px; }
  .report-sub{ font-size:13px; color:var(--text2); margin-top:5px; font-weight:600; letter-spacing:.3px; }
  .report-meta{ font-size:11.5px; color:var(--text3); margin-top:10px; }
  .report-body{ padding:24px; display:flex; flex-direction:column; gap:22px; }

  .detail-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:720px){ .detail-grid{ grid-template-columns:repeat(2,1fr); } }
  .detail-stat{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px 14px; }
  .detail-stat-label{ font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:700; margin-bottom:6px; }
  .detail-stat-val{ font-size:19px; color:var(--text); font-weight:800; line-height:1.2; }
  .detail-stat-val.green{ color:var(--green); }
  .detail-stat-val.gold{ color:var(--gold); }

  .report-section-title{ font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:700; margin-bottom:10px; }
  .tbl-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:10px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; padding:9px 12px; font-size:9px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.right{ text-align:right; }
  tbody tr{ border-bottom:1px solid var(--border); }
  tbody tr:last-child{ border-bottom:none; }
  tbody td{ padding:9px 12px; color:var(--text); vertical-align:middle; }
  tbody td.right{ text-align:right; font-weight:700; }
  tfoot td{ padding:10px 12px; font-weight:800; background:var(--surface2); border-top:2px solid var(--border); }
  tfoot td.right{ text-align:right; color:var(--gold); }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:24px; text-align:center; }
  .plan-chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .plan-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }

  .report-actions{ display:flex; justify-content:flex-end; gap:8px; padding:0 24px 22px; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @media print{
    #sidebarSlot, #topbarSlot, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    .content{ padding:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:none !important; }
    @page{ margin:16mm; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="section-header no-print">
        <div class="section-title">Revenue Report</div>
      </div>

      <div class="panel no-print">
        <div class="panel-head">
          <div class="panel-title">Report Filters</div>
        </div>
        <div class="filter-body">
          <div>
            <span class="flt-label">Quick Range</span>
            <div class="range-pills" id="rangePills"></div>
          </div>
          <div class="filter-row">
            <div class="form-group">
              <label class="form-label">From</label>
              <input type="date" class="form-input" id="rFrom" onchange="onCustomDateChange()">
            </div>
            <div class="form-group">
              <label class="form-label">To</label>
              <input type="date" class="form-input" id="rTo" onchange="onCustomDateChange()">
            </div>
            <button class="btn btn-primary" onclick="generateReport()"><i class="fa-solid fa-print"></i> Generate &amp; Print Report</button>
          </div>
          <div class="preview-line" id="previewLine">—</div>
        </div>
      </div>

      <div class="panel" id="reportPanel" style="display:none;">
        <div id="reportOutput"></div>
        <div class="report-actions no-print">
          <button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Again</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../component/gym-shell.js"></script>
<script>
const shell = GymShell.attach({
  sidebarTarget: '#sidebarSlot', topbarTarget: '#topbarSlot',
  activeFile: 'gym-revenue.html', pageTitle: 'Revenue Report', pageSubtitle: 'Generate & print revenue summaries',
  apiMode: 'Demo', user: { name: 'Gym Attendant', initials: 'GA' },
});
document.documentElement.classList.add('gym-ready');

const storage = window.storage || { async get(k,s){const v=localStorage.getItem(k);return v==null?null:{key:k,value:v,shared:s};}, async set(k,v,s){localStorage.setItem(k,v);return{key:k,value:v,shared:s};}, async delete(k){localStorage.removeItem(k);return{key:k,deleted:true};}, async list(p){const keys=Object.keys(localStorage).filter(k=>!p||k.startsWith(p));return{keys,prefix:p};} };
const KEY_MEMBERS='gym-members', KEY_PLANS='gym-plans', KEY_CHECKINS='gym-checkins';
async function load(k,f){ try{const r=await storage.get(k,true);if(r&&r.value){const p=JSON.parse(r.value);if(Array.isArray(p))return p;}}catch(e){} return f;}

let members=[], plans=[], checkins=[];
let activePreset = '30d';

const COLOR_TOKENS={gold:{bg:'var(--gold-dim)',fg:'var(--gold-light)',dot:'var(--gold)'},blue:{bg:'var(--blue-bg)',fg:'var(--blue)',dot:'var(--blue)'},purple:{bg:'var(--purple-bg)',fg:'var(--purple)',dot:'var(--purple)'},green:{bg:'var(--green-bg)',fg:'var(--green)',dot:'var(--green)'},amber:{bg:'var(--amber-bg)',fg:'var(--amber)',dot:'var(--amber)'}};
function _esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtN(n){return'₦'+Math.round(n||0).toLocaleString('en-NG');}
function fmtDate(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateFull(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});}
function planById(id){return plans.find(p=>p.id===id)||{id:null,name:'No Plan',price:0,durationDays:0,notes:'',color:'blue'};}
function planChipHtml(plan){const c=COLOR_TOKENS[plan.color]||COLOR_TOKENS.blue;return'<span class="plan-chip" style="background:'+c.bg+';color:'+c.fg+';"><span class="plan-dot" style="background:'+c.dot+';"></span>'+_esc(plan.name)+'</span>';}

const RANGE_PRESETS=[
  {key:'7d',label:'Last 7 Days'},
  {key:'30d',label:'Last 30 Days'},
  {key:'3m',label:'Last 3 Months'},
  {key:'6m',label:'Last 6 Months'},
  {key:'1y',label:'This Year'},
  {key:'all',label:'All Time'},
];

function renderPills(){
  const wrap=document.getElementById('rangePills');
  wrap.innerHTML = RANGE_PRESETS.map(p=>'<div class="range-pill'+(activePreset===p.key?' active':'')+'" data-key="'+p.key+'">'+p.label+'</div>').join('')
    + '<div class="range-pill'+(activePreset===null?' active':'')+'" data-key="custom">Custom</div>';
  wrap.querySelectorAll('.range-pill').forEach(el=>{
    el.addEventListener('click',()=>{
      const key = el.dataset.key;
      if(key==='custom') return;
      applyPreset(key);
    });
  });
}

function applyPreset(key){
  const today=new Date(); today.setHours(0,0,0,0);
  let from=null, to=today;
  if(key==='7d'){ from=new Date(today); from.setDate(from.getDate()-6); }
  else if(key==='30d'){ from=new Date(today); from.setDate(from.getDate()-29); }
  else if(key==='3m'){ from=new Date(today); from.setMonth(from.getMonth()-3); }
  else if(key==='6m'){ from=new Date(today); from.setMonth(from.getMonth()-6); }
  else if(key==='1y'){ from=new Date(today.getFullYear(),0,1); }
  else if(key==='all'){ from=null; to=null; }
  document.getElementById('rFrom').value = from ? from.toISOString().split('T')[0] : '';
  document.getElementById('rTo').value = to ? to.toISOString().split('T')[0] : '';
  activePreset = key;
  renderPills();
  updatePreview();
}

function onCustomDateChange(){ activePreset=null; renderPills(); updatePreview(); }

function getRange(){
  return { from: document.getElementById('rFrom').value || null, to: document.getElementById('rTo').value || null };
}
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}

function updatePreview(){
  const {from,to} = getRange();
  const newMembers = members.filter(m=>inRange(m.joined, from, to));
  const ciInRange = checkins.filter(ci=>inRange(ci.time?ci.time.split('T')[0]:null, from, to));
  const rangeLabel = !from && !to ? 'all time' : (from&&to ? fmtDate(from)+' – '+fmtDate(to) : (from?'from '+fmtDate(from):'up to '+fmtDate(to)));
  document.getElementById('previewLine').innerHTML = 'Matches <b>'+newMembers.length+'</b> new member'+(newMembers.length!==1?'s':'')+' and <b>'+ciInRange.length+'</b> check-in'+(ciInRange.length!==1?'s':'')+' for '+rangeLabel+'.';
}

function generateReport(){
  const {from,to} = getRange();
  const newMembers = members.filter(m=>inRange(m.joined, from, to));
  const ciInRange = checkins.filter(ci=>inRange(ci.time?ci.time.split('T')[0]:null, from, to));

  const revenueByPlan = {};
  let totalRevenue = 0;
  newMembers.forEach(m=>{
    const plan = planById(m.planId);
    const key = plan.id || 'none';
    if(!revenueByPlan[key]) revenueByPlan[key] = { plan, count:0, subtotal:0 };
    revenueByPlan[key].count++;
    revenueByPlan[key].subtotal += plan.price || 0;
    totalRevenue += plan.price || 0;
  });
  const planRows = Object.values(revenueByPlan).sort((a,b)=>b.subtotal-a.subtotal);

  const rangeLabel = !from && !to ? 'All Time' : (from&&to ? fmtDateFull(from)+' – '+fmtDateFull(to) : (from?'From '+fmtDateFull(from):'Up to '+fmtDateFull(to)));
  const generatedOn = new Date().toLocaleString('en-GB',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});

  const activeAsOf = members.filter(m=>{
    if(!m.planId) return false;
    if(m.status==='frozen') return false;
    if(!m.expiry) return true;
    return new Date(m.expiry+'T00:00:00') >= new Date(new Date().toDateString());
  }).length;

  document.getElementById('reportOutput').innerHTML = `
    <div class="report-letterhead">
      <div class="report-hotel-name">Aurum Hotel</div>
      <div class="report-sub">Gym &amp; Fitness — Revenue Report</div>
      <div class="report-meta">Period: ${rangeLabel} &nbsp;·&nbsp; Generated ${generatedOn}</div>
    </div>
    <div class="report-body">

      <div class="detail-grid">
        <div class="detail-stat">
          <div class="detail-stat-label">Revenue (New Sign-ups)</div>
          <div class="detail-stat-val gold">${fmtN(totalRevenue)}</div>
        </div>
        <div class="detail-stat">
          <div class="detail-stat-label">New Members</div>
          <div class="detail-stat-val">${newMembers.length}</div>
        </div>
        <div class="detail-stat">
          <div class="detail-stat-label">Check-ins in Period</div>
          <div class="detail-stat-val">${ciInRange.length}</div>
        </div>
        <div class="detail-stat">
          <div class="detail-stat-label">Active Members (as of today)</div>
          <div class="detail-stat-val green">${activeAsOf}</div>
        </div>
      </div>

      <div>
        <div class="report-section-title">Revenue by Plan</div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Plan</th><th>New Sign-ups</th><th class="right">Price Each</th><th class="right">Subtotal</th></tr></thead>
            <tbody>
              ${planRows.length===0
                ? '<tr><td colspan="4" class="empty-note">No new sign-ups in this period.</td></tr>'
                : planRows.map(r=>`<tr><td>${planChipHtml(r.plan)}</td><td>${r.count}</td><td class="right">${fmtN(r.plan.price)}</td><td class="right">${fmtN(r.subtotal)}</td></tr>`).join('')}
            </tbody>
            ${planRows.length>0 ? `<tfoot><tr><td colspan="3">Total Revenue</td><td class="right">${fmtN(totalRevenue)}</td></tr></tfoot>` : ''}
          </table>
        </div>
      </div>

      <div>
        <div class="report-section-title">New Members in Period</div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Member</th><th>Plan</th><th>Joined</th><th class="right">Amount</th></tr></thead>
            <tbody>
              ${newMembers.length===0
                ? '<tr><td colspan="4" class="empty-note">No new members in this period.</td></tr>'
                : newMembers.slice().sort((a,b)=>(a.joined||'').localeCompare(b.joined||'')).map(m=>{
                    const plan=planById(m.planId);
                    return `<tr><td>${_esc(m.name)}</td><td>${planChipHtml(plan)}</td><td>${fmtDate(m.joined)}</td><td class="right">${fmtN(plan.price)}</td></tr>`;
                  }).join('')}
            </tbody>
          </table>
        </div>
      </div>

    </div>
  `;

  document.getElementById('reportPanel').style.display = 'block';
  document.getElementById('reportPanel').scrollIntoView({ behavior:'smooth', block:'start' });
  setTimeout(()=>window.print(), 250);
}

function isoAgo(d){const x=new Date();x.setDate(x.getDate()-d);return x.toISOString().split('T')[0];}
function isoIn(d){const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().split('T')[0];}
function isoAgoHours(h){const x=new Date();x.setHours(x.getHours()-h);return x.toISOString();}

async function init(){
  plans = await load(KEY_PLANS,[
    {id:'pl01',name:'Basic',price:15000,durationDays:30,notes:'',color:'blue'},
    {id:'pl02',name:'Premium',price:35000,durationDays:30,notes:'',color:'gold'},
    {id:'pl03',name:'Day Pass',price:5000,durationDays:1,notes:'',color:'purple'},
    {id:'pl04',name:'Annual',price:120000,durationDays:365,notes:'',color:'green'},
    {id:'pl05',name:'Student',price:8000,durationDays:30,notes:'',color:'amber'},
  ]);
  members = await load(KEY_MEMBERS,[
    {id:'gm01',name:'Chidi Nwankwo',planId:'pl02',room:'Room 204',phone:'',joined:isoAgo(120),expiry:isoIn(18),checkins:34,lastCheckin:isoAgoHours(5),status:'active'},
    {id:'gm02',name:'Fatima Bello',planId:'pl01',room:'Room 118',phone:'',joined:isoAgo(60),expiry:isoIn(4),checkins:12,lastCheckin:isoAgoHours(30),status:'active'},
    {id:'gm03',name:'Segun Johnson',planId:'pl03',room:'Walk-in',phone:'',joined:isoAgo(1),expiry:isoAgo(0),checkins:1,lastCheckin:isoAgoHours(1),status:'active'},
    {id:'gm04',name:'Ada Williams',planId:'pl02',room:'Room 204 (Suite)',phone:'',joined:isoAgo(200),expiry:isoAgo(10),checkins:88,lastCheckin:isoAgo(10),status:'active'},
    {id:'gm05',name:'Ibrahim Musa',planId:'pl01',room:'Staff',phone:'',joined:isoAgo(300),expiry:isoIn(90),checkins:150,lastCheckin:isoAgo(45),status:'frozen'},
    {id:'gm06',name:'Ngozi Okafor',planId:'pl04',room:'Room 301',phone:'',joined:isoAgo(10),expiry:isoIn(50),checkins:6,lastCheckin:isoAgoHours(20),status:'active'},
    {id:'gm07',name:'Emeka Obi',planId:'pl02',room:'Room 105',phone:'',joined:isoAgo(90),expiry:isoAgo(5),checkins:45,lastCheckin:isoAgo(6),status:'active'},
  ]);
  checkins = await load(KEY_CHECKINS,[
    {id:'ci01',memberId:'gm03',memberName:'Segun Johnson',time:isoAgoHours(1)},
    {id:'ci02',memberId:'gm01',memberName:'Chidi Nwankwo',time:isoAgoHours(5)},
    {id:'ci03',memberId:'gm06',memberName:'Ngozi Okafor',time:isoAgoHours(20)},
    {id:'ci04',memberId:'gm02',memberName:'Fatima Bello',time:isoAgoHours(30)},
    {id:'ci05',memberId:'gm01',memberName:'Chidi Nwankwo',time:isoAgoHours(48)},
  ]);
  renderPills();
  applyPreset('30d');
}
init();
</script>
</body>
</html>
