<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Revenue Report | Gym & Fitness — Aurum Hotel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; visibility:hidden; }
  html.gym-ready{ visibility:visible; }
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; min-height:100vh;
    transition:background .3s,color .3s;
  }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px;
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec; --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:8px; }
  .section-title{ font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:600; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:700; color:var(--text); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-primary{ background:var(--gold); color:#fff; font-weight:700; box-shadow:0 4px 10px rgba(47,111,237,0.28); }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }

  .filter-body{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:16px; }
  .flt-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; margin-bottom:8px; display:block; }
  .range-pills{ display:flex; gap:7px; flex-wrap:wrap; }
  .range-pill{ padding:7px 14px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text2); transition:all .15s; white-space:nowrap; }
  .range-pill:hover{ border-color:var(--gold-border); color:var(--gold); }
  .range-pill.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:700; }
  .filter-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .form-group{ display:flex; flex-direction:column; gap:5px; }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; }
  .form-input{ background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13px; outline:none; transition:border-color .2s; }
  .form-input:focus{ border-color:var(--gold-border); }
  .preview-line{ font-size:11.5px; color:var(--text3); }
  .preview-line b{ color:var(--text2); font-weight:700; }

  .report-letterhead{ text-align:center; padding:26px 24px 22px; border-bottom:2px solid var(--gold); }
  .report-hotel-name{ font-size:25px; font-weight:800; color:var(--text); letter-spacing:.5px; }
  .report-sub{ font-size:13px; color:var(--text2); margin-top:5px; font-weight:600; letter-spacing:.3px; }
  .report-meta{ font-size:11.5px; color:var(--text3); margin-top:10px; }
  .report-body{ padding:24px; display:flex; flex-direction:column; gap:22px; }

  .detail-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:720px){ .detail-grid{ grid-template-columns:repeat(2,1fr); } }
  .detail-stat{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px 14px; }
  .detail-stat-label{ font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:700; margin-bottom:6px; }
  .detail-stat-val{ font-size:19px; color:var(--text); font-weight:800; line-height:1.2; }
  .detail-stat-val.green{ color:var(--green); }
  .detail-stat-val.gold{ color:var(--gold); }

  .report-section-title{ font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:700; margin-bottom:10px; }
  .tbl-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:10px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; padding:9px 12px; font-size:9px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.right{ text-align:right; }
  tbody tr{ border-bottom:1px solid var(--border); }
  tbody tr:last-child{ border-bottom:none; }
  tbody td{ padding:9px 12px; color:var(--text); vertical-align:middle; }
  tbody td.right{ text-align:right; font-weight:700; }
  tfoot td{ padding:10px 12px; font-weight:800; background:var(--surface2); border-top:2px solid var(--border); }
  tfoot td.right{ text-align:right; color:var(--gold); }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:24px; text-align:center; }
  .plan-chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .plan-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .mode-chip{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; background:var(--surface3); color:var(--text2); }

  .report-actions{ display:flex; justify-content:flex-end; gap:8px; padding:0 24px 22px; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @media print{
    #sidebarSlot, #topbarSlot, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    .content{ padding:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:none !important; }
    @page{ margin:16mm; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="section-header no-print">
        <div class="section-title">Revenue Report</div>
      </div>

      <div class="panel no-print">
        <div class="panel-head">
          <div class="panel-title">Report Filters</div>
        </div>
        <div class="filter-body">
          <div>
            <span class="flt-label">Quick Range</span>
            <div class="range-pills" id="rangePills"></div>
          </div>
          <div class="filter-row">
            <div class="form-group">
              <label class="form-label">From</label>
              <input type="date" class="form-input" id="rFrom" onchange="onCustomDateChange()">
            </div>
            <div class="form-group">
              <label class="form-label">To</label>
              <input type="date" class="form-input" id="rTo" onchange="onCustomDateChange()">
            </div>
            <button class="btn btn-primary" id="generateBtn" onclick="generateReport()">
              <i class="fa-solid fa-print"></i> Generate &amp; Print Report
            </button>
          </div>
          <div class="preview-line" id="previewLine">—</div>
        </div>
      </div>

      <div class="panel" id="reportPanel" style="display:none;">
        <div id="reportOutput"></div>
        <div class="report-actions no-print">
          <button class="btn btn-outline btn-sm" onclick="window.print()">
            <i class="fa-solid fa-print"></i> Print Again
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../services/permissions.js"></script>
<script src="services/gym-service.js"></script>
<script src="../component/gym-shell.js"></script>
<script>
'use strict';

/* UI only: call GymService / Permissions / shell, then render. */

var shell = GymShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'gym-revenue.html',
  pageTitle:     'Revenue Report',
  pageSubtitle:  'Generate & print revenue summaries',
});

document.documentElement.classList.add('gym-ready');

var session = null;
var canView = false;
var activePreset = '30d';

var COLOR_TOKENS = {
  gold:   { bg: 'var(--gold-dim)',   fg: 'var(--gold-light)', dot: 'var(--gold)' },
  blue:   { bg: 'var(--blue-bg)',    fg: 'var(--blue)',       dot: 'var(--blue)' },
  purple: { bg: 'var(--purple-bg)',  fg: 'var(--purple)',     dot: 'var(--purple)' },
  green:  { bg: 'var(--green-bg)',   fg: 'var(--green)',      dot: 'var(--green)' },
  amber:  { bg: 'var(--amber-bg)',   fg: 'var(--amber)',      dot: 'var(--amber)' },
};

var RANGE_PRESETS = [
  { key: '7d',  label: 'Last 7 Days' },
  { key: '30d', label: 'Last 30 Days' },
  { key: '3m',  label: 'Last 3 Months' },
  { key: '6m',  label: 'Last 6 Months' },
  { key: '1y',  label: 'This Year' },
  { key: 'all', label: 'All Time' },
];

function _esc(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtN(n) {
  return '₦' + Math.round(n || 0).toLocaleString('en-NG');
}
function fmtDate(s) {
  if (!s) return '—';
  return new Date(s + 'T00:00:00').toLocaleDateString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric',
  });
}
function fmtDateFull(s) {
  if (!s) return '—';
  return new Date(s + 'T00:00:00').toLocaleDateString('en-GB', {
    day: '2-digit', month: 'long', year: 'numeric',
  });
}
function planChipHtml(plan) {
  var c = COLOR_TOKENS[(plan && plan.color) || 'blue'] || COLOR_TOKENS.blue;
  return '<span class="plan-chip" style="background:' + c.bg + ';color:' + c.fg + ';">' +
    '<span class="plan-dot" style="background:' + c.dot + ';"></span>' +
    _esc((plan && plan.name) || 'No Plan') +
  '</span>';
}
function modeChipHtml(mode) {
  return '<span class="mode-chip">' + _esc(mode || 'Cash') + '</span>';
}

function getSession() {
  if (shell && typeof shell.getUser === 'function') {
    var u = shell.getUser();
    if (u) return u;
  }
  return session;
}

function applyPermissionUI() {
  var s = getSession();
  if (window.Permissions && Permissions.hasPermission) {
    canView = Permissions.hasPermission(s, 'canViewReports', 'gym') ||
              Permissions.hasPermission(s, 'canView', 'gym');
  } else {
    canView = false;
  }
  var btn = document.getElementById('generateBtn');
  if (btn) btn.style.display = canView ? '' : 'none';
}

/* ── Date range UI only ── */
function renderPills() {
  var wrap = document.getElementById('rangePills');
  wrap.innerHTML = RANGE_PRESETS.map(function (p) {
    return '<div class="range-pill' + (activePreset === p.key ? ' active' : '') +
      '" data-key="' + p.key + '">' + p.label + '</div>';
  }).join('') +
    '<div class="range-pill' + (activePreset === null ? ' active' : '') +
    '" data-key="custom">Custom</div>';

  wrap.querySelectorAll('.range-pill').forEach(function (el) {
    el.addEventListener('click', function () {
      var key = el.getAttribute('data-key');
      if (key === 'custom') return;
      applyPreset(key);
    });
  });
}

function applyPreset(key) {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var from = null;
  var to = today;

  if (key === '7d')  { from = new Date(today); from.setDate(from.getDate() - 6); }
  else if (key === '30d') { from = new Date(today); from.setDate(from.getDate() - 29); }
  else if (key === '3m')  { from = new Date(today); from.setMonth(from.getMonth() - 3); }
  else if (key === '6m')  { from = new Date(today); from.setMonth(from.getMonth() - 6); }
  else if (key === '1y')  { from = new Date(today.getFullYear(), 0, 1); }
  else if (key === 'all') { from = null; to = null; }

  document.getElementById('rFrom').value = from ? from.toISOString().split('T')[0] : '';
  document.getElementById('rTo').value   = to   ? to.toISOString().split('T')[0]   : '';
  activePreset = key;
  renderPills();
  updatePreview();
}

function onCustomDateChange() {
  activePreset = null;
  renderPills();
  updatePreview();
}

function getRange() {
  return {
    from: document.getElementById('rFrom').value || null,
    to:   document.getElementById('rTo').value || null,
  };
}

/* ── Call service for numbers; page only renders ── */
function updatePreview() {
  if (!window.GymService) {
    document.getElementById('previewLine').textContent = 'Service not loaded.';
    return;
  }
  var range = getRange();
  var report = GymService.getRevenueReport(range.from, range.to);
  var rangeLabel = !range.from && !range.to
    ? 'all time'
    : (range.from && range.to
      ? fmtDate(range.from) + ' – ' + fmtDate(range.to)
      : (range.from ? 'from ' + fmtDate(range.from) : 'up to ' + fmtDate(range.to)));

  document.getElementById('previewLine').innerHTML =
    'Matches <b>' + report.paymentsCount + '</b> payment' +
    (report.paymentsCount !== 1 ? 's' : '') +
    ' totalling <b>' + fmtN(report.totalRevenue) + '</b>' +
    ' (' + report.checkinsCount + ' check-in' + (report.checkinsCount !== 1 ? 's' : '') + ')' +
    ' for ' + rangeLabel + '.';
}

function generateReport() {
  if (!canView) {
    showToast("You don't have permission to view revenue reports.", 'error');
    return;
  }
  if (!window.GymService) {
    showToast('GymService not loaded.', 'error');
    return;
  }

  var range = getRange();
  var report = GymService.getRevenueReport(range.from, range.to);
  var planRows = (report.revenueByPlan || []).slice().sort(function (a, b) {
    return (b.subtotal || 0) - (a.subtotal || 0);
  });
  var payments = (report.payments || []).slice(); // already sorted newest-first by the service

  var rangeLabel = !range.from && !range.to
    ? 'All Time'
    : (range.from && range.to
      ? fmtDateFull(range.from) + ' – ' + fmtDateFull(range.to)
      : (range.from ? 'From ' + fmtDateFull(range.from) : 'Up to ' + fmtDateFull(range.to)));

  var generatedOn = new Date().toLocaleString('en-GB', {
    day: '2-digit', month: 'long', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });

  document.getElementById('reportOutput').innerHTML =
    '<div class="report-letterhead">' +
      '<div class="report-hotel-name">Aurum Hotel</div>' +
      '<div class="report-sub">Gym &amp; Fitness — Revenue Report</div>' +
      '<div class="report-meta">Period: ' + _esc(rangeLabel) +
        ' &nbsp;·&nbsp; Generated ' + _esc(generatedOn) + '</div>' +
    '</div>' +
    '<div class="report-body">' +

      '<div class="detail-grid">' +
        '<div class="detail-stat">' +
          '<div class="detail-stat-label">Revenue (Payments Received)</div>' +
          '<div class="detail-stat-val gold">' + fmtN(report.totalRevenue) + '</div>' +
        '</div>' +
        '<div class="detail-stat">' +
          '<div class="detail-stat-label">New Members</div>' +
          '<div class="detail-stat-val">' + report.newMembersCount + '</div>' +
        '</div>' +
        '<div class="detail-stat">' +
          '<div class="detail-stat-label">Check-ins in Period</div>' +
          '<div class="detail-stat-val">' + report.checkinsCount + '</div>' +
        '</div>' +
        '<div class="detail-stat">' +
          '<div class="detail-stat-label">Active Members (as of today)</div>' +
          '<div class="detail-stat-val green">' + report.activeMembers + '</div>' +
        '</div>' +
      '</div>' +

      '<div>' +
        '<div class="report-section-title">Revenue by Plan</div>' +
        '<div class="tbl-wrap"><table>' +
          '<thead><tr><th>Plan</th><th>Payments</th><th class="right">Avg. Payment</th><th class="right">Subtotal</th></tr></thead>' +
          '<tbody>' +
            (planRows.length === 0
              ? '<tr><td colspan="4" class="empty-note">No payments recorded in this period.</td></tr>'
              : planRows.map(function (r) {
                  var avg = r.count ? r.subtotal / r.count : 0;
                  return '<tr>' +
                    '<td>' + planChipHtml(r.plan) + '</td>' +
                    '<td>' + r.count + '</td>' +
                    '<td class="right">' + fmtN(avg) + '</td>' +
                    '<td class="right">' + fmtN(r.subtotal) + '</td>' +
                  '</tr>';
                }).join('')) +
          '</tbody>' +
          (planRows.length > 0
            ? '<tfoot><tr><td colspan="3">Total Revenue</td><td class="right">' +
                fmtN(report.totalRevenue) + '</td></tr></tfoot>'
            : '') +
        '</table></div>' +
      '</div>' +

      '<div>' +
        '<div class="report-section-title">Payments in Period</div>' +
        '<div class="tbl-wrap"><table>' +
          '<thead><tr><th>Member</th><th>Plan</th><th>Date</th><th>Mode</th><th class="right">Amount</th></tr></thead>' +
          '<tbody>' +
            (payments.length === 0
              ? '<tr><td colspan="5" class="empty-note">No payments recorded in this period.</td></tr>'
              : payments.map(function (row) {
                  return '<tr>' +
                    '<td>' + _esc(row.member.name) + '</td>' +
                    '<td>' + planChipHtml(row.plan) + '</td>' +
                    '<td>' + fmtDate(row.payment.date) + '</td>' +
                    '<td>' + modeChipHtml(row.payment.mode) + '</td>' +
                    '<td class="right">' + fmtN(row.payment.amount) + '</td>' +
                  '</tr>';
                }).join('')) +
          '</tbody>' +
        '</table></div>' +
      '</div>' +

    '</div>';

  document.getElementById('reportPanel').style.display = 'block';
  document.getElementById('reportPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(function () { window.print(); }, 250);
}

function showToast(msg, type) {
  type = type || 'success';
  var icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid #eef0f6;border-radius:10px;padding:11px 16px;font-size:13px;color:#1c2440;box-shadow:0 8px 28px rgba(15,20,40,0.18);z-index:999;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 40px);font-weight:600;border-left:3px solid ' +
    (type === 'success' ? '#12b76a' : type === 'error' ? '#f04438' : '#2f6fed') + ';';
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3200);
}

async function init() {
  if (!window.GymService) {
    document.getElementById('previewLine').textContent = 'GymService not loaded. Check script order.';
    return;
  }
  try {
    await GymService.loadAll();

    session = (shell.getUser && shell.getUser()) || null;
    applyPermissionUI();
    renderPills();
    applyPreset('30d');

    GymService.onChange(function () {
      updatePreview();
    });

    setTimeout(function () {
      session = (shell.getUser && shell.getUser()) || session;
      applyPermissionUI();
    }, 400);
  } catch (err) {
    console.error(err);
    document.getElementById('previewLine').textContent = 'Could not load gym data.';
    showToast('Failed to load gym data.', 'error');
  }
}
init();
</script>
</body>
</html>
