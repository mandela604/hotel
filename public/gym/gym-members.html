<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Members | Gym & Fitness — Aurum Hotel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; visibility:hidden; }
  html.gym-ready{ visibility:visible; }
  body{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px;
    /* ── Light-theme override, scoped to content + modals only ──
       matches gym-dashboard.html / booking-list.html: sidebar/topbar
       stay on gym-shell.js's own theme, only this area turns white/blue. ── */
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec; --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .section-title{ font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:500; }
  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:12.5px; cursor:pointer; outline:none; max-width:160px; }
  .filter-select:focus{ border-color:var(--gold-border); }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-primary{ background:var(--gold); color:#fff; font-weight:600; }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:11.5px; cursor:pointer; padding:8px 6px; }
  .btn-ghost:hover{ color:var(--gold); }

  /* ═══ Panel / table (list view — replaces the old card grid) ═══ */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .tbl-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:600; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.center{ text-align:center; }
  tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  tbody td.center{ text-align:center; }
  .empty-row td{ text-align:center; padding:40px; color:var(--text3); white-space:normal; }
  .mem-name{ font-weight:600; }
  .mem-avatar{ width:28px; height:28px; border-radius:50%; background:var(--gold-dim); border:1.5px solid var(--gold-border); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--gold); margin-right:9px; flex-shrink:0; }
  .mem-cell{ display:flex; align-items:center; }
  .mem-sub{ font-size:10.5px; color:var(--text3); margin-top:1px; }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .chip-active{ background:var(--green-bg); color:var(--green); } .chip-active::before{ background:var(--green); }
  .chip-expiring{ background:var(--amber-bg); color:var(--amber); } .chip-expiring::before{ background:var(--amber); }
  .chip-expired{ background:var(--red-bg); color:var(--red); } .chip-expired::before{ background:var(--red); }
  .chip-frozen{ background:var(--blue-bg); color:var(--blue); } .chip-frozen::before{ background:var(--blue); }
  .plan-chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .plan-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:600; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:40px; text-align:center; }

  /* ═══ Modal ═══ */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto;
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec; --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--modal-bg,var(--surface)); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(640px,96vw); box-shadow:0 32px 80px rgba(15,34,55,0.25); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; position:relative; overflow:hidden; }
  .modal::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
  .modal-sm{ width:min(420px,96vw); }
  @keyframes modalIn{ from{opacity:0;transform:translateY(16px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:19px; font-weight:700; color:var(--text); }
  .modal-close{ background:none; border:none; color:var(--text3); font-size:18px; cursor:pointer; padding:4px; line-height:1; }
  .modal-close:hover{ color:var(--text); }
  .detail-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .detail-avatar{ width:54px; height:54px; border-radius:50%; background:var(--gold-dim); border:2px solid var(--gold-border); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:var(--gold); flex-shrink:0; }
  .detail-name{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:21px; font-weight:700; color:var(--text); line-height:1.2; }
  .detail-subline{ display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
  @media (max-width:480px){ .detail-grid{ grid-template-columns:1fr 1fr; } }
  .detail-stat{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .detail-stat-label{ font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:600; margin-bottom:4px; }
  .detail-stat-val{ font-size:12.5px; color:var(--text); font-weight:600; line-height:1.4; }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .toast{ position:fixed; bottom:20px; right:20px; background:#ffffff; border:1px solid #eef0f6; border-radius:10px; padding:11px 16px; font-size:12.5px; color:#1c2440; box-shadow:0 8px 28px rgba(15,34,55,0.18); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-weight:600; }
  .toast.success{ border-left:3px solid #12b76a; }
  .toast.error{ border-left:3px solid #f04438; }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  /* ═══ Mobile: table restyles into stacked rows like booking-list ═══ */
  @media (max-width:720px){
    .tbl-wrap{ overflow-x:visible; }
    table{ min-width:0; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tbody tr{ border:1px solid var(--border); border-radius:10px; margin:10px; padding:4px 4px 2px; }
    tbody tr:hover{ background:var(--surface); }
    tbody td{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 10px; border-bottom:1px dashed var(--border); text-align:right; white-space:normal; }
    tbody td:last-child{ border-bottom:none; }
    tbody td::before{ content:attr(data-label); font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:600; text-align:left; flex-shrink:0; }
    tbody td.mcard-head{ padding:10px 10px 8px; border-bottom:1px solid var(--border); justify-content:space-between; }
    tbody td.mcard-head::before{ display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <div class="section-header">
        <div class="section-title">All Gym Members</div>
        <button class="btn btn-primary btn-sm" onclick="location.href='gym-dashboard.html'"><i class="fa-solid fa-plus"></i> New Member</button>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px;"></i>
            <input type="text" id="fSearch" placeholder="Search members…" oninput="gPage=1;renderMembers()">
          </div>
          <select class="filter-select" id="fFilter" onchange="gPage=1;renderMembers()">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="expiring">Expiring</option>
            <option value="expired">Expired</option>
            <option value="frozen">Inactive</option>
          </select>
        </div>
        <span style="font-size:11.5px;color:var(--text3);" id="memCount">—</span>
      </div>
      <div class="panel">
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Member</th>
                <th>Plan</th>
                <th>Room / Contact</th>
                <th>Joined</th>
                <th>Expiry</th>
                <th class="center">Check-ins</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="memBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="gPaginLabel">—</span>
          <div class="page-btns" id="gPageBtns"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MEMBER PROFILE (DETAIL) MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Member Profile</div>
      <button class="modal-close" onclick="closeModal('detailModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<script src="../component/gym-shell.js"></script>
<script>
const shell = GymShell.attach({
  sidebarTarget: '#sidebarSlot', topbarTarget: '#topbarSlot',
  activeFile: 'gym-members.html', pageTitle: 'Members', pageSubtitle: 'All gym members at a glance',
  apiMode: 'Demo', user: { name: 'Gym Attendant', initials: 'GA' },
});
document.documentElement.classList.add('gym-ready');

const storage = window.storage || { async get(k,s){const v=localStorage.getItem(k);return v==null?null:{key:k,value:v,shared:s};}, async set(k,v,s){localStorage.setItem(k,v);return{key:k,value:v,shared:s};}, async delete(k){localStorage.removeItem(k);return{key:k,deleted:true};}, async list(p){const keys=Object.keys(localStorage).filter(k=>!p||k.startsWith(p));return{keys,prefix:p};} };
const KEY_MEMBERS='gym-members', KEY_PLANS='gym-plans', KEY_CHECKINS='gym-checkins';
async function load(k,f){ try{const r=await storage.get(k,true);if(r&&r.value){const p=JSON.parse(r.value);if(Array.isArray(p))return p;}}catch(e){} return f;}
async function save(k,v){ try{await storage.set(k,JSON.stringify(v),true);}catch(e){console.warn(e);} }

let members=[], plans=[], checkins=[], gPage=1, gFilter='', detailMemberId=null;
const PAGE=12;
const COLOR_TOKENS={gold:{bg:'var(--gold-dim)',fg:'var(--gold-light)',dot:'var(--gold)'},blue:{bg:'var(--blue-bg)',fg:'var(--blue)',dot:'var(--blue)'},purple:{bg:'var(--purple-bg)',fg:'var(--purple)',dot:'var(--purple)'},green:{bg:'var(--green-bg)',fg:'var(--green)',dot:'var(--green)'},amber:{bg:'var(--amber-bg)',fg:'var(--amber)',dot:'var(--amber)'}};
function _esc(s){return(s==null?'':String(s)).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
function fmtN(n){return'₦'+Math.round(n||0).toLocaleString('en-NG');}
function fmtDate(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function initials(n){return(n||'').split(' ').filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function daysUntil(s){if(!s)return null;const d=new Date(s+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000);}

/* Status logic matches gym-dashboard.html: a plan is mandatory on every
   member, so "no plan" can't legitimately occur — treat any legacy record
   without one as expired rather than silently active. Four statuses only:
   active, expiring, expired, frozen (displayed as "Inactive"). */
function computeStatus(m){
  if(!m.planId) return 'expired';
  if(m.status==='frozen') return 'frozen';
  const days=daysUntil(m.expiry);
  if(days===null) return 'active';
  if(days<0) return 'expired';
  if(days<=7) return 'expiring';
  return 'active';
}
const STATUS_LABEL={active:'Active',expiring:'Expiring',expired:'Expired',frozen:'Inactive'};
const STATUS_CHIP={active:'chip-active',expiring:'chip-expiring',expired:'chip-expired',frozen:'chip-frozen'};
function planById(id){return plans.find(p=>p.id===id)||{id:null,name:'No Plan',price:0,durationDays:0,notes:'',color:'blue'};}
function planChipHtml(plan){const c=COLOR_TOKENS[plan.color]||COLOR_TOKENS.blue;return'<span class="plan-chip" style="background:'+c.bg+';color:'+c.fg+';"><span class="plan-dot" style="background:'+c.dot+';"></span>'+_esc(plan.name)+'</span>';}

function renderMembers(){
  const q=document.getElementById('fSearch').value.toLowerCase();
  gFilter=document.getElementById('fFilter').value;
  let rows=members.map(m=>({...m,_s:computeStatus(m)})).filter(m=>{
    const mq=!q||m.name.toLowerCase().includes(q)||(m.room||'').toLowerCase().includes(q);
    const ms=!gFilter||m._s===gFilter;
    return mq&&ms;
  });
  rows.sort((a,b)=>(b.joined||'').localeCompare(a.joined||''));
  document.getElementById('memCount').textContent=rows.length+' member'+(rows.length!==1?'s':'');
  const start=(gPage-1)*PAGE,pageRows=rows.slice(start,start+PAGE);
  const body=document.getElementById('memBody');
  body.innerHTML = pageRows.length===0
    ? '<tr class="empty-row"><td colspan="7">No members found.</td></tr>'
    : pageRows.map(m=>{
        const plan=planById(m.planId); const s=m._s;
        return '<tr onclick="openDetail(\''+m.id+'\')">'
          +'<td class="mcard-head" data-label="Member"><div class="mem-cell"><span class="mem-avatar">'+initials(m.name)+'</span><span class="mem-name">'+_esc(m.name)+'</span></div></td>'
          +'<td data-label="Plan">'+(!m.planId?'<span style="color:var(--text3);font-size:11px;">— Not set</span>':planChipHtml(plan))+'</td>'
          +'<td data-label="Room / Contact">'+_esc(m.room||'—')+(m.phone?'<div class="mem-sub">'+_esc(m.phone)+'</div>':'')+'</td>'
          +'<td data-label="Joined">'+fmtDate(m.joined)+'</td>'
          +'<td data-label="Expiry">'+fmtDate(m.expiry)+'</td>'
          +'<td class="center" data-label="Check-ins">'+(m.checkins||0)+'</td>'
          +'<td data-label="Status"><span class="chip '+STATUS_CHIP[s]+'">'+STATUS_LABEL[s]+'</span></td>'
          +'</tr>';
      }).join('');
  const tp=Math.max(1,Math.ceil(rows.length/PAGE));if(gPage>tp)gPage=tp;
  const from=rows.length===0?0:(gPage-1)*PAGE+1,to=Math.min(gPage*PAGE,rows.length);
  document.getElementById('gPaginLabel').textContent=rows.length===0?'No records':from+'\u2013'+to+' of '+rows.length;
  const w=document.getElementById('gPageBtns');w.innerHTML='';
  const mk=(l,p,d,ac)=>{const b=document.createElement('button');b.className='page-btn'+(ac?' active':'');b.textContent=l;b.disabled=!!d;b.onclick=()=>{gPage=p;renderMembers();};return b;};
  w.appendChild(mk('\u2039',gPage-1,gPage===1));let s2=Math.max(1,gPage-2),e2=Math.min(tp,s2+4);s2=Math.max(1,e2-4);
  for(let i=s2;i<=e2;i++)w.appendChild(mk(String(i),i,false,i===gPage));
  w.appendChild(mk('\u203a',gPage+1,gPage>=tp));
}
function openDetail(id){detailMemberId=id;renderDetail();document.getElementById('detailModal').classList.add('show');}
function renderDetail(){
  const m=members.find(x=>x.id===detailMemberId);if(!m)return;
  const plan=planById(m.planId);const s=computeStatus(m);
  document.getElementById('detailBody').innerHTML='<div class="detail-head"><span class="detail-avatar">'+initials(m.name)+'</span><div><div class="detail-name">'+_esc(m.name)+'</div><div class="detail-subline"><span class="chip '+STATUS_CHIP[s]+'">'+STATUS_LABEL[s]+'</span>'+(m.planId?planChipHtml(plan):'<span style="color:var(--text3);font-size:11px;margin-left:6px;">Not set</span>')+'</div></div></div>'+
    '<div class="detail-grid"><div class="detail-stat"><div class="detail-stat-label">Room / Contact</div><div class="detail-stat-val">'+_esc(m.room||'\u2014')+'<br>'+_esc(m.phone||'')+'</div></div><div class="detail-stat"><div class="detail-stat-label">Joined</div><div class="detail-stat-val">'+fmtDate(m.joined)+'</div></div><div class="detail-stat"><div class="detail-stat-label">Expiry</div><div class="detail-stat-val">'+fmtDate(m.expiry)+'</div></div><div class="detail-stat"><div class="detail-stat-label">Check-ins</div><div class="detail-stat-val">'+(m.checkins||0)+'</div></div><div class="detail-stat"><div class="detail-stat-label">Last Visit</div><div class="detail-stat-val">'+(m.lastCheckin?new Date(m.lastCheckin).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'Never')+'</div></div><div class="detail-stat"><div class="detail-stat-label">Status</div><div class="detail-stat-val">'+STATUS_LABEL[s]+'</div></div></div>'+
    '<div class="modal-footer"><button class="btn btn-outline btn-sm" onclick="closeModal(\'detailModal\')">Close</button><button class="btn btn-primary btn-sm" onclick="location.href=\'gym-dashboard.html\'"><i class="fa-solid fa-pen"></i> Edit on Dashboard</button></div>';
  document.getElementById('detailBody').innerHTML+=m.notes?'<div style="margin-top:10px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);font-weight:700;margin-bottom:6px;">Notes</div><div style="font-size:12px;color:var(--text2);">'+_esc(m.notes)+'</div></div>':'';
}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function showToast(msg,t){const d=document.createElement('div');d.className='toast '+(t||'success');d.textContent=(t==='success'?'\u2713 ':'\u2715 ')+msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===this)closeModal('detailModal');});

function isoAgo(d){const x=new Date();x.setDate(x.getDate()-d);return x.toISOString().split('T')[0];}
function isoIn(d){const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().split('T')[0];}
function isoAgoHours(h){const x=new Date();x.setHours(x.getHours()-h);return x.toISOString();}
