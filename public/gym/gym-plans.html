<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Plans | Gym & Fitness — Aurum Hotel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; visibility:hidden; }
  html.gym-ready{ visibility:visible; }
  body{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }
  .content{
    padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px;
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec; --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }
  .section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .section-title{ font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:600; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:700; color:var(--text); }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-primary{ background:var(--gold); color:#fff; font-weight:700; box-shadow:0 4px 10px rgba(47,111,237,0.28); }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }
  .plan-list{ display:flex; flex-direction:column; gap:12px; padding:16px; }
  .plan-card{ border:1px solid var(--border); border-radius:12px; padding:16px; background:var(--surface2); }
  .plan-card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .plan-card-actions{ display:flex; gap:5px; }
  .plan-chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .plan-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .plan-card-meta{ font-size:12px; color:var(--text2); font-weight:600; }
  .plan-card-notes{ font-size:12px; color:var(--text3); margin-top:8px; line-height:1.5; white-space:pre-line; }
  .act-btn{ background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:11px; font-weight:600; color:var(--text2); cursor:pointer; transition:all .15s; font-family:inherit; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
  .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .act-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:40px; text-align:center; }
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(15,20,40,0.55); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto;
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec; --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--modal-bg,var(--surface)); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(560px,96vw); box-shadow:0 32px 80px rgba(15,34,55,0.25); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; position:relative; overflow:hidden; }
  .modal::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
  .modal.mode-delete::before{ background:var(--red); }
  .modal-sm{ width:min(420px,96vw); }
  @keyframes modalIn{ from{opacity:0;transform:translateY(16px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-family:inherit; font-size:19px; font-weight:800; color:var(--text); }
  .modal-close{ background:var(--surface2); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; color:var(--text2); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; }
  .modal-close:hover{ color:var(--text); border-color:var(--gold-border); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  @media (max-width:480px){ .form-row{ grid-template-columns:1fr; } }
  .form-group{ display:flex; flex-direction:column; gap:5px; }
  .form-group.span2{ grid-column:span 2; }
  @media (max-width:480px){ .form-group.span2{ grid-column:span 1; } }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; }
  .form-input, .form-select, .form-textarea{ background:var(--input-bg,var(--surface2)); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13px; outline:none; transition:border-color .2s; width:100%; }
  .form-input:focus, .form-select:focus, .form-textarea:focus{ border-color:var(--gold-border); }
  .form-textarea{ resize:vertical; min-height:60px; }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .color-swatches{ display:flex; align-items:center; gap:8px; padding-top:4px; }
  .color-swatch{ width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .15s; display:inline-block; }
  .color-swatch:hover{ transform:scale(1.1); }
  .color-swatch.on{ border-color:var(--text); box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--text); }
  .plan-form{ background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .toast{ position:fixed; bottom:20px; right:20px; background:#ffffff; border:1px solid #eef0f6; border-radius:10px; padding:11px 16px; font-size:12.5px; color:#1c2440; box-shadow:0 8px 28px rgba(15,34,55,0.18); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-weight:600; }
  .toast.success{ border-left:3px solid #12b76a; }
  .toast.error{ border-left:3px solid #f04438; }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <div class="section-header">
        <div class="section-title">Membership Plans</div>
        <button class="btn btn-primary btn-sm" onclick="showPlanForm()"><i class="fa-solid fa-plus"></i> Add Plan</button>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">All Plans</div>
          <span style="font-size:11px;color:var(--text3);font-weight:600;" id="planCount">—</span>
        </div>
        <div id="planFormWrap" style="display:none;"></div>
        <div class="plan-list" id="planList"></div>
      </div>
    </div>
  </div>
</div>
<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm mode-delete">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--red);" id="deleteModalTitle">Delete Plan</div>
      <button class="modal-close" onclick="closeModal('deleteModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.6;" id="deleteMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('deleteModal')">Cancel</button>
      <button class="btn btn-sm" style="background:var(--red-bg);border-color:rgba(240,68,56,0.3);color:var(--red);font-weight:700;" onclick="confirmDelete()"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
  </div>
</div>

<script src="../services/permissions.js"></script>
<script src="data/gym-seed.js"></script>
<script src="services/gym-service.js"></script>
<script src="../component/gym-shell.js"></script>
<script>
/* ═══════════════════════════════════════════
   Shell — sidebar + topbar for Gym module.
═══════════════════════════════════════════ */
const shell = GymShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'gym-plans.html',
  pageTitle:     'Membership Plans',
  pageSubtitle:  'Manage gym membership tiers',
});
document.documentElement.classList.add('gym-ready');

/* ── Globals ── */
let editingPlanId = null;
let deleteTarget = null;

const COLOR_TOKENS = {
  gold:   { bg: 'var(--gold-dim)', fg: 'var(--gold-light)', dot: 'var(--gold)' },
  blue:   { bg: 'var(--blue-bg)',  fg: 'var(--blue)',       dot: 'var(--blue)' },
  purple: { bg: 'var(--purple-bg)',fg: 'var(--purple)',     dot: 'var(--purple)' },
  green:  { bg: 'var(--green-bg)', fg: 'var(--green)',      dot: 'var(--green)' },
  amber:  { bg: 'var(--amber-bg)', fg: 'var(--amber)',      dot: 'var(--amber)' },
};

function _esc(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmtN(n) { return '₦' + Math.round(n || 0).toLocaleString('en-NG'); }
function getPlans() { return GymService.state.plans || []; }
function getMembers() { return GymService.state.members || []; }

/* ── Render plan list ── */
function renderPlanList() {
  const plans = getPlans();
  const members = getMembers();
  const el = document.getElementById('planList');
  document.getElementById('planCount').textContent = plans.length + ' plan' + (plans.length !== 1 ? 's' : '');
  if (!plans.length) {
    el.innerHTML = '<div class="empty-note">No plans yet — add one above.</div>';
    return;
  }
  el.innerHTML = plans.map(p => {
    const inUse = members.filter(m => m.planId === p.id).length;
    const c = COLOR_TOKENS[p.color] || COLOR_TOKENS.blue;
    return `<div class="plan-card">
      <div class="plan-card-top">
        <span class="plan-chip" style="background:${c.bg};color:${c.fg};">
          <span class="plan-dot" style="background:${c.dot};"></span>
          ${_esc(p.name)}
        </span>
        <div class="plan-card-actions">
          <button class="act-btn" onclick="showPlanForm('${p.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
          <button class="act-btn danger" onclick="openDeleteModal('${p.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
      <div class="plan-card-meta">${fmtN(p.price)} <span style="color:var(--text3);font-weight:400;">/ ${p.durationDays} day${p.durationDays !== 1 ? 's' : ''} · ${inUse} member${inUse !== 1 ? 's' : ''} enrolled</span></div>
      ${p.notes ? `<div class="plan-card-notes">${_esc(p.notes)}</div>` : ''}
    </div>`;
  }).join('');
}

/* ── Plan form ── */
function showPlanForm(id) {
  editingPlanId = id || null;
  const plans = getPlans();
  const p = id ? plans.find(x => x.id === id) : { name: '', price: '', durationDays: '', notes: '', color: 'blue' };
  const wrap = document.getElementById('planFormWrap');
  wrap.innerHTML = `
    <div class="plan-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Plan Name</label>
          <input class="form-input" id="pfName" placeholder="e.g. Basic" value="${_esc(p.name)}">
        </div>
        <div class="form-group">
          <label class="form-label">Price (₦)</label>
          <input class="form-input" type="number" id="pfPrice" placeholder="0" min="0" value="${p.price || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">Duration (days)</label>
          <input class="form-input" type="number" id="pfDuration" placeholder="30" min="1" value="${p.durationDays || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">Color Tag</label>
          <div class="color-swatches" id="pfColorRow">
            ${Object.keys(COLOR_TOKENS).map(c => `
              <span class="color-swatch${c === p.color ? ' on' : ''}" data-color="${c}" style="background:${COLOR_TOKENS[c].dot}" title="${c}"></span>
            `).join('')}
          </div>
        </div>
        <div class="form-group span2">
          <label class="form-label">Notes / What's Included</label>
          <textarea class="form-textarea" id="pfNotes" placeholder="Describe what members get on this plan…">${_esc(p.notes || '')}</textarea>
        </div>
      </div>
      <div class="modal-footer" style="margin-top:0;padding-top:12px;">
        <button class="btn btn-outline btn-sm" onclick="hidePlanForm()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="savePlan()"><i class="fa-solid fa-check"></i> ${id ? 'Update Plan' : 'Add Plan'}</button>
      </div>
    </div>
  `;
  // Bind color swatches
  wrap.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', function() {
      wrap.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('on'));
      this.classList.add('on');
    });
  });
  wrap.style.display = 'block';
  document.getElementById('pfName').focus();
}

function hidePlanForm() {
  editingPlanId = null;
  document.getElementById('planFormWrap').style.display = 'none';
  document.getElementById('planFormWrap').innerHTML = '';
}

/* ── Save plan ── */
async function savePlan() {
  const name = document.getElementById('pfName').value.trim();
  if (!name) { showToast('Please enter a plan name.', 'error'); return; }
  const price = parseFloat(document.getElementById('pfPrice').value) || 0;
  const durationDays = parseInt(document.getElementById('pfDuration').value, 10) || 1;
  const notes = document.getElementById('pfNotes').value.trim();
  const colorEl = document.querySelector('#pfColorRow .color-swatch.on');
  const color = colorEl ? colorEl.dataset.color : 'blue';

  try {
    if (editingPlanId) {
      await GymService.editPlan(editingPlanId, { name, price, durationDays, notes, color });
      showToast('Plan updated.', 'success');
    } else {
      await GymService.addPlan({ name, price, durationDays, notes, color });
      showToast('Plan added.', 'success');
    }
    hidePlanForm();
    renderPlanList();
  } catch (err) {
    showToast(err.message || 'Could not save plan.', 'error');
  }
}

/* ── Delete ── */
function openDeleteModal(id) {
  const plans = getPlans();
  const p = plans.find(x => x.id === id);
  if (!p) return;
  const inUse = getMembers().filter(m => m.planId === id).length;
  if (inUse > 0) {
    showToast(`Can't delete "${p.name}" — ${inUse} member${inUse !== 1 ? 's are' : ' is'} still on this plan.`, 'error');
    return;
  }
  deleteTarget = { id };
  document.getElementById('deleteModalTitle').textContent = 'Delete Plan';
  document.getElementById('deleteMsg').textContent = `Delete the "${p.name}" plan? This cannot be undone.`;
  document.getElementById('deleteModal').classList.add('show');
}

async function confirmDelete() {
  if (!deleteTarget) return;
  try {
    await GymService.deletePlan(deleteTarget.id);
    closeModal('deleteModal');
    renderPlanList();
    showToast('Plan deleted.', 'error');
  } catch (err) {
    showToast(err.message || 'Delete failed.', 'error');
  }
  deleteTarget = null;
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.getElementById('deleteModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('deleteModal');
});

function showToast(msg, type) {
  const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'success');
  t.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ── Init ── */
async function init() {
  if (!window.GymService) {
    document.getElementById('planList').innerHTML = '<div class="empty-note">GymService not loaded. Check script order.</div>';
    return;
  }
  try {
    // Load data (seeds automatically if empty)
    await GymService.loadAll(GymSeed);
    // Subscribe to changes from other tabs/pages
    GymService.onChange(() => renderPlanList());
    renderPlanList();
    // Hide "Add Plan" if user lacks permission
    const session = shell.getUser();
    let canManage = false;
    if (window.Permissions) {
      canManage = Permissions.hasPermission(session, 'canManagePlans', 'gym') ||
                  Permissions.hasPermission(session, 'canManagePlans', null);
    } else {
      const role = (session && session.role) || '';
      canManage = (role === 'admin' || role === 'manager');
    }
    if (!canManage) {
      document.querySelector('.section-header .btn-primary').style.display = 'none';
    }
  } catch (err) {
    console.error(err);
    document.getElementById('planList').innerHTML = '<div class="empty-note">Could not load plans.</div>';
  }
}
init();
</script>
</body>
</html>
