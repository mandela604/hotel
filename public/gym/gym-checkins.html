<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Check-in Log | Gym & Fitness — Aurum Hotel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; visibility:hidden; }
  html.gym-ready{ visibility:visible; }
  body{ font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }
  .content{ padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }
  :root{
    --gold:#c9a84c; --gold-light:#e8c96a; --gold-dim:rgba(201,168,76,0.12); --gold-border:rgba(201,168,76,0.25);
    --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
    --red:#f87171; --red-bg:rgba(248,113,113,0.12);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
  }
  [data-theme="dark"]{
    --bg:#080f18; --surface:#111e2b; --surface2:#162435; --surface3:#1c2e40;
    --border:#1e3045; --border2:#243850; --text:#e8f0f8; --text2:#a8bece; --text3:#6a8a9e;
    --shadow:0 8px 32px rgba(0,0,0,0.5); --shadow-lg:0 16px 48px rgba(0,0,0,0.6);
    --sidebar-bg:#0a1520;
  }
  [data-theme="light"]{
    --bg:#eef2f7; --surface:#ffffff; --surface2:#f4f7fb; --surface3:#e8edf5;
    --border:#dce4ef; --border2:#ccd6e5; --text:#0f2237; --text2:#4a6580; --text3:#8aa0b8;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --sidebar-bg:#ffffff;
  }
  .section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .section-title{ font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:500; }
  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; min-width:180px; max-width:260px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:600; color:var(--text); }
  .tbl-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:600; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody tr{ border-bottom:1px solid var(--border); transition:background .15s; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  .empty-row td{ text-align:center; padding:32px; color:var(--text3); white-space:normal; }
  .mem-avatar{ width:28px; height:28px; border-radius:50%; background:var(--gold-dim); border:1.5px solid var(--gold-border); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--gold); margin-right:9px; flex-shrink:0; }
  .mem-cell{ display:flex; align-items:center; }
  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .chip-active{ background:var(--green-bg); color:var(--green); } .chip-active::before{ background:var(--green); }
  .chip-expiring{ background:var(--amber-bg); color:var(--amber); } .chip-expiring::before{ background:var(--amber); }
  .chip-expired{ background:var(--red-bg); color:var(--red); } .chip-expired::before{ background:var(--red); }
  .chip-frozen{ background:var(--blue-bg); color:var(--blue); } .chip-frozen::before{ background:var(--blue); }
  .chip-no_plan{ background:var(--purple-bg); color:var(--purple); } .chip-no_plan::before{ background:var(--purple); }
  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; font-family:'Outfit',sans-serif; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:600; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }
  .empty-note{ font-size:12.5px; color:var(--text3); padding:40px; text-align:center; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  :root{--purple:#a78bfa;--purple-bg:rgba(167,139,250,0.12);}
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <div class="section-header">
        <div class="section-title">Check-in Log</div>
        <span style="font-size:11.5px;color:var(--text3);" id="ciCount">—</span>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <span style="color:var(--text3);font-size:12px;">🔍</span>
            <input type="text" id="fSearch" placeholder="Search by member name…" oninput="cPage=1;renderCheckins()">
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Member</th>
                <th>Plan</th>
                <th>Status</th>
                <th>Time</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="paginLabel">—</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../component/gym-shell.js"></script>
<script>
const shell = GymShell.attach({
  sidebarTarget: '#sidebarSlot', topbarTarget: '#topbarSlot',
  activeFile: 'gym-checkins.html', pageTitle: 'Check-in Log', pageSubtitle: 'View all gym access history',
  apiMode: 'Demo', user: { name: 'Gym Attendant', initials: 'GA' },
});
document.documentElement.classList.add('gym-ready');

const storage = window.storage || { async get(k,s){const v=localStorage.getItem(k);return v==null?null:{key:k,value:v,shared:s};}, async set(k,v,s){localStorage.setItem(k,v);return{key:k,value:v,shared:s};} };
const KEY_MEMBERS='gym-members', KEY_PLANS='gym-plans', KEY_CHECKINS='gym-checkins';
async function load(k,f){ try{const r=await storage.get(k,true);if(r&&r.value){const p=JSON.parse(r.value);if(Array.isArray(p))return p;}}catch(e){} return f;}

let members=[], plans=[], checkins=[], cPage=1;
const PAGE=20;
const COLOR_TOKENS={gold:{bg:'var(--gold-dim)',fg:'var(--gold-light)',dot:'var(--gold)'},blue:{bg:'var(--blue-bg)',fg:'var(--blue)',dot:'var(--blue)'},purple:{bg:'var(--purple-bg)',fg:'var(--purple)',dot:'var(--purple)'},green:{bg:'var(--green-bg)',fg:'var(--green)',dot:'var(--green)'},amber:{bg:'var(--amber-bg)',fg:'var(--amber)',dot:'var(--amber)'}};
function _esc(s){return(s==null?'':String(s)).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
function initials(n){return(n||'').split(' ').filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function fmtDateTime(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function timeAgo(iso){
  if(!iso)return'—';const mins=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(mins<1)return'Just now';if(mins<60)return mins+'m ago';const hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+'h ago';const days=Math.floor(hrs/24);if(days<7)return days+'d ago';
  return fmtDateTime(iso);
}
function daysUntil(s){if(!s)return null;const d=new Date(s+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000);}
function computeStatus(m){if(!m)return'no_plan';if(!m.planId)return'no_plan';if(m.status==='frozen')return'frozen';const days=daysUntil(m.expiry);if(days===null)return'active';if(days<0)return'expired';if(days<=7)return'expiring';return'active';}
const STATUS_LABEL={active:'Active',expiring:'Expiring Soon',expired:'Expired',frozen:'Frozen',no_plan:'No Plan'};
const STATUS_CHIP={active:'chip-active',expiring:'chip-expiring',expired:'chip-expired',frozen:'chip-frozen',no_plan:'chip-no_plan'};
function planById(id){return plans.find(p=>p.id===id)||{id:null,name:'No Plan',price:0,durationDays:0,notes:'',color:'blue'};}
function planChipHtml(plan){const c=COLOR_TOKENS[plan.color]||COLOR_TOKENS.blue;return'<span class="plan-chip" style="background:'+c.bg+';color:'+c.fg+';"><span class="plan-dot" style="background:'+c.dot+';"></span>'+_esc(plan.name)+'</span>';}

function renderCheckins(){
  const q=document.getElementById('fSearch').value.toLowerCase();
  let rows=checkins.filter(ci=>!q||ci.memberName.toLowerCase().includes(q));
  document.getElementById('ciCount').textContent=rows.length+' check-in'+(rows.length!==1?'s':'');
  const tp=Math.max(1,Math.ceil(rows.length/PAGE));if(cPage>tp)cPage=tp;
  const start=(cPage-1)*PAGE,pageRows=rows.slice(start,start+PAGE);
  document.getElementById('tblBody').innerHTML=pageRows.length===0
    ?'<tr class="empty-row"><td colspan="5">No check-ins found.</td></tr>'
    :pageRows.map(ci=>{
      const m=members.find(x=>x.id===ci.memberId);
      const plan=m?planById(m.planId):null;
      const s=m?computeStatus(m):'no_plan';
      return '<tr><td><div class="mem-cell"><span class="mem-avatar">'+initials(ci.memberName)+'</span>'+_esc(ci.memberName)+'</div></td>'+
        '<td>'+(plan?planChipHtml(plan):'<span style="color:var(--text3);font-size:11px;">—</span>')+'</td>'+
        '<td><span class="chip '+STATUS_CHIP[s]+'">'+STATUS_LABEL[s]+'</span></td>'+
        '<td>'+timeAgo(ci.time)+'</td>'+
        '<td>'+fmtDateTime(ci.time)+'</td></tr>';
    }).join('');
  const from=rows.length===0?0:(cPage-1)*PAGE+1,to=Math.min(cPage*PAGE,rows.length);
  document.getElementById('paginLabel').textContent=rows.length===0?'No records':from+'–'+to+' of '+rows.length;
  const w=document.getElementById('pageBtns');w.innerHTML='';
  const mk=(l,p,d,ac)=>{const b=document.createElement('button');b.className='page-btn'+(ac?' active':'');b.textContent=l;b.disabled=!!d;b.onclick=()=>{cPage=p;renderCheckins();};return b;};
  w.appendChild(mk('‹',cPage-1,cPage===1));let s2=Math.max(1,cPage-2),e2=Math.min(tp,s2+4);s2=Math.max(1,e2-4);
  for(let i=s2;i<=e2;i++)w.appendChild(mk(String(i),i,false,i===cPage));
  w.appendChild(mk('›',cPage+1,cPage>=tp));
}

async function init(){
  plans=await load(KEY_PLANS,[
    {id:'pl01',name:'Basic',price:15000,durationDays:30,notes:'Full gym floor access during opening hours. Locker included.',color:'blue'},
    {id:'pl02',name:'Premium',price:35000,durationDays:30,notes:'Everything in Basic, plus group classes, sauna access, and one personal-training consult per month.',color:'gold'},
    {id:'pl03',name:'Day Pass',price:5000,durationDays:1,notes:'Single-day access for hotel guests and walk-ins. No locker.',color:'purple'},
  ]);
  members=await load(KEY_MEMBERS,[]);
  checkins=await load(KEY_CHECKINS,[]);
  renderCheckins();
}
init();
</script>
</body>
</html>
