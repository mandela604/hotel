<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Production History | Grace Kitchen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; }
  body{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:13px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content, .modal-overlay{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
    --input-bg:#f4f6fb; --modal-bg:#ffffff;
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
  }
  .content{ padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; background:var(--bg); color:var(--text); }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s; animation:fadeUp .4s ease both; }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-amber::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .ic-red{ background:var(--red-bg); color:var(--red); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:700; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; transition:border-color .2s; min-width:180px; max-width:260px; flex:1; }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; font-family:inherit; }
  .filter-select{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-size:12.5px; cursor:pointer; outline:none; font-family:inherit; }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-size:11.5px; font-weight:700; cursor:pointer; padding:8px 6px; display:inline-flex; align-items:center; gap:5px; font-family:inherit; }
  .btn-ghost:hover{ color:var(--gold); }

  .table-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; }
  .table-head-bar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
  .table-title{ font-size:13px; font-weight:800; color:var(--text); }
  .table-wrap{ overflow-x:auto; width:100%; }
  table.data-tbl{ width:100%; border-collapse:collapse; text-align:left; font-size:13px; }
  table.data-tbl th{ background:var(--surface2); color:var(--text3); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:10px 14px; border-bottom:1px solid var(--border); }
  table.data-tbl td{ padding:12px 14px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; cursor:pointer; }
  table.data-tbl tr:last-child td{ border-bottom:none; }
  table.data-tbl tr:hover td{ background:rgba(47,111,237,0.02); }

  .chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:700; white-space:nowrap; }
  .chip-sent{ background:var(--blue-bg); color:var(--blue); }
  .chip-accepted, .chip-completed{ background:var(--green-bg); color:var(--green); }
  .chip-rejected, .chip-voided{ background:var(--red-bg); color:var(--red); }
  .chip-rts{ background:var(--purple-bg); color:var(--purple); }
  .chip-coo{ background:var(--amber-bg); color:var(--amber); }
  .chip-in-progress{ background:var(--amber-bg); color:var(--amber); }

  .btn-primary-sm{ background:var(--gold); color:#fff; border:1px solid var(--gold); border-radius:9px; padding:8px 14px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; text-decoration:none; transition:all .2s; }
  .btn-primary-sm:hover{ background:var(--gold-light); }

  .modal-action-block{ background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:6px; }
  .modal-action-title{ font-size:11.5px; font-weight:800; color:var(--text); margin-bottom:10px; display:flex; align-items:center; gap:7px; }
  .modal-action-title.danger{ color:var(--red); }
  .modal-row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .modal-input{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-size:12.5px; font-family:inherit; color:var(--text); width:100%; outline:none; }
  .modal-input:focus{ border-color:var(--gold-border); }
  .btn-danger-sm{ background:var(--red-bg); border:1px solid rgba(240,68,56,.3); color:var(--red); font-weight:700; padding:8px 14px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:12px; }

  .pagin{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); flex-wrap:wrap; gap:8px; font-size:11.5px; color:var(--text2); }
  .page-btns{ display:flex; align-items:center; gap:4px; }
  .page-btn{ width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--surface2); color:var(--text2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11.5px; font-weight:600; }
  .page-btn.active{ background:var(--gold); border-color:var(--gold); color:#fff; font-weight:700; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(15,26,42,0.55); backdrop-filter:blur(4px); z-index:300; align-items:center; justify-content:center; padding:20px 16px; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(520px,96vw); box-shadow:0 32px 80px rgba(15,34,55,0.25); position:relative; overflow:hidden; }
  .modal::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
  .modal-title{ font-size:18px; font-weight:800; color:var(--text); margin-bottom:14px; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .detail-item{ display:flex; flex-direction:column; gap:2px; }
  .detail-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:700; }
  .detail-value{ font-size:13px; font-weight:600; color:var(--text); }
  .ing-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border); font-size:12.5px; }
  .ing-row:last-child{ border-bottom:none; }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .2s; border:1px solid transparent; font-family:inherit; }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text); box-shadow:0 8px 28px rgba(15,34,55,0.18); z-index:999; display:flex; align-items:center; gap:8px; font-weight:600; }
  .toast.success{ border-left:3px solid var(--green); } .toast.error{ border-left:3px solid var(--red); } .toast.info{ border-left:3px solid var(--blue); }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <!-- KPI CARDS -->
      <div class="kpi-row" id="kpiRow"></div>

      <!-- TOOLBAR -->
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="flt-group">
            <div class="flt-label">Search Log</div>
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px;"></i>
              <input type="text" id="fSearch" placeholder="Search dish, ID, or staff…">
            </div>
          </div>
          <div class="flt-group">
            <div class="flt-label">Status</div>
            <select class="filter-select" id="fStatus">
              <option value="">All Statuses</option>
              <option value="in-progress">Awaiting Yield</option>
              <option value="completed">Completed</option>
              <option value="voided">Voided</option>
            </select>
          </div>
          <div class="flt-group">
            <div class="flt-label">Type</div>
            <select class="filter-select" id="fType">
              <option value="">All Types</option>
              <option value="rts">Ready-to-Serve</option>
              <option value="coo">Cook-on-Order</option>
            </select>
          </div>
          <button class="btn-ghost" onclick="clearFilters()"><i class="fa-solid fa-rotate"></i> Reset</button>
        </div>
      </div>

      <!-- TABLE CARD -->
      <div class="table-card">
        <div class="table-head-bar">
          <div class="table-title">Production History Log</div>
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="font-size:11.5px;color:var(--text3);font-weight:600;" id="tblCount">Loading…</div>
            <a class="btn-primary-sm" href="kitchen-production.html"><i class="fa-solid fa-plus"></i> New Production</a>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-tbl">
            <thead>
              <tr>
                <th>Production No.</th>
                <th>Meals / Dish</th>
                <th>Type</th>
                <th>Status</th>
                <th>Time / Date</th>
              </tr>
            </thead>
            <tbody id="tblBody">
              <tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text3);">Loading production history…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagin">
          <div id="paginLabel">Showing 0–0 of 0</div>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="data/kitchen-seed.js"></script>
<script src="services/kitchen-service.js"></script>
<script src="../component/kitchen-shell.js"></script>
<script src="../component/production-modal.js"></script>
<script>
const shell = KitchenShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'kitchen-production-history.html',
  pageTitle:     'Production History',
  pageSubtitle:  'Historical log of all dishes produced in the Kitchen',
  apiMode:       'Demo',
});

let page = 1;
const PAGE_SIZE = 10;
let filtered = [];

function showToast(msg, type) {
  type = type || 'success';
  const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}
function getSession() { return shell ? shell.getUser() : null; }
function getStaffName() {
  const session = getSession();
  return (session && session.name) || 'Head Chef';
}
const STATUS_LBL = { draft:'Draft', saved:'Saved', 'in-progress':'Awaiting Yield', sent:'Awaiting Approval', accepted:'Accepted', rejected:'Rejected', completed:'Completed', voided:'Voided' };
const TYPE_LBL = { rts:'Ready-to-Serve', coo:'Cook-on-Order' };
function fmtQty(n){ return (Math.round((n||0)*100)/100).toString(); }

function formatTime12(t){
  if (!t) return '—';
  if (/am|pm/i.test(t)) return t.trim();
  const m = String(t).match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return t;
  let h = parseInt(m[1], 10);
  const min = m[2];
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${min} ${ampm}`;
}

function mealSummary(p){
  const meals = p.meals || (p.dish ? [{ name: p.dish, qty: p.outputQty, unit: p.outputUnit }] : []);
  if (!meals.length) return '—';
  const first = meals[0];
  const label = `${first.name} (${fmtQty(first.qty)} ${first.unit || ''})`.trim();
  return meals.length > 1 ? `${label} +${meals.length - 1} more` : label;
}

function renderKPIs(){
  const productions = KitchenService.state.production || [];
  const total = productions.length;
  const awaiting = productions.filter(p=>p.status==='in-progress').length;
  const accepted = productions.filter(p=>p.status==='completed').length;
  const rejected = productions.filter(p=>p.status==='voided').length;
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card acc-blue">
      <div class="kpi-top">
        <div class="kpi-ic ic-blue"><i class="fa-solid fa-layer-group"></i></div>
        <div class="kpi-label">Total Productions</div>
      </div>
      <div class="kpi-value" style="color:var(--blue);">${total}</div>
      <div class="kpi-trend neutral">All-time record</div>
    </div>
    <div class="kpi-card acc-amber">
      <div class="kpi-top">
        <div class="kpi-ic ic-amber"><i class="fa-solid fa-truck-fast"></i></div>
        <div class="kpi-label">Awaiting Yield</div>
      </div>
      <div class="kpi-value" style="color:var(--amber);">${awaiting}</div>
      <div class="kpi-trend warn">${awaiting>0?'Cooking in progress':'✓ All clear'}</div>
    </div>
    <div class="kpi-card acc-green">
      <div class="kpi-top">
        <div class="kpi-ic ic-green"><i class="fa-solid fa-circle-check"></i></div>
        <div class="kpi-label">Completed</div>
      </div>
      <div class="kpi-value" style="color:var(--green);">${accepted}</div>
      <div class="kpi-trend up">Yield recorded</div>
    </div>
    <div class="kpi-card acc-red">
      <div class="kpi-top">
        <div class="kpi-ic ic-red"><i class="fa-solid fa-circle-xmark"></i></div>
        <div class="kpi-label">Voided</div>
      </div>
      <div class="kpi-value" style="color:var(--red);">${rejected}</div>
      <div class="kpi-trend ${rejected>0?'warn':'up'}">${rejected>0?'Review needed':'None on record'}</div>
    </div>`;
}

function clearFilters(){
  document.getElementById('fSearch').value=''; document.getElementById('fStatus').value=''; document.getElementById('fType').value='';
  page=1; render();
}

function getFiltered(){
  const productions = KitchenService.state.production || [];
  const q = document.getElementById('fSearch').value.toLowerCase().trim();
  const st = document.getElementById('fStatus').value;
  const ty = document.getElementById('fType').value;
  return productions.filter(p => {
    const idNo = (p.no || p.id || '').toLowerCase();
    const dishName = (p.dish || '').toLowerCase();
    const mealsArr = p.meals || [];
    const mq = !q || idNo.includes(q) || dishName.includes(q) || mealsArr.some(m => (m.name||'').toLowerCase().includes(q));
    const pType = p.type || 'rts';
    return mq && (!st||p.status===st) && (!ty||pType===ty);
  });
}

function renderPagination(total){
  const totalPg = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if (page>totalPg) page=totalPg;
  const from = total===0?0:(page-1)*PAGE_SIZE+1, to = Math.min(page*PAGE_SIZE,total);
  document.getElementById('paginLabel').textContent = total===0?'No records':`${from}–${to} of ${total}`;
  const wrap = document.getElementById('pageBtns'); wrap.innerHTML='';
  const mk=(l,p,d,a)=>{ const b=document.createElement('button'); b.className='page-btn'+(a?' active':''); b.innerHTML=l; b.disabled=!!d; b.onclick=()=>{page=p;renderTable();}; return b; };
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-left"></i>',page-1,page===1,false));
  let start=Math.max(1,page-2), end=Math.min(totalPg,start+4); start=Math.max(1,end-4);
  for(let i=start;i<=end;i++) wrap.appendChild(mk(String(i),i,false,i===page));
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-right"></i>',page+1,page>=totalPg,false));
}

function renderTable(){
  const rows = filtered;
  document.getElementById('tblCount').textContent = rows.length + ' record' + (rows.length!==1?'s':'');
  const start=(page-1)*PAGE_SIZE;
  const pageRows = rows.slice(start,start+PAGE_SIZE);
  document.getElementById('tblBody').innerHTML = pageRows.length===0
    ? `<tr class="empty-row"><td colspan="5" style="text-align:center;padding:30px;color:var(--text3);">No production runs found.</td></tr>`
    : pageRows.map(p => {
        const pNo = p.no || p.id;
        const pType = p.type || 'rts';
        return `<tr onclick="openProductionModal('${pNo}')">
          <td data-label="No." style="font-weight:700;color:var(--gold);">${pNo}</td>
          <td data-label="Meals">${mealSummary(p)}</td>
          <td data-label="Type"><span class="chip chip-${pType==='rts'?'rts':'coo'}">${TYPE_LBL[pType] || pType}</span></td>
          <td data-label="Status"><span class="chip chip-${p.status}">${STATUS_LBL[p.status] || p.status}</span></td>
          <td data-label="Time">${formatTime12(p.time || (p.date ? p.date.split(' ')[1] : ''))}</td>
        </tr>`;
      }).join('');
  renderPagination(rows.length);
}

function render(){ filtered = getFiltered(); renderKPIs(); renderTable(); }

function openProductionModal(no){
  const productions = KitchenService.state.production || [];
  const p = productions.find(x=>(x.no===no || x.id===no)); if (!p) return;
  prodModal.openView(p);
}

['fSearch','fStatus','fType'].forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.addEventListener(id==='fSearch'?'input':'change', ()=>{ page=1; render(); });
});

let prodModal = null;

async function init(){
  await KitchenService.loadAll();
  prodModal = ProductionModal.create({
    service: KitchenService,
    session: getSession(),
    onSaved: render,
  });
  render();
  KitchenService.onChange(render);
  const openNo = new URLSearchParams(location.search).get('open');
  if (openNo) openProductionModal(openNo);
}
init();
</script>
</body>
</html>
