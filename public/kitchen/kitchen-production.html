<!DOCTYPE html>
<html lang="en" data-theme="dark" style="background:#080f18;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>New Production | Aurum Kitchen</title>
<style>html,body{background:#080f18;margin:0;}</style>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  [data-theme="dark"]{
    --bg:#080f18; --surface:#111e2b; --surface2:#162435; --surface3:#1c2e40;
    --border:#1e3045; --border2:#243850; --text:#e8f0f8; --text2:#a8bece; --text3:#6a8a9e;
    --shadow:0 8px 32px rgba(0,0,0,0.5); --shadow-lg:0 16px 48px rgba(0,0,0,0.6); --input-bg:#0d1a26;
  }
  [data-theme="light"]{
    --bg:#eef2f7; --surface:#ffffff; --surface2:#f4f7fb; --surface3:#e8edf5;
    --border:#dce4ef; --border2:#ccd6e5; --text:#0f2237; --text2:#4a6580; --text3:#8aa0b8;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10); --input-bg:#eef1f6;
  }
  html, body{ height:100%; overflow-x:hidden; }
  body{ font-family:'Outfit', system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }
  .content{ padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; }
  @media (max-width:768px){ .content{ padding:16px; } }
  @media (max-width:480px){ .content{ padding:14px 12px 20px; } }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">
      <div id="productionPlaceholder"></div>
    </div>
  </div>
</div>

<script src="../component/kitchen-shell.js"></script>
<script src="../component/grace-kitchen-production.js"></script>
<script>
KitchenShell.attach({
  sidebarTarget: '#sidebarSlot',
  topbarTarget:  '#topbarSlot',
  activeFile:    'kitchen-production.html',
  pageTitle:     'New Production',
  pageSubtitle:  'One row per batch, manual ingredient logging, expandable batch history',
  apiMode:       'Demo',
  user:          { name: 'Head Chef', initials: 'HC' },
});

/* ═══════════════════════════════════════════
   All form logic (batch-based meal entry,
   manual ingredient logging, expandable batch
   history, save) lives in
   grace-kitchen-production.js — this page is
   just a thin shell that configures it.
═══════════════════════════════════════════ */
GraceKitchenProduction.attach('#productionPlaceholder', {
  kitchenName: 'Main Kitchen',
  cfg: { API_BASE: '', API_KEY: '', USE_DEMO: true },

  // Hardcoded default — swapped for a live call automatically once
  // USE_DEMO is false and departmentsApiUrl resolves (General Platform
  // Settings page, when live).
  departments: ['Main Restaurant / POS', 'Pool Bar', 'Room Service', 'Banquets Hall'],
  departmentsApiUrl: '/api/settings/departments',

  // Suggestions only, shown in the meal-name datalist — no math is
  // derived from this list. Ingredients used are always entered manually.
  mealNames: ['Fried Rice', 'Jollof Rice', 'Egusi Soup', 'Pepper Soup', 'Moi Moi'],

  // Reference only — shown as "on hand" next to each manually-entered
  // ingredient so the chef can see if they're logging more than is in
  // stock. Nothing here is auto-deducted by a formula.
  stock: [
    { name:'Rice',        qty:112, unit:'kg' },
    { name:'Oil',         qty:18,  unit:'Ltr' },
    { name:'Curry',       qty:4,   unit:'kg' },
    { name:'Green Peas',  qty:9,   unit:'kg' },
    { name:'Chicken',     qty:38,  unit:'kg' },
    { name:'Seasoning',   qty:6,   unit:'kg' },
    { name:'Tomato',      qty:22,  unit:'kg' },
    { name:'Pepper',      qty:5,   unit:'kg' },
    { name:'Egusi',       qty:14,  unit:'kg' },
    { name:'Palm Oil',    qty:3,   unit:'Ltr' },
    { name:'Spinach',     qty:8,   unit:'kg' },
    { name:'Scent Leaf',  qty:2,   unit:'kg' },
    { name:'Beans Flour', qty:12,  unit:'kg' },
    { name:'Egg',         qty:60,  unit:'pcs' },
  ],

  openOrders: [
    { id:'ORD-1057', label:'ORD-1057 — Table 4, 2 covers' },
    { id:'ORD-1058', label:'ORD-1058 — Table 9, 1 cover' },
    { id:'ORD-1059', label:'ORD-1059 — Room Service, Rm 204' },
  ],

  onSave: (batch) => {
    // e.g. POST batch.batchNo / batch.meals / batch.ingredients / batch.transferNo
    // to your real API here once CFG.USE_DEMO is false.
    console.log('[kitchen-production] batch saved:', batch);
  },
});
</script>
</body>
</html>
