<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start Production | Grace Kitchen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:auto; }
  body{ font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; font-size:13px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:block; }
  .main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }

  .content{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
    --border:#eef0f6; --border2:#dfe3ec;
    --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
    --shadow:0 4px 20px rgba(15,34,55,0.07);
    --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
    --green:#12b76a; --green-bg:#e9f9f0;
    --red:#f04438; --red-bg:#feecec;
    --amber:#f79009; --amber-bg:#fff4e5;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; background:var(--bg); color:var(--text);
  }
  @media (max-width:480px){ .content{ padding:16px 14px 22px; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; animation:fadeUp .4s ease both; }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
  .kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
  .kpi-card.acc-amber::before{ background:linear-gradient(90deg,var(--amber),transparent); }
  .kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
  .kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .ic-blue{ background:var(--blue-bg); color:var(--blue); }
  .ic-green{ background:var(--green-bg); color:var(--green); }
  .ic-amber{ background:var(--amber-bg); color:var(--amber); }
  .ic-purple{ background:var(--purple-bg); color:var(--purple); }
  .kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
  .kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
  @media (max-width:420px){ .kpi-value{ font-size:18px; } }
  .kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.info{ color:var(--blue); }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; max-width:780px; margin:0 auto; width:100%; }
  .panel-head{ padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .panel-title{ font-size:13.5px; font-weight:800; color:var(--text); display:flex; align-items:center; gap:8px; }
  .panel-sub{ font-size:11px; color:var(--text3); font-weight:600; margin-top:2px; }
  .panel-body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:14px; }

  .staff-pill{ display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:6px 12px 6px 6px; font-size:11.5px; font-weight:700; color:var(--text2); white-space:nowrap; }
  .staff-pill .avatar{ width:22px; height:22px; border-radius:50%; background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; }

  .type-row{ display:flex; gap:8px; }
  .type-btn{ flex:1; text-align:center; padding:8px 6px; border:1px solid var(--border2); border-radius:10px; font-size:11.5px; font-weight:700; color:var(--text2); cursor:pointer; transition:all .15s; background:var(--surface); }
  .type-btn.on.normal{ background:var(--blue-bg); border-color:rgba(47,111,237,.4); color:var(--blue); }
  .type-btn.on.cook_on_order{ background:var(--amber-bg); border-color:rgba(247,144,9,.4); color:var(--amber); }

  .dish-table{ width:100%; border-collapse:collapse; }
  .dish-table th{ text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border); }
  .dish-table td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .dish-table tr:last-child td{ border-bottom:none; }
  .dish-table .row-num{ font-size:11px; font-weight:800; color:var(--text3); width:32px; text-align:center; }
  .dish-table .row-recipe{ min-width:180px; }
  .dish-table .row-qty{ width:100px; }
  .dish-table .row-yield{ width:130px; }
  .dish-table .row-action{ width:36px; text-align:center; }

  .dish-table select, .dish-table input{ background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:7px 10px; color:var(--text); font-family:inherit; font-size:12.5px; outline:none; width:100%; transition:border-color .2s; }
  .dish-table select:focus, .dish-table input:focus{ border-color:var(--gold-border); }
  .dish-table input[disabled]{ background:var(--surface3); color:var(--text3); cursor:not-allowed; }

  .btn-remove{ background:none; border:none; cursor:pointer; color:var(--text3); font-size:13px; padding:4px; border-radius:6px; transition:color .15s; }
  .btn-remove:hover{ color:var(--red); }

  .add-dish-btn{ display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; border:1.5px dashed var(--border2); border-radius:10px; color:var(--text2); font-size:12px; font-weight:700; cursor:pointer; background:none; width:100%; transition:border-color .2s,color .2s; font-family:inherit; }
  .add-dish-btn:hover{ border-color:var(--gold-border); color:var(--gold); }

  .start-all-btn{ background:var(--gold); color:#fff; border:1px solid var(--gold); border-radius:11px; padding:12px 16px; font-family:inherit; font-size:13.5px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; transition:all .2s; }
  .start-all-btn:hover{ background:var(--gold-light); }
  .start-all-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .progress-bar{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:12px; font-weight:600; color:var(--text2); display:none; align-items:center; gap:10px; }
  .progress-bar.show{ display:flex; }
  .progress-bar i{ color:var(--blue); }

  .link-history{ font-size:11.5px; font-weight:700; color:var(--gold); text-decoration:none; display:flex; align-items:center; justify-content:center; gap:6px; padding:4px 0; }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text); box-shadow:0 8px 28px rgba(15,34,55,0.18); z-index:9999; display:flex; align-items:center; gap:8px; font-weight:600; }
  .toast.success{ border-left:3px solid var(--green); }
  .toast.error{ border-left:3px solid var(--red); }
  .toast.info{ border-left:3px solid var(--blue); }

  .empty-msg{ text-align:center; padding:20px; color:var(--text3); font-size:12.5px; font-weight:600; }

  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title"><i class="fa-solid fa-fire-burner" style="color:var(--gold)"></i> Start Production Batch</div>
            <div class="panel-sub">Add dishes as line items — all start together. Record yield from History when done.</div>
          </div>
          <div class="staff-pill" id="staffPill"></div>
        </div>
        <div class="panel-body">

          <!-- Production type toggle (single, shared across batch) -->
          <div class="type-row" id="typeRow">
            <div class="type-btn on normal" data-type="normal">Normal Cook</div>
            <div class="type-btn" data-type="cook_on_order">Cook on Order</div>
          </div>

          <!-- Dish line items table -->
          <div style="overflow-x:auto;">
            <table class="dish-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Recipe</th>
                  <th>Batch Qty</th>
                  <th>Expected Yield</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="dishBody"></tbody>
            </table>
          </div>

          <div id="emptyMsg" class="empty-msg">No dishes added yet — click "Add Dish" below.</div>

          <!-- Add dish -->
          <button class="add-dish-btn" id="addDishBtn" type="button">
            <i class="fa-solid fa-plus"></i> Add Dish
          </button>

          <!-- Progress indicator -->
          <div class="progress-bar" id="progressBar">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <span id="progressText">Starting…</span>
          </div>

          <!-- Start all -->
          <button class="start-all-btn" id="startAllBtn" type="button">
            <i class="fa-solid fa-play"></i>
            <span id="startAllLabel">Start Production</span>
          </button>

          <a class="link-history" href="kitchen-production-history.html">
            <i class="fa-solid fa-clock-rotate-left"></i> Go to Production History to record yield or void a run
          </a>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="services/kitchen-service.js"></script>
<script src="../component/kitchen-shell.js"></script>
<script>
'use strict';

var shell = null;

function fmtN(n) { return KitchenService.fmtN(n); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, type) {
  type = type || 'success';
  var icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + esc(String(msg == null ? '' : msg));
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 4000);
}
function getSession() { return shell ? shell.getUser() : null; }
function getStaffName() {
  var s = getSession();
  return (s && s.name) || 'Head Chef';
}
function isManager() { return KitchenService.isManagerLike(getSession()); }

function renderStaffPill() {
  var name = getStaffName();
  var initials = name.split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join('').toUpperCase();
  document.getElementById('staffPill').innerHTML =
    '<span class="avatar">' + esc(initials || '?') + '</span> ' + esc(name);
}

/* ══════════════════════════════════════════════
   BATCH STATE — simple array of row objects
   Each: { id, recipeId, batchQty }
══════════════════════════════════════════════ */
var batchRows = [];
var nextRowId = 1;
var productionType = 'normal';

function makeRow() {
  return { id: nextRowId++, recipeId: '', batchQty: '' };
}

/* ══════════════════════════════════════════════
   RENDER — compact table rows
══════════════════════════════════════════════ */
function renderList() {
  var tbody = document.getElementById('dishBody');
  var emptyMsg = document.getElementById('emptyMsg');

  if (!batchRows.length) {
    tbody.innerHTML = '';
    emptyMsg.style.display = '';
    updateLabel();
    return;
  }
  emptyMsg.style.display = 'none';

  var recipeOpts = KitchenService.state.recipes.length
    ? '<option value="">Select recipe…</option>' + KitchenService.state.recipes.map(function (r) {
        return '<option value="' + esc(r.id) + '">' + esc(r.dish) + '</option>';
      }).join('')
    : '<option value="">No recipes</option>';

  tbody.innerHTML = batchRows.map(function (row, idx) {
    var recipe = row.recipeId ? KitchenService.findRecipeById(row.recipeId) : null;
    var yieldVal = '';
    if (recipe && row.batchQty) {
      var qty = parseFloat(row.batchQty) || 0;
      if (qty > 0 && recipe.expectedYield > 0 && recipe.baseQty > 0) {
        var factor = qty / recipe.baseQty;
        yieldVal = Math.round(recipe.expectedYield * factor * 100) / 100 + ' ' + (recipe.expectedYieldUnit || '');
      }
    }
    return '<tr data-row-id="' + row.id + '">' +
      '<td class="row-num">' + (idx + 1) + '</td>' +
      '<td class="row-recipe"><select data-role="recipe" data-rid="' + row.id + '">' +
        recipeOpts.replace('value="' + esc(row.recipeId) + '"', 'value="' + esc(row.recipeId) + '" selected') +
      '</select></td>' +
      '<td class="row-qty"><input data-role="qty" data-rid="' + row.id + '" type="number" min="0.1" step="0.1" placeholder="Qty" value="' + esc(String(row.batchQty)) + '"></td>' +
      '<td class="row-yield"><input type="text" disabled placeholder="—" value="' + esc(yieldVal) + '"></td>' +
      '<td class="row-action">' +
        (batchRows.length > 1
          ? '<button class="btn-remove" data-rid="' + row.id + '" title="Remove"><i class="fa-solid fa-xmark"></i></button>'
          : '') +
      '</td>' +
    '</tr>';
  }).join('');

  // Bind events
  tbody.querySelectorAll('select[data-role="recipe"]').forEach(function (sel) {
    sel.addEventListener('change', function () {
      var rid = Number(sel.dataset.rid);
      var row = batchRows.find(function (r) { return r.id === rid; });
      if (!row) return;
      row.recipeId = sel.value;
      // Auto-fill batch qty from recipe baseQty
      var recipe = row.recipeId ? KitchenService.findRecipeById(row.recipeId) : null;
      if (recipe) row.batchQty = String(recipe.baseQty || '');
      renderList();
    });
  });

  tbody.querySelectorAll('input[data-role="qty"]').forEach(function (inp) {
    inp.addEventListener('input', function () {
      var rid = Number(inp.dataset.rid);
      var row = batchRows.find(function (r) { return r.id === rid; });
      if (!row) return;
      row.batchQty = inp.value;
      // Update yield display in same row
      var tr = inp.closest('tr');
      var yieldInput = tr.querySelectorAll('input')[1]; // second input is yield (disabled)
      if (yieldInput) {
        var recipe = row.recipeId ? KitchenService.findRecipeById(row.recipeId) : null;
        var qty = parseFloat(row.batchQty) || 0;
        if (recipe && qty > 0 && recipe.expectedYield > 0 && recipe.baseQty > 0) {
          var factor = qty / recipe.baseQty;
          yieldInput.value = Math.round(recipe.expectedYield * factor * 100) / 100 + ' ' + (recipe.expectedYieldUnit || '');
        } else {
          yieldInput.value = '';
        }
      }
      updateLabel();
    });
  });

  tbody.querySelectorAll('.btn-remove').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var rid = Number(btn.dataset.rid);
      batchRows = batchRows.filter(function (r) { return r.id !== rid; });
      renderList();
    });
  });

  updateLabel();
}

function updateLabel() {
  var valid = batchRows.filter(function (r) { return r.recipeId && parseFloat(r.batchQty) > 0; }).length;
  var el = document.getElementById('startAllLabel');
  if (el) el.textContent = valid === 0 ? 'Start Production' : ('Start ' + valid + ' Dish' + (valid !== 1 ? 'es' : ''));
}

function addRow() {
  batchRows.push(makeRow());
  renderList();
  // Focus the new recipe select
  var selects = document.querySelectorAll('select[data-role="recipe"]');
  if (selects.length) selects[selects.length - 1].focus();
}

/* ══════════════════════════════════════════════
   PRODUCTION TYPE TOGGLE
══════════════════════════════════════════════ */
document.getElementById('typeRow').addEventListener('click', function (e) {
  var btn = e.target.closest('.type-btn');
  if (!btn) return;
  productionType = btn.dataset.type;
  document.querySelectorAll('#typeRow .type-btn').forEach(function (b) {
    b.className = 'type-btn' + (b.dataset.type === productionType ? ' on ' + productionType : '');
  });
});

/* ══════════════════════════════════════════════
   SUBMIT
══════════════════════════════════════════════ */
document.getElementById('addDishBtn').addEventListener('click', addRow);

document.getElementById('startAllBtn').addEventListener('click', async function () {
  var validRows = batchRows.filter(function (r) { return r.recipeId && parseFloat(r.batchQty) > 0; });

  if (!validRows.length) {
    showToast('Add at least one dish with a recipe and batch size.', 'error');
    return;
  }

  var btn = document.getElementById('startAllBtn');
  var progress = document.getElementById('progressBar');
  var progText = document.getElementById('progressText');
  btn.disabled = true;
  progress.classList.add('show');
  progText.textContent = 'Starting batch production…';

  try {
    var cooId = '';
    // Check if any row has a COO id (from loadCooIntoProduction)
    for (var i = 0; i < validRows.length; i++) {
      if (validRows[i]._cooId) { cooId = validRows[i]._cooId; break; }
    }

    var batchDishes = validRows.map(function (row) {
      return { recipeId: row.recipeId, batchQty: parseFloat(row.batchQty) };
    });

    var run = await KitchenService.startBatchProduction({
      dishes: batchDishes,
      type: productionType,
      cooId: cooId,
      staff: getStaffName(),
      notes: '',
    });

    progress.classList.remove('show');
    btn.disabled = false;

    showToast(validRows.length + ' dish' + (validRows.length !== 1 ? 'es' : '') + ' started in batch ' + (run.no || run.id) + ' — ingredients deducted.', 'success');
    batchRows = [makeRow()];
    renderList();
    renderKPIs();
  } catch (e) {
    progress.classList.remove('show');
    btn.disabled = false;
    showToast('Batch failed: ' + ((e && e.message) || 'unknown error'), 'error');
  }
});

/* ── KPIs ── */
function renderKPIs() {
  var k = KitchenService.dashboardKPIs();
  var pk = KitchenService.productionKPIs();
  var pending = (KitchenService.state.production || []).filter(function (p) { return p.status === 'in-progress'; }).length;
  document.getElementById('kpiRow').innerHTML =
    '<div class="kpi-card acc-blue">' +
      '<div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-fire-burner"></i></div><div class="kpi-label">Today\'s Runs</div></div>' +
      '<div class="kpi-value" style="color:var(--blue);">' + k.todayRunsCount + '</div>' +
      '<div class="kpi-trend info">Started today</div>' +
    '</div>' +
    '<div class="kpi-card acc-amber">' +
      '<div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-hourglass-half"></i></div><div class="kpi-label">Awaiting Yield</div></div>' +
      '<div class="kpi-value" style="color:var(--amber);">' + pending + '</div>' +
      '<div class="kpi-trend warn">Cooking in progress</div>' +
    '</div>' +
    (isManager()
      ? '<div class="kpi-card acc-green"><div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Today\'s Cost</div></div>' +
        '<div class="kpi-value" style="color:var(--green);">' + fmtN(k.todayCost) + '</div><div class="kpi-trend up">Ingredient value</div></div>'
      : '<div class="kpi-card acc-green"><div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-utensils"></i></div><div class="kpi-label">Items in Stock</div></div>' +
        '<div class="kpi-value" style="color:var(--green);">' + k.itemCount + '</div><div class="kpi-trend up">Ingredients tracked</div></div>'
    ) +
    '<div class="kpi-card acc-purple">' +
      '<div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-scale-balanced"></i></div><div class="kpi-label">Avg Yield Variance</div></div>' +
      '<div class="kpi-value" style="color:var(--purple);">' + (pk.avgVariancePct != null ? (pk.avgVariancePct > 0 ? '+' : '') + pk.avgVariancePct + '%' : '—') + '</div>' +
      '<div class="kpi-trend info">Vs expected yield</div>' +
    '</div>';
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
(async function init() {
  if (window.KitchenShell) {
    shell = KitchenShell.attach({
      sidebarTarget: '#sidebarSlot',
      topbarTarget:  '#topbarSlot',
      activeFile:    'kitchen-production.html',
      pageTitle:     'Start Production',
      pageSubtitle:  'Deducts ingredients now — record yield from History when cooking is done',
    });
  }

  await KitchenService.loadAll();
  renderStaffPill();
  renderKPIs();

  var params = new URLSearchParams(window.location.search);
  var cooId = params.get('cooId');
  if (cooId) {
    await loadCooIntoProduction(cooId);
  } else {
    batchRows = [makeRow()];
    renderList();
  }

  KitchenService.onChange(function () { renderKPIs(); });
})();

async function loadCooIntoProduction(cooId) {
  try {
    var res = await fetch('/api/kitchen/coo-orders/' + encodeURIComponent(cooId), { credentials: 'include' });
    var json = await res.json();
    if (!res.ok || !json.success) throw new Error(json.error || 'Failed to load COO order');
    var order = json.data;

    productionType = 'cook_on_order';
    document.querySelectorAll('#typeRow .type-btn').forEach(function (b) {
      b.className = 'type-btn' + (b.dataset.type === 'cook_on_order' ? ' on cook_on_order' : '');
    });

    batchRows = [];
    var missingRecipes = [];
    var items = order.items || [];
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var row = makeRow();
      row._cooId = cooId;
      if (item.recipeId) {
        row.recipeId = item.recipeId;
        var recipe = KitchenService.findRecipeById(item.recipeId);
        if (recipe && recipe.expectedYield > 0 && recipe.baseQty > 0) {
          row.batchQty = String(Math.round((Number(item.qty) / recipe.expectedYield) * recipe.baseQty * 100) / 100);
        } else {
          row.batchQty = item.qty || '';
        }
        if (!recipe) missingRecipes.push(item.name);
      } else {
        missingRecipes.push(item.name + ' (no recipe)');
      }
      batchRows.push(row);
    }
    if (!batchRows.length) batchRows = [makeRow()];
    renderList();

    var subtitle = document.querySelector('.panel-sub');
    if (subtitle) {
      var msg = '<i class="fa-solid fa-fire" style="color:var(--amber);"></i> COO Order — <b>' + esc(order.table || '—') + '</b> — ' + items.length + ' item(s). Review and start.';
      if (missingRecipes.length) {
        msg += '<div style="color:var(--red);font-size:11px;margin-top:4px;"><i class="fa-solid fa-exclamation-triangle"></i> Missing recipes: ' + esc(missingRecipes.join(', ')) + '</div>';
      }
      subtitle.innerHTML = msg;
    }
  } catch (e) {
    showToast('Failed to load COO order: ' + e.message, 'error');
    batchRows = [makeRow()];
    renderList();
  }
}
</script>
</body>
</html>
