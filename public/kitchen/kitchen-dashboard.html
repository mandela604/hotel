<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kitchen Dashboard | Aurum Hotel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* 
   Styles identical to your Store/Poolbar pattern 
*/
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  font-size:13px; transition:background .3s,color .3s;
}
.app{ display:flex; height:100vh; overflow:hidden; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
@media (max-width:768px){ .main{ margin-left:0 !important; } }

.content{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
  --border:#eef0f6; --border2:#dfe3ec;
  --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
  --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
  --green:#12b76a; --green-bg:#e9f9f0;
  --red:#f04438;  --red-bg:#feecec;
  --amber:#f79009; --amber-bg:#fff4e5;
  --blue:#2f6fed;  --blue-bg:#eaf1ff;
  --purple:#8b5cf6; --purple-bg:#f4efff;
  flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; gap:16px; min-height:0;
  background:var(--bg); color:var(--text);
}

.section-title{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); font-weight:700; margin-bottom:6px; }

.kpi-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
@media (max-width:1200px){ .kpi-row{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:640px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }

.kpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px 14px 12px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); cursor:pointer; text-decoration:none; display:flex; flex-direction:column;
  transition:transform .2s,box-shadow .2s,border-color .2s; animation:fadeUp .4s ease both;
}
.kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
.kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
.kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
.kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.ic-blue{ background:var(--blue-bg); color:var(--blue); }
.ic-green{ background:var(--green-bg); color:var(--green); }
.ic-amber{ background:var(--amber-bg); color:var(--amber); }
.ic-purple{ background:var(--purple-bg); color:var(--purple); }
.ic-red{ background:var(--red-bg); color:var(--red); }
.kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
.kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
.kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }

.row{ display:flex; gap:14px; align-items:stretch; }
@media (max-width:900px){ .row{ flex-direction:column; } }
.panel{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; animation:fadeUp .4s ease both; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
.panel-title{ font-size:13px; font-weight:800; color:var(--text); }
.panel-action{ font-size:11.5px; color:var(--gold); text-decoration:none; font-weight:700; white-space:nowrap; }
.panel-body{ padding:6px 20px 16px; }

.list-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); text-decoration:none; color:inherit; }
.list-row:last-child{ border-bottom:none; }
.list-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.list-body{ flex:1; min-width:0; }
.list-name{ font-size:12.5px; color:var(--text); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list-meta{ font-size:11px; color:var(--text3); margin-top:1px; }

.chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
.chip-completed{ background:var(--purple-bg); color:var(--purple); }
.chip-low{ background:var(--amber-bg); color:var(--amber); }

.quick-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:14px 20px 18px; }
@media (max-width:900px){ .quick-grid{ grid-template-columns:repeat(2,1fr); } }
.quick-btn{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px 12px; display:flex; align-items:center; gap:10px; color:var(--text2); text-decoration:none; font-weight:700; font-size:12.5px; }
.quick-btn:hover{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }

@keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div>
        <div class="section-title">Kitchen at a Glance</div>
        <div class="kpi-row" id="kpiRow"></div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Recent Productions</div>
            <a class="panel-action" href="kitchen-production.html">Production Log <i class="fa-solid fa-arrow-right"></i></a>
          </div>
          <div class="panel-body" id="recentProdList"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Low Stock Ingredients</div>
            <a class="panel-action" href="kitchen-inventory.html">Manage Inventory <i class="fa-solid fa-arrow-right"></i></a>
          </div>
          <div class="panel-body" id="lowStockList"></div>
        </div>
      </div>

      <div class="row">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Incoming Store Requisitions</div>
            <a class="panel-action" href="kitchen-transfers.html">View All <i class="fa-solid fa-arrow-right"></i></a>
          </div>
          <div class="panel-body" id="incomingReqs"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Quick Actions</div></div>
          <div class="quick-grid">
            <a class="quick-btn" href="kitchen-production.html"><i class="fa-solid fa-plus"></i> New Production</a>
            <a class="quick-btn" href="kitchen-recipes.html"><i class="fa-solid fa-book-open"></i> Recipes</a>
            <a class="quick-btn" href="kitchen-inventory.html"><i class="fa-solid fa-box"></i> Kitchen Stock</a>
            <a class="quick-btn" href="kitchen-transfers.html"><i class="fa-solid fa-truck-ramp-box"></i> Meal Transfers</a>
            <a class="quick-btn" href="kitchen-production-history.html"><i class="fa-solid fa-clock-rotate-left"></i> History Log</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- LOAD ORDER: Match the Store pattern exactly -->
<script src="services/kitchen-service.js"></script>
<script src="../component/kitchen-shell.js"></script>

<script>
/* ═══════════════════════════════════════════════
   Initialization & Rendering
═══════════════════════════════════════════════ */
const svc = window.KitchenService;
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function paint(){
  if(!svc || !svc.state.ready) return;

  const kpis = svc.dashboardKPIs();
  
  // 1. KPIs
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-fire-burner"></i></div><div class="kpi-label">Today's Productions</div></div>
      <div class="kpi-value">${kpis.todayRunsCount}</div>
      <div class="kpi-trend neutral">runs completed today</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="kpi-label">Low Stock</div></div>
      <div class="kpi-value" style="color:var(--amber)">${kpis.lowStock}</div>
      <div class="kpi-trend warn">ingredients to reorder</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Production Cost</div></div>
      <div class="kpi-value" style="color:var(--green)">${svc.fmtN(kpis.todayCost)}</div>
      <div class="kpi-trend up">today's ingredient value</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-boxes-stacked"></i></div><div class="kpi-label">Total Ingredients</div></div>
      <div class="kpi-value" style="color:var(--purple)">${kpis.itemCount}</div>
      <div class="kpi-trend neutral">tracked items</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-weight-hanging"></i></div><div class="kpi-label">Stock Units</div></div>
      <div class="kpi-value">${kpis.units}</div>
      <div class="kpi-trend neutral">total volume on hand</div>
    </div>
  `;

  // 2. Recent Productions
  const recent = svc.state.production.slice(0, 5);
  document.getElementById('recentProdList').innerHTML = recent.length ? recent.map(p => `
    <div class="list-row">
      <div class="list-ic ic-purple"><i class="fa-solid fa-utensils"></i></div>
      <div class="list-body">
        <div class="list-name">${esc(p.dish)}</div>
        <div class="list-meta">${esc(String(p.outputQty||''))} ${esc(p.outputUnit||'')} · by ${esc(p.staff||p.by||'')} · ${esc(p.date||'')}</div>
      </div>
      <span class="chip chip-completed">${p.status.toUpperCase()}</span>
    </div>
  `).join('') : '<div class="empty-note">No recent production runs.</div>';

  // 3. Low Stock List
  const low = svc.state.stock.filter(i => svc.stockLevel(i) !== 'ok').slice(0, 5);
  document.getElementById('lowStockList').innerHTML = low.length ? low.map(i => `
    <div class="list-row">
      <div class="list-ic ic-amber"><i class="fa-solid fa-box-open"></i></div>
      <div class="list-body">
        <div class="list-name">${esc(i.name)}</div>
        <div class="list-meta">Have ${i.qty} ${i.unit} · Reorder at ${i.min}</div>
      </div>
      <span class="chip chip-low">LOW</span>
    </div>
  `).join('') : '<div class="empty-note">All stock levels healthy.</div>';

  // 4. Incoming Requisitions (async call)
  svc.getKitchenRequisitions().then(reqs => {
    const pending = reqs.filter(r => r.status === 'Pending' || r.status === 'Partial').slice(0, 5);
    document.getElementById('incomingReqs').innerHTML = pending.length ? pending.map(r => `
      <a class="list-row" href="kitchen-requisition-history.html">
        <div class="list-ic ic-blue"><i class="fa-solid fa-file-invoice"></i></div>
        <div class="list-body">
          <div class="list-name">${esc(r.no)} — Requisition</div>
          <div class="list-meta">${r.items.length} items · Raised ${r.dateRaisedDisplay || r.dateRaised}</div>
        </div>
        <span class="chip" style="background:var(--blue-bg);color:var(--blue)">${r.status}</span>
      </a>
    `).join('') : '<div class="empty-note">No incoming requisitions from Store.</div>';
    
    // Update badge in shell
    if(window.currentShell) window.currentShell.setReqHistBadge(pending.length);
  });
}

async function init(){
  // Initialize UI Shell
  window.currentShell = KitchenShell.attach({
    sidebarTarget: '#sidebarSlot',
    topbarTarget:  '#topbarSlot',
    activeFile:    'kitchen-dashboard.html',
    pageTitle:     'Kitchen Dashboard',
    pageSubtitle:  'Operations & Production Overview'
  });

  if(!svc) {
    console.error("KitchenService not found!");
    return;
  }

  // Load Data
  await svc.loadAll();
  paint();
  
  // Listen for changes (like in Store)
  svc.onChange(paint);
}

window.addEventListener('load', init);
</script>
</body>
</html>
