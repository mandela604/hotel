<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Overview | Aurum Hotel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Same palette + Segoe UI font stack + Font Awesome icon system as
   restaurant-dashboard.html / restaurant-inventory.html. Sidebar +
   topbar look/markup live entirely in aurum-shell.js; this page just
   owns the content area, which stays permanently on this light theme
   (no dark/light toggle here — matches the rest of the module suite). */
:root {
  --radius: 14px; --radius-sm: 10px; --transition: 0.3s cubic-bezier(.4,0,.2,1);
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
  --border:#eef0f6; --border2:#dfe3ec;
  --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
  --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
  --green:#12b76a; --green-bg:#e9f9f0;
  --red:#f04438; --red-bg:#feecec;
  --amber:#f79009; --amber-bg:#fff4e5;
  --blue:#2f6fed; --blue-bg:#eaf1ff;
  --purple:#8b5cf6; --purple-bg:#f4efff;
  --cyan:#06b6d4; --cyan-bg:rgba(6,182,212,0.12);
}
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  font-size:13px; background:var(--bg); color:var(--text);
  display:flex; min-height:100vh;
}

/* ═══ MAIN — sidebar/topbar chrome comes from aurum-shell.js ═══ */
.main { margin-left:256px; flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh; transition:margin-left var(--transition); }
body.aur-sb-collapsed .main { margin-left:68px; }
@media (max-width:768px) { .main { margin-left:0 !important; } }
.content { flex:1; padding:20px 24px 28px; min-width:0; display:flex; flex-direction:column; gap:16px; background:var(--bg); color:var(--text); }
@media (max-width:480px) { .content { padding:16px 14px 22px; } }

/* Welcome banner */
.welcome-banner{ background:linear-gradient(135deg, var(--gold-dim), transparent 65%); border:1px solid var(--gold-border); border-radius:var(--radius); padding:18px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; box-shadow:var(--shadow); }
.welcome-text .wt-hi{ font-size:19px; font-weight:800; color:var(--text); }
.welcome-text .wt-sub{ font-size:12.5px; color:var(--text3); margin-top:3px; }
.welcome-date{ text-align:right; font-size:12px; color:var(--text2); }
.welcome-date b{ display:block; font-size:15px; font-weight:800; color:var(--gold); }

.section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; flex-wrap:wrap; gap:8px; }
.section-title{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); font-weight:700; }
.section-link{ font-size:12px; color:var(--gold); font-weight:700; cursor:pointer; background:none; border:none; text-decoration:none; font-family:inherit; }
.section-link:hover{ color:var(--gold-light); }

/* ═══ KPI CARDS — same kpi-top/kpi-ic/acc-* system as every other module ═══ */
.kpi-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
@media (max-width:1200px){ .kpi-grid{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:700px){ .kpi-grid{ grid-template-columns:1fr 1fr; gap:10px; } }
.kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); cursor:pointer; transition:transform .2s,box-shadow .2s,border-color .2s; text-decoration:none; display:flex; flex-direction:column; animation:fadeUp .4s ease both; }
.kpi-card:nth-child(1){animation-delay:.03s} .kpi-card:nth-child(2){animation-delay:.06s} .kpi-card:nth-child(3){animation-delay:.09s}
.kpi-card:nth-child(4){animation-delay:.12s} .kpi-card:nth-child(5){animation-delay:.15s}
.kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
.kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
.kpi-card.acc-green::before{ background:linear-gradient(90deg,var(--green),transparent); }
.kpi-card.acc-blue::before{ background:linear-gradient(90deg,var(--blue),transparent); }
.kpi-card.acc-red::before{ background:linear-gradient(90deg,var(--red),transparent); }
.kpi-card.acc-purple::before{ background:linear-gradient(90deg,var(--purple),transparent); }
.kpi-card.acc-amber::before{ background:linear-gradient(90deg,var(--amber),transparent); }
.kpi-card.acc-cyan::before{ background:linear-gradient(90deg,var(--cyan),transparent); }
.kpi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
.kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.ic-blue{ background:var(--blue-bg); color:var(--blue); }
.ic-green{ background:var(--green-bg); color:var(--green); }
.ic-amber{ background:var(--amber-bg); color:var(--amber); }
.ic-purple{ background:var(--purple-bg); color:var(--purple); }
.ic-red{ background:var(--red-bg); color:var(--red); }
.ic-cyan{ background:var(--cyan-bg); color:var(--cyan); }
.kpi-label{ font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
.kpi-value{ font-size:22px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
@media (max-width:420px){ .kpi-value{ font-size:18px; } }
.kpi-trend{ font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
.kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); }

.two-col{ display:grid; grid-template-columns:1.3fr .7fr; gap:14px; }
@media (max-width:960px){ .two-col{ grid-template-columns:1fr; } }

/* ═══ PANEL — same panel/panel-head/panel-title pattern as every module ═══ */
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
.panel-title{ font-size:13px; font-weight:800; color:var(--text); display:flex; align-items:center; gap:8px; }
.panel-action{ font-size:11.5px; color:var(--gold); font-weight:700; cursor:pointer; background:none; border:none; text-decoration:none; font-family:inherit; display:inline-flex; align-items:center; gap:5px; }
.panel-action:hover{ color:var(--gold-light); }
.panel-body{ padding:16px 20px; }

/* Revenue bars */
.rev-total{ font-size:26px; font-weight:800; color:var(--gold); line-height:1; }
.rev-sub{ font-size:11px; color:var(--text3); margin:4px 0 16px; }
.bar-row{ margin-bottom:12px; } .bar-row:last-child{ margin-bottom:0; }
.bar-meta{ display:flex; justify-content:space-between; margin-bottom:5px; }
.bar-name{ font-size:12.5px; color:var(--text2); } .bar-count{ font-size:11.5px; color:var(--text3); font-weight:600; }
.bar-track{ height:6px; background:var(--surface3); border-radius:20px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:20px; transition:width 1.2s cubic-bezier(.4,0,.2,1); }
.bar-fill.rooms{ background:linear-gradient(90deg,var(--gold),var(--gold-light)); }
.bar-fill.rest{ background:linear-gradient(90deg,#60a5fa,#93c5fd); }
.bar-fill.pool{ background:linear-gradient(90deg,#12b76a,#6ee7b7); }

/* Room status snapshot */
.room-status-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.rs-card{ background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; position:relative; overflow:hidden; }
.rs-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; }
.rs-card.occ::before{ background:var(--gold); } .rs-card.vac::before{ background:var(--green); }
.rs-card.dirty::before{ background:var(--amber); } .rs-card.maint::before{ background:var(--red); }
.rs-lbl{ font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); margin-bottom:5px; font-weight:700; }
.rs-val{ font-size:20px; font-weight:800; }
.rs-card.occ .rs-val{ color:var(--gold); } .rs-card.vac .rs-val{ color:var(--green); }
.rs-card.dirty .rs-val{ color:var(--amber); } .rs-card.maint .rs-val{ color:var(--red); }

/* Activity feed — same list-row pattern as restaurant-dashboard.html */
.act-list{ display:flex; flex-direction:column; }
.act-item{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.act-item:last-child{ border-bottom:none; padding-bottom:0; }
.act-item:hover .act-text{ color:var(--gold); }
.act-ic{ width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; margin-top:1px; }
.act-text{ font-size:12.5px; color:var(--text); line-height:1.4; transition:color .15s; }
.act-time{ font-size:11px; color:var(--text3); margin-top:1px; }

.chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; flex-shrink:0; }
.chip i{ font-size:6px; }
.chip-ok{ background:var(--green-bg); color:var(--green); }
.chip-warn{ background:var(--amber-bg); color:var(--amber); }
.chip-bad{ background:var(--red-bg); color:var(--red); }

.empty-note{ font-size:12.5px; color:var(--text3); padding:14px 0; text-align:center; }

::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }
@keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

@media print{ #sidebarSlot,#topbarSlot,.no-print{ display:none !important; } .main{ margin-left:0 !important; } body{ background:#fff !important; color:#000 !important; } .panel{ box-shadow:none !important; border:1px solid #ccc !important; } }
</style>
</head>
<body>

<!-- Sidebar rendered here by aurum-shell.js -->
<div id="sidebarSlot"></div>

<div class="main" id="mainWrap">
  <!-- Topbar rendered here by aurum-shell.js -->
  <div id="topbarSlot"></div>

  <div class="content">

    <div class="welcome-banner">
      <div class="welcome-text">
        <div class="wt-hi" id="welcomeHi">Good day, General Manager</div>
        <div class="wt-sub">Here's how Aurum Hotel is running across every department right now.</div>
      </div>
      <div class="welcome-date"><b id="welcomeDate"></b><span id="welcomeTime"></span></div>
    </div>

    <!-- KPI ROW -->
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- Revenue + Room Status -->
    <div class="two-col">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title"><i class="fa-solid fa-sack-dollar" style="color:var(--gold)"></i> Revenue by Department — Today</div>
          <a class="panel-action" href="accounting/accounting-dashboard.html">Full Report <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div class="panel-body">
          <div class="rev-total" id="revTotal">₦0</div>
          <div class="rev-sub">Across all revenue-generating modules</div>
          <div id="revBars"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title"><i class="fa-solid fa-bed" style="color:var(--gold)"></i> Room Status Snapshot</div>
          <a class="panel-action" href="booking/booking-dashboard.html">Booking <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div class="panel-body">
          <div class="room-status-grid" id="roomStatusGrid"></div>
        </div>
      </div>
    </div>

    <!-- Recent Activity — now spans the full width of its own row -->
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><i class="fa-solid fa-bolt" style="color:var(--gold)"></i> Recent Activity — All Departments</div>
        <span class="panel-action" id="actCount">—</span>
      </div>
      <div class="panel-body">
        <div class="act-list" id="activityList"></div>
      </div>
    </div>

  </div>
</div>

<script src="component/data-store.js"></script>
<script>
/* ═══════════════════════════════════════
   DATA — reads from the unified DataStore,
    which reads from the unified DataStore.
═══════════════════════════════════════ */
function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function fmtNShort(n){ n = Math.round(n||0); if (n>=1000000) return '₦'+(n/1000000).toFixed(1)+'M'; if (n>=1000) return '₦'+(n/1000).toFixed(0)+'k'; return '₦'+n.toLocaleString('en-NG'); }

/* ═══════════════════════════════════════
   KPIs — same kpi-top/kpi-ic/acc-* markup as every other module page
═══════════════════════════════════════ */
function renderKPIs(roomRev, restRev, poolRev, rooms, procPending, lowStock){
  const r = rooms || { total:0, occupied:0, vacant:0, dirty:0, maintenance:0 };
  const occPct = r.total > 0 ? Math.round(r.occupied / r.total * 100) : 0;

  document.getElementById('kpiGrid').innerHTML = `
    <a class="kpi-card acc-blue" href="accounting/accounting-dashboard.html">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Today's Revenue</div></div>
      <div class="kpi-value" style="color:var(--blue);">${fmtNShort(roomRev + restRev + poolRev)}</div>
      <div class="kpi-trend up">Across Rooms, Restaurant &amp; Pool Bar</div>
    </a>
    <a class="kpi-card acc-green" href="booking/booking-dashboard.html">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-bed"></i></div><div class="kpi-label">Occupancy Rate</div></div>
      <div class="kpi-value" style="color:var(--green);">${occPct}%</div>
      <div class="kpi-trend neutral">${r.occupied} of ${r.total} rooms occupied</div>
    </a>
    <a class="kpi-card acc-purple" href="booking/guests.html">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-user"></i></div><div class="kpi-label">Guests In-House</div></div>
      <div class="kpi-value" style="color:var(--purple);">${r.occupied}</div>
      <div class="kpi-trend neutral">Checked in right now</div>
    </a>
    <a class="kpi-card acc-cyan" href="procurement/procurement-dashboard.html">
      <div class="kpi-top"><div class="kpi-ic ic-cyan"><i class="fa-solid fa-box"></i></div><div class="kpi-label">Procurement In Chain</div></div>
      <div class="kpi-value" style="color:var(--cyan);">${procPending}</div>
      <div class="kpi-trend warn">Awaiting approval</div>
    </a>
    <a class="kpi-card acc-amber" href="kitchen/kitchen-dashboard.html">
      <div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="kpi-label">Low Stock Alerts</div></div>
      <div class="kpi-value" style="color:${lowStock>0?'var(--amber)':'var(--text)'};">${lowStock}</div>
      <div class="kpi-trend ${lowStock>0?'warn':'up'}">${lowStock>0?'Kitchen ingredients low':'All stocked'}</div>
    </a>`;
}

/* ═══════════════════════════════════════
   REVENUE BARS
═══════════════════════════════════════ */
function renderRevenue(roomRev, restRev, poolRev){
  const total = roomRev + restRev + poolRev;
  const max = Math.max(total, 1);
  document.getElementById('revTotal').textContent = fmtN(total);
  document.getElementById('revBars').innerHTML = `
    <div class="bar-row">
      <div class="bar-meta"><span class="bar-name"><i class="fa-solid fa-bed" style="color:var(--text3);margin-right:5px;"></i>Rooms</span><span class="bar-count">${fmtN(roomRev)}</span></div>
      <div class="bar-track"><div class="bar-fill rooms" style="width:${Math.round(roomRev/max*100)}%"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-meta"><span class="bar-name"><i class="fa-solid fa-utensils" style="color:var(--text3);margin-right:5px;"></i>Restaurant / Bar</span><span class="bar-count">${fmtN(restRev)}</span></div>
      <div class="bar-track"><div class="bar-fill rest" style="width:${Math.round(restRev/max*100)}%"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-meta"><span class="bar-name"><i class="fa-solid fa-glass-water" style="color:var(--text3);margin-right:5px;"></i>Pool Bar</span><span class="bar-count">${fmtN(poolRev)}</span></div>
      <div class="bar-track"><div class="bar-fill pool" style="width:${Math.round(poolRev/max*100)}%"></div></div>
    </div>`;
}

/* ═══════════════════════════════════════
   ROOM STATUS
═══════════════════════════════════════ */
function renderRoomStatus(rooms){
  const r = rooms || { total:0, occupied:0, vacant:0, dirty:0, maintenance:0 };
  document.getElementById('roomStatusGrid').innerHTML = `
    <div class="rs-card occ"><div class="rs-lbl">Occupied</div><div class="rs-val">${r.occupied}</div></div>
    <div class="rs-card vac"><div class="rs-lbl">Vacant &amp; Ready</div><div class="rs-val">${r.vacant}</div></div>
    <div class="rs-card dirty"><div class="rs-lbl">Needs Housekeeping</div><div class="rs-val">${r.dirty}</div></div>
    <div class="rs-card maint"><div class="rs-lbl">Under Maintenance</div><div class="rs-val">${r.maintenance}</div></div>`;
}

/* ═══════════════════════════════════════
   ACTIVITY FEED — colored icon box per department, same act-ic
   pattern as the kpi-ic boxes elsewhere on this page.
═══════════════════════════════════════ */
const ACT_ICON = { Booking:'fa-bed', Kitchen:'fa-kitchen-set', Restaurant:'fa-utensils', 'Pool Bar':'fa-glass-water', Accounting:'fa-chart-column', Staff:'fa-user-clock' };
const ACT_CLASS = { gold:'ic-blue', purple:'ic-purple', blue:'ic-blue', green:'ic-green', amber:'ic-amber' };

function renderActivity(activity){
  const a = (activity && activity.length) ? activity : [];
  document.getElementById('actCount').textContent = a.length + ' updates';
  document.getElementById('activityList').innerHTML = a.length
    ? a.map(item => `
    <div class="act-item" onclick="location.href='${item.href}'">
      <span class="act-ic ${ACT_CLASS[item.color]||'ic-blue'}"><i class="fa-solid ${ACT_ICON[item.dept]||'fa-circle-info'}"></i></span>
      <div><div class="act-text">${item.text}</div><div class="act-time">${item.dept} · ${item.time}</div></div>
    </div>`).join('')
    : '<div class="empty-note">No activity yet.</div>';
}

/* ═══════════════════════════════════════
   INIT — loads live data from DataStore
═══════════════════════════════════════ */
async function init(){
  const now = new Date();
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

  // Get logged-in user
  let userName = 'Guest';
  try { const raw = localStorage.getItem('aurum_user'); if (raw) { const u = JSON.parse(raw); if (u && u.name) userName = u.name; } } catch (e) {}

  document.getElementById('welcomeHi').textContent = `${greeting}, ${userName}`;
  document.getElementById('welcomeDate').textContent = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('welcomeTime').textContent = now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

  // Load data from DataStore (no demo fallbacks — show real data or zeros)
  const roomTx    = await DataStore.get('ds_accounting_room_tx').catch(() => null) || [];
  const restSales = await DataStore.get('ds_restaurant_sales').catch(() => null) || [];
  const poolSales = await DataStore.get('ds_poolbar_sales').catch(() => null) || [];
  const activity  = await DataStore.get(DataStore.ACTIVITY_KEY).catch(() => null);
  const rooms     = await DataStore.get('ds_bookings_rooms').catch(() => null) || [];
  const prs       = await DataStore.get('ds_procurement_prs').catch(() => null) || [];
  const kitchenInv = await DataStore.get('ds_kitchen_inventory').catch(() => null) || [];

  // Compute room stats from live data
  const totalRooms = rooms.length;
  const occupiedRooms = rooms.filter(r => r.status === 'occupied').length;
  const vacantRooms = rooms.filter(r => r.status === 'available').length;
  const dirtyRooms = rooms.filter(r => r.status === 'dirty' || r.status === 'cleaning').length;
  const maintRooms = rooms.filter(r => r.status === 'maintenance' || r.status === 'out_of_service').length;
  const roomsData = { total: totalRooms, occupied: occupiedRooms, vacant: vacantRooms, dirty: dirtyRooms, maintenance: maintRooms };

  const roomRev = roomTx.reduce((s,t)=>s+(t.amount||0), 0);
  const restRev = restSales.filter(s=>s.status!=='voided').reduce((s,t)=>s+(t.total||0), 0);
  const poolRev = poolSales.reduce((s,t)=>s+(t.total||0), 0);

  const procPending = prs.filter(p => p.status === 'pending' || p.status === 'accountant' || p.status === 'gm').length;
  const lowStock = kitchenInv.filter(i => i.qty <= i.reorder).length;

  renderKPIs(roomRev, restRev, poolRev, roomsData, procPending, lowStock);
  renderRevenue(roomRev, restRev, poolRev);
  renderRoomStatus(roomsData);
  renderActivity(activity);
}

/* ── Boot: init DataStore, then render ──
   The root route (/ ) always serves login.html, so reaching this
   dashboard page only happens after a successful login. No extra
   client-side session redirect here — same simple pattern as the rest
   of the suite. */
(async function boot() {
  await DataStore.init();
  init();
})();
</script>

<!-- Platform menu shell — shared sidebar + topbar across all Aurum Hotel pages -->
<script src="component/aurum-shell.js"></script>
<script>
  const _user = (function(){ try{ const v = JSON.parse(localStorage.getItem('aurum_user')); return (v && v.name) ? v : null; }catch(e){ return null; } })() || {name:'Guest',initials:'G'};
  const shell = AurumShell.attach({
    sidebarTarget: '#sidebarSlot',
    topbarTarget:  '#topbarSlot',
    activeFile:    'index.html',
    pageTitle:     'Overview',
    apiMode:       'Live',
    user:          { name: _user.name, initials: _user.initials || 'G' },
  });
</script>
</body>
</html>
