<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transactions | Accounting — Aurum Hotel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   This page now follows the exact same split every other Accounting
   page uses: sidebar + topbar are owned entirely by accounting-shell.js
   (dropped in via #sidebarSlot / #topbarSlot below), and this page only
   owns the light-themed .content area, which re-declares the same CSS
   variable NAMES with light values so only the main content + its
   modal turn white while the sidebar/topbar stay on their own theme.
   Same Segoe UI stack, Font Awesome icon set, kpi-top/kpi-ic KPI
   cards, status-pill/status-chip filters, and panel/table/pagination
   system as accounting-reconciliation.html / accounting-reports.html. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --radius: 14px; --radius-sm: 10px; --transition: .3s cubic-bezier(.4,0,.2,1); }
html{ height:auto; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  font-size: 13px; min-height:100vh; transition:background .3s,color .3s;
}
.app { display: block; }
.main{ margin-left:250px; min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
@media (max-width:768px){ .main{ margin-left:0 !important; } }

/* ══ Light-theme content area, scoped to .content + .modal-overlay ══ */
.content, .modal-overlay {
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f4f6fb; --surface3:#eef0f6;
  --border:#eef0f6; --border2:#dfe3ec;
  --text:#1c2440; --text2:#6b7280; --text3:#9aa1b3;
  --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  --input-bg:#f4f6fb; --modal-bg:#ffffff;
  --gold:#2f6fed; --gold-light:#5b8ff9; --gold-dim:rgba(47,111,237,0.10); --gold-border:rgba(47,111,237,0.25);
  --green:#12b76a; --green-bg:#e9f9f0;
  --red:#f04438; --red-bg:#feecec;
  --amber:#f79009; --amber-bg:#fff4e5;
  --blue:#2f6fed; --blue-bg:#eaf1ff;
  --purple:#8b5cf6; --purple-bg:#f4efff;
}
.content {
  flex:1; padding:20px 24px 28px; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; gap:16px; min-height:0;
  background:var(--bg); color:var(--text);
}
@media (max-width:640px){ .content{ padding:16px 14px 22px; } }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ══ KPI CARDS ══ */
.kpi-row { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; flex-shrink:0; }
@media (max-width:1150px){ .kpi-row{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:640px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:380px){ .kpi-row{ grid-template-columns:1fr; } }
.kpi-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s, border-color .2s; display:flex; flex-direction:column; cursor:pointer; animation:fadeUp .4s ease both; }
.kpi-card:nth-child(1){animation-delay:.03s} .kpi-card:nth-child(2){animation-delay:.06s}
.kpi-card:nth-child(3){animation-delay:.09s} .kpi-card:nth-child(4){animation-delay:.12s} .kpi-card:nth-child(5){animation-delay:.15s}
.kpi-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
.kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
.kpi-card.acc-green::before { background:linear-gradient(90deg,var(--green),transparent); }
.kpi-card.acc-amber::before { background:linear-gradient(90deg,var(--amber),transparent); }
.kpi-card.acc-red::before { background:linear-gradient(90deg,var(--red),transparent); }
.kpi-card.acc-purple::before { background:linear-gradient(90deg,var(--purple),transparent); }
.kpi-top { display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
.kpi-ic { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.ic-blue { background:var(--blue-bg); color:var(--blue); }
.ic-green { background:var(--green-bg); color:var(--green); }
.ic-amber { background:var(--amber-bg); color:var(--amber); }
.ic-red { background:var(--red-bg); color:var(--red); }
.ic-purple { background:var(--purple-bg); color:var(--purple); }
.kpi-label { font-size:11px; color:var(--text2); font-weight:600; line-height:1.3; }
.kpi-value { font-size:21px; font-weight:800; color:var(--text); margin:4px 0 2px; line-height:1; }
@media (max-width:420px){ .kpi-value{ font-size:17px; } }
.kpi-trend { font-size:10.5px; font-weight:600; color:var(--text3); margin-top:auto; }
.kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); }

/* ══ TOOLBAR ══ */
.toolbar { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
.toolbar-row { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
.toolbar-row.top { justify-content:space-between; }
.toolbar-left { display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
.toolbar-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.flt-group { display:flex; flex-direction:column; gap:4px; min-width:0; }
.flt-label { font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:700; padding-left:2px; }
.search-box { display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; transition:border-color .2s; min-width:190px; max-width:270px; flex:1; }
.search-box:focus-within { border-color:var(--gold-border); }
.search-box input { background:none; border:none; outline:none; color:var(--text); font-family:inherit; font-size:13px; width:100%; }
.search-box input::placeholder { color:var(--text3); }
.filter-sel, input[type="date"].filter-sel { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-family:inherit; font-size:12.5px; cursor:pointer; outline:none; transition:border-color .2s; color-scheme:light; }
.filter-sel:focus { border-color:var(--gold-border); }
.btn-ghost { background:none; border:none; color:var(--text3); font-family:inherit; font-size:11.5px; font-weight:700; cursor:pointer; padding:8px 6px; display:inline-flex; align-items:center; gap:5px; }
.btn-ghost:hover { color:var(--gold); }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
.btn-primary { background:var(--gold); color:#fff; box-shadow:0 4px 10px rgba(47,111,237,0.28); }
.btn-primary:hover { background:var(--gold-light); transform:translateY(-1px); }
.btn-outline { background:var(--surface); border-color:var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--gold); color:var(--gold); }
.btn-sm { padding:6px 12px; font-size:11.5px; }

.status-chips { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
.status-chips::-webkit-scrollbar{ height:0; }
.sc-btn { flex-shrink:0; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:11.5px; font-weight:700; color:var(--text2); cursor:pointer; transition:all .2s; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
.sc-btn i { font-size:6px; }
.sc-btn:hover, .sc-btn.active { background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }

@media (max-width:760px){
  .toolbar-row.top{ flex-direction:column; align-items:stretch; }
  .toolbar-left{ flex-direction:column; align-items:stretch; }
  .toolbar-actions{ width:100%; }
  .toolbar-actions .btn{ flex:1; justify-content:center; }
  .search-box{ max-width:100%; }
  .filter-sel{ width:100%; }
}

/* ══ PANEL / TABLE ══ */
.panel { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; flex-shrink:0; }
.panel-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
.panel-title { font-size:14px; font-weight:800; color:var(--text); }
.panel-count { font-size:11.5px; color:var(--text3); font-weight:600; white-space:nowrap; }
.tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:12.5px; min-width:940px; }
thead th { text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; }
thead th.no-sort{ cursor:default; }
thead th.right{ text-align:right; }
thead th .sort-arrow{ font-size:9px; margin-left:3px; opacity:.6; }
tbody tr { border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:var(--surface2); }
tbody td { padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
tbody td.right{ text-align:right; }
.empty-row td { text-align:center; padding:34px; color:var(--text3); font-weight:600; cursor:default; white-space:normal; }

.txn-id { color:var(--gold); font-weight:700; }
.dept-chip, .chip { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; white-space:nowrap; }
.dept-chip i, .chip i { font-size:6px; }
.dept-restaurant { background:var(--green-bg); color:var(--green); }
.dept-bar { background:var(--purple-bg); color:var(--purple); }
.dept-poolbar { background:var(--blue-bg); color:var(--blue); }
.dept-rooms { background:var(--gold-dim); color:var(--gold); }
.dept-gym { background:var(--amber-bg); color:var(--amber); }
.chip-completed { background:var(--green-bg); color:var(--green); }
.chip-pending { background:var(--amber-bg); color:var(--amber); }
.chip-voided { background:var(--red-bg); color:var(--red); }
.pay-chip { background:var(--gold-dim); color:var(--gold); }
.desc-cell { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
.desc-sub { font-size:10.5px; color:var(--text3); margin-top:1px; }

.act-btn { background:none; border:1px solid var(--border); border-radius:7px; padding:5px 11px; font-size:11px; font-weight:700; color:var(--text2); cursor:pointer; transition:all .15s; font-family:inherit; }
.act-btn:hover { border-color:var(--gold-border); color:var(--gold); }

/* ══ SUMMARY BAR ══ */
.summary-bar { display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface2); border-top:1px solid var(--border); }
@media (max-width:560px){ .summary-bar{ grid-template-columns:1fr 1fr; } }
.sb-item { text-align:center; padding:12px 12px; border-right:1px solid var(--border); }
.sb-item:last-child { border-right:none; }
@media (max-width:560px){ .sb-item:nth-child(2){ border-right:none; } }
.sb-lbl { font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); margin-bottom:3px; font-weight:700; }
.sb-val { font-size:16.5px; font-weight:800; color:var(--text); }

/* ══ PAGINATION ══ */
.pagination { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:12px; color:var(--text3); flex-wrap:wrap; gap:8px; font-weight:600; }
.page-btns { display:flex; gap:3px; flex-wrap:wrap; }
.page-btn { min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; transition:all .15s; font-family:inherit; padding:0 7px; font-weight:600; }
.page-btn:hover { border-color:var(--gold-border); color:var(--gold); }
.page-btn.active { background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:700; }
.page-btn:disabled { opacity:.3; cursor:default; pointer-events:none; }

/* ══ MODAL ══ */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,20,40,0.55); backdrop-filter:blur(5px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; }
.modal-overlay.show { display:flex; }
.modal { background:var(--modal-bg); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(560px,96vw); box-shadow:0 30px 80px rgba(15,20,40,0.25); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; position:relative; overflow:hidden; }
.modal::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
@keyframes modalIn { from{opacity:0;transform:translateY(14px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }
.modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.modal-title { font-size:18px; font-weight:800; color:var(--text); }
.modal-close { background:var(--surface2); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; color:var(--text2); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
.modal-close:hover { border-color:var(--red); color:var(--red); }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-bottom:16px; }
@media (max-width:460px){ .detail-grid{ grid-template-columns:1fr; } }
.detail-item.span2{ grid-column:span 2; }
@media (max-width:460px){ .detail-item.span2{ grid-column:span 1; } }
.detail-label { font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:700; }
.detail-value { font-size:13.5px; color:var(--text); font-weight:600; margin-top:3px; }
.modal-footer { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }

/* ══ TOAST ══ */
.toast { position:fixed; bottom:20px; right:20px; background:#ffffff; border:1px solid #eef0f6; border-radius:10px; padding:11px 16px; font-size:13px; color:#1c2440; box-shadow:0 8px 28px rgba(15,20,40,0.18); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); font-weight:600; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; }
.toast.success { border-left:3px solid #12b76a; } .toast.success i{ color:#12b76a; }
.toast.info { border-left:3px solid #2f6fed; } .toast.info i{ color:#2f6fed; }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2,#dfe3ec); border-radius:6px; }

@media print {
  #acc-sidebar, #acc-topbar, .toolbar, .status-chips, .pagination, .no-print { display:none !important; }
  .main{ margin-left:0 !important; }
  body { background:#fff !important; color:#000 !important; }
  .panel { box-shadow:none !important; border:1px solid #ccc !important; }
}
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar is rendered here by accounting-shell.js -->
  <div id="sidebarSlot"></div>

  <div class="main">
    <!-- Topbar is rendered here by accounting-shell.js -->
    <div id="topbarSlot"></div>

    <div class="content">

      <div class="kpi-row" id="kpiRow"></div>

      <!-- ══ FILTER BAR ══ -->
      <div class="toolbar no-print">
        <div class="toolbar-row top">
          <div class="toolbar-left">
            <div class="flt-group" style="flex:1;min-width:200px;max-width:280px;">
              <span class="flt-label">Search</span>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--text3);font-size:12px;"></i>
                <input type="text" id="fSearch" placeholder="Txn ID, description, staff…" oninput="page=1;render()">
              </div>
            </div>
            <div class="flt-group">
              <span class="flt-label">Department</span>
              <select class="filter-sel" id="fDept" onchange="page=1;render()">
                <option value="">All Departments</option>
                <option value="Restaurant">Restaurant</option>
                <option value="Bar">Bar</option>
                <option value="Pool Bar">Pool Bar</option>
                <option value="Rooms">Rooms</option>
                <option value="Gym">Gym</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">Payment</span>
              <select class="filter-sel" id="fMethod" onchange="page=1;render()">
                <option value="">All Payments</option>
                <option>Cash</option><option>POS</option><option>Transfer</option>
                <option>Room Charge</option><option>Complimentary</option>
              </select>
            </div>
            <div class="flt-group">
              <span class="flt-label">From</span>
              <input type="date" class="filter-sel" id="fFrom" onchange="page=1;render()">
            </div>
            <div class="flt-group">
              <span class="flt-label">To</span>
              <input type="date" class="filter-sel" id="fTo" onchange="page=1;render()">
            </div>
            <div class="flt-group">
              <span class="flt-label">Sort</span>
              <select class="filter-sel" id="fSort" onchange="page=1;render()">
                <option value="date_desc">Date (Newest)</option>
                <option value="date_asc">Date (Oldest)</option>
                <option value="amount_desc">Amount (High → Low)</option>
                <option value="amount_asc">Amount (Low → High)</option>
              </select>
            </div>
            <button class="btn-ghost" onclick="clearFilters()"><i class="fa-solid fa-xmark"></i> Clear Filters</button>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
            <button class="btn btn-primary btn-sm" onclick="refreshData(true)"><i class="fa-solid fa-rotate"></i> Refresh</button>
          </div>
        </div>
        <div class="status-chips" id="statusTabs"></div>
      </div>

      <!-- ══ TABLE PANEL ══ -->
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">All Transactions</div>
          <div class="panel-count" id="tblCount">—</div>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th class="no-sort">Txn ID</th>
                <th class="no-sort">Department</th>
                <th class="no-sort">Description</th>
                <th data-sortkey="date">Date &amp; Time <span class="sort-arrow" id="arrow-date"></span></th>
                <th class="no-sort">Payment</th>
                <th data-sortkey="amount" class="right">Amount (₦) <span class="sort-arrow" id="arrow-amount"></span></th>
                <th class="no-sort">Status</th>
                <th class="no-print no-sort">Actions</th>
              </tr>
            </thead>
            <tbody id="tblBody"><tr class="empty-row"><td colspan="8"><i class="fa-solid fa-spinner fa-spin"></i> Loading transactions…</td></tr></tbody>
          </table>
        </div>
        <div class="summary-bar" id="summaryBar" style="display:none;">
          <div class="sb-item"><div class="sb-lbl">Transactions</div><div class="sb-val" id="sbCount">0</div></div>
          <div class="sb-item"><div class="sb-lbl">Gross</div><div class="sb-val" id="sbGross">₦0</div></div>
          <div class="sb-item"><div class="sb-lbl">Refunded / Voided</div><div class="sb-val" style="color:var(--red);" id="sbVoid">₦0</div></div>
          <div class="sb-item"><div class="sb-lbl">Net Revenue</div><div class="sb-val" style="color:var(--green);" id="sbNet">₦0</div></div>
        </div>
        <div class="pagination">
          <span id="paginLabel">—</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ══ TRANSACTION DETAIL MODAL ══ -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="dTitle">Transaction Detail</div>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="detail-grid" id="dGrid"></div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script src="../component/accounting-shell.js"></script>
<!-- Shared demo/seed data for this module — see file header there for why
     this exists as its own file instead of being hardcoded inline. -->
<script src="accounting-seed.js"></script>
<script>
/* ═══════════════════════════════════════════
   Shell — sidebar + topbar, same accounting-shell.js component every
   other Accounting page uses. Replaces this page's old hand-rolled
   dark sidebar/topbar markup entirely.
═══════════════════════════════════════════ */
const shell = AccountingShell.attach({
  sidebarTarget: '#sidebarSlot',

/* ═══════════════════════════════════════════════════════════════
   DATA LAYER — reads the exact same shared storage keys every other
   module in this platform already writes to (window.storage, or the
   localStorage fallback outside the Claude.ai preview), so this page
   needs no separate "accounting" data pipe. It only ever READS:
     poolbar-sales        → Pool Bar sales (Sales page)
     restaurant-sales     → Restaurant sales (Sales page)
     booking-bookings     → Room revenue (paid amounts on bookings)
     gym-members          → Membership payments (amountPaid on join)
   Falls back to the same demo seeds as every other Accounting page
   (AccountingSeed) if a key hasn't been written yet — Bookings/Gym
   aren't reconciliation concerns so their small demo seeds stay local
   to this page rather than living in accounting-seed.js.
═══════════════════════════════════════════════════════════════ */
const { DEMO_RESTAURANT_SALES, DEMO_POOLBAR_SALES } = AccountingSeed;

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
};
async function loadShared(key, fallback){
  try {
    const r = await storage.get(key, true);
    if (r && r.value) { const parsed = JSON.parse(r.value); if (Array.isArray(parsed)) return parsed; }
  } catch(e){}
  return fallback;
}

let txns = [];

const PAGE_SIZE = 10;

function fmtN(n){ return '₦' + Math.round(n||0).toLocaleString('en-NG'); }
function showToast(msg, type='success'){
  const icon = type==='success' ? 'fa-circle-check' : 'fa-circle-info';
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

/* Parses the "DD/MM/YY hh:mm AM/PM" stamp used by Restaurant/Pool Bar,
   or a plain "YYYY-MM-DD" used by Bookings/Gym, into a comparable Date. */
function parseAnyDate(str){
  if (!str) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return new Date(str + 'T00:00:00');
  const [datePart, timePart, ampm] = str.split(' ');
  if (!datePart || !datePart.includes('/')) return null;
  const [d, m, y] = datePart.split('/').map(n => parseInt(n, 10));
  let hh = 0, mm = 0;
  if (timePart) { const [h, mi] = timePart.split(':').map(n => parseInt(n, 10)); hh = h; mm = mi || 0; }
  if (ampm) { const u = ampm.toUpperCase(); if (u === 'PM' && hh < 12) hh += 12; if (u === 'AM' && hh === 12) hh = 0; }
  return new Date(2000 + y, m - 1, d, hh, mm);
}
function dateOnlyStr(dt){ if (!dt) return ''; return dt.toISOString().split('T')[0]; }
function fmtDisplayDate(dt){
  if (!dt) return '—';
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' +
         dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

/* ═══════════════════════════════════════════════════════════════
   NORMALIZE — every source is folded into one shape:
   { id, dept, deptChip, desc, sub, date(Date obj), method, amount,
     status ('completed'|'pending'|'voided'), staff, raw }
═══════════════════════════════════════════════════════════════ */
function fromPoolBar(sales){
  return sales.map(s => ({
    id: s.id, dept: 'Pool Bar', deptChip: 'dept-poolbar',
    desc: (s.items||[]).map(i=>`${i.name} ×${i.qty}`).join(', ') || 'Pool Bar Sale',
    sub: s.table || '', date: parseAnyDate(s.date), method: s.method || '—',
    amount: s.total || 0, status: s.status === 'voided' ? 'voided' : 'completed',
    staff: s.staff || '—', source: 'poolbar-sales',
  }));
}
function fromRestaurant(sales){
  return sales.map(s => ({
    id: s.id, dept: (s.items||[]).some(i => /chapman|heineken|guinness|drink|beer|wine|cocktail/i.test(i.meal||'')) ? 'Bar' : 'Restaurant',
    deptChip: (s.items||[]).some(i => /chapman|heineken|guinness|drink|beer|wine|cocktail/i.test(i.meal||'')) ? 'dept-bar' : 'dept-restaurant',
    desc: (s.items||[]).map(i=>`${i.meal} ×${i.qty}`).join(', ') || 'Restaurant Sale',
    sub: s.table || '', date: parseAnyDate(s.date), method: s.method || '—',
    amount: s.total || 0, status: s.status === 'voided' ? 'voided' : 'completed',
    staff: s.staff || '—', source: 'restaurant-sales',
  }));
}
function fromBookings(bookings){
  return bookings.filter(b => b.guest && (b.paid || 0) > 0).map(b => ({
    id: 'RM-' + b.room + '-' + (b.checkin || '').replace(/-/g,''), dept: 'Rooms', deptChip: 'dept-rooms',
    desc: `Room ${b.room} — ${b.guest}`, sub: `${b.checkin || '—'} → ${b.checkout || '—'}`,
    date: parseAnyDate(b.checkin) || new Date(), method: b.payMethod || '—',
    amount: b.paid || 0, status: b.payStatus === 'Pending' ? 'pending' : 'completed',
    staff: b.recordedBy || '—', source: 'booking-bookings',
  }));
}
function fromGym(members){
  return members.filter(m => (m.amountPaid || 0) > 0).map(m => ({
    id: 'GYM-' + m.id, dept: 'Gym', deptChip: 'dept-gym',
    desc: `Membership Payment — ${m.name}`, sub: m.planId || '',
    date: parseAnyDate(m.joined) || new Date(), method: 'Cash',
    amount: m.amountPaid || 0, status: 'completed',
    staff: 'Gym Attendant', source: 'gym-members',
  }));
}

async function refreshData(manual){
  document.getElementById('tblBody').innerHTML = `<tr class="empty-row"><td colspan="8"><i class="fa-solid fa-spinner fa-spin"></i> Loading transactions…</td></tr>`;
  try {
    const [poolbar, restaurant, bookings, gym] = await Promise.all([
      loadShared('poolbar-sales', DEMO_POOLBAR_SALES),
      loadShared('restaurant-sales', DEMO_RESTAURANT_SALES),
      loadShared('booking-bookings', DEMO_BOOKINGS),
      loadShared('gym-members', DEMO_GYM_MEMBERS),
    ]);
    txns = [
      ...fromPoolBar(poolbar),
      ...fromRestaurant(restaurant),
      ...fromBookings(bookings),
      ...fromGym(gym),
    ].filter(t => t.date);
    txns.sort((a,b) => b.date - a.date);
    renderStatusTabs();
    render();
    if (manual) showToast('Transactions refreshed from all departments.', 'success');
  } catch (err) {
    console.error('[Accounting] Failed to load transactions:', err);
    document.getElementById('tblBody').innerHTML = `<tr class="empty-row"><td colspan="8"><i class="fa-solid fa-triangle-exclamation"></i> Couldn't load transaction data.</td></tr>`;
  }
}

/* ═══════════════════════════════════════════════════════════════
   KPIs
═══════════════════════════════════════════════════════════════ */
function renderKPIs(){
  const completed = txns.filter(t => t.status === 'completed');
  const pending = txns.filter(t => t.status === 'pending');
  const voided = txns.filter(t => t.status === 'voided');
  const totalRevenue = completed.reduce((s,t)=>s+t.amount,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const todayRevenue = completed.filter(t => t.date && t.date >= today).reduce((s,t)=>s+t.amount,0);

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-ic ic-blue"><i class="fa-solid fa-receipt"></i></div><div class="kpi-label">Total Transactions</div></div>
      <div class="kpi-value">${txns.length}</div>
      <div class="kpi-trend neutral">Across all departments</div>
    </div>
    <div class="kpi-card acc-green">
      <div class="kpi-top"><div class="kpi-ic ic-green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Total Revenue</div></div>
      <div class="kpi-value" style="color:var(--green);font-size:${totalRevenue>=1000000?'17px':'21px'}">${fmtN(totalRevenue)}</div>
      <div class="kpi-trend up">${completed.length} completed sale${completed.length!==1?'s':''}</div>
    </div>
    <div class="kpi-card acc-amber">
      <div class="kpi-top"><div class="kpi-ic ic-amber"><i class="fa-solid fa-hourglass-half"></i></div><div class="kpi-label">Today's Revenue</div></div>
      <div class="kpi-value" style="color:var(--amber);">${fmtN(todayRevenue)}</div>
      <div class="kpi-trend neutral">As of today</div>
    </div>
    <div class="kpi-card acc-red">
      <div class="kpi-top"><div class="kpi-ic ic-red"><i class="fa-solid fa-ban"></i></div><div class="kpi-label">Voided / Refunded</div></div>
      <div class="kpi-value" style="color:var(--red);">${voided.length}</div>
      <div class="kpi-trend ${voided.length>0?'warn':'up'}">${voided.length>0?'Excluded from revenue':'None on record'}</div>
    </div>
    <div class="kpi-card acc-purple">
      <div class="kpi-top"><div class="kpi-ic ic-purple"><i class="fa-solid fa-clock"></i></div><div class="kpi-label">Pending Settlement</div></div>
      <div class="kpi-value" style="color:var(--purple);">${pending.length}</div>
      <div class="kpi-trend ${pending.length>0?'warn':'up'}">${pending.length>0?'Room balances due':'All settled'}</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   STATUS TABS
═══════════════════════════════════════════════════════════════ */
const STATUS_TABS = [
  {v:'', l:'All', dot:null},
  {v:'completed', l:'Completed', dot:'var(--green)'},
  {v:'pending', l:'Pending', dot:'var(--amber)'},
  {v:'voided', l:'Voided', dot:'var(--red)'},
];
function renderStatusTabs(){
  document.getElementById('statusTabs').innerHTML = STATUS_TABS.map(s => `
    <button class="sc-btn ${s.v===statusFilter?'active':''}" onclick="setStatus('${s.v}')">
      ${s.dot ? `<i class="fa-solid fa-circle" style="color:${s.dot}"></i>` : ''}${s.l}
    </button>`).join('');
}
function setStatus(s){ statusFilter = s; page = 1; renderStatusTabs(); render(); }
function clearFilters(){
  document.getElementById('fSearch').value = '';
  document.getElementById('fDept').value = '';
  document.getElementById('fMethod').value = '';
  document.getElementById('fFrom').value = '';
  document.getElementById('fTo').value = '';
  document.getElementById('fSort').value = 'date_desc';
  statusFilter = '';
  page = 1;
  renderStatusTabs();
  render();
}

/* ═══════════════════════════════════════════════════════════════
   FILTER / SORT / TABLE
═══════════════════════════════════════════════════════════════ */
function getFiltered(){
  const q = document.getElementById('fSearch').value.toLowerCase();
  const dept = document.getElementById('fDept').value;
  const method = document.getElementById('fMethod').value;
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;
  const sortVal = document.getElementById('fSort').value;
  [sortKey, sortDir] = sortVal.split('_');

  let rows = txns.filter(t => {
    const mq = !q || t.id.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.staff.toLowerCase().includes(q);
    const mDept = !dept || t.dept === dept;
    const mMethod = !method || t.method === method;
    const mStatus = !statusFilter || t.status === statusFilter;
    let mDate = true;
    if (from || to) {
      const ds = dateOnlyStr(t.date);
      if (from && ds < from) mDate = false;
      if (to && ds > to) mDate = false;
    }
    return mq && mDept && mMethod && mStatus && mDate;
  });

  rows.sort((a,b) => {
    let cmp = 0;
    if (sortKey === 'date') cmp = a.date - b.date;
    else if (sortKey === 'amount') cmp = a.amount - b.amount;
    return sortDir === 'desc' ? -cmp : cmp;
  });
  return rows;
}
function renderSortArrows(){
  ['date','amount'].forEach(k => {
    const el = document.getElementById('arrow-' + k);
    if (el) el.textContent = sortKey === k ? (sortDir === 'desc' ? '▼' : '▲') : '';
  });
}
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('th[data-sortkey]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sortkey;
      const sel = document.getElementById('fSort');
      const [curKey, curDir] = sel.value.split('_');
      const nextDir = curKey === key ? (curDir === 'desc' ? 'asc' : 'desc') : 'desc';
      sel.value = `${key}_${nextDir}`;
      page = 1; render();
    });
  });
});

function renderPagination(total){
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  const from = total === 0 ? 0 : (page-1)*PAGE_SIZE + 1;
  const to = Math.min(page*PAGE_SIZE, total);
  document.getElementById('paginLabel').textContent = total === 0 ? 'No records' : `${from}–${to} of ${total}`;
  const wrap = document.getElementById('pageBtns');
  wrap.innerHTML = '';
  const mk = (label, p, disabled, active) => {
    const b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.innerHTML = label; b.disabled = !!disabled;
    b.onclick = () => { page = p; renderTable(); };
    return b;
  };
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-left"></i>', page-1, page===1, false));
  let start = Math.max(1, page-2), end = Math.min(totalPages, start+4); start = Math.max(1, end-4);
  for (let i=start;i<=end;i++) wrap.appendChild(mk(i, i, false, i===page));
  wrap.appendChild(mk('<i class="fa-solid fa-chevron-right"></i>', page+1, page>=totalPages, false));
}

const STATUS_CHIP = { completed:'chip-completed', pending:'chip-pending', voided:'chip-voided' };
const STATUS_LABEL = { completed:'Completed', pending:'Pending', voided:'Voided' };
const DEPT_CLASS = { Restaurant:'dept-restaurant', Bar:'dept-bar', 'Pool Bar':'dept-poolbar', Rooms:'dept-rooms', Gym:'dept-gym' };

function renderTable(){
  const rows = _filteredCache;
  document.getElementById('tblCount').textContent = rows.length + ' record' + (rows.length!==1?'s':'');
  const start = (page-1)*PAGE_SIZE;
  const pageRows = rows.slice(start, start+PAGE_SIZE);

  document.getElementById('tblBody').innerHTML = pageRows.length === 0
    ? `<tr class="empty-row"><td colspan="8">No transactions match your filters.</td></tr>`
    : pageRows.map((t, i) => `
      <tr onclick="openDetail(${start+i})">
        <td class="txn-id">${t.id}</td>
        <td><span class="dept-chip ${DEPT_CLASS[t.dept]||''}"><i class="fa-solid fa-circle"></i>${t.dept}</span></td>
        <td><div class="desc-cell">${t.desc}</div>${t.sub ? `<div class="desc-sub">${t.sub}</div>` : ''}</td>
        <td>${fmtDisplayDate(t.date)}</td>
        <td><span class="chip pay-chip"><i class="fa-solid fa-circle"></i>${t.method}</span></td>
        <td class="right" style="font-weight:700;color:${t.status==='voided'?'var(--red)':'var(--text)'};">${fmtN(t.amount)}</td>
        <td><span class="chip ${STATUS_CHIP[t.status]}"><i class="fa-solid fa-circle"></i>${STATUS_LABEL[t.status]}</span></td>
        <td class="no-print" onclick="event.stopPropagation()"><button class="act-btn" onclick="openDetail(${start+i})"><i class="fa-solid fa-eye"></i> View</button></td>
      </tr>`).join('');

  renderPagination(rows.length);
}

function renderSummaryBar(rows){
  const bar = document.getElementById('summaryBar');
  if (rows.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'grid';
  const gross = rows.filter(t=>t.status!=='voided').reduce((s,t)=>s+t.amount,0);
  const voidedAmt = rows.filter(t=>t.status==='voided').reduce((s,t)=>s+t.amount,0);
  document.getElementById('sbCount').textContent = rows.length;
  document.getElementById('sbGross').textContent = fmtN(gross);
  document.getElementById('sbVoid').textContent = fmtN(voidedAmt);
  document.getElementById('sbNet').textContent = fmtN(gross);
}

function render(){
  renderKPIs();
  _filteredCache = getFiltered();
  renderSortArrows();
  renderTable();
  renderSummaryBar(_filteredCache);
}

/* ═══════════════════════════════════════════════════════════════
   DETAIL MODAL
═══════════════════════════════════════════════════════════════ */
function openDetail(idx){
  const t = _filteredCache[idx];
  if (!t) return;
  document.getElementById('dTitle').textContent = `Transaction ${t.id}`;
  document.getElementById('dGrid').innerHTML = `
    <div class="detail-item"><div class="detail-label">Department</div><div class="detail-value"><span class="dept-chip ${DEPT_CLASS[t.dept]||''}"><i class="fa-solid fa-circle"></i>${t.dept}</span></div></div>
    <div class="detail-item"><div class="detail-label">Status</div><div class="detail-value"><span class="chip ${STATUS_CHIP[t.status]}"><i class="fa-solid fa-circle"></i>${STATUS_LABEL[t.status]}</span></div></div>
    <div class="detail-item span2"><div class="detail-label">Description</div><div class="detail-value">${t.desc}${t.sub ? ' — ' + t.sub : ''}</div></div>
    <div class="detail-item"><div class="detail-label">Date &amp; Time</div><div class="detail-value">${fmtDisplayDate(t.date)}</div></div>
    <div class="detail-item"><div class="detail-label">Payment Method</div><div class="detail-value">${t.method}</div></div>
    <div class="detail-item"><div class="detail-label">Recorded By</div><div class="detail-value">${t.staff}</div></div>
    <div class="detail-item"><div class="detail-label">Amount</div><div class="detail-value" style="color:${t.status==='voided'?'var(--red)':'var(--green)'};font-size:16px;">${fmtN(t.amount)}</div></div>
  `;
  document.getElementById('detailModal').classList.add('show');
}
function closeModal(){ document.getElementById('detailModal').classList.remove('show'); }
document.getElementById('detailModal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
refreshData(false);
</script>
