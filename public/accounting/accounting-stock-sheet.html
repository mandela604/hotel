<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daily Stock Sheet | Accounting — Boston Leisure Hotel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--radius:14px;--radius-sm:10px;--bg:#f4f6fb;--surface:#fff;--surface2:#f4f6fb;
--border:#eef0f6;--border2:#dfe3ec;--text:#1c2440;--text2:#6b7280;--text3:#9aa1b3;
--gold:#2f6fed;--gold-light:#5b8ff9;--gold-dim:rgba(47,111,237,.1);--gold-border:rgba(47,111,237,.25);
--green:#12b76a;--red:#f04438;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:13px;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
.app{display:flex;min-height:100vh;width:100%;}
.main{margin-left:256px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
@media(max-width:768px){.main{margin-left:0 !important;}}
.content{flex:1;padding:20px 24px 28px;min-width:0;display:flex;flex-direction:column;gap:16px;}
@media(max-width:480px){.content{padding:16px 14px 22px;}}
.print-header{display:none;}
.print-header h2{font-size:18px;} .print-header p{font-size:11px;color:#555;margin-top:3px;}
.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 4px 20px rgba(15,34,55,.07);}
.flt-group{display:flex;flex-direction:column;gap:5px;}
.flt-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);font-weight:700;}
.form-select,.form-input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:12.5px;color:var(--text);outline:none;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid transparent;}
.btn-primary{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn-primary:hover{background:var(--gold-light);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--gold-border);color:var(--gold);}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 20px rgba(15,34,55,.07);overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px;flex-wrap:wrap;gap:8px;}
.panel-title{font-size:14px;font-weight:800;} .panel-sub{font-size:11.5px;color:var(--text3);font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:10px 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;}
tr.total-row td{font-weight:800;background:var(--surface2);border-top:2px solid var(--gold);}
.empty{text-align:center;padding:28px;color:var(--text3);}
.toast{position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:12.5px;box-shadow:0 8px 28px rgba(15,20,40,.18);z-index:9999;font-weight:600;}
.toast.success{border-left:3px solid var(--green);} .toast.error{border-left:3px solid var(--red);}
@media print{
  #sidebarSlot,#topbarSlot,.toolbar,.no-print{display:none !important;}
  .main{margin-left:0 !important;} .content{padding:0 !important;}
  body{background:#fff !important;color:#000 !important;}
  .panel{box-shadow:none !important;border:1px solid #ccc !important;}
  .print-header{display:block !important;margin-bottom:14px;}
}
</style>
</head>
<body>
<div class="app">
<div id="sidebarSlot"></div>
<div class="main">
<div id="topbarSlot"></div>
<div class="content">
<div class="print-header"><h2>Boston Leisure Hotel — Daily Stock Sheet</h2><p id="printSub"></p></div>
<div class="toolbar no-print">
<div class="flt-group"><span class="flt-label">Department</span>
<select class="form-select" id="deptSel">
<option value="restaurant">Restaurant</option>
<option value="poolbar">Pool Bar</option>
<option value="store">Central Store</option>
<option value="kitchen">Kitchen</option>
</select></div>
<div class="flt-group"><span class="flt-label">Date</span><input class="form-input" type="date" id="dateSel"></div>
<button class="btn btn-primary" onclick="loadSheet()"><i class="fa-solid fa-rotate"></i> Load Sheet</button>
<button class="btn btn-outline" onclick="printSheet()"><i class="fa-solid fa-print"></i> Print</button>
</div>
<div class="panel">
<div class="panel-head"><div><div class="panel-title" id="sheetTitle">Daily Stock Sheet</div><div class="panel-sub" id="sheetSub">Pick a department and date.</div></div></div>
<div style="overflow-x:auto;"><table>
<thead><tr><th>Date</th><th>Item name</th><th class="num">Opening stock</th><th class="num">Added stock</th><th class="num">Total stock</th><th class="num">Selling price / unit</th><th class="num">Total sales (₦)</th><th class="num">Closing stock</th></tr></thead>
<tbody id="sheetBody"><tr><td colspan="8" class="empty">Select a date and load the sheet.</td></tr></tbody>
</table></div>
</div>
</div>
</div>
</div>
<script src="../component/Accounting-shell.js"></script>
<script>
(function(){
'use strict';
var shell = AccountingShell.attach({ sidebarTarget:'#sidebarSlot', topbarTarget:'#topbarSlot', activeFile:'accounting-stock-sheet.html', pageTitle:'Daily Stock Sheet', pageSubtitle:'Opening · added · sales · closing per item', apiMode:'Live', user:{name:'…',initials:'…'} });
function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':s); return d.innerHTML; }
function fmtN(n){ return '₦'+Math.round(Number(n)||0).toLocaleString('en-NG'); }
function fmtQ(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('en-NG'); }
function toast(m,t){ var d=document.createElement('div'); d.className='toast '+(t||'success'); d.textContent=m; document.body.appendChild(d); setTimeout(function(){d.remove();},3200); }
(function(){ var d=new Date(); document.getElementById('dateSel').value=d.toISOString().split('T')[0]; })();
window.loadSheet=async function(){
  var dept=document.getElementById('deptSel').value;
  var date=document.getElementById('dateSel').value;
  if(!date){ toast('Pick a date.','error'); return; }
  var body=document.getElementById('sheetBody');
  body.innerHTML='<tr><td colspan="8" class="empty">Loading…</td></tr>';
  try{
    var r=await fetch('/api/accounting/stock-sheet?dept='+encodeURIComponent(dept)+'&date='+encodeURIComponent(date),{credentials:'include'});
    var j=await r.json();
    if(!r.ok||!j.success) throw new Error((j&&j.error)||('Request failed ('+r.status+')'));
    var rows=j.rows||[], t=j.totals||{};
    var deptLbl={restaurant:'Restaurant',poolbar:'Pool Bar',store:'Central Store',kitchen:'Kitchen'}[dept]||dept;
    document.getElementById('sheetTitle').textContent=deptLbl+' — '+date;
    document.getElementById('sheetSub').textContent=rows.length+' item'+(rows.length!==1?'s':'');
    document.getElementById('printSub').textContent=deptLbl+' · '+date+' · '+rows.length+' items';
    body.innerHTML=rows.length?rows.map(function(x){
      return '<tr><td>'+esc(date)+'</td><td style="font-weight:700;">'+esc(x.item)+'</td>'+
      '<td class="num">'+fmtQ(x.opening)+'</td><td class="num">'+fmtQ(x.added)+'</td><td class="num">'+fmtQ(x.total)+'</td>'+
      '<td class="num">'+fmtN(x.price)+'</td><td class="num" style="font-weight:700;">'+fmtN(x.totalSales)+'</td>'+
      '<td class="num" style="font-weight:800;">'+fmtQ(x.closing)+'</td></tr>';
    }).join('')+'<tr class="total-row"><td colspan="2">TOTAL</td><td class="num">'+fmtQ(t.opening)+'</td><td class="num">'+fmtQ(t.added)+'</td><td class="num">'+fmtQ(t.total)+'</td><td class="num">—</td><td class="num">'+fmtN(t.totalSales)+'</td><td class="num">'+fmtQ(t.closing)+'</td></tr>'
    :'<tr><td colspan="8" class="empty">No stock items in this department yet.</td></tr>';
  }catch(e){ body.innerHTML='<tr><td colspan="8" class="empty">Failed: '+esc(e.message)+'</td></tr>'; }
};
window.printSheet=function(){
  document.getElementById('printSub').textContent=document.getElementById('deptSel').selectedOptions[0].text+' · '+document.getElementById('dateSel').value;
  window.print();
};
loadSheet();
})();
</script>
</body>
</html>
