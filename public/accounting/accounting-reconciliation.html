<!DOCTYPE html>
<html lang="en" data-theme="dark" style="background:#080f18;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Shift Reconciliation | Aurum Accounting</title>

<style>html,body{background:#080f18;margin:0;}</style>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>

<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --gold:#c9a84c; --gold-light:#e8c96a; --gold-dim:rgba(201,168,76,0.12); --gold-border:rgba(201,168,76,0.25);
    --green:#4ade80; --green-bg:rgba(74,222,128,0.12);
    --red:#f87171; --red-bg:rgba(248,113,113,0.12);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
  }
  [data-theme="dark"]{
    --bg:#080f18; --surface:#111e2b; --surface2:#162435; --surface3:#1c2e40;
    --border:#1e3045; --border2:#243850; --text:#e8f0f8; --text2:#a8bece; --text3:#6a8a9e;
    --input-bg:#0d1a27; --modal-bg:#0a1520;
    --shadow:0 8px 32px rgba(0,0,0,0.5); --shadow-lg:0 16px 48px rgba(0,0,0,0.6);
  }
  [data-theme="light"]{
    --bg:#eef2f7; --surface:#ffffff; --surface2:#f4f7fb; --surface3:#e8edf5;
    --border:#dce4ef; --border2:#ccd6e5; --text:#0f2237; --text2:#4a6580; --text3:#8aa0b8;
    --input-bg:#f0f4f9; --modal-bg:#f8fafc;
    --shadow:0 4px 20px rgba(15,34,55,0.07); --shadow-lg:0 8px 40px rgba(15,34,55,0.10);
  }
  html{ height:auto; }
  body{ font-family:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; transition:background .3s,color .3s; }
  .app{ display:flex; min-height:100vh; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; margin-left:250px; transition:margin-left .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width:768px){ .main{ margin-left:0 !important; } }
  .content{ flex:1; padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; }
  @media (max-width:768px){ .content{ padding:16px 16px 24px; } }
  @media (max-width:480px){ .content{ padding:14px 12px 20px; } }

  .shift-banner{ background:linear-gradient(135deg, var(--gold-dim), transparent 60%); border:1px solid var(--gold-border); border-radius:14px; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .shift-banner .sb-icon{ font-size:19px; flex-shrink:0; }
  .shift-banner .sb-text{ flex:1; min-width:220px; font-size:12px; color:var(--text2); line-height:1.5; }
  .shift-banner .sb-text b{ color:var(--gold-light); }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1000px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:112px; transition:transform .2s,box-shadow .2s,border-color .2s; animation:fadeUp .4s ease both; }
  .kpi-card:nth-child(1){animation-delay:.04s} .kpi-card:nth-child(2){animation-delay:.08s}
  .kpi-card:nth-child(3){animation-delay:.12s} .kpi-card:nth-child(4){animation-delay:.16s}
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--gold-border); }
  .kpi-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); }
  .kpi-accent{ position:absolute; bottom:-10px; right:-10px; font-size:46px; opacity:.16; line-height:1; pointer-events:none; }
  .kpi-label{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; font-weight:500; }
  .kpi-value{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--text); line-height:1; margin-bottom:6px; }
  @media (max-width:420px){ .kpi-value{ font-size:21px; } }
  .kpi-trend{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; margin-top:auto; }
  .kpi-trend.up{ color:var(--green); } .kpi-trend.warn{ color:var(--amber); } .kpi-trend.down{ color:var(--red); } .kpi-trend.neutral{ color:var(--text3); }

  .toolbar{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .toolbar-row{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; justify-content:space-between; }
  .toolbar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1; min-width:0; }
  .flt-group{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .flt-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:600; padding-left:2px; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; min-width:180px; max-width:240px; flex:1; }
  .search-box:focus-within{ border-color:var(--gold-border); }
  .search-box input{ background:none; border:none; outline:none; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text3); }
  .filter-select, .filter-date{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; color:var(--text); font-family:'Outfit',sans-serif; font-size:12.5px; cursor:pointer; outline:none; transition:border-color .2s; color-scheme:dark; }
  [data-theme="light"] .filter-date{ color-scheme:light; }
  .filter-select:focus, .filter-date:focus{ border-color:var(--gold-border); }
  .status-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-pill{ display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text2); transition:all .15s; white-space:nowrap; }
  .status-pill:hover{ border-color:var(--gold-border); }
  .status-pill .pdot{ width:6px; height:6px; border-radius:50%; }
  .status-pill.on.all{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); }
  .status-pill.on.open{ background:var(--amber-bg); border-color:rgba(251,191,36,.4); color:var(--amber); }
  .status-pill.on.reconciled{ background:var(--green-bg); border-color:rgba(74,222,128,.4); color:var(--green); }
  .status-pill.on.variance{ background:var(--red-bg); border-color:rgba(248,113,113,.4); color:var(--red); }
  .btn-ghost{ background:none; border:none; color:var(--text3); font-family:'Outfit',sans-serif; font-size:11.5px; cursor:pointer; padding:8px 6px; }
  .btn-ghost:hover{ color:var(--gold); }

  @media (max-width:700px){
    .toolbar-row.top{ flex-direction:column; align-items:stretch; }
    .toolbar-left{ flex-direction:column; align-items:stretch; }
    .flt-group{ width:100%; }
    .search-box{ max-width:100%; }
    .filter-select, .filter-date{ width:100%; }
    .status-pills{ flex-wrap:wrap; }
    .toolbar-row.top > .btn{ width:100%; justify-content:center; }
  }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .panel-title{ font-size:13px; font-weight:600; color:var(--text); }
  .tbl-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:920px; }
  thead th{ text-align:left; padding:10px 14px; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); font-weight:600; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.center{ text-align:center; }
  tbody tr{ border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface2); }
  tbody td{ padding:11px 14px; color:var(--text); vertical-align:middle; white-space:nowrap; }
  tbody td.center{ text-align:center; }
  .empty-row td{ text-align:center; padding:32px; color:var(--text3); white-space:normal; }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; white-space:nowrap; }
  .chip::before{ content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .chip-open{ background:var(--amber-bg); color:var(--amber); } .chip-open::before{ background:var(--amber); }
  .chip-ok{ background:var(--green-bg); color:var(--green); } .chip-ok::before{ background:var(--green); }
  .chip-bad{ background:var(--red-bg); color:var(--red); } .chip-bad::before{ background:var(--red); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid transparent; }
  .btn-primary{ background:var(--gold); color:#000; font-weight:600; }
  .btn-primary:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .btn-outline{ background:none; border-color:var(--border); color:var(--text2); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }
  .act-btn{ background:none; border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:11px; font-weight:600; color:var(--text2); cursor:pointer; transition:all .15s; font-family:'Outfit',sans-serif; white-space:nowrap; }
  .act-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .act-btn.reconcile{ border-color:rgba(251,191,36,.4); color:var(--amber); background:var(--amber-bg); }
  .act-btn.reconcile:hover{ border-color:var(--amber); background:rgba(251,191,36,.22); }

  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text3); flex-wrap:wrap; gap:8px; }
  .page-btns{ display:flex; gap:3px; flex-wrap:wrap; }
  .page-btn{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11.5px; transition:all .15s; font-family:'Outfit',sans-serif; padding:0 7px; }
  .page-btn:hover{ border-color:var(--gold-border); color:var(--gold); }
  .page-btn.active{ background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold); font-weight:600; }
  .page-btn:disabled{ opacity:.35; cursor:default; pointer-events:none; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:300; align-items:flex-start; justify-content:center; padding:20px 16px; overflow-y:auto; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--modal-bg); border:1px solid var(--border); border-radius:18px; padding:24px; width:min(520px,96vw); box-shadow:0 32px 80px rgba(0,0,0,0.6); animation:modalIn .22s cubic-bezier(.4,0,.2,1); margin:auto; position:relative; overflow:hidden; }
  .modal::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
  .modal.mode-ok::before{ background:var(--green); }
  .modal.mode-bad::before{ background:var(--red); }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:700; color:var(--text); }
  .modal-close{ background:none; border:none; color:var(--text3); font-size:18px; cursor:pointer; padding:4px; line-height:1; transition:color .2s; }
  .modal-close:hover{ color:var(--text); }
  .modal-meta{ font-size:12px; color:var(--text3); margin-bottom:16px; line-height:1.6; }
  .modal-meta b{ color:var(--text); }
  .breakdown-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-bottom:16px; }
  @media (max-width:460px){ .breakdown-grid{ grid-template-columns:1fr; } }
  .bd-item{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .bd-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text3); font-weight:600; margin-bottom:4px; }
  .bd-val{ font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:700; color:var(--text); }
  .form-group{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .form-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:500; }
  .form-label.req::after{ content:' *'; color:var(--red); }
  .form-input, .form-textarea{ background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; outline:none; transition:border-color .2s; width:100%; }
  .form-input:focus, .form-textarea:focus{ border-color:var(--gold-border); }
  .form-textarea{ resize:vertical; min-height:60px; }
  .variance-box{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin:12px 0 16px; text-align:center; }
  .variance-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); font-weight:600; margin-bottom:4px; }
  .variance-val{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; }
  .variance-val.ok{ color:var(--green); } .variance-val.bad{ color:var(--red); } .variance-val.neutral{ color:var(--text3); }
  .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); flex-wrap:wrap; }

  /* Reconciliation history — audit trail shown inside the View modal */
  .history-section{ margin-top:6px; }
  .history-head{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--gold); font-weight:600; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--gold-border); }
  .history-entry{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .history-entry:last-child{ margin-bottom:0; }
  .history-row-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px; }
  .history-actor{ font-size:12.5px; font-weight:600; color:var(--text); }
  .history-time{ font-size:10.5px; color:var(--text3); white-space:nowrap; }
  .history-meta{ font-size:11.5px; color:var(--text2); display:flex; gap:12px; flex-wrap:wrap; margin-bottom:3px; }
  .history-meta span b{ color:var(--text); }
  .history-note{ font-size:11.5px; color:var(--text2); font-style:italic; margin-top:4px; line-height:1.4; }
  .history-tag{ font-size:8.5px; text-transform:uppercase; font-weight:700; letter-spacing:.5px; padding:1px 7px; border-radius:20px; }
  .history-tag.initial{ background:var(--blue-bg); color:var(--blue); }
  .history-tag.correction{ background:var(--amber-bg); color:var(--amber); }
  .empty-note{ font-size:12px; color:var(--text3); padding:10px 0; text-align:center; }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:12.5px; color:var(--text); box-shadow:0 8px 28px rgba(0,0,0,0.3); z-index:999; display:flex; align-items:center; gap:8px; animation:toastIn .3s ease; max-width:calc(100vw - 40px); }
  .toast.success{ border-left:3px solid var(--green); }
  .toast.error{ border-left:3px solid var(--red); }
  @keyframes toastIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:6px; }

  @media print{
    #acc-sidebar, #acc-topbar, .toolbar, .pagination, .act-btn, .no-print{ display:none !important; }
    .main{ margin-left:0 !important; }
    body{ background:#fff !important; color:#000 !important; }
    .panel{ box-shadow:none !important; border:1px solid #ccc !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div id="topbarSlot"></div>
    <div class="content">

      <div class="shift-banner no-print">
        <div class="sb-icon">🕘</div>
        <div class="sb-text" id="bannerText"></div>
      </div>

      <div class="kpi-row" id="kpiRow"></div>

      <div class="toolbar no-print">
        <div class="toolbar-row top">
          <div class="toolbar-left">
            <div class="flt-group">
              <span class="flt-label">Status</span>
              <div class="status-pills" id="statusPills">
                <div class="status-pill on all" data-status="">All</div>
                <div class="status-pill open" data-status="open"><span class="pdot" style="background:var(--amber)"></span>Awaiting Count</div>
                <div class="status-pill reconciled" data-status="ok"><span class="pdot" style="background:var(--green)"></span>Reconciled</div>
                <div class="status-pill variance" data-status="bad"><span class="pdot" style="background:var(--red)"></span>Variance</div>
              </div>
            </div>
            <div class="flt-group" style="flex:1;min-width:180px;max-width:240px;">
              <span class="flt-label">Search</span>
              <div class="search-box"><span style="color:var(--text3);font-size:12px;">🔍</span><input type="text" id="fSearch" placeholder="Staff name…" oninput="page=1;render()"></div>
            </div>
            <div class="flt-group"><span class="flt-label">From</span><input type="date" class="filter-date" id="fFrom" onchange="page=1;render()"></div>
            <div class="flt-group"><span class="flt-label">To</span><input type="date" class="filter-date" id="fTo" onchange="page=1;render()"></div>
            <div class="flt-group">
              <span class="flt-label">Sort By</span>
              <select class="filter-select" id="fSort" onchange="page=1;render()">
                <option value="date_desc">Shift Date (Newest)</option>
                <option value="date_asc">Shift Date (Oldest)</option>
                <option value="variance_desc">Variance (High → Low)</option>
              </select>
            </div>
            <button class="btn-ghost" onclick="clearFilters()">✕ Clear Filters</button>
          </div>
          <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Shift Reconciliation Log</div>
          <span style="font-size:11px;color:var(--text3);" id="tblCount">—</span>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Shift (9AM–9AM)</th><th>Staff</th><th class="center">Opening Float</th>
                <th class="center">Cash Sales</th><th class="center">Expected Cash</th>
                <th class="center">Actual Cash</th><th class="center">Variance</th><th class="center">Status</th>
                <th class="no-print center">Actions</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="paginLabel">—</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- VIEW MODAL (reconciled shifts) -->
<div class="modal-overlay" id="viewModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="vTitle">Shift Detail</div><button class="modal-close" onclick="closeModal('viewModal')">✕</button></div>
    <div class="modal-meta" id="vMeta"></div>
    <div class="breakdown-grid" id="vBreakdown"></div>
    <div class="variance-box"><div class="variance-label">Variance</div><div class="variance-val" id="vVarianceVal">—</div></div>
    <div class="history-section">
      <div class="history-head">Reconciliation History</div>
      <div id="vHistory"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('viewModal')">Close</button>
      <button class="btn btn-primary btn-sm" id="vCorrectBtn" onclick="startCorrection()">✎ Correct Entry</button>
    </div>
  </div>
</div>

<!-- RECONCILE MODAL (open shifts, and corrections to reconciled shifts) -->
<div class="modal-overlay" id="reconcileModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="rTitle">Reconcile Shift</div><button class="modal-close" onclick="closeModal('reconcileModal')">✕</button></div>
    <div class="modal-meta" id="rMeta"></div>

const SHIFT_START_HOUR = 9;
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function shiftKeyFor(dt){
  const d = new Date(dt);
  if (d.getHours() < SHIFT_START_HOUR) d.setDate(d.getDate() - 1);
  return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate()));
}
function fmtTime(d){ return d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit',hour12:true}); }
function fmtHourLabel(h){ const suffix = h>=12?'PM':'AM'; const hh = h%12===0?12:h%12; return `${hh}:00 ${suffix}`; }
function shiftRangeLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  const start = new Date(y, m-1, d, SHIFT_START_HOUR, 0);
  const end = new Date(start); end.setDate(end.getDate()+1);
  const opt = {day:'numeric', month:'short'};
  return `${start.toLocaleDateString('en-GB',opt)}, ${fmtTime(start)} → ${end.toLocaleDateString('en-GB',opt)}, ${fmtTime(end)}`;
}
function shiftDateOnly(key){ const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d); }
function parseTxDate(str){
  if (!str) return null;
  const [datePart, timePart, ampm] = str.split(' ');
  const [d,m,y] = datePart.split('/').map(n=>parseInt(n,10));
  let hh=0, mm=0;
  if (timePart) { const [h,mi]=timePart.split(':').map(n=>parseInt(n,10)); hh=h; mm=mi||0; }
  if (ampm) { const u=ampm.toUpperCase(); if (u==='PM'&&hh<12) hh+=12; if (u==='AM'&&hh===12) hh=0; }
  const fullYear = y<100 ? 2000+y : y;
  return new Date(fullYear, m-1, d, hh, mm);
}
function nowStamp(){ return new Date().toLocaleString('en-GB', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }).replace(',', ''); }

const CFG = { API_BASE:'', API_KEY:'', USE_DEMO:true, PAGE_SIZE:8 };
async function apiFetch(method, path, body=null){
  if (!CFG.API_BASE) throw new Error('No API_BASE configured');
  const opts = { method, headers:{ 'Content-Type':'application/json' } };
  if (CFG.API_KEY) opts.headers['Authorization'] = `Bearer ${CFG.API_KEY}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(CFG.API_BASE + path, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
function apiSave(method, path, body){ if (!CFG.USE_DEMO) apiFetch(method, path, body).catch(e => console.warn('[API write]', e.message)); }

const storage = window.storage || {
  async get(key, shared){ const v = localStorage.getItem(key); return v==null ? null : {key, value:v, shared}; },
  async set(key, value, shared){ localStorage.setItem(key, value); return {key, value, shared}; },
};
async function loadShared(key, fallback){
  try { const r = await storage.get(key, true); if (r && r.value) { const p = JSON.parse(r.value); if (Array.isArray(p)) return p; } } catch(e){}
  return fallback;
}
async function saveShared(key, value){ try { await storage.set(key, JSON.stringify(value), true); } catch(e){ console.warn('[sync]', key, e); } }

function buildTransactions(roomTx, restSales, poolSales){
  const out = [];
  roomTx.forEach(r => out.push({ id:r.id, dept:'Rooms', desc:r.desc, amount:r.amount, method:r.method, staff:r.staff, date:parseTxDate(r.date) }));
  restSales.filter(s=>s.status!=='voided').forEach(s => {

    out.push({ id:s.id, dept:'Restaurant', desc, amount:s.total, method:s.method, staff:s.staff, date:parseTxDate(s.date) });
  });
  poolSales.forEach(s => out.push({ id:s.id, dept:'Pool Bar', desc:`${s.item} ×${s.qty}`, amount:s.total, method:s.method, staff:s.staff, date:parseTxDate(s.time) }));
  return out.filter(t => t.date).sort((a,b) => b.date - a.date);
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let transactions = [];
let shifts = [];
let reconLog = [];
let page = 1;
let statusFilter = '';
let activeKey = null;
let correctionMode = false;
const VARIANCE_TOLERANCE = 500; // ₦ — within this counts as "Reconciled" not "Variance"

function cashForShift(key){ return transactions.filter(t => t.method==='Cash' && shiftKeyFor(t.date)===key).reduce((s,t)=>s+t.amount,0); }
function grossForShift(key){ return transactions.filter(t => shiftKeyFor(t.date)===key).reduce((s,t)=>s+t.amount,0); }
function txCountForShift(key){ return transactions.filter(t => shiftKeyFor(t.date)===key).length; }
function expectedCash(shift){ return shift.openingFloat + cashForShift(shift.key); }
function shiftHealth(shift){
  if (shift.status !== 'reconciled') return 'open';
  const v = shift.actualCash - expectedCash(shift);
  return Math.abs(v) <= VARIANCE_TOLERANCE ? 'ok' : 'bad';
}
function historyForShift(key){
  return reconLog.filter(h => h.key === key).sort((a,b) => parseTxDate(b.date) - parseTxDate(a.date));
}

/* ═══════════════════════════════════════════
   BANNER + KPIs
═══════════════════════════════════════════ */
function renderBanner(){
  document.getElementById('bannerText').innerHTML =
    `<b>Shift Day accounting</b> — a shift runs <b>${fmtHourLabel(SHIFT_START_HOUR)} → ${fmtHourLabel(SHIFT_START_HOUR)} the next day</b>. ` +
    `Count the cash drawer against expected cash sales to close out each shift.`;
}
function renderKPIs(){
  const open = shifts.filter(s=>s.status==='open').length;
  const reconciled = shifts.filter(s=>shiftHealth(s)==='ok').length;
  const variance = shifts.filter(s=>shiftHealth(s)==='bad').length;
  const totalVarianceAmt = shifts.filter(s=>s.status==='reconciled').reduce((sum,s)=>sum+(s.actualCash-expectedCash(s)),0);

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-accent">🕘</div><div class="kpi-label">Awaiting Count</div>
      <div class="kpi-value" style="color:${open>0?'var(--amber)':'var(--text)'};">${open}</div>
      <div class="kpi-trend ${open>0?'warn':'up'}">${open>0?'⚠ Needs cash count':'✓ All closed out'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">✓</div><div class="kpi-label">Reconciled</div>
      <div class="kpi-value" style="color:var(--green);">${reconciled}</div>
      <div class="kpi-trend up">Within ${fmtN(VARIANCE_TOLERANCE)} tolerance</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">⚠</div><div class="kpi-label">Flagged for Variance</div>
      <div class="kpi-value" style="color:${variance>0?'var(--red)':'var(--text)'};">${variance}</div>
      <div class="kpi-trend ${variance>0?'warn':'up'}">${variance>0?'Needs investigation':'None on record'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-accent">₦</div><div class="kpi-label">Net Variance (All Time)</div>
      <div class="kpi-value" style="color:${totalVarianceAmt<0?'var(--red)':totalVarianceAmt>0?'var(--green)':'var(--text)'};">${totalVarianceAmt>=0?'+':''}${fmtN(totalVarianceAmt)}</div>
      <div class="kpi-trend neutral">Across reconciled shifts</div>
    </div>`;
  shell.setPendingBadge(open);
}

/* ═══════════════════════════════════════════
   STATUS PILLS + FILTER + SORT
═══════════════════════════════════════════ */
function bindStatusPills(){
  document.querySelectorAll('.status-pill').forEach(p => {
    p.addEventListener('click', () => {
      statusFilter = p.dataset.status;
      document.querySelectorAll('.status-pill').forEach(x=>x.classList.remove('on'));
      p.classList.add('on');
      page = 1; render();
    });
  });
}
function clearFilters(){
  document.getElementById('fSearch').value = '';
  document.getElementById('fFrom').value = '';
  document.getElementById('fTo').value = '';
  document.getElementById('fSort').value = 'date_desc';
  statusFilter = '';
  document.querySelectorAll('.status-pill').forEach(x=>x.classList.remove('on'));
  document.querySelector('.status-pill.all').classList.add('on');
  page = 1; render();
}
function getFiltered(){
  const q = document.getElementById('fSearch').value.toLowerCase();
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;
  const sort = document.getElementById('fSort').value;

  let rows = shifts.filter(s => {
    const mq = !q || s.staff.toLowerCase().includes(q);
    const mh = !statusFilter || shiftHealth(s) === statusFilter;
    let md = true;
    const sd = shiftDateOnly(s.key);
    if (from) { const f = new Date(from+'T00:00:00'); if (sd < f) md = false; }
    if (to) { const t = new Date(to+'T00:00:00'); if (sd > t) md = false; }
    return mq && mh && md;
  });

  rows.sort((a,b) => {
    if (sort === 'date_asc') return a.key.localeCompare(b.key);
    if (sort === 'variance_desc') {
      const va = a.status==='reconciled' ? Math.abs(a.actualCash-expectedCash(a)) : -1;
      const vb = b.status==='reconciled' ? Math.abs(b.actualCash-expectedCash(b)) : -1;
      return vb - va;
    }
    return b.key.localeCompare(a.key);
  });
  return rows;
}

/* ═══════════════════════════════════════════
   TABLE + PAGINATION
═══════════════════════════════════════════ */
const HEALTH_CHIP = { open:'chip-open', ok:'chip-ok', bad:'chip-bad' };
const HEALTH_LABEL = { open:'Awaiting Count', ok:'Reconciled', bad:'Variance' };

function renderPagination(total){
  const totalPages = Math.max(1, Math.ceil(total / CFG.PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  const from = total===0?0:(page-1)*CFG.PAGE_SIZE+1;
  const to = Math.min(page*CFG.PAGE_SIZE, total);
  document.getElementById('paginLabel').textContent = total===0?'No records':`${from}–${to} of ${total}`;
  const wrap = document.getElementById('pageBtns'); wrap.innerHTML='';
  const mk = (label,p,disabled,active) => { const b=document.createElement('button'); b.className='page-btn'+(active?' active':''); b.textContent=label; b.disabled=!!disabled; b.onclick=()=>{page=p;renderTable();}; return b; };
  wrap.appendChild(mk('‹',page-1,page===1,false));
  let start=Math.max(1,page-2), end=Math.min(totalPages,start+4); start=Math.max(1,end-4);
  for(let i=start;i<=end;i++) wrap.appendChild(mk(String(i),i,false,i===page));
  wrap.appendChild(mk('›',page+1,page>=totalPages,false));
}

let _filteredCache = [];
function renderTable(){
  const rows = _filteredCache;
  document.getElementById('tblCount').textContent = rows.length + ' shift' + (rows.length!==1?'s':'');
  const start = (page-1)*CFG.PAGE_SIZE;
  const pageRows = rows.slice(start, start+CFG.PAGE_SIZE);

  document.getElementById('tblBody').innerHTML = pageRows.length===0
    ? `<tr class="empty-row"><td colspan="9">No shifts match your filters.</td></tr>`
    : pageRows.map(s => {
        const health = shiftHealth(s);
        const cash = cashForShift(s.key);
        const expected = expectedCash(s);
        const variance = s.status==='reconciled' ? (s.actualCash - expected) : null;
        const rowClick = health==='open' ? `openReconcile('${s.key}')` : `openView('${s.key}')`;
        return `<tr onclick="${rowClick}">
          <td style="font-weight:600;">${shiftRangeLabel(s.key)}</td>
          <td>${s.staff}</td>
          <td class="center">${fmtN(s.openingFloat)}</td>
          <td class="center">${fmtN(cash)}</td>
          <td class="center" style="font-weight:600;">${fmtN(expected)}</td>
          <td class="center">${s.status==='reconciled' ? fmtN(s.actualCash) : '—'}</td>
          <td class="center" style="font-weight:600;color:${variance===null?'var(--text3)':Math.abs(variance)<=VARIANCE_TOLERANCE?'var(--green)':'var(--red)'};">${variance===null?'—':(variance>=0?'+':'')+fmtN(variance)}</td>
          <td class="center"><span class="chip ${HEALTH_CHIP[health]}">${HEALTH_LABEL[health]}</span></td>
          <td class="no-print center" onclick="event.stopPropagation()">
            ${health==='open' ? `<button class="act-btn reconcile" onclick="openReconcile('${s.key}')">🕘 Reconcile</button>` : `<button class="act-btn" onclick="openView('${s.key}')">👁 View</button>`}
          </td>
        </tr>`;
      }).join('');

  renderPagination(rows.length);
}
function render(){
  renderKPIs();
  _filteredCache = getFiltered();
  renderTable();
}

/* ═══════════════════════════════════════════
   VIEW MODAL — now includes the full reconciliation
   history (audit trail) for this shift.
═══════════════════════════════════════════ */
function breakdownHtml(key){
  const rooms = transactions.filter(t=>shiftKeyFor(t.date)===key && t.dept==='Rooms').reduce((s,t)=>s+t.amount,0);
  const rest  = transactions.filter(t=>shiftKeyFor(t.date)===key && t.dept==='Restaurant').reduce((s,t)=>s+t.amount,0);
  const pool  = transactions.filter(t=>shiftKeyFor(t.date)===key && t.dept==='Pool Bar').reduce((s,t)=>s+t.amount,0);
  const cash  = cashForShift(key);
  return `
    <div class="bd-item"><div class="bd-label">🛏 Rooms Revenue</div><div class="bd-val">${fmtN(rooms)}</div></div>
    <div class="bd-item"><div class="bd-label">🍽 Restaurant Revenue</div><div class="bd-val">${fmtN(rest)}</div></div>
    <div class="bd-item"><div class="bd-label">🏊 Pool Bar Revenue</div><div class="bd-val">${fmtN(pool)}</div></div>
    <div class="bd-item"><div class="bd-label">💵 Total Cash Sales</div><div class="bd-val">${fmtN(cash)}</div></div>`;
}
function historyHtml(key){
  const entries = historyForShift(key);
  if (entries.length === 0) return `<div class="empty-note">No reconciliation entries recorded yet.</div>`;
  return entries.map(h => `
    <div class="history-entry">
      <div class="history-row-top">
        <span class="history-actor">${h.actor}</span>
        <span class="history-tag ${h.type}">${h.type==='initial'?'Initial Count':'Correction'}</span>
      </div>
      <div class="history-meta">
        <span>Actual: <b>${fmtN(h.actualCash)}</b></span>
        <span>Expected: <b>${fmtN(h.expected)}</b></span>
        <span>Variance: <b style="color:${Math.abs(h.variance)<=VARIANCE_TOLERANCE?'var(--green)':'var(--red)'};">${h.variance>=0?'+':''}${fmtN(h.variance)}</b></span>
      </div>
      <div class="history-time">${h.date}</div>
      ${h.notes ? `<div class="history-note">"${h.notes}"</div>` : ''}
    </div>`).join('');
}
function openView(key){
  const s = shifts.find(x=>x.key===key); if (!s) return;
  activeKey = key;
  const health = shiftHealth(s);
  const expected = expectedCash(s);
  const variance = s.actualCash - expected;
  document.querySelector('#viewModal .modal').classList.remove('mode-ok','mode-bad');
  document.querySelector('#viewModal .modal').classList.add(health==='ok'?'mode-ok':'mode-bad');
  document.getElementById('vTitle').textContent = shiftRangeLabel(key);
  document.getElementById('vMeta').innerHTML = `Cashier: <b>${s.staff}</b> &nbsp;·&nbsp; Opening float <b>${fmtN(s.openingFloat)}</b> &nbsp;·&nbsp; ${txCountForShift(key)} transaction${txCountForShift(key)!==1?'s':''} this shift`;
  document.getElementById('vBreakdown').innerHTML = breakdownHtml(key) + `
    <div class="bd-item"><div class="bd-label">Expected Cash</div><div class="bd-val">${fmtN(expected)}</div></div>
    <div class="bd-item"><div class="bd-label">Actual Cash Counted</div><div class="bd-val">${fmtN(s.actualCash)}</div></div>`;
  const vEl = document.getElementById('vVarianceVal');
  vEl.textContent = (variance>=0?'+':'') + fmtN(variance);
  vEl.className = 'variance-val ' + (health==='ok'?'ok':'bad');
  document.getElementById('vHistory').innerHTML = historyHtml(key);
  document.getElementById('viewModal').classList.add('show');
}
function startCorrection(){
  const key = activeKey;
  closeModal('viewModal');
  openReconcile(key, true);
}

/* ═══════════════════════════════════════════
   RECONCILE MODAL — used both for the first count on an
   open shift, and for logging a correction to an already
   reconciled one (isCorrection=true).
═══════════════════════════════════════════ */
function openReconcile(key, isCorrection=false){
  const s = shifts.find(x=>x.key===key); if (!s) return;
  activeKey = key;
  correctionMode = isCorrection;
  const expected = expectedCash(s);
  document.getElementById('rTitle').textContent = isCorrection ? 'Correct Reconciliation' : 'Reconcile Shift';
  document.getElementById('rMeta').innerHTML = `Cashier: <b>${s.staff}</b> &nbsp;·&nbsp; Opening float <b>${fmtN(s.openingFloat)}</b> &nbsp;·&nbsp; ${txCountForShift(key)} transaction${txCountForShift(key)!==1?'s':''} this shift`
    + (isCorrection ? ` &nbsp;·&nbsp; <span style="color:var(--amber);">Amending a previous count — this will be logged as a correction.</span>` : '');
  document.getElementById('rBreakdown').innerHTML = breakdownHtml(key) + `
    <div class="bd-item" style="grid-column:1/-1;"><div class="bd-label">Expected Cash (Opening Float + Cash Sales)</div><div class="bd-val" style="color:var(--gold);">${fmtN(expected)}</div></div>`;
  document.getElementById('rActorName').value = '';
  document.getElementById('rActualCash').value = isCorrection ? s.actualCash : '';
  document.getElementById('rNotes').value = isCorrection ? s.notes : '';
  updateVariancePreview();
  document.getElementById('reconcileModal').classList.add('show');
}
function updateVariancePreview(){
  const s = shifts.find(x=>x.key===activeKey); if (!s) return;
  const expected = expectedCash(s);
  const actual = parseFloat(document.getElementById('rActualCash').value) || 0;
  const variance = actual - expected;
  const el = document.getElementById('rVarianceVal');
  el.textContent = (variance>=0?'+':'') + fmtN(variance);
  el.className = 'variance-val ' + (Math.abs(variance)<=VARIANCE_TOLERANCE ? 'ok' : 'bad');
}
async function confirmReconcile(){
  const s = shifts.find(x=>x.key===activeKey); if (!s) return;
  const actor = document.getElementById('rActorName').value.trim();
  const actual = document.getElementById('rActualCash').value;
  if (!actor) { showToast('Enter your name — every reconciliation is logged.', 'error'); return; }
  if (actual === '' || parseFloat(actual) < 0) { showToast('Enter the actual cash counted.', 'error'); return; }

  const expected = expectedCash(s);
  const actualCash = parseFloat(actual);
  const variance = actualCash - expected;
  const notes = document.getElementById('rNotes').value.trim();
  const stamp = nowStamp();

  s.actualCash = actualCash;
  s.status = 'reconciled';
  s.notes = notes;

  reconLog.unshift({
    key: s.key, actor, actualCash, expected, variance, notes,
    type: correctionMode ? 'correction' : 'initial',
    date: stamp,
  });

  await Promise.all([ saveShared('accounting-shifts', shifts), saveShared(KEY_RECON_LOG, reconLog) ]);
  apiSave('PATCH', `/api/accounting/shifts/${s.key}`, { actualCash, notes, status:'reconciled', actor, type: correctionMode?'correction':'initial' });

  closeModal('reconcileModal');
  const health = shiftHealth(s);
  const verb = correctionMode ? 'corrected' : 'reconciled';
  showToast(health==='ok' ? `${shiftRangeLabel(s.key)} ${verb} by ${actor} — within tolerance.` : `${shiftRangeLabel(s.key)} ${verb} by ${actor} — variance flagged for review.`, health==='ok'?'success':'error');
  render();
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }
['viewModal','reconcileModal'].forEach(id => document.getElementById(id).addEventListener('click', function(e){ if (e.target===this) closeModal(id); }));

function showToast(msg, type='success'){
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = (type==='success'?'✓ ':'✕ ') + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
async function init(){
  renderBanner();
  const roomTx    = await loadShared('accounting-room-tx', DEMO_ROOM_TX);
  const restSales = await loadShared('restaurant-sales', DEMO_RESTAURANT_SALES);
  const poolSales = await loadShared('poolbar-sales', DEMO_POOLBAR_SALES);
  shifts = await loadShared('accounting-shifts', DEMO_SHIFTS);
  reconLog = await loadShared(KEY_RECON_LOG, DEMO_RECON_LOG);

  await Promise.all([
    saveShared('accounting-room-tx', roomTx),
    saveShared('accounting-shifts', shifts),
    saveShared(KEY_RECON_LOG, reconLog),
  ]);

  transactions = buildTransactions(roomTx, restSales, poolSales);
  bindStatusPills();
  render();
}
init();
</script>
