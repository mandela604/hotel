<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement | Aurum Hotel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', sans-serif;
    background: #080f18;
    color: #e8f0f8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .redirect-box {
    text-align: center;
    max-width: 400px;
    padding: 40px;
    background: #111e2b;
    border: 1px solid #1e3045;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 700;
    color: #c9a84c;
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6a8a9e;
    margin-bottom: 30px;
  }
  .message {
    font-size: 14px;
    color: #a8bece;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: #c9a84c;
    color: #0a1520;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
  }
  .btn:hover {
    background: #e8c96a;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(201,168,76,0.3);
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #1e3045;
    border-top-color: #c9a84c;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="redirect-box">
    <div class="logo">📦</div>
    <div class="subtitle">Procurement Module</div>
    <div class="spinner"></div>
    <p class="message">Redirecting to Procurement Module...</p>
    <a href="procurement/dashboard.html" class="btn">Go to Dashboard →</a>
  </div>

  <script>
    // Auto-redirect after 1 second
    setTimeout(() => {
      window.location.href = 'procurement/dashboard.html';
    }, 1000);
  </script>
</body>
</html>
